nitial_prompt":"SKEPTIC — PRECEDENT gate. You receive the synthesizer's draft cyber-alchemy-space architecture. For each major building block, find whether it is ALREADY OWNED across the three repos (Arcanum inventory / ontology-vault / context-builder / disciplines; domainspec CONSTITUTION / ADLC / AUTHORITY-MAP / view-triad / TAXONOMY; framework-unification ARTIFACTS catalog; the craft two-lane; the dispatch chain). FINDING AN OWNER IS NOT A KILL — label it build-from-owned (owner exists, cite path) or already-deployed (owned + already wired). Refute only NOVEL claims that actually have an owner (demote to build-from-owned). Return per block: owner (citation or precedent-clean) + use-mode. If you raise no objection, say so (terminates your zig-zag turn). Budget ~3000 tokens. Raw output."},{"agent_name":null,"role":"skeptic","model":"claude-sonnet-4-6","token_budget":3500,"angle":"non-vacuity gate; builds the smallest witness, exposing precedent over-claims and definitional hollowness","initial_prompt":"SKEPTIC — NON-VACUITY gate. You receive the synthesizer's draft architecture. Build the SMALLEST CONCRETE WITNESS: take ONE real context-dir, projects/ontologize/clients/hellbender (it has ontology-view.md / system-view.md / engineer-view.md / SUMMARY.md today). Show, file by file, that the proposed architecture actually MATERIALIZES there: which branch-views (meaning/system/run/residue) map to the existing files, which two-lanes (human/machine) exist vs are missing, which catalog tier each artifact is, and what the migrated hellbender tree would look like. If it CANNOT be built without inventing steps that don't exist, FORCE A CLOSED NEGATIVE and name the exact gap that zeroes it. Read the actual hellbender files. Return the built witness OR the typed negative. If no objection to the architecture's buildability, say so. Budget ~3500 tokens. Raw output."},{"agent_name":null,"role":"skeptic","model":"claude-sonnet-4-6","token_budget":2500,"angle":"definitional-soundness gate; catches re-skins that pass precedent and have a witness but collapse into an existing named thing","initial_prompt":"SKEPTIC — DEFINITIONAL-SOUNDNESS gate. You receive the synthesizer's draft architecture. For each headline construct, decide whether it is a genuinely distinct object or a RE-SKIN that collapses into something already named: (a) does 'cyber-alchemy-space' collapse into Arcanum's existing space/repo concept renamed? (b) does 'branch-as-view' (meaning/system/run/residue) collapse into the existing view-triad (ontology-view/system-view/engineer-view) renamed? (c) does the 'two-lane discipline' collapse into what craft already IS? (d) does 'artifact catalog' collapse into domainspec's existing taxonomy/SCHEMA-INVENTORY? For each: either name the concrete DIFFERENTIATOR that makes it a distinct object, or flag it TAUTOLOGICAL (re-skin) and say what it should just reuse instead. If no objection, say so. Budget ~2500 tokens. Raw output."}]},{"group_id":"coverage-audit","n":1,"agents":[{"agent_name":"coverage-auditor","role":"auditor","model":"claude-sonnet-4-6","token_budget":3000,"initial_prompt":"AUDITOR + FINAL APPROVER (P12 — you do no other work; you did not generate or synthesize). You receive the synthesizer's findings.md, the three skeptics' verdicts, and the working_folder. Certify, as the dispatch's final_approver: (1) COVERAGE — were all THREE corpora mapped (Arcanum, domainspec, domainspec-core) AND the cross-cutting conventions extracted? Name any unmapped corpus or skipped target. (2) CITATION (P9) — does every load-bearing architecture claim cite the owned artifact it builds from (build-from-owned discipline)? List uncited load-bearing claims. (3) WITNESS — was the hellbender non-vacuity witness actually BUILT against real files (not merely asserted)? (4) RE-SKIN — were the definitional skeptic's collapse flags either refuted or accepted (not ignored)? (5) NAMING COLLISION — did the synthesis explicitly resolve ontology-view-as-sibling vs ontology-as-tree, and spec-vs-system-view? Return ACCEPT (resolved) with a one-line certification, OR REJECT-WITH-GAPS listing exactly what must be fixed. Budget ~3000 tokens. Raw output."}]}]
