    groups: [{"group_id":"explorers","n":4,"anti_bias":"source-corpus (Arcanum | domainspec | domainspec-core) composed with methodology (per-repo survey vs cross-cutting convention mining)","agents":[{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3500,"angle":"Arcanum corpus survey; bias toward engine-substrate-as-spine, exposed by the domainspec explorer","initial_prompt":"EXPLORER (read-only; write NOTHING to the source tree). Corpus: C:/Users/victo/Arcanum. Map the reusable engine material for a unified 'cyber-alchemy-space'. Return a structured inventory with PATHS: (1) METHODS — sigils under arcana/, plus spells/, transmutations/, formulae/ — name each capability + its one-line job. (2) DISCIPLINES — disciplines/. (3) CONSTITUTIONS/LAW — any CONSTITUTION/AXIOMS/DECISIONS, registry/. (4) ARTIFACT CONVENTIONS — how Arcanum lays artifacts on disk; the inventory -> ontology-vault -> context-builder substrate; observability/telemetry; BUSINESS-ONTOLOGY. (5) TWO-LANE (human/machine) evidence if any. For each item: path + whether it is reusable building material for the unified space (owned) or Arcanum-specific. YOUR TENSION: you carry a bias toward treating Arcanum's engine substrate as THE architecture spine — explicitly flag where you assert that vs where domainspec might own the catalog/governance instead. Budget ~3500 tokens. Your text IS the return — raw structured findings."},{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3500,"angle":"domainspec corpus survey; bias toward lifecycle-as-prescribed, exposed by the domainspec-core projects explorer","initial_prompt":"EXPLORER (read-only; write NOTHING to the source tree). Corpus: C:/Users/victo/domainspec. Map the artifact-catalog + governance patterns for a unified 'cyber-alchemy-space'. Return a structured inventory with PATHS: (1) LAW — CONSTITUTION.md, AXIOMS.md, AUTHORITY-MAP.md, GOVERNANCE-ATTENUATION.md. (2) ONTOLOGY/TYPES — TAXONOMY.md, RELATIONSHIPS.md (the concept-type + edge catalogs). (3) LIFECYCLE — the ADLC artifact lifecycle (ADLC-ALIGNMENT.md), the pipeline + view-triad skills (system-view/engineer-view/ontology-view), SCHEMA-INVENTORY if present. (4) ARTIFACT CONVENTIONS — frontmatter, doc structure, how artifacts are catalogued. (5) TWO-LANE (human/machine) evidence. For each: path + owned-vs-specific. YOUR TENSION: you carry a bias toward 'the lifecycle as prescribed by the framework' — flag where you state the prescribed model vs where real projects (the core explorer) may diverge or under-use it. Budget ~3500 tokens. Your text IS the return."},{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3500,"angle":"domainspec-core/projects survey; concrete on-disk evidence, exposes the Arcanum and domainspec explorers' abstraction/prescription biases","initial_prompt":"EXPLORER (read-only; write NOTHING to the source tree). Corpus: C:/Users/victo/domainspec-core, focused on projects/* and the umbrella infra. Map the per-context / ontology-as-tree / two-lane evidence ACTUALLY ON DISK. Return a structured inventory with PATHS: (1) ONTOLOGIZE — projects/ontologize/ : the view-triad-method (development/view-triad-method/), the branch-as-view refinement runs (development/refinement-runs/*branch*), ONTOLOGY-BRANCHES.md, DELIVERY-LANES.md, clients/hellbender/ (the existing ontology-view.md/system-view.md/engineer-view.md). (2) GOLDENQUILL — projects/goldenquill/CRAFT.md + .craft/ledger.yml (the craft two-lane in real use). (3) FRAMEWORK-UNIFICATION — projects/framework-unification/components/ARTIFACTS.md (the tier catalog) + CONCEPT-MAP.md. (4) DISPATCH CHAIN — internal_tools/subagents-dispatch-hooks/ (router/type-skills/constitution). (5) cyberAlchemy/. For each: path + what concrete pattern it proves. YOUR TENSION: you carry concrete on-disk evidence; use it to EXPOSE where the Arcanum/domainspec explorers claim an abstract/prescribed model that real projects don't actually follow. Budget ~3500 tokens. Your text IS the return."},{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3500,"angle":"cross-cutting convention mining across all three repos; methodology axis, exposes repo-unique claims as shared-or-parochial","initial_prompt":"EXPLORER (read-only; write NOTHING to the source tree). Corpora: C:/Users/victo/Arcanum, C:/Users/victo/domainspec, C:/Users/victo/domainspec-core. Do NOT survey one repo — MINE the cross-cutting CONVENTIONS shared (or not) across all three, on the methodology axis. For each convention return: the convention, where it appears in EACH repo (path) or where it is absent, and verdict shared-discipline | partial | parochial. Target conventions: (1) the TWO-LANE human/machine pattern (craft CRAFT.md + .craft/ledger.yml; ontology-view typed graph as machine vs prose as human; spec vs system-view). (2) repo-structure conventions (how a 'context' directory is organized; READMEs; per-dir artifact sets). (3) FRONTMATTER schema conventions (tags/node_type/layer/nature/status). (4) MACHINE INDEXES (ledger indexes, code-tags.json, dispatch ledger, telemetry JSONL). (5) TYPED-GRAPH ONTOLOGY (ontology-view typed nodes/edges; domainspec TAXONOMY/RELATIONSHIPS; Arcanum ontology-vault). (6) ARTIFACT-CATALOG tiers. YOUR TENSION: methodology (cross-cutting mining) vs the three per-repo surveyors — actively challenge any claim that a pattern is repo-unique by checking the other two repos. Budget ~3500 tokens. Your text IS the return."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":null,"role":"writer","model":"claude-opus-4-8","token_budget":6000,"initial_prompt":"SYNTHESIZER (writer). You receive the 4 explorers' verbatim corpus maps (Arcanum / domainspec / domainspec-core / cross-cutting). Compose the unified 'cyber-alchemy-space' architecture as findings.md, grounded in OWNED material — cite which repo/artifact each building block comes from (build-from-owned; never claim novel where