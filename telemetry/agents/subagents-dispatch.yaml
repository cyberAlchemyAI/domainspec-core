    context: "Three sibling repos (Arcanum engine, domainspec framework, domainspec-core umbrella) each carry methods/artifacts/disciplines/constitutions that overlap and conflict. Craft already proves a two-lane (human CRAFT.md / machine .craft/ledger.yml) discipline; ontologize is reworking branch-as-view (ontology IS the dir tree); framework-unification has the ARTIFACTS tier catalog. Goal: a single unified, governed pattern for every new cyber-alchemy repo, with ontologize as the pilot (business docs now, code later)."
