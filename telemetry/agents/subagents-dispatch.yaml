er","model":"claude-sonnet-4-6","token_budget":1600,"angle":"generative latent-demand — the questions not yet asked","initial_prompt":"You are the latent-persona explorer. Using the manual's 7 audience personas and the distill notes (arcanum/.craft/artifacts/arcanum-manual-distill-notes.md), generate the question-TYPES this user is likely to ask NEXT but has not yet — the gap between what they asked and what the tools afford. For each: a one-line name, the persona it serves, and the capability that would answer it. Explicitly LABEL each as latent (no current witness) so a skeptic can test it. Read-only. ~1600 tokens."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":"Ahrens, Sönke","role":"writer","model":"claude-opus-4-8","token_budget":4000,"initial_prompt":"You are the synthesizer. From the three explorer returns (prompt-archaeology, affordance-map, latent-demand), draft findings.md: (1) a question-type matrix — each row a question-type with owner/witness, sound?, verdict, use-mode; (2) concrete improvement edits for the four manual topics (tool-use-by-pattern, refine, dispatch-spec construction, constitution-governance), each tied to a witnessed question-type and written in the manual's existing evidence-forward style. Every load-bearing claim cites the explorer return it rests on (claim<=proof). Flag anything you expect the skeptics to refute. ~4000 tokens."}]},{"group_id":"reviewers","n":3,"anti_bias":"attack-vector: non-vacuity vs precedent vs definitional-soundness","agents":[{"agent_name":"Popper, Karl","role":"skeptic","model":"claude-opus-4-8","token_budget":1800,"angle":"non-vacuity gate — every addition needs a concrete witness","initial_prompt":"You are the non-vacuity skeptic. For each proposed question-type and each tutorial edit in the synthesizer's findings.md, demand a concrete witness — an actual user prompt or a real capability behavior with a source path. KILL (mark no-witness) any item that is only 'the user might wonder about X'. Re