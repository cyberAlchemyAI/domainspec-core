itted to one unit, so the anchor may be set before the lanes run; address where to place the fork. Write to arcanum/arcana/refine/development/refine-improvement/lanes/g3-hewitt-late-dispatch.md. Budget ~1800 tokens."}]},{"group_id":"g4-synthesizer","agents":[{"agent_name":"Hofstadter, Douglas","role":"writer","model":"claude-opus-4-8","token_budget":4000,"initial_prompt":"You are the SYNTHESIZER for the refine-improvement research dispatch. Read every lane return in arcanum/arcana/refine/development/refine-improvement/lanes/. Produce arcanum/arcana/refine/development/refine-improvement/findings.md following the two-lane synthesis discipline (projects/domainspec-v2/research/TWO-LANE-DISCIPLINE.md):\n1. Name what problem EACH lane actually solved vs only reframed. CRITICALLY adjudicate G0 (Meadows/Christensen: anchoring is NOT refine's real problem - it is friction/adoption or non-binding outputs) AGAINST G1-G3 (which assume anchoring is the problem). Do not let the dispatch stay anchored on the anchoring framing if G0 is more load-bearing.\n2. Issue a bridge decision per load-bearing claim: borrow-carefully | analogy-only | block | promotion-candidate | future-work.\n3. Record residue with a named owner.\nInclude a verdict matrix (candidate | owner | witnessed? | sound? | verdict | use-mode). Every load-bearing claim CITES the lane return it rests on (claim <= proof; demote, never inflate). Also assemble arcanum/arcana/refine/development/refine-improvement/research.md = the collected lane returns verbatim. You are in a zig-zag with the reviewers (G5): expect change-asks and revise. Budget ~4000 tokens."}]},{"group_id":"g5-reviewers","n":2,"anti_bias":"attack-vector (non-vacuity vs definitional-soundness)","agents":[{"agent_name":"Kahneman, Daniel","role":"skeptic","model":"claude-opus-4-8","token_budget":1800,"angle":"non-vacuity gate: build the smallest witness; flag fixes that change no outcome","initial_prompt":"You are a SKEPTIC reviewer (attack-vector = NON-VACU