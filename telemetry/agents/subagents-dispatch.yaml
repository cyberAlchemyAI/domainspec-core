  - dispatch_id: "2026-06-22-ternary-llm-old-cpu"
    schema_version: "0.6.0"
    created: "2026-06-22T19:10:44.499Z"
    invoked_by: "rondellivladimir@gmail.com"
    dispatch_type: "research"
    goal: "Decide whether to stand up ternary-weight LLM inference on genuinely old (pre-AVX2 / no-SIMD) CPUs for a concrete local-inference use, naming the build obligations a GO would incur."
    context: "Ternary LLMs (BitNet b1.58 et al.) promise multiply-free inference, but the published speedups (bitnet.cpp TL1/TL2, T-MAC) lean on modern SIMD (AVX2/NEON) — exactly what pre-AVX2 silicon lacks. The decision turns on what is already owned and portable down, what we would have to build, and whether the advantage survives without SIMD. Outputs are a build/deploy decision with named obligations, not a novelty claim."
    max_loops: 1
    final_approver: "parent"
    anti_bias_global: "owned-and-portable-down optimism vs no-SIMD-vacuity skepticism"
    working_folder: "research/ternary-models-old-cpus/"
    groups: [{"group_id":"explorers","n":2,"anti_bias":"source-corpus × temporal-prior × methodology — modern ternary-LLM CPU runtimes (empirical/modern-only) vs historical multiply-free arithmetic lineage (formal cost model/historical-lineage)","agents":[{"agent_name":"Xiao, Guangxuan","role":"explorer","model":"claude-sonnet-4-6","token_budget":1500,"angle":"owns the MODERN ternary-LLM CPU-runtime corpus (empirical, modern-only)","initial_prompt":"Research question (build/deploy decision): can ternary-weight LLMs run usefully on genuinely OLD, pre-AVX2 / no-SIMD CPUs? Your angle: survey the MODERN ternary-LLM CPU-inference corpus empirically. Use WebSearch/WebFetch. Cover: Microsoft bitnet.cpp (TL1/TL2 lookup kernels), T-MAC, llama.cpp/ggml ternary (TQ1_0/TQ2_0) support, BitNet b1.58 2B4T. For each: who owns it, what hardware its published tok/s benchmarks actually ran on (note explicitly whether AVX2/AVX512/NEON was required or assumed), and any data point on scalar / pre-AVX2 / very old x86. Be precise about claim≤proof: if a speedup number assumes SIMD, say so. Return a compact list of candidate owners with citations (URLs), the hardware each benchmark used, and a one-line note on portability down to pre-AVX2. ~1500 tokens. Read-only — do not write files; return your findings as your message."},{"agent_name":"Nyquist, Harry","role":"explorer","model":"claude-sonnet-4-6","token_budget":1500,"angle":"owns the HISTORICAL multiply-free arithmetic lineage (formal cost model, historical)","initial_prompt":"Research question (build/deploy decision): can ternary-weight LLMs run usefully on genuinely OLD, pre-AVX2 / no-SIMD CPUs? Your angle: ignore modern LLM runtimes and instead survey the HISTORICAL multiply-free / low-precision arithmetic lineage, then build a FORMAL scalar cost model. Use WebSearch/WebFetch. Cover: integer-only / fixed-point inference, lookup-table (LUT) matmul and bit-serial arithmetic, ternary/balanced-ternary logic and ternary neural nets (e.g. TWN, ternary content-addressable ideas), classic DSP multiply-free techniques. Then reason formally: on a scalar in-order pre-AVX2 core (no wide SIMD, narrow issue width), what is the per-op cost of a ternary {-1,0,1} matmul via add/sub/LUT versus an int8 multiply-add? Where does the multiply-free advantage come from, and how much of it is memory-bandwidth vs ALU vs SIMD-lane parallelism? State, with reasoning, whether the advantage is expected to survive WITHOUT SIMD. Cite sources (URLs). ~1500 tokens. Read-only — return findings as your message."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":"Shannon, Claude","role":"writer","model":"claude-opus-4-8","token_budget":3500,"initial_prompt":"You are the synthesizer for a research dispatch deciding whether to stand up ternary-weight LLM inference on genuinely old (pre-AVX2 / no-SIMD) CPUs. You will receive two explorer returns (modern ternary-LLM CPU runtimes; historical multiply-free arithmetic cost model) and, in a later round, skeptic challenges (precedent ownership; non-vacuity witness). Draft findings.md: (1) a verdict matrix with one row per candidate path — columns: candidate | owner (citation or precedent-clean) | witnessed on pre-AVX2? | sound? | verdict (GO/KILL) | use-mode (build-from-owned / already-deployed / novel-attempt); (2) a build/deploy recommendation that, if GO, names the concrete build obligations (what kernel/runtime work, what target hardware, what proof would be needed) and, if the advantage is SIMD-bound, says so plainly. Every load-bearing claim cites the explorer/skeptic return it rests on (claim≤proof — demote, never inflate). Output the findings.md content as your message; the parent persists it to research/ternary-models-old-cpus/findings.md. ~3500 tokens."}]},{"group_id":"reviewers","n":2,"anti_bias":"attack-vector — precedent ownership gate vs non-vacuity witness gate","agents":[{"agent_name":"Tetlock, Philip","role":"skeptic","model":"claude-opus-4-8","token_budget":1500,"angle":"precedent gate — ownership attribution","initial_prompt":"You are the PRECEDENT-gate skeptic on a research dispatch about ternary LLMs on pre-AVX2 CPUs. You will receive the synthesizer's draft findings. Your one gate: is the claim 'ternary weights make LLM inference viable on pre-AVX2 / no-SIMD CPUs' already OWNED? Use WebSearch/WebFetch to find the owner (Microsoft BitNet / bitnet.cpp, T-MAC, ggml/llama.cpp, academic ternary-net work). Finding an owner is NOT a kill — label each candidate build-from-owned (owner exists, benchmarks are SIMD-era only, repo does not yet deploy on pre-AVX2 — cite honestly), already-deployed, or precedent-clean. Critically check whether each owner's evidence actually covers genuinely pre-AVX2 hardware or only AVX2/NEON. Return: owner attributions with citations, and a build-from-owned/already-deployed/precedent-clean label per candidate, plus any portability gap. ~1500 tokens. Read-only."},{"agent_name":"Popper, Karl","role":"skeptic","model":"claude-opus-4-8","token_budget":1500,"angle":"non-vacuity gate — witness construction or closed negative","initial_prompt":"You are the NON-VACUITY-gate skeptic on a research dispatch about ternary LLMs on pre-AVX2 CPUs. You will receive the synthesizer's draft findings. Your one gate: build the smallest CONCRETE witness, or force a closed negative. The witness needed: a real, citable instance (or a hand-built back-of-envelope construction) of a ternary LLM running at USABLE tok/s on genuinely pre-AVX2 / no-SIMD silicon (e.g. an old Core 2 / Pentium / pre-2013 x86, or a scalar embedded core). Use WebSearch/WebFetch to hunt for any such measurement. If none exists, construct the cost estimate by hand from the historical cost model and state the closed negative explicitly: what is the expected tok/s for a small BitNet on a scalar pre-AVX2 core, and is it usable? If the answer is 'no witness, and the estimate is unusable', say so as a typed negative (what the path would have contributed + the exact fact that zeroes it). ~1500 tokens. Read-only."}]}]
