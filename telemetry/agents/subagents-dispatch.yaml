sume): the session said initializing submodules 'closes OQ-5' while ARTIFACTS-OQ-5 is about incrementally building the domain ontology — is there a cross-document OQ-5 numbering collision (ARTIFACTS-OQ-5 vs CONCEPT-MAP OQ-5)? Confirm or refute from the actual files. (c) the I2 provenance invariant names problem-statement as the root, but the catalog marks problem-statement 'to-create' with NO producer — is the graph hanging off a non-existent root? For each finding: file + quoted evidence + severity + one-line fix. State what survived. Budget ~2500 tokens."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":null,"role":"writer","model":"claude-opus-4-8","token_budget":4000,"initial_prompt":"SYNTHESIZER for a review dispatch over ARTIFACTS.md. You receive the verbatim returns of three attackers (governance, mechanics, reference-integrity) INCLUDING each attacker's initial AND final robot-talks positions (collapse detection — note where an attacker abandoned a finding under peer pressure). Dedupe overlapping findings, severity-rank them (CRITICAL/MAJOR/MINOR per the review house taxonomy: CRITICAL=breaks system/contradicts governing law; MAJOR=functional gap/drift/doc-vs-code mismatch/load-bearing omission; MINOR=wording/stale/fuzzy pointer), and draft findings.md: per-artifact section -> table (| # | file | evidence | severity | proposed fix |) -> per-section verdict KEEP/FIX (FIX iff >=1 surviving CRITICAL or MAJOR) -> a closing change-request list ordered by severity. Every finding must quote ARTIFACTS.md and cite the attacker return it came from (claim <= proof). Do NOT inflate; flag any finding you think the verifiers will refute. Budget ~4000 tokens."}]},{"group_id":"verifiers","n":2,"anti_bias":"source corpus (literal ARTIFACTS.md text vs built-engine ground truth)","agents":[{"agent_name":null,"role":"skeptic","model":"claude-sonnet-4-6","token_budget":2500,"angle":"refute any finding not grounded in the literal artifact text — guards against attackers