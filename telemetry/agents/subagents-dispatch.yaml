    groups: [{"group_id":"attackers","n":3,"robot_talks":true,"anti_bias":"attack-vector (governance/fidelity vs mechanics/correctness vs ownership/reference-integrity)","agents":[{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":2500,"angle":"fidelity/governance lens — does ARTIFACTS.md contradict or silently extend its governing law (SCOPE.md, CONCEPT-MAP.md)? A governance bias accepts a classification as legitimate because the law permits it; the mechanics attacker would expose it as engine-false.","initial_prompt":"RED-TEAM (read-only; never modify the targets). Target: projects/framework-unification/components/ARTIFACTS.md. Governing law: projects/framework-unification/SCOPE.md and projects/framework-unification/CONCEPT-MAP.md. YOUR ONE LENS: fidelity/governance. Question: where does ARTIFACTS.md contradict, or silently extend beyond, its governing law? Check specifically: (a) does the four-tier + three-plane taxonomy honor SCOPE's stated boundary and the open-questions rule (SCOPE 3)? (b) does the catalog assert anything CONCEPT-MAP's invariants (esp. I2 provenance) do NOT license, or restate an invariant in a way that drifts from it? (c) are the (proposal)/(design choice) markers honest, or does the doc treat an unratified rule as settled law (e.g. the one-artifact granularity rule)? For each finding return: file + quoted evidence + severity (CRITICAL/MAJOR/MINOR) + one-line proposed fix. If you find nothing for some sub-check, state what you attacked and why it survived. Budget ~2500 tokens."},{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3000,"angle":"mechanics/correctness lens — do the tier-A 'built' statuses and named producers match the actual built engine? A mechanics bias accepts the doc's self-description; the governance attacker judges by law-intent, the integrity attacker by whether the pointer resolves.","initial_prompt":"RED-TEAM (read-only; never modify the targets). Target: projects