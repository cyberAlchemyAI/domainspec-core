    working_folder: "research/cyber-alchemy-space/capability-taxonomy/"
    groups: [{"group_id":"explorers","n":4,"anti_bias":"composite methodology x source-corpus (empirical shipped-catalog / formal law-required / computational-structural recursion / adversarial seam)","agents":[{"agent_name":"Simon, Herbert","role":"explorer","model":"claude-sonnet-4-6","token_budget":1800,"angle":"empirical bottom-up: the shipped catalog is the capability set","initial_prompt":"EMPIRICAL bottom-up enumeration. Walk the SHIPPED capability units on disk and verb-tag what each DOES. Corpus: arcanum/{formulae,transmutations,arcana,spells}/, arcanum/disciplines/DISCIPLINES.md, .claude/skills/ (this repo), implementation/domainspec/.claude/skills/. For each capability: name, on-disk path, the operating verb (e.g. define/design/research/ontologize/interview/validate/observe/govern/route), one-line of what it operates on, and whether it is Arcanum-portable or repo-parochial. Read-only; write nothing outside the working_folder. Return a structured list (table). Flag your own bias: you over-trust the existing catalog as the complete/true capability set. ~1800 tokens."},{"agent_name":"Lawvere, F. William","role":"explorer","model":"claude-sonnet-4-6","token_budget":1800,"angle":"formal top-down: capability types the method/law requires regardless of shipping","initial_prompt":"FORMAL top-down derivation. From the LAW SPINE derive the capability TYPES the method REQUIRES, independent of what is shipped. Corpus: arcanum/framework/CYBERALCHEMY-METHOD.md, ARTIFACT-CONSTITUTION.md; implementation/domainspec/{AXIOMS.md,CONSTITUTION.md,AUTHORITY-MAP.md,GOVERNANCE-ATTENUATION.md}; implementation/domainspec/vault/ontology-conventions.md. Question: if CyberAlchemy is a method, what capability types must exist for the method to run end to end? Name each type, the law clause that demands it, and whether a shipped owner exists. Read-only. Return a structured list. Flag your own bias: you invent idealized types with no on-disk owner. ~1800 tokens."},{"agent_name":"Mandelbrot, Benoit","role":"explorer","model":"claude-sonnet-4-6","token_budget":1800,"angle":"computational/structural: capabilities are recurrences, not a flat list","initial_prompt":"COMPUTATIONAL/STRUCTURAL recursion + symmetry mining. CyberAlchemy 'seeks symmetries and recursive structures as its operating methods' — find them. Corpus: projects/ontologize/ (ONTOLOGY-BRANCHES, view-triad-method), projects/framework-unification/ (CONCEPT-MAP invariant I9, ARTIFACTS tier-A/tier-B), cyberAlchemy/, the dispatch chain (.claude/skills/domainspec-subagents-strategy + research/review/experiment + register-dispatch: router->type-skill->form). Identify recurring operating structures: the SAME capability/verb appearing at different altitudes (per-run vs cross-run; tier-A vs tier-B; I9 self-application), the router->type->form recursion, the view-triad symmetry. For each recurrence: the invariant, the altitudes it repeats at, and which capabilities are really ONE capability recurring. Read-only. Flag your own bias: you over-fit symmetry and see recursion everywhere. ~1800 tokens."},{"agent_name":"Ashby, W. Ross","role":"explorer","model":"claude-sonnet-4-6","token_budget":1800,"angle":"adversarial seam-mining: capabilities collide, duplicate, lack an owner","initial_prompt":"ADVERSARIAL seam / boundary mining. Find where capabilities COLLIDE, DUPLICATE, or LACK AN OWNER, and test whether Knowledge/Craft/Governance (the seed buckets) is a clean partition. Corpus: domainspec-core projects (projects/goldenquill, ontologize, framework-unification), implementation/domainspec/AUTHORITY-MAP.md, domainspec-sync-registry, and contested/overlapping sigils (audit-alignment, code-tag-audit, test-derivation; capability index vs project catalog; define appears in invoke AND domainspec). For each seam: the colliding capabilities, the nature of the collision (duplicate / no-owner / multi-bucket), and whether it breaks a clean 3-bucket partition. Read-only. Flag your own bias: you may call genuinely-distinct shipped units a 'collision'. ~1800 tokens."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":"Spivak, David","role":"writer","model":"claude-opus-4-8","token_budget":4500,"initial_prompt":"Synthesize the 4 explorer returns into a capability taxonomy + a verdict matrix (one row per candidate capability type: candidate | owner/precedent | witnessed? | sound? | verdict GO/KILL | use-mode build-from-owned/already-deployed/novel-attempt). Every load-bearing claim cites the explorer return it rests on. Propose the taxonomy: are Knowledge / Craft / Governance the right top buckets, do emergent types (interviewer, router, observer, validator...) need their own bucket, and which capabilities recur across buckets (Mandelbrot's recurrences). State each capability's CyberAlchemy symmetry/altitude where one exists. Honesty contract: tag every claim BUILT / OWNED / PROPOSED / OPEN. ~4500 tokens."}]},{"group_id":"reviewers","n":3,"robot_talks":false,"anti_bias":"attack-vector (precedent / non-vacuity / definitional-soundness)","agents":[{"agent_name":"Kuhn, Thomas","role":"skeptic","model":"claude-opus-4-8","token_budget":1500,"angle":"precedent gate — is each type/bucket already owned","initial_prompt":"PRECEDENT gate (ownership attribution; never a terminal kill). For each capability type and each bucket in the synthesis, find the OWNER. Is 'interviewer' already owned (scope-interview / interrogation / structured-interview-kits / domainspec-interview-kits)? Is Knowledge/Craft/Governance already an owned grouping (arcanum/disciplines stewardship, the Arcanum method-tiers formulae/transmutations/arcana, or domainspec Business/System/Bridge)? Label each build-from-owned (cite owner) / already-deployed / precedent-clean. Read-only; cite path:line. ~1500 tokens."},{"agent_name":"Gödel, Kurt","role":"skeptic","model":"claude-opus-4-8","token_budget":1500,"angle":"non-vacuity gate — force every capability into exactly one bucket or a closed negative","initial_prompt":"NON-VACUITY gate. Build the smallest concrete witness: take the shipped capabilities (from Simon/Ashby) and try to place EVERY one into exactly ONE of the proposed buckets. Either produce the full placement, or force a CLOSED NEGATIVE: name a capability that fits NONE or fits TWO buckets, proving the partition is not total/disjoint. A taxonomy that cannot place its own members is vacuous. Read-only. ~1500 tokens."},{"agent_name":"Wittgenstein, Ludwig","role":"skeptic","model":"claude-opus-4-8","token_budget":1500,"angle":"definitional-soundness gate — does the scheme collapse to a named primitive","initial_prompt":"DEFINITIONAL-SOUNDNESS gate. Does the 3-bucket scheme (Knowledge/Craft/Governance) or the thesis 'CyberAlchemy is a method of symmetries/recursion' COLLAPSE to something already named and re-skinned — e.g. invariant I9 recursive self-application, the Arcanum method-tiers, or Business/System/Bridge? If the buckets are just an existing grouping relabeled, say so and name it. Distinguish a genuine new organizing axis from a rename. Read-only; cite. ~1500 tokens."}]},{"group_id":"auditor","n":1,"agents":[{"agent_name":"Vlachopulos, Ioannis","role":"auditor","model":"claude-sonnet-4-6","token_budget":1800,"initial_prompt":"FINAL APPROVER + completeness critic. Meta-evaluate the revised findings: (1) did the explorers miss a capability or a whole corpus (cyberAlchemy/, validation/poker-team, domainspec-lean-formalization, internal_tools)? (2) is EVERY load-bearing claim in findings.md cited to a collected return (P9)? (3) is claim <= proof everywhere (P10)? Return ACCEPT or REJECT-with-gaps. List any uncited claim or missed capability/corpus. Read-only. ~1800 tokens."}]}]
