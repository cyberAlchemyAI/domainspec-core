    groups: [{"group_id":"attackers","n":3,"robot_talks":true,"anti_bias":"attack-vector (governance/fidelity vs mechanics/correctness vs ownership/reference-integrity)","agents":[{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":2500,"angle":"fidelity/governance lens — does ARTIFACTS.md contradict or silently extend its governing law (SCOPE.md, CONCEPT-MAP.md)? A governance bias accepts a classification as legitimate because the law permits it; the mechanics attacker would expose it as engine-false.","initial_prompt":"RED-TEAM (read-only; never modify the targets). Target: projects/framework-unification/components/ARTIFACTS.md. Governing law: projects/framework-unification/SCOPE.md and projects/framework-unification/CONCEPT-MAP.md. YOUR ONE LENS: fidelity/governance. Question: where does ARTIFACTS.md contradict, or silently extend beyond, its governing law? Check specifically: (a) does the four-tier + three-plane taxonomy honor SCOPE's stated boundary and the open-questions rule (SCOPE 3)? (b) does the catalog assert anything CONCEPT-MAP's invariants (esp. I2 provenance) do NOT license, or restate an invariant in a way that drifts from it? (c) are the (proposal)/(design choice) markers honest, or does the doc treat an unratified rule as settled law (e.g. the one-artifact granularity rule)? For each finding return: file + quoted evidence + severity (CRITICAL/MAJOR/MINOR) + one-line proposed fix. If you find nothing for some sub-check, state what you attacked and why it survived. Budget ~2500 tokens."},{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3000,"angle":"mechanics/correctness lens — do the tier-A 'built' statuses and named producers match the actual built engine? A mechanics bias accepts the doc's self-description; the governance attacker judges by law-intent, the integrity attacker by whether the pointer resolves.","initial_prompt":"RED-TEAM (read-only; never modify the targets). Target: projects/framework-unification/components/ARTIFACTS.md (esp. the Tier A object-artifacts table and its Status / Producer columns). Ground truth: implementation/domainspec/.claude/skills/domainspec-pipeline/SKILL.md (the built orchestrator) and projects/framework-unification/layers/domainspec-language/SCHEMA-INVENTORY.md (empirical schema inventory); also the implementation/domainspec/.claude/skills/ directory for whether a named producer skill actually exists. YOUR ONE LENS: mechanics/correctness. Question: which catalog claims are factually false against the engine? Check: (a) every 'built' status — is it really built, or designed/inline/to-create mislabeled? (b) every named Producer (skill/agent) — does it exist and actually emit that artifact? (c) the lifecycle order the catalog implies vs the pipeline's real step order (the session logged a Route-3 'Spec->Plan' vs pipeline 'plan then spec' contradiction — verify it). For each finding: file + quoted evidence + severity + one-line fix. State what survived each attack. Budget ~3000 tokens."},{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":2500,"angle":"ownership/reference-integrity lens — dangling pointers, double-owned concepts, claims about another doc the target does not satisfy, and the I2-root-without-producer seam. Differs from mechanics (producer-truth) by testing pointer/ownership-truth and from governance (law-intent) by testing whether cites resolve.","initial_prompt":"RED-TEAM (read-only; never modify the targets). Target: projects/framework-unification/components/ARTIFACTS.md. YOUR ONE LENS: ownership/reference-integrity. Question: which pointers, citations, and ownership claims fail to hold? Check: (a) the Connections table cites (../CONCEPT-MAP.md, ../SCOPE.md, ../layers/domainspec-language/SCHEMA-INVENTORY.md, the pipeline SKILL path) — do the files exist and say what the row claims? (b) double-owned concepts — is any term/OQ owned in two places? Candidate to VERIFY (do not assume): the session said initializing submodules 'closes OQ-5' while ARTIFACTS-OQ-5 is about incrementally building the domain ontology — is there a cross-document OQ-5 numbering collision (ARTIFACTS-OQ-5 vs CONCEPT-MAP OQ-5)? Confirm or refute from the actual files. (c) the I2 provenance invariant names problem-statement as the root, but the catalog marks problem-statement 'to-create' with NO producer — is the graph hanging off a non-existent root? For each finding: file + quoted evidence + severity + one-line fix. State what survived. Budget ~2500 tokens."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":null,"role":"writer","model":"claude-opus-4-8","token_budget":4000,"initial_prompt":"SYNTHESIZER for a review dispatch over ARTIFACTS.md. You receive the verbatim returns of three attackers (governance, mechanics, reference-integrity) INCLUDING each attacker's initial AND final robot-talks positions (collapse detection — note where an attacker abandoned a finding under peer pressure). Dedupe overlapping findings, severity-rank them (CRITICAL/MAJOR/MINOR per the review house taxonomy: CRITICAL=breaks system/contradicts governing law; MAJOR=functional gap/drift/doc-vs-code mismatch/load-bearing omission; MINOR=wording/stale/fuzzy pointer), and draft findings.md: per-artifact section -> table (| # | file | evidence | severity | proposed fix |) -> per-section verdict KEEP/FIX (FIX iff >=1 surviving CRITICAL or MAJOR) -> a closing change-request list ordered by severity. Every finding must quote ARTIFACTS.md and cite the attacker return it came from (claim <= proof). Do NOT inflate; flag any finding you think the verifiers will refute. Budget ~4000 tokens."}]},{"group_id":"verifiers","n":2,"anti_bias":"source corpus (literal ARTIFACTS.md text vs built-engine ground truth)","agents":[{"agent_name":null,"role":"skeptic","model":"claude-sonnet-4-6","token_budget":2500,"angle":"refute any finding not grounded in the literal artifact text — guards against attackers