    working_folder: "research/lesswrong-rationality/"
    groups: [{"group_id":"lens-readers","n":3,"anti_bias":"composite methodology × source-corpus × temporal-prior — all three read the WHOLE 6-book corpus through a different reading stance so they engage the same concepts and can disagree (per-book coverage is the synthesizer's job downstream, not the anti-bias axis)","agents":[{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3500,"angle":"E1 — charitable/steelman, SOURCE-INTERNAL: reconstruct the strongest version of each book's thesis on the Sequences' own terms (methodology=charitable-reconstruction; corpus=Sequences-internal)","initial_prompt":"You are E1, the charitable/steelman SOURCE-INTERNAL reader in a governed research dispatch dissecting LessWrong's 'Rationality: A-Z' (Rationality: From AI to Zombies, by Eliezer Yudkowsky) at https://www.lesswrong.com/rationality. The 6 books: (1) Map and Territory, (2) How to Actually Change Your Mind, (3) The Machine in the Ghost, (4) Mere Reality, (5) Mere Goodness, (6) Becoming Stronger.\n\nYOUR LENS: reconstruct the STRONGEST version of each book's core thesis on the Sequences' OWN terms — charitable, source-internal. Do NOT critique against outside literature (another agent owns that). For EACH of the 6 books give: (a) core thesis in one sentence; (b) 3-6 load-bearing claims stated as the author intends them; (c) the named vocabulary it introduces (e.g. map/territory, 'beliefs should pay rent in anticipated experience', semantic stopsign, mysterious answer to a mysterious question, affective death spiral, terminal vs instrumental values, the 'Litany of Tarski/Gendlin') with the author's intended meaning.\n\nMETHOD: WebFetch https://www.lesswrong.com/rationality and each book's contents page; fetch 2-4 keystone essays per book where you can. If a page is truncated/unreachable, say so explicitly.\n\nSOURCE-KIND DISCIPLINE (critical): label EVERY line — [primary-source]=stated in an essay; [local-inference]=your reasonable deduction; [open-residue]=not verified / essay unread. Never invent quotes. Claim ≤ proof: if you only saw a title, label it [open-residue].\n\nOUTPUT: write your full per-book analysis to research/lesswrong-rationality/_dispatch/lens-E1.md (create it; this is the only file you write). Then RETURN a ~400-word summary: the strongest cross-book thesis, the 8-12 most load-bearing vocabulary terms each with a source-kind label, and a list of which essays you actually fetched vs. inferred from title. Budget ~3500 tokens. Read-only except that one file."},{"agent_name":null,"role":"explorer","model":"claude-opus-4-8","token_budget":3500,"angle":"E2 — adversarial/critical vs EXTERNAL literature: read the same corpus against Kahneman/Tversky, Jaynes, mainstream cognitive science & Bayesian epistemology; surface overclaims and divergences (methodology=adversarial; corpus=external academic)","initial_prompt":"You are E2, the ADVERSARIAL / EXTERNAL-LITERATURE reader in a governed research dispatch dissecting LessWrong's 'Rationality: A-Z' (Eliezer Yudkowsky) at https://www.lesswrong.com/rationality. Books: (1) Map and Territory, (2) How to Actually Change Your Mind, (3) The Machine in the Ghost, (4) Mere Reality, (5) Mere Goodness, (6) Becoming Stronger.\n\nYOUR LENS: read the SAME 6-book corpus ADVERSARIALLY and against the EXTERNAL academic literature it invokes or relates to — Kahneman & Tversky (heuristics & biases, prospect theory), E.T. Jaynes 'Probability Theory: The Logic of Science', mainstream cognitive science, philosophy of mind, and Bayesian epistemology. For EACH book ask: where does the corpus OVERCLAIM, oversimplify, or DIVERGE from the literature it draws on? Which claims are well-supported by that literature, and which are the author's own stronger leaps presented as settled? Name specific external sources where you can.\n\nMETHOD: WebFetch the corpus pages + keystone essays; WebSearch the external literature where useful. If truncated/unreachable, say so.\n\nSOURCE-KIND DISCIPLINE (critical): label EVERY line — [primary-source]=a corpus claim; [related-source]=an external-literature claim (NAME the source); [local-inference]=your adversarial judgment; [open-residue]=unverified. Be precise: separate 'the corpus says X' from 'the external literature supports/contradicts X'. Do not strawman — attack the strongest reading. Claim ≤ proof.\n\nOUTPUT: write your full per-book critique to research/lesswrong-rationality/_dispatch/lens-E2.md (create it; only file you write). RETURN a ~400-word summary: the 6-8 most important overclaims/divergences (with the external source that exposes each), and the claims the literature genuinely backs. Budget ~3500 tokens. Read-only except that one file."},{"agent_name":null,"role":"explorer","model":"claude-sonnet-4-6","token_budget":3500,"angle":"E3 — historical-lineage / cross-book concept-tracing: trace concept origins (2006-2009 Overcoming Bias/LessWrong), recurrence across books, and correct cross-book attribution (methodology=historical; temporal-prior=historical-lineage)","initial_prompt":"You are E3, the HISTORICAL-LINEAGE / CROSS-BOOK-TRACING reader in a governed research dispatch dissecting LessWrong's 'Rationality: A-Z' (Eliezer Yudkowsky) at https://www.lesswrong.com/rationality. Books: (1) Map and Territory, (2) How to Actually Change Your Mind, (3) The Machine in the Ghost, (4) Mere Reality, (5) Mere Goodness, (6) Becoming Stronger.\n\nYOUR LENS: trace CONCEPT LINEAGE and CROSS-BOOK recurrence. The Sequences began as 2006-2009 blog posts on Overcoming Bias and LessWrong, compiled into the 6 books in 2015. For the major concepts (map/territory, 'beliefs pay rent', Bayesian updating/evidence, mysterious answers, semantic stopsigns, affective death spirals, terminal vs instrumental values, reductionism, the 'how an algorithm feels from inside'): where does each FIRST appear, which book 'owns' it, and where does it RECUR across the other books? Flag concepts commonly MIS-attributed to the wrong book. Note diachronic development (how a concept's framing changed).\n\nMETHOD: WebFetch the corpus contents pages + keystone essays; note original sequence groupings (Predictably Wrong, Fake Beliefs, Noticing Confusion, Mysterious Answers, Against Rationalization, Death Spirals, etc.). If truncated/unreachable, say so.\n\nSOURCE-KIND DISCIPLINE (critical): label EVERY line — [primary-source]=verified against a page; [local-inference]=your tracing judgment; [open-residue]=attribution you could not verify against a page. Claim ≤ proof — unverified lineage is [open-residue], not asserted.\n\nOUTPUT: write your full lineage map to research/lesswrong-rationality/_dispatch/lens-E3.md (create it; only file you write). RETURN a ~400-word summary: a concept→owning-book table with recurrence notes and any mis-attribution flags, each row source-kind labeled. Budget ~3500 tokens. Read-only except that one file."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":null,"role":"writer","model":"claude-opus-4-8","token_budget":6000,"initial_prompt":"You are the synthesizer (writer) in a governed research dispatch building the research/lesswrong-rationality/ tower for LessWrong's 'Rationality: A-Z'. Read the three lens-reader returns: research/lesswrong-rationality/_dispatch/lens-E1.md (charitable/source-internal), lens-E2.md (adversarial/external-literature), lens-E3.md (historical/lineage). Triangulate them.\n\nPRODUCE research/lesswrong-rationality/_dispatch/findings-draft.md with: (1) DEEP PER-BOOK MAPS for all 6 books — each: core thesis, 3-6 load-bearing claims, key vocabulary, and where E2's critique or E3's lineage qualifies it; (2) the CROSS-BOOK SPINE (how the 6 books build on each other); (3) a CLAIM TABLE separating [primary-source] / [related-source] / [local-inference]; (4) clearly-LABELLED ARCANUM BRIDGE CANDIDATES (mark each [analogy] or [operator-reading], NEVER as a corpus claim) — reasoning patterns Arcanum might borrow (e.g. evidence/source-kind discipli