0,"angle":"operability/abuse-gaming lens — attacks end-to-end fillability and hollowness; bias to guard: accepting the template's self-description of completeness","initial_prompt":"RED-TEAM (read-only; never modify). Target corpus: ALL files in arcanum/spells/invoke/templates/domainspec-spec/ including README.md — read the whole corpus. YOUR ONE LENS: operability/abuse-gaming. Two questions. (1) OPERABILITY — can an operator author a real spec from these templates end-to-end WITHOUT inventing steps? Are the placeholder conventions ({Feature Name}, {CapabilityName}, {anchor}) unambiguous; do the per-aspect docs (operations/queries/interfaces/states/events/mappings/architecture-bundle/execution-pack) give enough shape to fill; can the downstream consumers the README claims (spec->test derivation, doc->metrics derivation, registry sync) actually be derived from the Concept Registry + aspect docs as structured, or is a step missing? (2) ABUSE/GAMING — can the format be satisfied in letter while the spec is hollow: a Concept Registry listing IDs whose aspect-doc bodies are never written, empty capability tables, placeholder {tokens} left unfilled passing as complete, the governance-threshold split gamed to hide complexity? Your bias to guard: do not accept the template's self-description of completeness — hold it to real fillability and real consumer ingestion. For each finding: file + quoted evidence + severity + one-line fix. State what survived. Budget ~2500 tokens. Your text IS the return. Robot-talks after: confront A1/A2, keep initial positions."}]},{"group_id":"synthesizer","n":1,"agents":[{"agent_name":"Mac Lane, Saunders","role":"writer","model":"claude-opus-4-8","token_budget":3500,"initial_prompt":"SYNTHESIZER (writer) for a review dispatch over the DomainSpec spec template family. You receive the verbatim returns of three attackers (A1 fidelity/governance, A2 ownership/reference-integrity, A3 operability/abuse-gaming) INCLUDING each attacker's initial AND final robot-talks positions (collapse detection — note where an attacker abandoned a finding under peer pressure). Dedupe overlapping findings, severity-rank per the review house taxonomy (CRITICAL = breaks the system / corrupts the registry / contradicts DomainSpec law; MAJOR = functional gap / doc-vs-doc drift / load-bearing omission; MINOR = wording / stale pointer). WRITE TWO FILES to internal_tools/subagents-dispatch-hooks/docs/reviews/2026-06-16-domainspec-spec-template/ : attacks.md (the collected attacker + verifier returns, verbatim) and findings.md (per-document section -> table with columns # | file | evidence | severity | proposed fix -> per-document verdict KEEP/FIX, FIX iff >=1 surviving CRITICAL or MAJOR -> a closing change-request list ordered by severity). Every finding MUST quote the spec template and cite the attacker return it came from (claim <= proof). Do NOT inflate; flag any finding you expect the verifiers to refute. This is the zig-zag opener; you will receive verifier objections and revise findings.md. Budget ~3500 tokens."}]},{"group_id":"verifiers","n":2,"anti_bias":"methodology (deductive refutation against DomainSpec governing law vs empirical refutation against the literal spec files)","agents":[{"agent_name":"Gödel, Kurt","role":"skeptic","model":"claude-opus-4-8","token_budget":2200,"angle":"deductive against DomainSpec governing law — refute findings the law does not actually require","initial_prompt":"VERIFIER (deductive against governing law). You receive the synthesizer's draft findings.md over the DomainSpec spec template family. For EACH finding, refute it DEDUCTIVELY: does DomainSpec law actually require what the finding claims? Consult arcanum/definitions/DEFINITIONS.md (DS-D1/DS-D2), RELATIONSHIPS.md/TAXONOMY.md, and the template's OWN governance notes (the HTML-comment instructions stating thresholds, 'Link only to aspect files that exist. Delete unused lines.', etc.). DROP (do not soften) any finding that holds the template