    groups: [{"group_id":"explorers","n":3,"anti_bias":"source-corpus + methodology (composite): external debate/scoring literature vs external knowledge-representation literature vs internal-repo structural verification","agents":[{"agent_name":"Hewitt, Carl","role":"explorer","model":"claude-sonnet-4-6","token_budget":1400,"angle":"source-corpus axis: the multi-agent-debate / LLM-consensus-scoring literature (ELO-for-panels, oracle consensus, the term 'MOGT')","initial_prompt":"ROLE: explorer (precedent + ownership sweep) for a research dispatch hardening a 'Tower System' taxonomy. Read context for the four layers. YOUR ANGLE (source-corpus): survey the multi-agent-debate and LLM-consensus-scoring literature ONLY - e.g. multi-agent debate (Liang et al.), ChatEval (Chan et al.), expert-prompting, LLM-as-judge, ELO/Bradley-Terry rating of model outputs, oracle/consensus aggregation, DPO-from-disagreement, MoE routing. TASKS: (1) For the L4 Adjudication layer (scoring = elo | oracle-consensus | MOGT, plus tournament/synthesis), find prior art and name OWNERS with citations - is each scoring mode already an owned, named technique? (2) Resolve 'MOGT': what does it most plausibly denote (Mixture of Ground Truths? Mixture of Generative Trees? a tournament variant?) - give the best-supported reading and its owner, or mark it precedent-clean/coined. (3) Flag any L3/L4 category that the debate literature already owns under a different name. OUTPUT (~1400 tokens): a candidate list, each with owner-or-'precedent-clean', a one-line citation, and a use-mode (build-from-owned / already-deployed / novel-attempt). Claim <= proof; demote uncertain claims. Read-only; do not write files."},{"agent_name":"Ahrens, Sönke","role":"explorer","model":"claude-sonnet-4-6","token_budget":1400,"angle":"source-corpus axis: the knowledge-representation / note-taking / knowledge-graph literature","initial_prompt":"ROLE: explorer (precedent + ownership sweep) for a research dispatch hardening a 'Tower System' taxonomy. Read context for the four layers. YOUR ANGLE (source-corpus): survey the knowledge-representation, personal-knowledge-management, and knowledge-graph literature ONLY - e.g. Zettelkasten / smart notes, Alexander's pattern language, concept maps, ontologies/typed graphs, RDF/property graphs, spaced learning, 'reading a book through a system'. TASKS: (1) For the L1 Substrate (tower = traversable knowledge graph + persona set) and L2 Construction (distill-build / read-through / promote), find prior art and name OWNERS with citations - is the 'persona embodies a concept/technique drawn from a graph' idea already owned? is 'read-through construction' a named learning method? (2) Propose and evaluate candidate UMBRELLA NAMES for the whole system vs. keeping 'research-tower' for L1-L2 only; cite any naming precedent. (3) Flag any L1/L2 category already owned under a different name. OUTPUT (~1400 tokens): candidate list with owner-or-'precedent-clean', one-line citations, use-mode (build-from-owned / already-deployed / novel-attempt). Claim <= proof. Read-only; do not write files."},{"agent_name":"Spivak, David","role":"explorer","model":"claude-sonnet-4-6","token_budget":1600,"angle":"methodology axis (formal/internal-structural): verify the reuse-vs-net-new mapping against the actual in-repo skills","initial_prompt":"ROLE: explorer (internal-structural verification) for a research dispatch hardening a 'Tower System' taxonomy. YOUR ANGLE (methodology = formal/internal-structural): consult NO external literature - instead READ the actual in-repo skill files and verify the taxonomy's claimed reuse-vs-net-new mapping. Files: .claude/skills/research-tower/SKILL.md, .claude/skills/distill/SKILL.md, .claude/skills/robot-talks/SKILL.md, and the subagents-strategy constitution operationalized by .claude/skills/domainspec-subagents-strategy/SKILL.md (+ .claude/skills/anti-bias-vector-composition/SKILL.md). CLAIMED MAPPING TO VERIFY: L1 substrate + L2 distill-b