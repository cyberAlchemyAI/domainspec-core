ledger_id: craft.cav2.language_project
schema_ref: ../../../arcanum/arcana/craft/templates/ledger.schema.yml
schema_version: 0.3.0
status: candidate-local
source_of_truth: .craft/ledger.yml
human_view: CRAFT.md
notes:
  - Private candidate ledger for the CyberAlchemy Language Project.
  - Craft records project state; it grants no definition, governance, implementation, publication, or deployment authority.

indexes:
  by_id:
    CTX-LANGUAGE-ROOT: contexts[0]
    CTX-LANGUAGE-MEANING: contexts[1]
    CTX-LANGUAGE-EDGES: contexts[2]
    CTX-LANGUAGE-REALIZATION: contexts[3]
    CTX-LANGUAGE-GOVERNANCE-KERNEL: contexts[4]
    DESC-LANGUAGE-ROOT-001: descriptions[0]
    DESC-LANGUAGE-MEANING-001: descriptions[1]
    DESC-LANGUAGE-EDGES-001: descriptions[2]
    DESC-LANGUAGE-REALIZATION-001: descriptions[3]
    DESC-LANGUAGE-GOVERNANCE-KERNEL-001: descriptions[4]
    DEF-LANGUAGE-RECOMMENDATION-001: definitions[0]
    DEF-LANGUAGE-RULE-REVIEW-RECOMMENDATION-001: definitions[1]
    DEF-LANGUAGE-DECISION-SUPPORT-OUTPUT-001: definitions[2]
    DEF-LANGUAGE-GOVERNANCE-PROGRAM-001: definitions[3]
    DEF-LANGUAGE-GOVERNANCE-REQUEST-001: definitions[4]
    DEF-LANGUAGE-GOVERNANCE-FACT-001: definitions[5]
    DEF-LANGUAGE-GOVERNANCE-FACT-SET-001: definitions[6]
    ENA-LANGUAGE-NONCOLLAPSE-001: typed_items[0]
    ENA-LANGUAGE-AUTHORITY-NONCOLLAPSE-001: typed_items[1]
    DEC-LANGUAGE-REALIZATION-001: decisions[0]
    DEC-LANGUAGE-PRODUCES-001: decisions[1]
    GAP-LANGUAGE-REALIZATION-001: gaps[0]
    GAP-LANGUAGE-PRODUCES-001: gaps[1]
    GAP-LANGUAGE-KERNEL-RUNTIME-001: gaps[2]
    ART-LANGUAGE-LEDGER: artifacts[0]
    ART-LANGUAGE-VIEW: artifacts[1]
    ART-LANGUAGE-MEANINGS: artifacts[2]
    ART-LANGUAGE-EDGES: artifacts[3]
    ART-LANGUAGE-REALIZATIONS: artifacts[4]
    ART-LANGUAGE-EXAMPLE: artifacts[5]
    ART-LANGUAGE-VALIDATOR: artifacts[6]
    ART-LANGUAGE-AUTHORITY: artifacts[7]
    ART-LANGUAGE-KERNEL-EXAMPLE: artifacts[8]
    REL-LANGUAGE-MEANING-ENABLES-ROOT: relations[0]
    REL-LANGUAGE-REALIZATION-DEPENDS-DECISION: relations[1]
    REL-LANGUAGE-EDGES-DEPENDS-DECISION: relations[2]
    REL-LANGUAGE-KERNEL-ENABLES-ROOT: relations[3]
  open_decisions:
    - DEC-LANGUAGE-REALIZATION-001
    - DEC-LANGUAGE-PRODUCES-001
  blocking_decisions: []
  active_blockers: []
  active_gaps:
    - GAP-LANGUAGE-REALIZATION-001
    - GAP-LANGUAGE-PRODUCES-001
    - GAP-LANGUAGE-KERNEL-RUNTIME-001
  next_moves:
    - context_id: CTX-LANGUAGE-ROOT
      next_move: Carry the defined Governance Program, Request, Fact, and Fact Set language into the candidate system-runtime ontology while the separate policy-language exercise remains open.
    - context_id: CTX-LANGUAGE-REALIZATION
      next_move: Decide whether Rule Review Recommendation requires independent identity and lifecycle.
    - context_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
      next_move: Use the candidate language and authority bindings as Define input for the Governance system-runtime ontology and verifier-contract design.
  artifacts_by_path:
    .craft/ledger.yml: ART-LANGUAGE-LEDGER
    CRAFT.md: ART-LANGUAGE-VIEW
    meaning-bindings.json: ART-LANGUAGE-MEANINGS
    edge-vocabulary.json: ART-LANGUAGE-EDGES
    realization-bindings.json: ART-LANGUAGE-REALIZATIONS
    examples/governance-policy-resolution.json: ART-LANGUAGE-EXAMPLE
    scripts/validate.py: ART-LANGUAGE-VALIDATOR
    authority-bindings.json: ART-LANGUAGE-AUTHORITY
    examples/governance-evaluation-kernel-language.json: ART-LANGUAGE-KERNEL-EXAMPLE

contexts:
  - context_id: CTX-LANGUAGE-ROOT
    parent_id: root
    title: CyberAlchemy Language Project
    purpose: Preserve business, domain, product, and system meaning without silently collapsing one representation into another.
    stage: define
    gate: flag
    next_move: Carry the defined Governance Program, Request, Fact, and Fact Set language into the candidate system-runtime ontology while the separate policy-language exercise remains open.
    owned_artifacts:
      - ART-LANGUAGE-LEDGER
      - ART-LANGUAGE-VIEW
      - ART-LANGUAGE-EXAMPLE
      - ART-LANGUAGE-VALIDATOR
      - ART-LANGUAGE-AUTHORITY
      - ART-LANGUAGE-KERNEL-EXAMPLE
    links:
      - label: Meaning context
        target: CTX-LANGUAGE-MEANING
        kind: row-id
      - label: Realization decision
        target: DEC-LANGUAGE-REALIZATION-001
        kind: row-id
      - label: Governance kernel language
        target: CTX-LANGUAGE-GOVERNANCE-KERNEL
        kind: row-id
    notes: The project structure is locally testable; semantic owner review remains open.
  - context_id: CTX-LANGUAGE-MEANING
    parent_id: CTX-LANGUAGE-ROOT
    title: Business and product meaning
    purpose: Name one concept in ordinary business, bounded-domain, and product language before selecting a technical realization.
    stage: define
    gate: pass
    next_move: Test the three meanings in the first Governance rule-review conversation and product flow.
    owned_artifacts:
      - ART-LANGUAGE-MEANINGS
    links:
      - label: Meaning bindings
        target: ART-LANGUAGE-MEANINGS
        kind: artifact-id
    notes: Recommendation and Decision Support Output are candidate-local terms.
  - context_id: CTX-LANGUAGE-EDGES
    parent_id: CTX-LANGUAGE-ROOT
    title: Earned edge vocabulary
    purpose: Require business meaning, product consequence, and a non-collapse witness before an edge verb can be adopted.
    stage: define
    gate: flag
    next_move: Exercise offers and informs, then resolve the produces collision without assuming a DomainSpec mapping.
    owned_artifacts:
      - ART-LANGUAGE-EDGES
    links:
      - label: Produces decision
        target: DEC-LANGUAGE-PRODUCES-001
        kind: row-id
    notes: offers and informs are proposed, not accepted vocabulary.
  - context_id: CTX-LANGUAGE-REALIZATION
    parent_id: CTX-LANGUAGE-ROOT
    title: DomainSpec realization
    purpose: Select a DomainSpec meta-type only from observed identity, equality, and lifecycle needs.
    stage: define
    gate: flag
    next_move: Decide whether Rule Review Recommendation requires independent identity and lifecycle.
    owned_artifacts:
      - ART-LANGUAGE-REALIZATIONS
    links:
      - label: Open selection
        target: DEC-LANGUAGE-REALIZATION-001
        kind: row-id
    notes: The open realization does not invalidate the business and product meanings.
  - context_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    parent_id: CTX-LANGUAGE-ROOT
    title: Governance kernel input language
    purpose: Define Governance Program, Request, Fact, and Fact Set and bind their meanings to the CyberAlchemy authority model without creating authority or enforcement.
    stage: define
    gate: flag
    next_move: Use the candidate language and authority bindings as Define input for the Governance system-runtime ontology and verifier-contract design.
    owned_artifacts:
      - ART-LANGUAGE-AUTHORITY
      - ART-LANGUAGE-KERNEL-EXAMPLE
      - ART-LANGUAGE-MEANINGS
      - ART-LANGUAGE-REALIZATIONS
    links:
      - label: Runtime realization gap
        target: GAP-LANGUAGE-KERNEL-RUNTIME-001
        kind: row-id
      - label: Authority bindings
        target: ART-LANGUAGE-AUTHORITY
        kind: artifact-id
    notes: The language slice and candidate DomainSpec mappings are owner-reviewed; the system-runtime ontology, verifier contracts, Rust types, Runtime Contract acceptance, and enforcement remain outside this Define apply.

artifacts:
  - artifact_id: ART-LANGUAGE-LEDGER
    owner_context_id: CTX-LANGUAGE-ROOT
    path: .craft/ledger.yml
    artifact_type: ledger-source
    status: active
    notes: Machine-readable Craft source of truth.
  - artifact_id: ART-LANGUAGE-VIEW
    owner_context_id: CTX-LANGUAGE-ROOT
    path: CRAFT.md
    artifact_type: human-view
    status: active
    notes: Human-readable view derived from the Craft ledger.
  - artifact_id: ART-LANGUAGE-MEANINGS
    owner_context_id: CTX-LANGUAGE-MEANING
    path: meaning-bindings.json
    artifact_type: meaning-registry
    status: active
    notes: Separates business, domain, and product meaning from system realization.
  - artifact_id: ART-LANGUAGE-EDGES
    owner_context_id: CTX-LANGUAGE-EDGES
    path: edge-vocabulary.json
    artifact_type: edge-vocabulary
    status: active
    notes: Proposed earned edges and the open produces collision.
  - artifact_id: ART-LANGUAGE-REALIZATIONS
    owner_context_id: CTX-LANGUAGE-REALIZATION
    path: realization-bindings.json
    artifact_type: realization-registry
    status: active
    notes: Open DomainSpec classification with explicit fit conditions.
  - artifact_id: ART-LANGUAGE-EXAMPLE
    owner_context_id: CTX-LANGUAGE-ROOT
    path: examples/governance-policy-resolution.json
    artifact_type: language-exercise
    status: flag
    notes: In-progress owner exercise; no accepted mapping.
  - artifact_id: ART-LANGUAGE-VALIDATOR
    owner_context_id: CTX-LANGUAGE-ROOT
    path: scripts/validate.py
    artifact_type: validator
    status: active
    notes: Check-only by default; validation creates no authority.
  - artifact_id: ART-LANGUAGE-AUTHORITY
    owner_context_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    path: authority-bindings.json
    artifact_type: authority-binding-registry
    status: active
    notes: Binds candidate language to CAV2 Authority, Authority Model, Constitution, and runtime boundaries without transferring authority.
  - artifact_id: ART-LANGUAGE-KERNEL-EXAMPLE
    owner_context_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    path: examples/governance-evaluation-kernel-language.json
    artifact_type: language-exercise
    status: active
    notes: Owner-reviewed candidate definitions and DomainSpec semantic mappings; no runtime or enforcement acceptance.

descriptions:
  - description_id: DESC-LANGUAGE-ROOT-001
    context_id: CTX-LANGUAGE-ROOT
    description: The Language Project connects representations while keeping their meanings, owners, and claim limits visible.
    status: active
    evidence: ART-LANGUAGE-LEDGER
  - description_id: DESC-LANGUAGE-MEANING-001
    context_id: CTX-LANGUAGE-MEANING
    description: Recommendation is the business meaning; Rule Review Recommendation is its Governance-domain expression; Decision Support Output is its product role.
    status: active
    evidence: ART-LANGUAGE-MEANINGS
  - description_id: DESC-LANGUAGE-EDGES-001
    context_id: CTX-LANGUAGE-EDGES
    description: An edge is only a candidate after it has a business sentence, product consequence, and evidence that it does not collapse distinct objects.
    status: active
    evidence: ART-LANGUAGE-EDGES
  - description_id: DESC-LANGUAGE-REALIZATION-001
    context_id: CTX-LANGUAGE-REALIZATION
    description: DomainSpec Value Object and Entity are alternative system realizations, not business translations.
    status: active
    evidence: ART-LANGUAGE-REALIZATIONS
  - description_id: DESC-LANGUAGE-GOVERNANCE-KERNEL-001
    context_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    description: Program carries evaluation instructions and authority requirements; Request names one proposed consequence; Facts supply bounded verifier-admitted propositions. None of them grants authority or applies an effect.
    status: active
    evidence: ART-LANGUAGE-AUTHORITY

definitions:
  - definition_id: DEF-LANGUAGE-RECOMMENDATION-001
    scope_id: CTX-LANGUAGE-MEANING
    term: Recommendation
    statement: Evidence-backed advice offered for a decision without making or authorizing that decision.
    status: candidate
    evidence: ART-LANGUAGE-MEANINGS
  - definition_id: DEF-LANGUAGE-RULE-REVIEW-RECOMMENDATION-001
    scope_id: CTX-LANGUAGE-MEANING
    term: Rule Review Recommendation
    statement: A recommendation about how a reviewed Governance Rule should be treated after evaluation.
    status: candidate
    evidence: ART-LANGUAGE-MEANINGS
  - definition_id: DEF-LANGUAGE-DECISION-SUPPORT-OUTPUT-001
    scope_id: CTX-LANGUAGE-MEANING
    term: Decision Support Output
    statement: The review result a governance product presents to help an authorized owner decide what happens next.
    status: candidate
    evidence: ART-LANGUAGE-MEANINGS
  - definition_id: DEF-LANGUAGE-GOVERNANCE-PROGRAM-001
    scope_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    term: Governance Program
    statement: A named, versioned declarative set of governance instructions, authority requirements, fact requirements, and verdict logic for a bounded evaluation domain; it grants no authority.
    status: candidate
    evidence: ART-LANGUAGE-MEANINGS
  - definition_id: DEF-LANGUAGE-GOVERNANCE-REQUEST-001
    scope_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    term: Governance Request
    statement: An immutable description of one exact proposed consequence submitted for governance evaluation; it is not an owner request, permission, or action.
    status: candidate
    evidence: ART-LANGUAGE-MEANINGS
  - definition_id: DEF-LANGUAGE-GOVERNANCE-FACT-001
    scope_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    term: Governance Fact
    statement: A typed, scoped proposition admitted for one evaluation under a named verifier contract with source and provenance visible; it is not Evidence, Authority, or universal truth.
    status: candidate
    evidence: ART-LANGUAGE-MEANINGS
  - definition_id: DEF-LANGUAGE-GOVERNANCE-FACT-SET-001
    scope_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    term: Governance Fact Set
    statement: The finite collection of admitted Governance Facts supplied for one Program and Request; it is not a repository snapshot or lifecycle hash.
    status: candidate
    evidence: ART-LANGUAGE-MEANINGS

typed_items:
  - item_id: ENA-LANGUAGE-NONCOLLAPSE-001
    kind: enabler
    base_type: definition_enabler
    context_type: language.meaning_noncollapse
    primary_lane: business
    secondary_lanes:
      - product
      - tech
    source_id: ART-LANGUAGE-MEANINGS
    target_id: CTX-LANGUAGE-ROOT
    status: pass
    default_role: language_owner
    allowed_roles:
      - language_owner
      - product_owner
      - definitions_reviewer
    delegation_route: definitions-governance
    requires_human: false
    role_confidence: candidate
    owner_ref: CyberAlchemy v2 Language Project owner
    role_notes: The explicit separation lets business and product work continue while system classification remains open.
    evidence: ART-LANGUAGE-MEANINGS
    reason: Business meaning no longer depends on prematurely selecting a DomainSpec meta-type.
    links:
      - label: Open realization decision
        target: DEC-LANGUAGE-REALIZATION-001
        kind: row-id
  - item_id: ENA-LANGUAGE-AUTHORITY-NONCOLLAPSE-001
    kind: enabler
    base_type: definition_enabler
    context_type: language.authority_noncollapse
    primary_lane: business
    secondary_lanes:
      - governance
      - tech
    source_id: ART-LANGUAGE-AUTHORITY
    target_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    status: pass
    default_role: language_owner
    allowed_roles:
      - language_owner
      - authority_owner
      - runtime_owner
      - definitions_reviewer
    delegation_route: definitions-governance
    requires_human: false
    role_confidence: candidate
    owner_ref: CyberAlchemy Governance runtime owner with CyberAlchemy authority owner review
    role_notes: Explicit non-collapse lets the runtime ontology use the language without treating a Program, Request, or Fact as authority.
    evidence: ART-LANGUAGE-AUTHORITY
    reason: The authority model fit is explicit and effect-free, so system modeling can proceed without repository-wide hashing or implied adoption.
    links:
      - label: Runtime realization gap
        target: GAP-LANGUAGE-KERNEL-RUNTIME-001
        kind: row-id

decisions:
  - decision_id: DEC-LANGUAGE-REALIZATION-001
    scope_id: CTX-LANGUAGE-REALIZATION
    decision_type: selection
    question: Does Rule Review Recommendation require independent identity and lifecycle, or is immutable field equality sufficient?
    description: Select the system realization from observed behavior; do not use the business label as a type-selection shortcut.
    options:
      - value-object
      - entity
      - another-realization
      - defer
    default_option: defer
    selected: pending
    rationale: Current evidence establishes business and product meaning but not the identity and lifecycle semantics required for system classification.
    evidence: ART-LANGUAGE-REALIZATIONS
    status: active
    blocking: false
    impact: DomainSpec modeling, formalization, and implementation binding remain blocked; language definition and exercise can continue.
    owner: CyberAlchemy Governance owner
    links:
      - label: Realization registry
        target: ART-LANGUAGE-REALIZATIONS
        kind: artifact-id
  - decision_id: DEC-LANGUAGE-PRODUCES-001
    scope_id: CTX-LANGUAGE-EDGES
    decision_type: selection
    question: How should the business Capability-to-Output use of produces relate to DomainSpec DS-D2 Operation-to-Event produces?
    description: Resolve a same-spelling, different-signature collision without silently treating the meanings as equivalent.
    options:
      - qualify-business-verb
      - introduce-explicit-bridge
      - retain-context-scoped-homonym
      - defer
    default_option: defer
    selected: pending
    rationale: The business and DomainSpec endpoint signatures are different and no accepted bridge exists.
    evidence: ART-LANGUAGE-EDGES
    status: active
    blocking: false
    impact: produces cannot be claimed as earned cross-layer vocabulary; offers and informs remain proposed candidates.
    owner: CyberAlchemy Governance owner plus DomainSpec v2 definitions-governance owner
    links:
      - label: Edge vocabulary
        target: ART-LANGUAGE-EDGES
        kind: artifact-id

gaps:
  - gap_id: GAP-LANGUAGE-REALIZATION-001
    scope_id: CTX-LANGUAGE-REALIZATION
    summary: Rule Review Recommendation has no selected DomainSpec realization because identity, equality, and lifecycle evidence are not yet sufficient.
    severity: flag
    treatment: defer
    owner: CyberAlchemy Governance owner
    status: active
    evidence: ART-LANGUAGE-REALIZATIONS
    links:
      - label: Owner decision
        target: DEC-LANGUAGE-REALIZATION-001
        kind: row-id
  - gap_id: GAP-LANGUAGE-PRODUCES-001
    scope_id: CTX-LANGUAGE-EDGES
    summary: produces currently names two relations with different business and DomainSpec endpoint signatures.
    severity: flag
    treatment: plan
    owner: CyberAlchemy Governance owner plus DomainSpec v2 definitions-governance owner
    status: active
    evidence: ART-LANGUAGE-EDGES
    links:
      - label: Vocabulary decision
        target: DEC-LANGUAGE-PRODUCES-001
        kind: row-id
  - gap_id: GAP-LANGUAGE-KERNEL-RUNTIME-001
    scope_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    summary: The candidate kernel input language has no realized system-runtime ontology, verifier contracts, Rust types, accepted Runtime Contract, or enforcement adapter.
    severity: flag
    treatment: plan
    owner: CyberAlchemy Governance runtime owner
    status: active
    evidence: ART-LANGUAGE-KERNEL-EXAMPLE
    links:
      - label: Authority bindings
        target: ART-LANGUAGE-AUTHORITY
        kind: artifact-id

route_handoffs: []
receipts: []

relations:
  - relation_id: REL-LANGUAGE-MEANING-ENABLES-ROOT
    source_id: ENA-LANGUAGE-NONCOLLAPSE-001
    target_id: CTX-LANGUAGE-ROOT
    type: enables
    status: active
    reason: Separated meanings allow language work to proceed without a premature system classification.
    evidence: ART-LANGUAGE-MEANINGS
  - relation_id: REL-LANGUAGE-REALIZATION-DEPENDS-DECISION
    source_id: CTX-LANGUAGE-REALIZATION
    target_id: DEC-LANGUAGE-REALIZATION-001
    type: depends_on
    status: active
    reason: System realization depends on the Governance owner's identity and lifecycle decision.
    evidence: ART-LANGUAGE-REALIZATIONS
  - relation_id: REL-LANGUAGE-EDGES-DEPENDS-DECISION
    source_id: CTX-LANGUAGE-EDGES
    target_id: DEC-LANGUAGE-PRODUCES-001
    type: depends_on
    status: active
    reason: Cross-layer use of produces depends on resolving its incompatible endpoint meanings.
    evidence: ART-LANGUAGE-EDGES
  - relation_id: REL-LANGUAGE-KERNEL-ENABLES-ROOT
    source_id: ENA-LANGUAGE-AUTHORITY-NONCOLLAPSE-001
    target_id: CTX-LANGUAGE-ROOT
    type: enables
    status: active
    reason: The authority-bound candidate vocabulary lets the Governance runtime design proceed without collapsing evaluation inputs into authority or lifecycle.
    evidence: ART-LANGUAGE-AUTHORITY

recomposition: []
