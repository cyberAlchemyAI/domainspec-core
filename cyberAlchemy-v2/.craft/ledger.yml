    scope_id: CTX-CAV2-DEF-TOWERS
    term: typed coupling invariant
    statement: Any non-orthogonal dependency, bridge, constraint, influence, or co-change relation that affects CyberAlchemy v2 authority, routing, validation, or implementation must be represented as an explicit typed relation with endpoints, direction, owner, evidence, and effect.
    status: promoted-by-owner
    evidence: ART-CAV2-DEFINITIONS
  - definition_id: DEF-CAV2-REFLECTION-TOWER-METHOD-001
    scope_id: CTX-CAV2-DEF-TOWERS
    term: reflection tower method
    statement: When structural residue cannot be closed inside the current schema/data layer, the residue becomes the seed for a higher explanatory layer with its own schema, validation, owner, and recomposition path.
    status: promoted-by-owner
    evidence: ART-CAV2-DEFINITIONS
  - definition_id: DEF-CAV2-RESIDUE-001
    scope_id: CTX-CAV2-DEF-TOWERS
    term: residue
    statement: Residue is the typed remainder exposed when a transformation, translation, promotion, validation, or governance operation cannot preserve, name, justify, validate, or carry all source structure required by the operation's intended use.
    status: promoted-by-owner
    evidence: ART-CAV2-DEFINITIONS
  - definition_id: DEF-CAV2-ONTOLOGY-001
    scope_id: CTX-CAV2-DEF-TOWERS
    term: ontology
    statement: Ontology is a governed meaning layer that represents a domain, workspace, system, or operation as typed knowledge objects, typed relations, branch or role assignments, provenance, confidence, promotion state, and use obligations.
    status: promoted-by-owner
    evidence: ART-CAV2-DEFINITIONS

