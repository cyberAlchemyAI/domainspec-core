services:
  site:
    image: nginx:1.27-alpine
    container_name: creative-economy-academy-site
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK:-troqar_edge}
      - traefik.http.routers.creative-economy-academy.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.creative-economy-academy.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)
      - traefik.http.routers.creative-economy-academy.tls=true
      - traefik.http.routers.creative-economy-academy.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.creative-economy-academy.loadbalancer.server.port=80
    networks:
      - edge

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-troqar_edge}
