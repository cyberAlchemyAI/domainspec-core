agents_patch: "diff --git a/AGENTS.md b/AGENTS.md\n--- a/AGENTS.md\n+++ b/AGENTS.md\n@@ -42,6 +42,30 @@\n   conversation. Never report background work as complete while an agent is open,\n   unjoined, or missing its validation receipt.\n \n+## Governance Flow Choreography\n+\n+Governed work uses three explicit modes. Preserve exact-byte, owner, authority, risk,\n+public/private, publication, Git, deployment, external-effect, executable-identity,\n+and independent-review protections in every mode.\n+\n+1. **Preacceptance / no-effect** — validate the schema-first machine source, derive\n+   human views deterministically, run every reachable declared consumer, collect all\n+   blockers, and continue bounded environmental or mechanical evidence-only retries\n+   automatically. Run-local evidence is the only permitted write. Mark a dependent\n+   check `not_evaluable` with causal blockers; never call it PASS or omit it.\n+2. **Human decision** — after rehearsal, freeze one immutable owner decision graph,\n+   obtain independent review, emit at most one idempotent owner request for its digest,\n+   and stop. Preparation, rehearsal, freeze, review, or request emission grants no\n+   selection, admission, execution, publication, deployment, or external-effect authority.\n+3. **Effectful execution** — after exact acceptance, selection, and admission, execute\n+   only the accepted envelope and fail fast at the first effectful failure or real\n+   governance blocker. Never execute a successor implicitly.\n+\n+The artifact chain is monotonic: source -> derived graph -> rehearsal -> freeze ->\n+review -> request -> acceptance -> execution. A terminal outcome contract dominates\n+local PASS receipts. `Bounded` means the smallest complete vertical slice that crosses\n+every required real consumer and reaches the promised terminal boundary.\n+\n ## Governance-Defect Sidecar\n \n Do not turn a mechanical governance defect into the main conversation or abandon the\n@@ -75,7 +99,12 @@\n    scope already authorizes those writes. It must not alter accepted bytes in place,\n    apply canonical targets, promote, publish, commit, push, or execute product work.\n 5. Keep the parent available to the user. Join and inspect the helper receipt before\n-   resuming the affected edge; surface only the material decision or owner gate.\n+   evaluating resumption; surface only a material decision or owner gate.\n+6. Auto-resume the suspended chain exactly once at its recorded continuation point\n+   when the repair is independently reviewed PASS, classified\n+   `mechanical_evidence_only`, leaves the immutable decision graph and exact target\n+   digest unchanged, changes no authority-bearing executable, passes the required\n+   revalidation, and has not consumed its resume token. Otherwise remain stopped.\n \n Treat changed acceptance-bound bytes as a new candidate. Regenerate their inventory,\n digests, independent review bindings, and final acceptance request; never stretch an\n@@ -90,6 +119,12 @@\n never mask an earlier failed validation. When a sidecar finds a coverage gap, its\n repair proposal must add a regression check so the same defect fails before the next\n acceptance request.\n+\n+In preacceptance mode, run all reachable checks and return the first nonzero status\n+while preserving the complete blocker set. In effectful execution mode, stop before\n+the next effect. Environmental retries preserve graph identity; mechanical\n+evidence-only retries require passing repair review and auto-resume; semantic or\n+authority changes require a new frozen graph and at most one new owner request.\n \n ## Candidate-Local Prototype Fast Lane\n \n"
compatibility_impact:
- surface: existing accepted records
  impact: Remain readable historical evidence and keep their original authority. They are not retroactively promoted into governance-flow v1 closure or reinterpreted as request-ready.
- surface: new or regenerated owner requests
  impact: Require a schema-valid decision graph, complete collect-all rehearsal, freeze, independent review, and idempotent request record before presentation.
- surface: legacy split projections
  impact: Need an explicit adapter that composes one machine graph and proves field equality or subset relations; prose cannot repair stale machine arrays.
- surface: validators and wrappers
  impact: Preacceptance wrappers change from early exit to run-all-reachable while preserving the first nonzero. Effectful runners retain fail-fast semantics.
- surface: human-facing documents
  impact: Human views become derived outputs with source, graph, and renderer digests; hand-authored views are non-authoritative and cannot be request inputs.
- surface: sidecar repairs
  impact: Mechanical evidence-only repairs can resume without a new owner prompt only when machine predicates prove the decision graph and target bytes unchanged. Semantic or authority repair still requires a new graph.
- surface: public/private boundary
  impact: The public contract is project-agnostic and contains no private project prose, paths, examples, or identifiers. Private adapters and evidence remain outside Arcanum.
- surface: generated packages
  impact: No generated bytes change in this stage. Later changes are regenerated from canonical sources and independently inventoried, never hand-edited.
migration_plan:
- phase: M0-proposal
  action: Materialize and validate this non-overlapping design package; preserve the active MVLR and dirty-worktree bytes.
  gate: Only the six package paths change; all forbidden paths remain byte-identical.
  authority_effect: none
- phase: M1-owner-selection
  action: After the active MVLR chain is closed or handed off, rehash live target files and ask the owner to accept, revise, or reject the exact root/public change set and decision-envelope boundary.
  gate: Explicit owner decision over the refreshed proposal; no older digest is stretched over new bytes.
  authority_effect: proposal selection only
- phase: M2-framework-vertical
  action: Implement the framework contract, YAML schemas, deterministic compiler, renderer, runner, metrics events, one positive terminal fixture, and the full negative matrix in one smallest complete public vertical.
  gate: The positive fixture reaches its promised terminal boundary and every negative case fails at its intended boundary.
  authority_effect: public candidate bytes only
- phase: M3-root-policy
  action: Apply the exact AGENTS patch rebased onto the live file without disturbing the existing publication-policy change.
  gate: Patch check passes, policy statements do not conflict, and root diff contains only the proposed choreography changes plus pre-existing bytes.
  authority_effect: repository-local instruction change
- phase: M4-adapters
  action: Adapt Invoke, Task Session, and Context Builder only after their concurrent MVLR changes are frozen; preserve their current exact-byte and authority contracts while routing them through the framework graph.
  gate: Rebased exact inventory, all existing suites, new cross-capability terminal fixture, public privacy scan, and independent review pass.
  authority_effect: canonical public candidate bytes; no execution authority
- phase: M5-generated-parity
  action: Regenerate only the packages owned by the changed canonical capabilities and validate source/generated parity.
  gate: Exact generated inventory, zero unexplained files, zero private markers, all validation suites pass.
  authority_effect: generated candidate bytes only
- phase: M6-enforcement-and-observation
  action: Enable the new gate for new request versions, keep legacy records historical, emit the five metric events, and observe a bounded rollout before broader adoption.
  gate: Positive terminal fixture remains green and observed metrics meet targets; failures do not downgrade safeguards.
  authority_effect: enforcement only after separate acceptance; no publication or deployment authority
regression_matrix:
- case_id: P01-TERMINAL-VERTICAL
  polarity: positive
  assertion: One schema-valid source compiles, renders byte-stably, rehearses every real fixture consumer, freezes, reviews, emits one request, consumes fixture acceptance, executes in an isolated root, and reaches the promised terminal receipt with no successor.
- case_id: N01-INVALID-MACHINE-SOURCE
  polarity: negative
  assertion: A schema-invalid model source emits no graph, human view, rehearsal, or owner request.
- case_id: N02-HUMAN-VIEW-DRIFT
  polarity: negative
  assertion: A hand-edited human view or renderer/source digest mismatch is rejected and cannot influence authority.
- case_id: N03-MULTI-BLOCKER-COLLECT
  polarity: negative
  assertion: At least three independent preacceptance failures are all reported, later checks run, and process exit preserves the first nonzero.
- case_id: N04-NOT-EVALUABLE-CAUSALITY
  polarity: negative
  assertion: A dependency-blocked consumer is marked not_evaluable with exact causal blockers, never PASS or omitted.
- case_id: N05-PREPARATION-NO-AUTHORITY
  polarity: negative
  assertion: Compilation, rehearsal, freeze, review, and request evidence cannot set selection, admission, execution, publication, deployment, or external-effect permissions.
- case_id: N06-STALE-DESCENDANT
  polarity: negative
  assertion: Any source or decision-envelope mutation invalidates rehearsal, freeze, review, request, acceptance, and execution descendants.
- case_id: N07-DUPLICATE-REQUEST
  polarity: negative
  assertion: A second emission attempt for the same decision_graph_digest returns the original request identity and bytes and creates no second prompt event.
- case_id: N08-MISSING-REVIEW
  polarity: negative
  assertion: Missing, stale, non-independent, or non-passing review blocks request emission.
- case_id: N09-LOCAL-PASS-NO-TERMINAL
  polarity: negative
  assertion: All component receipts may PASS but aggregate completion remains false when the required terminal receipt is missing.
- case_id: N10-WRONG-TERMINAL
  polarity: negative
  assertion: A schema-valid terminal receipt with the wrong boundary, postimage, effect, or successor state fails completion.
- case_id: N11-EFFECTFUL-FAIL-FAST
  polarity: negative
  assertion: The first effectful failure stops execution and proves no later effect or successor ran.
- case_id: N12-ENVIRONMENTAL-RETRY
  polarity: negative
  assertion: A declared environmental failure retries within budget without graph change or owner prompt; exhaustion blocks.
- case_id: N13-MECHANICAL-AUTO-RESUME
  polarity: negative
  assertion: A passing independently reviewed evidence-only repair with unchanged decision and target digests consumes one resume token and resumes the suspended stage without a prompt.
- case_id: N14-SIDECAR-NO-RESUME
  polarity: negative
  assertion: Failed review, changed decision or target digest, changed authority-bearing executable, or a consumed resume token leaves the chain suspended.
- case_id: N15-SEMANTIC-NEW-GRAPH
  polarity: negative
  assertion: A semantic, owner, risk, authority, write, privacy, publication, deployment, external-effect, successor, or executable-authority change requires a new graph and forbids auto-resume.
- case_id: N16-EXACT-BYTE-ACCEPTANCE
  polarity: negative
  assertion: A changed target-byte digest rejects the old acceptance even when prose and path names are unchanged.
- case_id: N17-MANUAL-RECEIPT-TRANSFER
  polarity: negative
  assertion: A consumer that requires manual copying, path translation, or prose extraction fails the automatic receipt-edge contract and increments the manual-transfer metric.
- case_id: N18-LATE-DISCOVERABLE-BLOCKER
  polarity: negative
  assertion: A governance blocker introduced after request that a declared preacceptance consumer could detect fails the blocker-timing metric.
- case_id: N19-PRIVATE-MARKER-PUBLIC
  polarity: negative
  assertion: Private project identifiers, paths, prose, or authority names in proposed public additions fail the privacy scan.
- case_id: N20-GRAPH-WIDENING
  polarity: negative
  assertion: A derived graph or human view that widens target, owner, risk, write, publication, deployment, external-effect, or successor scope relative to the source fails.
- case_id: N21-BOUNDLESS-SLICE
  polarity: negative
  assertion: A small task that does not traverse every required consumer or cannot reach its terminal predicate is not considered bounded or complete.
positive_terminal_fixture:
  fixture_path: arcanum/framework/governance-flow/development/fixtures/positive/terminal-boundary-source.json
  executor_path: arcanum/framework/governance-flow/development/fixtures/positive/terminal-boundary-executor.py
  promised_boundary: An isolated fixture output reaches its exact accepted postimage, a schema-valid terminal receipt records complete, protected inputs remain unchanged, and no successor or external effect occurs.
  steps:
  - validate one model-produced machine source
  - compile one normalized decision graph
  - render the human view twice and compare exact bytes
  - run every declared consumer in collect-all isolated rehearsal
  - freeze the zero-blocker graph
  - independently review the graph and full rehearsal
  - emit one idempotent fixture owner request and prove the second call returns the same request
  - consume one exact fixture acceptance after proving selection, admission, and execution were previously false
  - select and admit the sandboxed fixture executor
  - execute the allowed local effect and fail fast on any error
  - validate the terminal receipt and exact postimage
  - assert aggregate completion from the terminal predicate and prove no successor ran
  required_assertions:
  - source, graph, renderer, rehearsal, freeze, review, request, acceptance, execution, and terminal digests form one monotonic chain
  - human output is byte-identical across two renders
  - all required consumers were evaluated
  - preacceptance blocker set is empty
  - preacceptance protected-input before and after digests are equal
  - preacceptance created only declared run-local evidence
  - request count for the graph is one
  - prompt event count for the graph is one
  - no selection, admission, or execution precedes acceptance
  - execution writes only the accepted sandboxed target
  - terminal receipt matches the promised boundary and exact postimage
  - no prohibited effect, external call, or successor execution occurs
  - a paired all-local-PASS but missing-terminal variant fails aggregate completion
  - all five metric values satisfy their targets for the fixture run
