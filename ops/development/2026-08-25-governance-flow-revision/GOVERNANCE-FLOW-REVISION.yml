problem_statement: The current system safely refuses to stretch exact acceptance across repaired bytes, but it discovers too many deterministic governance blockers only after an owner prompt. Producer-local PASS receipts are being mistaken for terminal closure, so safe repairs create serial approval loops. The correction is a three-mode flow that collects every reachable no-effect blocker before one frozen owner decision, then preserves fail-fast behavior once effects can occur.
required_invariants:
- id: GFR-01
  statement: Preacceptance is deterministic and no-effect except for isolated run-local evidence writes.
  enforcement: Deny repository target mutation, selection, admission, publication, deployment, credentials, external calls, and successor execution; hash protected inputs before and after every rehearsal.
- id: GFR-02
  statement: Preacceptance collects every reachable blocker and continues automatically.
  enforcement: Run all independent checks, preserve the first nonzero for process status, record later failures too, and mark dependency-blocked checks not_evaluable with causal blocker references.
- id: GFR-03
  statement: Human-decision mode stops exactly once on one immutable owner decision graph.
  enforcement: Use persistent idempotency keyed by decision_graph_digest; a repeat emission returns the original request identity and bytes and increments no prompt counter.
- id: GFR-04
  statement: Effectful execution fails fast.
  enforcement: After acceptance, stop at the first failed or blocked effect and prove that no later effect or successor ran.
- id: GFR-05
  statement: A terminal outcome contract dominates component PASS receipts.
  enforcement: Aggregate completion is false until the required terminal receipt validates and its observed effects, prohibited effects, final postimage, and successor state satisfy the frozen terminal predicate.
- id: GFR-06
  statement: Bounded means the smallest complete vertical slice.
  enforcement: A slice is bounded only if it crosses every required real consumer and reaches the promised terminal boundary without adding unrelated targets, authority, risk, or effects.
- id: GFR-07
  statement: Preparation is not authority.
  enforcement: Compilation, rehearsal, freeze, review, and request emission must state authority_effect none and keep selection, admission, execution, publication, deployment, and external effects false.
- id: GFR-08
  statement: Models provide schema-valid machine views; human views are deterministic projections.
  enforcement: Reject the source before rendering when schema validation fails; render only from the validated machine graph and bind source digest, graph digest, renderer digest, and visibility policy.
- id: GFR-09
  statement: 'The evidence chain is monotonic: source to graph to rehearsal to freeze to review to request to acceptance to execution.'
  enforcement: Each descendant binds the exact predecessor digest; source or decision-envelope mutation invalidates all descendants and no receipt may rebind backward to different bytes.
- id: GFR-10
  statement: Retry policy distinguishes environmental, mechanical evidence-only, and semantic or authority changes.
  enforcement: Apply machine predicates over target-byte, decision-envelope, executable-authority, evidence, and environment digests; never infer the retry class from prose.
- id: GFR-11
  statement: A governance-only sidecar auto-resumes its suspended chain after a passing repair.
  enforcement: Resume exactly once at the recorded continuation point only when repair review passes, decision and target digests are unchanged, the defect is mechanical evidence-only, and no authority-bearing executable changed.
- id: GFR-12
  statement: Exact-byte, owner, risk, authority, privacy, publication, Git, deployment, external-effect, and independent-review protections remain intact.
  enforcement: Keep these fields inside the immutable decision envelope and require a new graph and decision whenever any one changes.
before_workflow:
- ordinal: 1
  name: prepare local artifacts
  behavior: Each producer validates its own output and can report PASS.
  authority: No execution authority, but local PASS is often treated as request-ready.
- ordinal: 2
  name: prompt owner
  behavior: An exact candidate is presented before all real downstream consumers have exercised it.
  authority: Owner acceptance binds exact bytes and correctly cannot cover later repairs.
- ordinal: 3
  name: discover downstream blocker
  behavior: A later validator, schema, runner, locator, projection, or closeout consumer finds a deterministic defect.
  authority: Effectful work stops safely.
- ordinal: 4
  name: repair and reprompt
  behavior: Acceptance-bound bytes change, the old decision becomes unusable, and the owner is asked again.
  authority: Safety is preserved at the cost of serial approval loops.
after_workflow:
- ordinal: 1
  name: schema-valid machine source
  behavior: The model emits one versioned source containing the complete decision envelope and terminal outcome contract.
  authority: Preparation only; no authority effect.
- ordinal: 2
  name: deterministically derived graph and human view
  behavior: The compiler normalizes the source into the owner decision graph; the renderer derives the human view from that validated graph.
  authority: Derived artifacts cannot widen the source ceiling.
- ordinal: 3
  name: collect-all rehearsal
  behavior: Every reachable actual consumer runs in isolation; all blockers are accumulated and mechanically safe retries continue without prompting.
  authority: Only isolated run-local evidence writes are permitted.
- ordinal: 4
  name: freeze
  behavior: A zero-blocker rehearsal freezes the exact decision graph and terminal predicate.
  authority: Freeze grants no selection, admission, or execution authority.
- ordinal: 5
  name: independent review
  behavior: A distinct reviewer checks the frozen graph, complete rehearsal, privacy boundary, and request eligibility.
  authority: Review can only permit one request emission.
- ordinal: 6
  name: single owner request
  behavior: The request emitter publishes at most one idempotent question for the immutable graph and then stops.
  authority: The request itself grants no downstream authority.
- ordinal: 7
  name: acceptance
  behavior: The owner accepts or rejects the exact decision graph; revisions create a new graph rather than mutating the frozen one.
  authority: Acceptance is necessary but does not bypass selection or admission gates.
- ordinal: 8
  name: fail-fast execution to terminal boundary
  behavior: The admitted slice executes effects in order, stops at the first failed effect, and completes only when the terminal contract is satisfied.
  authority: Limited to the accepted, selected, admitted envelope; no automatic successor.
mode_contracts:
- mode: preacceptance_no_effect
  effect_ceiling: Isolated run-local evidence only; zero repository-target, selection, admission, publication, deployment, credential, external-system, or successor effects.
  stop_policy: Do not stop on an ordinary reachable validation failure; record it and continue. Stop only when safe evaluation itself is impossible or a semantic or authority decision is required.
  continuation_policy: Automatically rerun bounded environmental and mechanical evidence-only repairs while retry budget and graph identity remain valid.
  completion_rule: Complete only when all required checks are pass, no check is not_evaluable, blocker set is empty, two-run evidence is byte-stable, and protected inputs are unchanged.
- mode: human_decision
  effect_ceiling: One idempotent owner request for one frozen decision graph; no selection, admission, or execution.
  stop_policy: Stop immediately after returning the one request or its existing idempotent identity.
  continuation_policy: Continue only from an explicit owner response bound to that request; revisions create a new graph.
  completion_rule: Mode closes with exact accept or reject evidence; absence of a response remains pending, not failed.
- mode: effectful_execution
  effect_ceiling: Exactly the accepted, selected, and admitted target, write, executable, risk, and external-effect envelope.
  stop_policy: Fail fast at the first effectful failure or governance blocker and prove later effects did not run.
  continuation_policy: Resume only through a passing governance-only sidecar predicate or a new admitted graph after semantic or authority change.
  completion_rule: Complete only when the promised terminal receipt validates and its terminal predicate is true.
decision_graph_contract:
  definition: The immutable owner decision graph is the normalized, schema-valid envelope of exact target bytes and all fields whose change can alter owner intent, authority, risk, privacy, publication, deployment, external effects, executable authority, or the promised terminal outcome.
  includes:
  - exact target postimages and baselines
  - owner and lifecycle route
  - authority and write ceilings
  - risk and request budget
  - public/private and publication class
  - deployment, credential, destructive, and external-effect policy
  - authority-bearing executable path, digest, argv, mode, cwd, and environment allowlist
  - terminal outcome contract
  - admitted frontier, route, selection, and successor policy
  excludes:
  - non-authoritative run identifiers and timestamps
  - mechanical evidence receipts whose replacement proves the decision graph and target-byte digests unchanged
  freeze_rule: Freeze only after a complete zero-blocker rehearsal; record graph digest and exact rehearsal predecessor without allowing later graph mutation.
  request_rule: Persist request identity by decision_graph_digest and enforce request_count <= 1; retries return the same bytes and prompt identity.
  descendant_rule: Rehearsal, freeze, review, request, acceptance, execution, sidecar, and terminal receipts bind predecessor digests. A decision-envelope or target-byte change invalidates descendants and requires a new graph.
terminal_outcome_contract:
  dominance_rule: The aggregate result is incomplete or blocked unless the terminal predicate is true, even when every local component receipt reports PASS.
  required_fields:
  - promised_boundary_id
  - required_terminal_receipt_path_and_schema
  - required_effects_and_exact_postimages
  - prohibited_effects_and_successors
  - completion_predicate
  - authority_and_write_ceiling
  - terminal_observer_identity
  local_pass_rule: Component PASS means only that component's bounded claim succeeded; it never synthesizes terminal completion.
  bounded_definition: The smallest complete vertical slice that traverses every required real consumer and can satisfy the promised terminal predicate without unrelated scope.
retry_policy:
- classification: environmental
  predicate: Decision graph, target bytes, semantic inputs, authority-bearing executable, and required evidence schema are unchanged; failure is attributable to a declared transient runtime condition.
  action: Retry automatically within an explicit budget and record every attempt; exhaustion blocks without an owner prompt.
  graph_effect: Preserve the same graph and descendants that remain exact.
  owner_prompt: none
- classification: mechanical_evidence_only
  predicate: Repair changes only validator, wrapper, locator, receipt consistency, formatting, or run-local evidence mechanics and proves the decision graph, target-byte, semantic, authority, risk, privacy, publication, deployment, external-effect, and authority-bearing executable digests unchanged.
  action: Run one bounded governance sidecar, independently review the repair, revalidate the suspended edge, and auto-resume once from its recorded continuation point.
  graph_effect: Preserve the accepted decision graph; append exact repair and resume receipts.
  owner_prompt: none
- classification: semantic_or_authority
  predicate: Any target byte, terminal effect, owner, route, risk, write, privacy, publication, deployment, credential, external-effect, successor, or authority-bearing executable identity changes.
  action: Stop, supersede the old chain, compile and rehearse a new graph, independently review it, and request one new owner decision.
  graph_effect: New decision_graph_digest required; old acceptance cannot be reused.
  owner_prompt: exactly one for the new immutable graph
sidecar_resume_contract:
  suspend_rule: Capture the failed stage, first nonzero status, complete diagnostics, accepted decision_graph_digest, target_byte_digest, predecessor receipt, and exact continuation point before repair.
  repair_ceiling: The sidecar may change only separately staged mechanical evidence or already-authorized validator/workflow tests; it may not change accepted target bytes, semantics, authority, promotion, publication, deployment, credentials, external effects, or authority-bearing executable identity.
  resume_predicate: repair_classification == mechanical_evidence_only AND repair_review == pass AND decision_graph_digest unchanged AND target_byte_digest unchanged AND revalidation == pass AND resume_count == 0
  non_resume_cases:
  - repair review fails or is missing
  - decision graph or target-byte digest changes
  - semantic, owner, risk, authority, privacy, publication, deployment, external-effect, or executable-authority boundary changes
  - resume already consumed
metrics:
- metric_id: postacceptance_consumer_defects
  definition: Count of deterministic consumer-contract defects first discovered after acceptance for a graph when the responsible consumer was declared or required preacceptance.
  target: '0'
  evidence_event: governance_flow.consumer_defect.v1
- metric_id: prompts_per_immutable_graph
  definition: Owner decision prompts emitted divided by immutable decision graphs that reached human-decision mode; each such graph must have exactly one prompt identity and at most one presentation.
  target: '1'
  evidence_event: governance_flow.owner_prompt.v1
- metric_id: unchanged_byte_approval_retries
  definition: Count of new owner request identities emitted after a prior request when both decision-envelope digest and exact target-byte digest are unchanged.
  target: '0'
  evidence_event: governance_flow.request_retry.v1
- metric_id: blockers_discovered_after_request
  definition: Count of governance blockers first observed after request emission that the declared deterministic no-effect consumers could have discovered before request.
  target: '0'
  evidence_event: governance_flow.late_blocker.v1
- metric_id: manual_receipt_transfers
  definition: Count of receipt edges requiring a human to copy, rewrite, translate, or manually relocate machine evidence between declared consumers.
  target: '0'
  evidence_event: governance_flow.receipt_transfer.v1
