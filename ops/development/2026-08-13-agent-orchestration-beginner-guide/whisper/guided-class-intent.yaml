text_intent_substrate:
  metadata:
    substrate_version: "0.2"
    transport_type: repository_local_interactive_guided_class
    transport_proof_status: unproven
    artifact_status: candidate
    intent_state: frozen
    parent_transport: repository_local_learning_guide

  source_context:
    learning_guide:
      path: ops/development/2026-08-13-agent-orchestration-beginner-guide/learning-guide.md
      sha256: 506595a3fbd590af33709ea7c2d614c91da738baf693b373712692fd9eea06a4
    parent_receipt:
      path: ops/development/2026-08-13-agent-orchestration-beginner-guide/whisper/validation-report-r2.json
      status: flag
      inherited_residue:
        - transport-proof-unproven
        - comprehension-required
    xray_lane_model:
      path: ops/development/2026-08-13-agent-orchestration-beginner-guide/guided-class.lanes.json
      status: candidate
    evidence_policy: >-
      Audience-facing material may use the guide's public Arcanum explanations, public
      paths, fixture commands, and test-backed failure codes. Research provenance,
      private pillar material, run identities, and recovery chronology remain outside
      the class.

  revision_context:
    revision_id: guided-class-context-r4
    user_correction: Add more explanatory context inside every lesson step.
    scope: >-
      Deepen lesson-local context while preserving the seven-step learning trajectory,
      exercises, and public evidence boundary.
    meaning_core_effect: none
    intent_state_effect: remains_frozen
    prior_html:
      path: ops/development/2026-08-13-agent-orchestration-beginner-guide/guided-class.html
      sha256: 57b419b02180faff885d2ed739af6ba05956d2c8bb7da74ae125f42b1d6659cc
    prior_validation_receipt:
      path: ops/development/2026-08-13-agent-orchestration-beginner-guide/whisper/guided-class-validation.json
      sha256: ff81f1bcee05fb0bbf4564f5023340bd4a310fade74e52453175f07f0dd8406d
    audience_boundary: >-
      Do not surface private paths, recovery chronology, or governance transcript
      mechanics in the learner-facing class.

  author_objective:
    primary_outcome: >-
      Turn the beginner guide into a self-guided local class in which each interaction
      helps the learner distinguish a supported orchestration state from an unjustified
      next claim.
    desired_reader_change: >-
      Move the learner from reading the controlled-relay metaphor to applying the
      last-proven-step loop to action JSON, event order, receipts, gates, and one unseen
      transfer scenario, with enough context to explain why each boundary exists before
      practicing it.
    success_signal: >-
      The learner can choose helper versus dispatch, locate the last supported state,
      match code artifacts to owners, diagnose a missing causal transition, explain what
      fixture compilation proves, and complete a four-part retell chain.
    author_stance: practical instructor with explicit evidence limits

  resonance_core:
    tone: calm, curious, and rigorous without ceremony
    voice: collaborative coding instructor
    emotional_residue: confidence in asking what the evidence actually permits
    value_signal: clicks earn understanding only when they expose a decision or boundary
    forbidden_feels:
      - gamification without learning evidence
      - magical autonomy
      - live-operations tutorial
      - completion theatre
      - inaccessible visual puzzle

  relevance_core:
    target_public: >-
      beginners who know agents, files, basic JSON, and terminal commands but have not
      operated a governed multi-agent dispatch
    reader_state: needs short context bridges before active practice
    authority_mode: source-backed local teaching candidate
    likely_questions:
      - When is one helper enough?
      - What exactly changes between an action and a gate?
      - Which code component owns each transition?
      - What does a fixture command prove?
      - How do I find the first missing causal event?
    reader_reward: a reusable source-level debugging method for orchestration state

  trajectory_core:
    narrative_anchor: follow one work ticket through a controlled relay
    transport_type: repository_local_interactive_guided_class
    introduction_strategy: >-
      Begin with two work requests and ask the learner to choose the smallest responsible
      coordination shape before naming the full runtime.
    body_parts:
      - coordination choice
      - four-question last-proven-step loop
      - controlled relay ordering
      - action JSON and owner map
      - causal failure diagnosis
      - fixture-only coding lab
      - unseen transfer and retell exit ticket
    ending_strategy: >-
      Return a self-recorded local learning receipt that preserves the learner's answers
      while stating that browser completion is not admitted human-comprehension proof.

  transport_schema:
    profile_id: repository_local_interactive_guided_class.v0
    status: candidate_unproven
    delivery_mode: self_guided
    renderer: L0 semantic HTML, CSS, inline SVG, and JavaScript
    dependency_policy: no remote assets, packages, APIs, or shell bridges
    required_surfaces:
      - class orientation and evidence ceiling
      - free lesson navigation with local progress
      - one lesson-local context primer in every step
      - one expandable public-repository anchor and claim limit in every step
      - source-backed and inference labels
      - native form controls and live feedback
      - keyboard-operable lifecycle trace
      - annotated action JSON
      - five test-backed causal failure codes
      - copy-only fixture commands
      - exit ticket and local JSON export
      - source trail and reader glossary
    completion_policy: >-
      A lesson completes only after an answer or authored response. Visited state alone is
      not progress. Free navigation remains available so completion is never a keyboard or
      comprehension trap.
    evidence_policy: >-
      Local answers and exported progress are learner-reported observations. They do not
      admit themselves as comprehension, runtime, authorization, publication, deployment,
      or production evidence.

  composition_plan:
    candidate_id: controlled-relay-active-practice
    selection_rationale: >-
      Seven focused moments preserve the guide's earned progression while giving each
      core distinction a source-grounded context bridge and one observable learner action.
    lesson_sequence:
      - lesson_id: choose
        outcome: distinguish a bounded helper from a governed dispatch
        context_focus: >-
          Identify the decision being protected, then distinguish one bounded helper from
          a governed dispatch.
        evidence_action: classify two scenarios
      - lesson_id: prove
        outcome: apply state, evidence, next owner, and residue
        context_focus: >-
          Explain status transitions, residue, and the boundary between an admitted event
          and a completed or truthful outcome.
        evidence_action: choose the missing next decision
      - lesson_id: relay
        outcome: order the controlled relay without collapsing transitions
        context_focus: >-
          Show which upstream assumptions the relay inherits and why the workflow separates
          preparation, execution, and closure.
        evidence_action: inspect a lifecycle state, identify the gate predecessor, and name a non-implication
      - lesson_id: code
        outcome: connect an action JSON field to its safety responsibility
        context_focus: >-
          Connect stable identity, owner capability, declared inputs and outputs, and
          success evidence before side effects occur.
        evidence_action: identify the forbidden-write boundary and code owner
      - lesson_id: fail
        outcome: stop at the first invalid causal transition
        context_focus: >-
          Teach the valid-prefix method so a learner can find the first unsupported
          transition without receiving the answer upfront.
        evidence_action: diagnose a fixture-backed validator error and protected boundary
      - lesson_id: lab
        outcome: predict what safe fixture compilation can establish
        context_focus: >-
          Separate what deterministic fixture evidence can show from host execution,
          transport, network, or domain truth.
        evidence_action: select the supported claim and copy optional commands
      - lesson_id: transfer
        outcome: use the mechanism on an unseen dependent-work scenario
        context_focus: >-
          Rebuild the local transition as a decision, artifact, evidence, and human-gate
          chain without supplying a model answer.
        evidence_action: answer the gate question and author a four-part retell chain
    surface_map:
      audience_facing:
        - ops/development/2026-08-13-agent-orchestration-beginner-guide/guided-class.html
      authoring_only:
        - ops/development/2026-08-13-agent-orchestration-beginner-guide/guided-class.lanes.json
        - ops/development/2026-08-13-agent-orchestration-beginner-guide/whisper/guided-class-intent.yaml
        - ops/development/2026-08-13-agent-orchestration-beginner-guide/whisper/guided-class-validation-r4.json
      public_export: none
    xray_patterns:
      - pattern.process-branch
      - pattern.lifecycle-stack
      - pattern.evidence-inference-split

  language_audition:
    status: approved_by_parent_editorial_review
    transport_proof_effect: none
    moments:
      - moment_id: opening_choice
        projected_copy: One task. One result. Do you need a team?
        interaction_copy: Choose the smallest coordination shape that keeps the decision inspectable.
      - moment_id: lifecycle_tension
        projected_copy: A worker returned. May the next worker begin?
        interaction_copy: Find the last proven step before you trust the apparent progress.
      - moment_id: transfer_reveal
        projected_copy: The gate passed. The next action does not exist yet.
        interaction_copy: Name what changed—and what still does not follow.
    checks:
      problem_specific_opening: pass
      need_before_name: pass
      one_visible_thought_per_moment: pass
      question_does_not_contain_answer: pass
      read_aloud_natural: pass
      safety_boundary_visible: pass
      claim_ceiling_visible: pass

  interaction_contract:
    evidence_fields:
      - stable question identifier
      - learner answer
      - attempt count
      - scoped correctness for closed questions
      - learner-authored response for the exit ticket
    accessibility:
      - semantic landmarks and linear heading order
      - skip link and visible focus
      - native buttons, radios, fieldsets, legends, and status regions
      - complete keyboard path without drag-only controls
      - text labels in addition to color
      - reduced-motion support
      - narrow viewport and zoom resilience
    local_state:
      storage: browser localStorage when available
      reset: explicit and complete
      export: inspectable JSON copied by explicit learner action
      privacy: no network transmission

  safe_lab_boundary:
    allowed:
      - copy the public dispatch validation command
      - copy compilation commands that write to mktemp output
      - copy the public event validation command
      - copy the three direct unittest commands
      - reveal guide-backed expected observations
    forbidden:
      - executing shell commands from the page
      - native host calls
      - collaboration tool calls
      - live dispatch registration or spawning
      - driver spawn, record, or advance operations
      - repository mutation exercises
      - network requests

  validation_plan:
    structural:
      - parse HTML and lane JSON
      - run the canonical X-ray example validator with its explicit schema path
      - verify exactly seven lesson-context primers, one for each lesson id
      - verify every primer contains a public repository anchor and an explicit claim boundary
      - verify no remote references and no trailing whitespace
    browser:
      - load with no console or page errors
      - complete all seven lessons with pointer controls
      - repeat the critical path with keyboard controls
      - open and close every expandable repository anchor with the keyboard
      - verify lesson context remains present across navigation and reload
      - verify deterministic feedback, persistence, reset, and export
      - inspect narrow viewport and reduced-motion behavior
      - confirm all copied commands remain fixture-only
    human:
      - intended beginner completes an unseen transfer task
      - human reviewer scores the four-field exit ticket

  claim_ceiling:
    status_ceiling: flag
    reasons:
      - interactive-transport-unproven
      - intended-reader-comprehension-required
    browser_pass_may_establish:
      - exact local HTML renders and behaves as tested
      - encoded questions return deterministic feedback
      - safe lab controls contain only fixture commands
      - local persistence and reset work as tested
    browser_pass_cannot_establish:
      - durable beginner comprehension
      - independent orchestration ability
      - live host readiness
      - canonical documentation
      - publication, deployment, production, or semantic truth

  learning_residue:
    status: pending_candidate_validation
    questions:
      - Can a beginner identify the first unsupported transition in an unseen history?
      - Does the seven-lesson path feel guided without hiding free navigation?
      - Does code inspection clarify ownership without becoming an operator runbook?
      - Is the self-recorded completion receipt useful without inviting evidence inflation?
      - Is each context primer short enough to orient a beginner without burying the active task?
      - Does any primer reveal the answer to its own exercise?
