      position_relation: planned_lesson
      selector: '#lesson-relay [data-context-for="relay"] > p:nth-of-type(2)'
      source_line: 1436
      text: Planning creates the ticket; the host stage attempts it; terminal accounting closes the worker; evidence handling admits and joins the result; the gate decides one transition. A dependent action then re-enters the same lifecycle—planning it is not closeout.
      text_sha256: 7ea3ede6ae4bfdc97111f0bb19643921acb2095872654712dd9807b3af94e416
  - formal_term: compile
