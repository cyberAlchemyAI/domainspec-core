      selector: '#lesson-relay [data-context-for="relay"] > p:nth-of-type(1)'
      source_line: 1435
      text: Strategy, the exact route, material confirmation, route validation, and host preflight sit upstream of this lesson. The trace starts at one persisted action so you can follow a single work ticket without losing the causal edges around it.
      text_sha256: 38e5c97dcae70aaa3a981f1e88b64bcc4bd7208461091a604c7b81f0091ad3ad
  - formal_term: closeout
