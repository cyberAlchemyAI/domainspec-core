      selector: '.hero .lede'
      source_line: 1194
      text: One task can look finished while its evidence is still several handoffs behind. Learn to find the last proven step, inspect the code boundary, and stop before a claim outruns its proof.
      text_sha256: a1668fc3c273c534131da9912d03145a27d0f7eed2997f8850dfa51afc3e2390
  - formal_term: bounded helper
    tier: T1
    planned_first_lesson: '1'
