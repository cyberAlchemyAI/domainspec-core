decisions:
  - decision_id: DEC-DSV2-CRAFT-SCOPE
    scope_id: CTX-DSV2-ROOT
    question: Should DomainSpec v2 have its own Craft space, or stay one context in the cav2 ledger?
    options: [own-scoped-craft, stay-cav2-context]
    decision_type: structural
    blocking: false
    status: closed
    selected_option: own-scoped-craft
    rationale: >-
      v2 outgrew a single cav2 row — it has multiple nested sub-contexts (authority / make-it-green /
      reformulate-batch1 / spec-ontology) each with its own blockers, decisions, gaps, and recomposition.
      A scoped .craft/ is not a new cav2 folder (memory constraint intact); cav2 stays umbrella + points here.
    evidence: [CTX-DSV2-ROOT]

  - decision_id: DEC-DSV2-LANE-ZA
    scope_id: CTX-DSV2-SPEC-ONTOLOGY
    question: Lane Z (fuse spec == ontology) vs Lane A (keep separate + generated bidirectional mapping)?
    options: [lane-z-unify, lane-a-generated-mapping, defer]
    decision_type: research-direction
    blocking: false
    status: open
    default_option: defer
    description: >-
      The toy proved the mapping is viable — which BOTH lanes need — so it does not decide between them.
      The decider is SEED's "cheaper agents" claim, unmeasurable on paper (proxy gap).
    impact: Determines whether the spec schema ever fuses with code patterns (SEED promotion boundary).
    links:
      - {label: verdict, target: ART-DSV2-SPEC-ONTOLOGY-TOY, kind: evidence}

  - decision_id: DEC-DSV2-EDGE-ADMISSIBILITY
    scope_id: CTX-DSV2-REFORMULATE-BATCH1
    question: What governs whether a RELATIONSHIPS edge earns its own type, vs folding into a node type or a coupling flag?
    options: [ad-hoc, build-from-owned-cav2-orthogonality]
    decision_type: edge-law
    blocking: false
    status: closed
    selected_option: build-from-owned-cav2-orthogonality
    rationale: >-
      The edge-law admissibility test ("an edge earns its type iff it composes into different code") is a
      domain specialization of owned cav2 invariants — CAV2-D22 (orthogonal classification), CAV2-D29
      (axis orthogonality), CAV2-D16 (typed coupling). Rulings: keep enforces vs applies (guard vs
      select); collapse enforces/enforces-cross to one edge + a cross-feature flag; reject queries for
      Calculation->Policy (redundant with applies); widen applies to Policy->{Operation, Calculation}.
      Scope = governance orthogonality, NOT Lean/Hilbert projector orthogonality (excluded from cav2).
    evidence: [ART-DSV2-REFORMULATE-BATCH1, ART-DSV2-SPEC-ONTOLOGY-TOY]
    links:
      - {label: CAV2-D22 orthogonal classification, target: "[repo-root]/cyberAlchemy-v2/authority/definitions/DEFINITIONS.md", kind: path}
      - {label: CAV2-D29 axis orthogonality, target: "[repo-root]/cyberAlchemy-v2/authority/definitions/DEFINITIONS.md", kind: path}
      - {label: CAV2-D16 typed coupling, target: "[repo-root]/cyberAlchemy-v2/authority/definitions/DEFINITIONS.md", kind: path}

