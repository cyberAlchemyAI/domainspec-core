# DomainSpec v2 meta-type schema — Saga (Behavioral). SCHEMA-CONSTITUTION; companion saga.md.
meta_type: Saga
category: behavioral
companion: saga.md
code_pattern: long-running orchestration across features/bounded contexts with compensation (cross-feature)

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  cross_feature:
    rule: attribute-equals
    key: scope
    value: cross-feature

distinguisher:
  vs: Workflow
  rule: a Saga spans features (scope=cross-feature); a Workflow stays within one feature

edge_participation:
  source_of: [orchestrates]
  target_of: []

fixtures:
  positive: spec/__fixtures__/mt/saga-ok.md
  negative: spec/__fixtures__/mt/saga-bad.md
