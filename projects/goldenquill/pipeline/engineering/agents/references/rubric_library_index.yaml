# The 12-Dimension Universal Framework (90+ Rubric)
# Used when funder-specific rubric is unavailable or as cross-check overlay
universal_framework:
  name: "90+ Rubric"
  total_points: 120
  threshold: 110  # 91.7% = "90+ on any funder rubric"
  dimensions:
    1: { name: "Project Narrative Clarity & Coherence", points: 10 }
    2: { name: "Need Statement / Problem Definition", points: 10 }
    3: { name: "Goals, Objectives, Outcomes Alignment", points: 10 }
    4: { name: "Methods / Approach / Work Plan", points: 10 }
    5: { name: "Timeline & Milestones", points: 10 }
    6: { name: "Budget Justification & Reasonableness", points: 10 }
    7: { name: "Organizational Capacity & Track Record", points: 10 }
    8: { name: "Partnerships & Collaboration", points: 10 }
    9: { name: "Evaluation Plan & Metrics", points: 10 }
    10: { name: "Sustainability / Post-Grant Plan", points: 10 }
    11: { name: "Innovation / Unique Value Proposition", points: 10 }
    12: { name: "Alignment with Funder Priorities", points: 10 }

# Cross-rubric synthesis rules
synthesis_rules:
  - "Always score against PRIMARY rubric first"
  - "Select 2-3 related rubrics from 'related_rubrics' field"
  - "Note where related rubrics weight dimensions differently"
  - "Note dimensions related rubrics emphasize but primary doesn't"
  - "Cross-rubric notes are informational — primary score is canonical"
  - "If funder-specific rubric unavailable, use universal framework as primary"
  - "When funder weights dimensions differently, score proportionally but report all 12"

# SFR format requirement (per A3)
sfr_requirement: |
  Every dimension score uses Semi-Formal Reasoning format:
    PREMISES: [rubric criterion + draft evidence + PC corroboration]
    TRACE: [reasoning chain from premises to score]
    CONCLUSION: [score + deduction reason + prescriptive fix + point recovery estimate]
  Logician enforces via F-VERDICT-CERT-MALFORMED POST-gate.
