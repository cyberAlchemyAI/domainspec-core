display_name: Market Access
funding_mechanism_summary: Buyer development, distribution, commercialization, and demand-side funding where verified buyer
  commitments, channel strategy, production capacity, and unit economics drive underwriting (USDA VAPG / LAMP / SCBGP / Regional
  Food Business Centers, SBA growth programs, EDA Build to Scale, SBIR Phase II / IIB commercialization, NSF I-Corps, state
  agricultural marketing programs). Includes the SBIR Phase III commercialization stage where Phase II awardees proceed to
  revenue-generating market presence without further SBIR funding — Phase III is a status / mechanism reliant on private,
  customer-funded, or other non-federal capital, not a new federal grant. The Phase II → Phase III transition is characteristic
  of Market Access funding logic and distinguishes it from purely R&D-focused funding.
