    note: AMS-administered. 25% non-federal cost share required (cash + in-kind). FY rounds annual; deadlines vary by sub-track.
  - &id024
    form_id: USDA AMS SCBGP application (state-portal pass-through)
    form_version: Per state Department of Agriculture RFP
    required_for: USDA Specialty Crop Block Grants (federal pass-through to state DOAs)
    source: https://www.ams.usda.gov/services/grants/scbgp
    note: Federal funds pass through state Departments of Agriculture. Each state DOA publishes its own annual RFP, application
      portal, deadline, and award range. PA DOA, CDFA, FDACS, MDARD, NYSDAM all publish state-specific procedures.
  - &id025
    form_id: EDA Build to Scale online application
    form_version: Per FY NOFO (Venture Challenge + Capital Challenge tracks)
    required_for: EDA Build to Scale Venture Challenge + Capital Challenge
    source: https://www.eda.gov/funding/programs/build-to-scale
    note: Submitted via Grants.gov Workspace + EDA-specific narrative templates. 50% non-federal match required. Eligible
      applicants narrowly defined (TBED organizations, non-profit equity-based investment funds, etc.).
  - &id026
    form_id: SBA program-specific application (SAM.gov + program portal)
    form_version: Per SBA program (GAFC, Boots to Business, Women's Business Centers, etc.)
    required_for: SBA Growth Accelerator Fund Competition + related SBA grant programs
    source: https://www.sba.gov/funding-programs/grants
    note: SBA grants are limited compared to SBA loan guarantees — most SBA market-access support flows through 7(a) / 504
      lending guarantees, not grants. Grant programs (GAFC, T-HUB) competitively scarce.
  - &id027
    form_id: State agricultural marketing program applications
    form_version: Per state DOA / DCED program
    required_for: PA Specialty Crop Block, PA Ag Innovation, NY Grown & Certified, MA Massachusetts Food Trust, CDFA Healthy
      Refrigeration, etc.
    source: https://www.nasda.org/policy/state-grants-programs
    note: State agricultural marketing programs vary widely by state in scope, eligibility, award size, match. NASDA aggregates
      state ag program listings; per-state portal application typical.
  - &id028
    form_id: USDA AMS Regional Food Business Center Business Builder subaward application
    form_version: Per-regional-center per RFP
    required_for: USDA Regional Food Business Centers Business Builder subaward (up to $100K subawards to small / mid-tier
      food and farm businesses)
    source: https://www.ams.usda.gov/services/local-regional/rfbc
    note: Application is to a regional center (12 regional + 1 tribal centers awarded 2023-2024), not direct federal submission.
      Each regional center publishes its own RFP, eligibility, and subaward range. Coverage geography per regional center
      territory.
  - &id029
    form_id: SBIR / STTR agency-specific application package
    form_version: Per-agency per-topic solicitation (USDA NIFA, NSF, NIH, DOE, DOD)
    required_for: SBIR / STTR Phase I + Phase II + Phase IIB commercialization applications
    source: https://www.sbir.gov/applicants
    note: Submission via agency-specific portals (NSF FastLane / Research.gov; USDA NIFA via Grants.gov; NIH eRA Commons;
      DOE EERE Exchange). Phase II commercialization-plan template per agency. Phase III is commercialization-without-additional-SBIR-funds
      and is not an application — it is a status / mechanism.
  narrative_section_patterns:
  - &id030
    section_name: Sales Strategy
    typical_word_count: 500-1200
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
    note: How sales are made — direct sales staff, broker network, distributor recruitment, inbound marketing, trade-show
      presence, e-commerce funnel. Tied to customer-acquisition-cost math + work-plan tasks.
  - &id031
    section_name: Competitive Landscape
    typical_word_count: 300-800
    source_citation: https://www.eda.gov/funding/programs/build-to-scale
    note: Named direct + adjacent + substitute competitors; competitive positioning + defensibility. 'No direct competitors'
      is a near-universal red flag — reviewers read it as research failure.
  - &id032
    section_name: Pricing Strategy
    typical_word_count: 300-700
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
    note: Cost-plus floor + market-validated ceiling; per-SKU pricing; volume discounts; channel-specific pricing (wholesale
      vs. direct vs. institutional); promotional pricing rationale. Pair with attached price sheet.
  - &id033
    section_name: Financial Projections (typically 3-year, sometimes 5-year)
    typical_word_count: 500-1500
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion a.iii must_address)
    note: Pro-forma income statement, cash-flow projection, balance sheet (where applicable), break-even analysis, customer-base
      expansion, revenue projections. Each line tied to assumptions + evidence (LOI volume, price sheet, sales history, named
      benchmarks).
  - &id034
    section_name: Commercialization Pathway / SBIR Phase III Plan (where SBIR Phase II / IIB context)
    typical_word_count: 600-1200
    source_citation: https://www.sbir.gov/about
    note: SBIR Phase II commercialization-plan template + Phase III pathway. Phase III is the commercialization stage where
      the awardee proceeds without further SBIR funding, relying on private equity, debt, customer-funded growth, strategic-partner
      investment, or other non-federal capital. Section names revenue model, named buyer commitments + commitment artifacts,
      channel strategy, pricing logic, projected unit economics, follow-on capital plan. Reviewers test whether Phase III
      post-Phase-II commercialization is credible without additional federal SBIR subsidy.
  budget_structure_conventions:
    source_citation: pipeline/rubrics/vapg_fy26.json (matching_requirements)
  reviewer_profile_typical:
    reviewer_types:
    - usda_ams_lamp_review_panel (LAMP merit reviewers — agricultural economists, market specialists, food-systems practitioners)
    - 'state_doa_scbgp_reviewers (per-state composition: extension specialists, ag-economy specialists, industry representatives)'
    - eda_regional_office_program_officer (Build to Scale first-tier eligibility + merit)
    - sba_program_reviewers (entrepreneur-development + impact-evaluation focus)
    - agriculture_market_specialist (USDA AMS Market News reviewers, state ag economists)
    - commercialization_reviewer (NSF I-Corps, SBIR Phase II commercialization, EDA Build to Scale)
    - lender_or_financial_review (where loan guarantee or revenue-projection scrutiny dominant)
    - buyer_or_industry_practitioner (where peer review by industry insiders — common in foundation buyer-development programs)
    reviewer_priorities:
    - Are buyers verified, with signed commitment artifacts at the strongest available rung?
    - Does production capacity match projected demand, with contingencies for spikes / disruptions?
    - Is customer acquisition cost named, with the work plan reflecting the acquisition labor and spend?
    - Does the pro forma reconcile to LOI / contract evidence, sales history, and named industry benchmarks?
    - Is the work plan exhaustive — every task with timing, accountable person, expense, evidence?
    - Does the applicant understand the channel they're entering — distributor terms, slotting fees, payment cycles?
    - Is the competitive landscape honestly mapped, or is the applicant claiming false novelty?
    note: 'The 10 priorities above are the union across reviewer registers; per-register weighting differs materially (rendered
      as note prose to avoid schema-extension risk per §18.6 Wave 2 Cycle-2 FIX-IN-PLACE). Federal program-officer register
      (USDA RD VAPG specialists, USDA AMS LAMP panels, state DOA SCBGP, EDA regional offices, SBA program reviewers) reads
      buyer-commitment-rung + match-composition + work-plan exhaustiveness early; unit-economics is evaluated rigorously but
      buyer-commitment evidence often carries decisive weight (especially under VAPG criterion a.iii + criterion c). Business-reviewer
      / lender / commercialization-reviewer register (commercialization peer reviewers at EDA Build to Scale / SBIR Phase
      II / NSF I-Corps; agriculture-market specialists; buyer-or-industry practitioners; lender-style review at SBA-context)
      reads unit-economics + cash-flow + creditworthiness early; buyer-commitment-rung + production-capacity-vs-demand follow;
      match composition typically last. Scribe should dialect-switch by funder type — do not flatten federal-program-officer
      priorities onto business-reviewer dialect or vice versa. Note: both registers care about unit economics + buyer-commitment-rung
      at high priority; the difference is sequencing + relative weighting, not exclusion.'
    common_red_flags_from_reviewer_pov:
    - Market-size substitution — TAM presented as obtainable demand
    - Pro-forma assumptions opaque — revenue projections without underlying volume × price × conversion math
    - Production capacity insufficient to meet projected demand at peak
    - CAC ignored or buried — no sales-staff time, marketing spend, broker commission in budget
    - Pricing below cost (sustainability impossible) or above market (no premium-positioning evidence)
    - Match commitment uncertain or in-kind only when cash scores higher
    - Work plan + budget mismatch — orphan tasks or orphan budget lines
    - Key Personnel without commercial / sales experience for a Working Capital application
    - '''No direct competitors'' claim'
    source_citation: pipeline/rubrics/vapg_fy26.json + https://www.ams.usda.gov/services/grants/lamp + https://www.eda.gov/funding/programs/build-to-scale
  common_portals:
  - &id035
    portal: USDA AMS Grants application portal
    typical_use: USDA AMS-administered programs including LAMP (FMPP / LFPP / RFSP), Specialty Crop Multi-State Program, Acer
      Access, Sheep Production and Marketing.
    source_citation: https://www.ams.usda.gov/services/grants
  - &id036
    portal: State Department of Agriculture portals (PA, CA CDFA, FL FDACS, MI MDARD, NY NYSDAM, etc.)
    typical_use: USDA AMS SCBGP federal-pass-through applications submitted through state DOA portals; state ag-marketing
      programs.
    source_citation: https://www.nasda.org/policy/state-grants-programs
  - &id037
    portal: SBA Lender Match + SBA program portals
    typical_use: SBA Growth Accelerator Fund Competition + program-specific SBA grant intake. Most SBA market-access support
      flows through lending channels (7(a), 504, microloan) rather than direct grants.
    source_citation: https://www.sba.gov/funding-programs/grants
  - &id038
    portal: USDA Regional Food Business Center portals (per-regional-center)
    typical_use: USDA AMS Regional Food Business Center Business Builder subaward applications — each of the 12 regional centers
      + 1 tribal center publishes its own portal + RFP.
    source_citation: https://www.ams.usda.gov/services/local-regional/rfbc
  - portal: SBIR.gov + per-agency SBIR portals
    typical_use: SBIR / STTR Phase I, Phase II, Phase IIB applications across USDA NIFA, NSF, NIH, DOE, DOD, EPA. Per-agency
      portals (Research.gov, Grants.gov, eRA Commons, EERE Exchange).
    source_citation: https://www.sbir.gov/
  - &id039
    portal: NSF Research.gov / FastLane
    typical_use: NSF I-Corps Teams + Hub applications; NSF SBIR applications; NSF Convergence Accelerator commercialization-track
      applications.
    source_citation: https://www.research.gov/
  - &id040
    portal: Foundant GLM / Submittable / Fluxx
    typical_use: Foundation Market Access programs (W.K. Kellogg food-systems portfolio, Walton Family Foundation regional
      food-systems, regional foundation collaboratives) typically platform-hosted.
    source_citation: https://www.fluxx.io/ + https://www.foundant.com/ + https://www.submittable.com/
  common_red_flags:
  - &id041
    flag: market_size_substitution_tam_for_obtainable
    severity: HIGH
    red_team_probe: Walk the chain TAM → SAM → obtainable. What fraction of SAM is realistically reachable in the grant period
      given production capacity, channel reach, and customer-acquisition rate?
  - &id042
    flag: unsupported_revenue_projections
    severity: HIGH
    red_team_probe: For each year of the pro forma, name the volume × price × conversion-rate assumptions. Which assumption
      is most fragile, and what evidence backs it (LOI, sales history, industry benchmark)?
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion a.iii)
  - &id043
    flag: ignored_customer_acquisition_cost
    severity: HIGH
    red_team_probe: Per channel, what is the cost per customer acquired (sales staff time, marketing spend, broker commission,
      slotting fee, sample cost)? Does the work-plan budget reflect this acquisition labor and spend?
  - &id044
    flag: pricing_below_cost
    severity: HIGH
    red_team_probe: Does revenue per unit cover variable cost per unit + allocated overhead per unit, with defensible margin?
      Pricing below cost makes the business model unsustainable — reviewers reject.
  - &id045
    flag: pricing_above_market_no_premium_positioning
    severity: MEDIUM
    red_team_probe: If pricing exceeds competitor benchmarks, what justifies the premium — certification, provenance, brand,
      relationship? If 'higher quality' without evidence, pricing assumption fails.
  - &id046
    flag: no_competitive_analysis_or_no_direct_competitors
    severity: HIGH
    red_team_probe: Name three direct competitors + three adjacent + three substitutes. 'No direct competitors' tells the
      reviewer the applicant has not done market research; even truly novel products have substitutes.
    source_citation: https://www.eda.gov/funding/programs/build-to-scale
  - &id047
    flag: projected_sales_exceed_production_capacity
    severity: HIGH
    red_team_probe: Year-by-year, do projected sales unit volumes exceed production capacity? If yes, the projection is fiction;
      if no, demonstrate the math.
  reporting_requirements_typical:
    performance_reporting:
      frequency: 'semi_annual_federal_typical (USDA VAPG: semi-annual + annual + final + 3-year performance period); annual
        + final foundation typical'
      content_required:
      - Progress against work-plan milestones (buyers contacted, sales meetings held, contracts signed, units sold, revenue,
        etc.)
      - Channel development progress (distributors signed, retail accounts opened, institutional accounts won)
      - Production capacity status (scale-up completion, certifications obtained, inspection findings)
      - Marketing / outreach metrics (trade shows attended, leads captured, conversion rates)
      - Variance from work plan + rationale + corrective actions
      - Lessons learned + market-condition adjustments
    financial_reporting:
      frequency: quarterly_federal_typical; quarterly_or_semi_annual_foundation
      content_required:
      - SF-425 Federal Financial Report (quarterly federal)
      - Expenditure by budget category
      - Burn rate vs. timeline
      - Match documentation (cash + in-kind, with basis-of-valuation)
      - Drawdown requests + supporting documentation
      - Variance explanation
    final_report_required: true
    source_citation: 'pipeline/rubrics/vapg_fy26.json (performance_period_max_years: 3) + https://www.ams.usda.gov/services/grants/lamp
      + https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200'
    note: 'USDA VAPG: 3-year performance period max; semi-annual + annual + final reports; SF-425 quarterly. USDA LAMP: annual
      + final per AMS template. USDA AMS SCBGP: per state DOA reporting schedule (varies by state). EDA Build to Scale: quarterly
      + annual + final per 2 CFR 200. SBA Growth Accelerator: final report. Federal SF-425 + SF-PPR baseline across federal
      portfolio.'
  compliance_obligations:
  - &id048
    framework: 2 CFR Part 200 (Uniform Guidance)
    applicability: All federal Market Access grants
    typical_filings:
    - SF-425 Federal Financial Report (quarterly)
    - SF-PPR Performance Progress Report (semi-annual / annual per program)
    - Single Audit if federal expenditures ≥ $750,000/year (threshold rising to $1M under 2024 update)
    - Closeout per §200.344 within 120 days of grant end
    source_citation: https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200
  - &id049
    framework: USDA AMS LAMP regulation (7 CFR Part 249 / annual RFA)
    applicability: USDA Local Agriculture Market Program (FMPP / LFPP / RFSP)
    typical_filings:
    - Annual + final performance reports per AMS template
    - Cost-share documentation (25% non-federal)
    - SF-425 quarterly
    source_citation: https://www.ams.usda.gov/services/grants/lamp
  - &id050
    framework: USDA AMS SCBGP regulation (7 CFR Part 1291)
    applicability: USDA Specialty Crop Block Grants (federal pass-through)
    typical_filings:
    - Per-state-DOA reporting schedule (varies)
    - Annual + final performance reports
    - USDA AMS aggregate state-grantee reporting
    source_citation: https://www.ams.usda.gov/services/grants/scbgp
  - &id051
    framework: FSMA (Food Safety Modernization Act) — where food product
    applicability: Market Access grants involving food production where applicant is a food facility or farm producing fresh
      produce subject to Produce Safety Rule
    typical_filings:
    - FDA food facility registration (where applicable)
    - Produce Safety Rule compliance + inspection (FDA + state delegated)
    - Preventive Controls for Human Food (where applicable)
    - FSMA Foreign Supplier Verification (where importing)
    source_citation: https://www.fda.gov/food/guidance-regulation-food-and-dietary-supplements/food-safety-modernization-act-fsma
  - &id052
    framework: FFATA (Federal Funding Accountability and Transparency Act)
    applicability: All federal Market Access grants $30,000+
    typical_filings:
    - Sub-award + executive compensation reporting per FFATA Sub-Award Reporting System (FSRS)
    source_citation: https://www.fsrs.gov/
  - &id053
    framework: Build America Buy America (BABA)
    applicability: Federal infrastructure-tied procurement; some EDA Build to Scale + USDA programs where infrastructure investment
      occurs
    typical_filings:
    - BABA compliance certification + waiver requests where applicable
    - Domestic content documentation for iron, steel, manufactured products, construction materials
    source_citation: https://www.transportation.gov/buyamerica
    note: Current administration emphasizes BABA + domestic supply chain — federal Market Access applicants in infrastructure-adjacent
      programs should expect BABA compliance language to be reviewed.
  - &id054
    framework: State agricultural marketing rules
    applicability: USDA AMS SCBGP (state-pass-through), state ag-marketing programs
    typical_filings:
    - Per-state-DOA reporting + audit per state RFP
    - State labeling / origin / certification rules where product carries 'Pennsylvania Preferred', 'Jersey Fresh', 'New York
      Grown & Certified' or similar state mark
  - &id055
    framework: Foundation grant agreement (Market Access portfolios)
    applicability: Foundation Market Access grants (W.K. Kellogg food-systems, Walton regional food-systems, regional collaboratives)
    typical_filings:
    - Interim narrative + financial reports per agreement schedule
    - Final report at grant close
    - Acknowledgment / branding per agreement
    - 990-PF transparency — funder publishes award on 990-PF
  commitment_tracking_pattern:
    typical_commitments_extracted:
    - &id056
      commitment_type: new_markets_entered
      measurement_method: market name (geographic / channel / customer-segment) + entry date + first-sale date + revenue first
        90 days
    - &id057
      commitment_type: distributors_signed
      measurement_method: distributor name + agreement date + territory + minimum-volume guarantee + margin split
    - &id058
      commitment_type: customer_acquisition_cost_actual
      measurement_method: 'channel + period + total acquisition spend ÷ customers acquired + variance from budgeted CAC. Sub-components
        tracked: sales_staff_time (FTE-hours × loaded rate) + marketing_spend (digital ad + print + trade publication) + broker_commission
        (% of revenue or fixed fee) + slotting_fees / listing_fees (retail / e-commerce channel entry costs) + trade-show
        / sample / promotional product cost.'
    - &id059
      commitment_type: margin_per_unit_actual
      measurement_method: SKU + channel + period + revenue per unit − variable cost per unit − allocated overhead per unit
    - &id060
      commitment_type: gross_margin_total
      measurement_method: Period + total revenue − total variable cost (COGS including raw materials, packaging, processing
        labor, freight, broker commission, returns reserve). Gross margin reported aggregate AND by channel × SKU breakdown.
        VAPG + SBIR Phase II commercialization plans typically request gross margin at both aggregate and channel-level granularity.
    - &id061
      commitment_type: net_margin_total
      measurement_method: Period + gross margin − allocated overhead (rent, equipment depreciation, sales overhead, indirect
        labor). Net margin reported aggregate AND by channel × SKU breakdown. Reviewers compare net margin trend across reporting
        periods to validate the pro-forma was credible at award.
    - &id062
      commitment_type: jobs_created
      measurement_method: FTE count + role + hire date + retention status + connection to grant-funded work
    - &id063
      commitment_type: production_capacity_milestone
      measurement_method: capacity expansion description + completion date + new throughput rate + capital invested + match
        documentation
    - &id064
      commitment_type: certification_obtained
      measurement_method: certification type (GAP / HACCP / SQF / BRC / Organic) + audit date + audit body + scope + cost
    proposal_commitments_yaml_extension: &id065
      field_name: market_access_commitments
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05 + pipeline/rubrics/vapg_fy26.json
track_b:
  track_name: sbir_phase_iii
  track_description: 'SBIR Phase III — commercialization without further SBIR funds. Funding source is private capital + procurement
    vehicles (sole-source contracts available to SBIR Phase II awardees under the SBIR Phase III authority — no further SBIR
    competition). Underwriting is commercial: buyer commitments, channel strategy, revenue model, competitive position, delivery
    capacity, unit economics. Reviewer profile: commercial procurement officers / private investors / strategic partners.
    Scribe MUST treat Track B as go-to-market drafting (buyer + channel + revenue) NOT R&D drafting. The broader §18.6 v1
    market_access content (VAPG / SBA / market development / Build to Scale / institutional procurement) is Track-B-shape
    — it inherits to this track. Phase III is non-competitive sole-source under SBA / agency-specific rules.'
  underwriting_criteria:
  - *id001
  - *id002
  - *id003
  - criterion: channel_strategy
    description: Explicit channel mix — direct-to-consumer, wholesale, institutional (schools, hospitals, government), e-commerce,
      retail (independent + chain), foodservice, export. Each channel named with addressable buyer count, margin profile,
      fulfillment requirements, and named accounts where commitments exist. 'Multi-channel' without per-channel detail reads
      as a hedge.
    weight_in_typical_rubric: qualitative
    source_citation: https://www.ams.usda.gov/services/grants/lfpp
  - criterion: revenue_model
    description: How revenue is generated, recognized, and grown — pricing model (per-unit, subscription, contract, royalty),
      payment terms (net-30/60/90, prepay, escrow), refund/return exposure, seasonal cash-flow profile. Reviewers compare
      proposed revenue model against historical revenue (where available) and named buyer terms.
    weight_in_typical_rubric: qualitative
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
  - *id004
  - criterion: delivery_capacity
    description: Production / fulfillment capacity matched to projected demand — current capacity, planned scale-up (with
      timing + capital), bottlenecks identified, contingencies for demand spikes or supply disruptions. USDA VAPG criterion
      a.ii ('Operational efficiency') explicitly requires labor, expertise, facility, equipment, logistics, and risk identification.
    weight_in_typical_rubric: qualitative
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion a.ii must_address)
  - *id005
  - *id006
  - *id007
  - criterion: risk_mitigation
    description: Named risks with mitigations — buyer concentration (one buyer >30% of revenue), demand seasonality, distribution
      disruption, raw-material supply variability, competitor entry, regulatory shift, FDA/USDA inspection findings, food-safety
      recall exposure, climate/weather exposure for ag products. Each risk paired with a named mitigation (diversification
      timeline, secondary supplier, insurance, certification, reserve fund).
    weight_in_typical_rubric: qualitative
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
  - *id008
  scoring_weight_patterns:
  - rubric_example: USDA Value-Added Producer Grant (VAPG) — FY2026 100-pt rubric (canonical Market Access reference)
    weights:
      nature_of_proposed_venture: 30 pts (technological feasibility 10 + operational efficiency 10 + profitability/economic
        sustainability 10)
      qualifications_of_key_personnel: 20 pts
      work_plan_and_budget: 20 pts
      matching_funds_commitment: 5 pts (cash match scores higher than in-kind)
      prior_vapg_assistance: 5 pts (no prior award scores highest)
      priority_points: 10 pts (applicant category + creating marketing opportunities)
      administrator_priority_categories: 10 pts (capped, discretionary)
    source_citation: pipeline/rubrics/vapg_fy26.json
    note: VAPG is the most fully published Market-Access scoring rubric in the federal portfolio; 50-pt minimum to fund. Buyer
      commitment evidence + market expansion strategy + customer-base expansion + pro-forma financials all map to the 30-pt
      'Nature of proposed venture' criterion. The full rubric is on disk at pipeline/rubrics/vapg_fy26.json — Judge consults
      it directly at runtime.
  - rubric_example: USDA Local Agriculture Market Program (LAMP) umbrella — Farmers Market Promotion (FMPP) / Local Food Promotion
      (LFPP) / Regional Food System Partnerships (RFSP)
    weights:
      project_purpose_and_market_opportunity: weighted
      project_design_and_management: weighted
      partnerships_and_buyer_engagement: weighted
      outcomes_evaluation_and_sustainability: weighted
      budget_and_match: weighted
    source_citation: https://www.ams.usda.gov/services/grants/lamp
    note: LAMP is the AMS-administered umbrella program for FMPP / LFPP / RFSP. Each sub-program has slightly different scoring
      emphasis; LFPP weights direct-buyer engagement most heavily, FMPP weights market access for producers, RFSP weights
      coalition / partnership infrastructure. 25% cost share required across LAMP.
  - *id009
  - rubric_example: EDA Build to Scale (Venture Challenge / Capital Challenge)
    weights:
      strategy_and_innovation: weighted
      capacity_and_partnerships: weighted
      impact_and_outcomes: weighted
      sustainability_and_match: weighted
    source_citation: https://www.eda.gov/funding/programs/build-to-scale
    note: Build to Scale requires 50% non-federal match. For Market Access applicants, the Venture Challenge (capacity-building
      for tech-based-economic-development organizations) and Capital Challenge (operational support to equity-based investment
      funds) both treat regional commercialization ecosystem strength as the primary lever. Sustainability of the regional
      innovation ecosystem heavily weighted.
  - rubric_example: SBA Growth Accelerator Fund Competition (GAFC)
    weights:
      innovation: weighted
      impact: weighted
      sustainability: weighted
    source_citation: https://www.sba.gov/article/2024/may/01/sba-launches-2024-growth-accelerator-fund-competition-incentivizing-innovation-investment
    note: SBA GAFC awards cash prizes to accelerators / incubators that support entrepreneurs. Recent rounds emphasize underrepresented
      founder reach (R&D Track) + technology commercialization (Investment Track). No match required; cash awards in $50K-$200K
      range typically.
  - *id010
  - rubric_example: USDA Farm to School Grant Program (FNS-administered)
    weights:
      project_design_and_planning: weighted
      community_engagement_and_partnerships: weighted
      project_outcomes_and_measurement: weighted
      organizational_capacity: weighted
      budget_appropriateness: weighted
    source_citation: https://www.fns.usda.gov/cfs/farm-school-grant-program
    note: Farm to School is institutional-procurement Market Access — connects producers to school food authorities. Planning
      + Implementation + Training + Turnkey tracks; scoring emphasizes the producer-to-buyer relationship infrastructure.
  - rubric_example: USDA Regional Food Business Centers (RFBC) — coordination + technical-assistance hub network
    weights:
      coordination_and_outreach: weighted
      business_builder_subaward_design: weighted
      regional_food_system_strengthening: weighted
      partnership_breadth: weighted
      sustainability_and_match: weighted
    source_citation: https://www.ams.usda.gov/services/local-regional/rfbc
    note: Regional Food Business Centers are USDA AMS hub-and-spoke network providing coordination + technical assistance
      + Business Builder subawards (up to $100K) to small / mid-tier food and farm businesses scaling buyer relationships.
      Twelve regional centers + one tribal center awarded 2023-2024. Direct Market Access funding flows through Business Builder
      subaward applications to a regional center, not direct federal Grants.gov submission.
  - *id011
  - *id012
  evidence_weights:
    buyer_letters_of_intent: *id013
    purchase_orders_or_contracts:
      weight: HIGH
      rationale: Strongest demand evidence — already-signed PO or contract. USDA VAPG, USDA LAMP, EDA Build to Scale, and
        most foundation buyer-development programs treat these as evidence-of-record.
      source_citation: pipeline/rubrics/vapg_fy26.json
    sales_history:
      weight: HIGH
      rationale: Last 1-3 years of revenue by channel + customer + product line. For VAPG and similar programs, historical
        sales anchor the pro-forma projection; absence of history forces the projection to lean entirely on LOI strength.
      source_citation: 'pipeline/rubrics/vapg_fy26.json (criterion a.iii must_address: ''Historical financial summary (if
        applicable)'')'
    customer_pipeline: *id014
    distributor_agreements:
      weight: MEDIUM
      rationale: 'Signed agreements with distributors, brokers, fulfillment partners. Critical for scaling beyond direct-to-consumer;
        reviewers check for exclusivity terms, margin splits, payment terms, and minimum-volume guarantees. Weight canonicalized
        to MEDIUM at Wave 2 Cycle-2 FIX-IN-PLACE per §18.6 enum (HIGH | MEDIUM | LOW). Nuance: at VAPG / LAMP / EDA Build
        to Scale specifically, signed distributor agreements WITH minimum-volume guarantees often score closer to HIGH-tier
        evidence; absent guarantees they score solidly MEDIUM. Scribe should attach guarantees + margin splits + payment terms
        when present so the in-context weighting elevates appropriately.'
    market_study: *id015
    price_sheet: *id016
    production_capacity_proof:
      weight: HIGH
      rationale: Documentation that production capacity meets projected demand — facility specs, equipment list with throughput
        rates, labor plan, third-party processor agreements, FDA / USDA inspection status, food-safety certifications (GAP,
        HACCP, SQF, BRC). VAPG criterion a.ii treats this as load-bearing.
      source_citation: pipeline/rubrics/vapg_fy26.json (criterion a.ii)
    revenue_projections_with_assumptions: *id017
    customer_interviews:
      weight: MEDIUM
      rationale: Direct quotes + paraphrased findings from prospective customer interviews supporting demand claims. Higher
        weight when interview methodology is documented (sample size, recruitment, question protocol). Treated as supporting
        evidence — does not substitute for buyer commitment artifacts.
    channel_partner_letters: *id018
    cost_of_acquisition_documentation: *id019
    business_or_marketing_plan:
      weight: HIGH
      rationale: Written business plan or marketing plan as supporting attachment. USDA VAPG Working Capital track requires
        either Feasibility Study or Business / Marketing Plan completed by Qualified Consultant prior to Working Capital application;
        Planning Grant track funds the creation of these artifacts.
      source_citation: https://www.rd.usda.gov/programs-services/business-programs/value-added-producer-grants
    feasibility_study: *id020
