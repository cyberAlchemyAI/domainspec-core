track_a:
  track_name: sbir_phase_ii
  track_description: 'SBIR Phase II — further SBIR R&D funds with NIH / NSF / DOD / DOE / USDA program variations. Underwriting
    extends from Phase I demonstration: technical feasibility extended to commercialization-readiness; team capability; intellectual
    merit + broader impacts (NIH/NSF variations) or program-of-record alignment (DOD/DOE). Reviewer profile: SBIR program
    managers + peer reviewers (technical SMEs). Phase II proposals are R&D-driven and read like research proposals with explicit
    commercialization-readiness sections; Scribe MUST treat Track A as research-and-development drafting, NOT go-to-market
    drafting. Phase II awards typically $750k-$1.5M over 24 months.'
  underwriting_criteria:
  - &id001
    criterion: target_market_definition
    description: Specific, bounded market segment named — geography, customer type, size class, channel, decision-maker. Not
      'consumers who care about local food'; reviewers want defensible TAM → SAM → obtainable-market arithmetic with the obtainable
      slice grounded in production capacity and channel reach.
    weight_in_typical_rubric: qualitative
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
  - &id002
    criterion: verified_demand
    description: 'Demand evidence comes from prospective buyers, not the applicant''s own projections. Acceptable evidence:
      signed LOIs with volume + price + term, purchase orders, contracts, paid pilot deliveries, documented pre-orders, distributor
      purchase commitments. Customer interviews and survey data are supporting, not load-bearing.'
    weight_in_typical_rubric: qualitative
    source_citation: https://www.rd.usda.gov/programs-services/business-programs/value-added-producer-grants
  - &id003
    criterion: buyer_commitment
    description: 'Named buyers with written commitment artifacts at the strongest rung available. Buyer-commitment evidence
      ladder (descending strength, per Wave 2 Cycle-2 FIX-IN-PLACE — rendered as prose within description to avoid schema-extension
      risk per §18.6): RUNG 1 PURCHASE ORDER — signed PO with buyer name + SKU + volume + price + delivery date + payment
      terms; evidence-of-record; strongest pre-award demand artifact; anchors pro-forma volume × price math. RUNG 2 SIGNED
      CONTRACT — supply / distributor / institutional procurement contract with buyer name + volume commitment + price terms
      + contract duration + performance terms; strong multi-period commitment; treated as strong evidence (NOT formally weighted
      equivalent to PO at VAPG; PO retains highest VAPG criterion a.iii anchor). RUNG 3 LOI WITH VOLUME + PRICE + TERM — Letter
      of Intent on buyer letterhead with explicit volume + price + delivery term + signature + date; strong demand signal;
      reviewers expect SBIR Phase II / IIB / VAPG Working Capital applications to carry volume-price-term LOIs at minimum.
      RUNG 4 LOI WITH VOLUME ONLY — LOI naming volume commitment but no price / term; moderate signal; adequate for Planning
      Grant / pilot stage; under-rated for Working Capital / Phase II commercialization. RUNG 5 EXPRESSION OF INTEREST — letter
      expressing interest without volume or price commitment; weak signal; reviewers read as supporting evidence only; generic
      ''we are interested'' letters score weakly under VAPG criterion a.iii. INTAKE should surface this ladder at applicant
      onboarding so applicants pursue stronger-rung evidence before drafting; SCRIBE should attach the strongest-rung evidence
      to the proposal narrative; JUDGE and RED TEAM should challenge any claim of ''verified buyer'' that does not cite a
      specific rung + evidence artifact. USDA VAPG explicitly weights buyer commitments under the ''Nature of the proposed
      venture / Profitability'' criterion (10 pts) and the ''Work plan and budget'' criterion (20 pts) where buyers anchor
      the projection narrative.'
    weight_in_typical_rubric: qualitative
    source_citation: 'pipeline/rubrics/vapg_fy26.json (criterion a.iii must_address: ''Expected expansion of customer base'';
      criterion c must_address: ''Sources and uses of grant AND matching funds for all activities'')'
  - &id004
    criterion: competitive_position
    description: Named competitors (direct + adjacent + substitutes) with positioning — what the applicant offers that competitors
      do not, what defensibility (brand, certification, geography, relationship, supply control) the applicant has. 'No direct
      competitors' is a near-universal red flag; reviewers read it as research failure.
    weight_in_typical_rubric: qualitative
    source_citation: https://www.eda.gov/funding/programs/build-to-scale
  - &id005
    criterion: pricing_logic
    description: Pricing built from cost-plus floor (COGS + overhead + target margin) and validated against market-clearing
      prices (competitor pricing, distributor markups, retail pricing, willingness-to-pay evidence). Pricing-below-cost flagged
      HIGH; pricing-above-market flagged HIGH unless premium positioning is documented (certification, provenance, brand).
    weight_in_typical_rubric: qualitative
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
  - &id006
    criterion: customer_acquisition_cost_and_plan
    description: Per-customer or per-channel acquisition cost named (sales staff time, marketing spend, broker commissions,
      sample costs, trade-show fees, listing fees, slotting fees) with the channel-specific acquisition plan. Ignored CAC
      is a structural weakness — the work-plan budget must reflect it.
    weight_in_typical_rubric: qualitative
    source_citation: https://www.sba.gov/funding-programs/grants
  - &id007
    criterion: unit_economics
    description: 'Per-unit margin defensible: revenue per unit minus variable cost per unit (raw materials, packaging, processing
      labor, freight, broker commission, returns reserve) yields contribution margin; contribution margin minus per-unit allocated
      overhead (rent, equipment depreciation, sales overhead) yields net unit margin. Reviewers run the arithmetic; opaque
      math fails.'
    weight_in_typical_rubric: qualitative
    source_citation: https://www.sba.gov/funding-programs/grants
  - &id008
    criterion: buy_america_and_domestic_supply_chain_alignment
    description: Where applicable to the program (EDA Build to Scale, USDA where Build America Buy America applies, federal
      infrastructure-tied procurement), evidence that materials, components, and supply chain are domestic per BABA + USDA
      Domestic Origin requirements. Current administration emphasis on 'American-made' / 'domestic supply chain' framing is
      operative for Market Access in 2026 federal applications — see admin_risk_term_register.
    weight_in_typical_rubric: qualitative
    source_citation: https://www.transportation.gov/buyamerica
  scoring_weight_patterns:
  - &id009
    rubric_example: USDA AMS Specialty Crop Block Grant Program (SCBGP) — state-DOA-pass-through scoring varies
    weights:
      project_design: weighted
      potential_impact: weighted
      outcomes_and_evaluation: weighted
      budget_and_match: weighted
      partnerships_and_collaboration: weighted
    source_citation: https://www.ams.usda.gov/services/grants/scbgp
    note: 'SCBGP funds pass through state Departments of Agriculture; scoring rubrics + sub-criteria + weights vary by state.
      Pennsylvania, California, Florida, Michigan, New York all publish state-specific RFPs. Common thread: enhances competitiveness
      of specialty crops (fruits, vegetables, tree nuts, dried fruits, horticulture, nursery crops including floriculture).'
  - &id010
    rubric_example: PA Department of Agriculture Specialty Crop Block Grant (state SCBGP pass-through example)
    weights:
      enhancing_specialty_crop_competitiveness: weighted
      project_design_and_methodology: weighted
      outcomes_and_measurable_results: weighted
      budget_reasonableness_and_match: weighted
      partnerships_and_outreach: weighted
    source_citation: https://www.pa.gov/agencies/pda/programs/specialty-crop-block-grant-program.html
    note: PA Department of Agriculture publishes annual SCBGP RFP; typical award range $30K-$150K; 1-3 year project periods;
      no formal match required at federal level but PA encourages cost share for competitiveness.
  - &id011
    rubric_example: SBIR Phase II / IIB Commercialization — agency-specific (USDA NIFA SBIR, NSF SBIR, NIH SBIR, DOE SBIR,
      etc.)
    weights:
      commercialization_potential: weighted
      technical_merit: weighted
      team_qualifications: weighted
      market_opportunity: weighted
      revenue_model_and_projections: weighted
    source_citation: https://www.sbir.gov/about
    note: 'SBIR Phase II is the commercialization-readiness federal mechanism; Phase IIB extends Phase II projects approaching
      market entry. Per-agency rubrics vary: USDA NIFA SBIR, NSF SBIR, NIH SBIR, DOE SBIR, DOD SBIR each publish topic-specific
      solicitations + commercialization-plan templates. Phase III is commercialization-without-additional-federal-SBIR-funds
      — see funding_mechanism_summary + narrative_section_patterns ''Commercialization Pathway / SBIR Phase III Plan''.'
  - &id012
    rubric_example: NSF I-Corps — customer-discovery-driven commercialization training
    weights:
      customer_discovery_progress: weighted
      team_quality_and_engagement: weighted
      lessons_learned_and_pivot_evidence: weighted
      commercialization_pathway: weighted
    source_citation: https://new.nsf.gov/funding/initiatives/i-corps
    note: I-Corps is NSF's customer-discovery training program — 100+ customer interviews + Lean LaunchPad methodology + Business
      Model Canvas iteration. Outcome is a go/no-go commercialization decision + structured pivot evidence. National Innovation
      Network hub program; team-based application via NSF I-Corps Hub or Teams program. Outputs feed SBIR Phase II commercialization
      plans.
  evidence_weights:
    buyer_letters_of_intent: &id013
      weight: HIGH
      rationale: Signed LOI with volume + price + term is the strongest pre-contract evidence of demand. Reviewers treat LOI
        quality as a near-veto signal — generic 'we are interested in your product' letters score weakly; volume-specific
        commitments score strongly.
      source_citation: https://www.rd.usda.gov/programs-services/business-programs/value-added-producer-grants
    customer_pipeline: &id014
      weight: HIGH
      rationale: Named prospects with stage (cold outreach / first meeting / proposal sent / verbal commitment / signed LOI
        / signed contract) + close probability + expected close date + value. Treats sales as a measurable process, not a
        wish.
    market_study: &id015
      weight: MEDIUM
      rationale: Third-party market analysis (industry reports, consultant studies, USDA AMS data, Census of Agriculture)
        preferred over applicant-authored. Internal market analysis acceptable when methodology + sources are documented;
        aggregator-cited stats without primary source flag weakly.
      source_citation: https://www.ams.usda.gov/market-news
    price_sheet: &id016
      weight: MEDIUM
      rationale: Current price sheet by SKU + channel + customer tier + volume break. Reviewers compare against COGS to verify
        margins are real and against competitor pricing to verify market positioning.
    revenue_projections_with_assumptions: &id017
      weight: HIGH
      rationale: '3-year (often 5-year for SBA contexts) pro forma with named assumptions: unit volume by channel + product,
        price assumptions, COGS assumptions, sales-cycle timing, seasonality factors. Each assumption tied to evidence (LOI
        volume, price sheet, historical conversion rate, named industry benchmark).'
      source_citation: 'pipeline/rubrics/vapg_fy26.json (criterion a.iii must_address: ''Pro forma financial projections'')'
    channel_partner_letters: &id018
      weight: MEDIUM
      rationale: 'Letters from distributors, brokers, retailers, foodservice operators, institutional buyers describing channel
        relationship + expected role. Stronger when paired with executed agreements; weaker when expressing only ''willingness
        to consider''. Weight canonicalized to MEDIUM at Wave 2 Cycle-2 FIX-IN-PLACE per §18.6 enum (HIGH | MEDIUM | LOW).
        Nuance: when a channel-partner letter is paired with an executed distributor agreement + volume commitment, the joint
        evidence approaches HIGH-tier; the standalone letter sits at MEDIUM.'
    cost_of_acquisition_documentation: &id019
      weight: MEDIUM
      rationale: 'Per-channel CAC math: cost per cold call, cost per trade-show lead, cost per converted distributor, slotting
        / listing fees, broker commission rates, marketing spend per customer acquired. Ignored CAC is a common red flag —
        work plan must reflect the acquisition labor and spend.'
    feasibility_study: &id020
      weight: HIGH
      rationale: Independent feasibility study by Qualified Consultant covering market analysis, technical feasibility, financial
        feasibility, organizational capacity. Required for VAPG Working Capital eligibility; valuable supporting attachment
        for LAMP, EDA, and most institutional-procurement programs.
      source_citation: 'pipeline/rubrics/vapg_fy26.json (planning_scope: ''Feasibility Study and/or Business/Marketing Plan
        by Qualified Consultant'')'
