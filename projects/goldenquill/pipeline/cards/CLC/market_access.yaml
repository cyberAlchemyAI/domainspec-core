  common_red_flags:
  - flag: no_buyer_commitment_only_interest
    severity: HIGH
    red_team_probe: For each named buyer, what is the strongest commitment artifact — signed PO, signed contract, signed LOI
      with volume/price/term, or only 'interest'? Quantify the difference for the funder; an 'interest' letter is not demand
      evidence.
    source_citation: https://www.rd.usda.gov/programs-services/business-programs/value-added-producer-grants
  - *id041
  - *id042
  - flag: unsolved_distribution
    severity: HIGH
    red_team_probe: How does product reach the buyer — direct shipping, broker-distributor network, retail-DC pull, foodservice
      broker, e-commerce fulfillment? Name the partners or build the in-house capability in the work plan with budget.
  - *id043
  - flag: production_capacity_insufficient_for_projected_demand
    severity: HIGH
    red_team_probe: At projected peak demand (year 2 or 3 of the pro forma), does production capacity meet it — current facility,
      scale-up capital + timing, third-party processing, inspection / certification status? VAPG criterion a.ii reviewers
      run this arithmetic.
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion a.ii)
  - *id044
  - *id045
  - *id046
  - *id047
  - flag: single_buyer_concentration_no_diversification
    severity: HIGH
    red_team_probe: If one buyer represents >30% of projected revenue, what is the concentration timeline (declining over
      years) and what is the diversification plan (named additional buyers, channel expansion)?
  - flag: unfilled_key_personnel_no_qualifications
    severity: MEDIUM
    red_team_probe: For unfilled Key Personnel positions, are required qualifications specifically described per VAPG criterion
      b? Vague 'will hire experienced sales person' loses points.
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion b)
  - flag: in_kind_only_match_when_cash_scores_higher
    severity: MEDIUM
    red_team_probe: Under VAPG criterion d, cash match scores up to 5 pts; in-kind only scores 0. Is the cash portion maximized
      within the applicant's capacity? In-kind cannot substitute for cash after award.
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion d)
  - flag: work_plan_budget_mismatch
    severity: HIGH
    red_team_probe: For each work-plan task, is there a corresponding budget line? For each budget line, is there a corresponding
      task? VAPG criterion c (20 pts) requires both directions — orphan tasks + orphan budget lines lose points.
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion c)
  - flag: qualified_consultant_missing_for_vapg_planning_or_working_capital_pre_req
    severity: HIGH
    red_team_probe: For VAPG Working Capital track, is the Feasibility Study or Business/Marketing Plan completed by Qualified
      Consultant on file? For Planning Grant, is the Qualified Consultant identified for the deliverable? Required, not optional.
    source_citation: pipeline/rubrics/vapg_fy26.json (planning_scope + working_capital_ready)
  - flag: third_party_consultant_costs_exceed_15_percent_disqualifying_administrator_priority
    severity: MEDIUM
    red_team_probe: Under VAPG criterion g (Administrator priority categories), third-party professional services > 15% of
      grant amount disqualifies from administrator priority points (10 pts available). Calculate the consultant cost ratio.
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion g disqualifier)
  reporting_requirements_typical:
    performance_reporting:
      frequency: 'semi_annual_federal_typical (USDA VAPG: semi-annual + annual + final + 3-year performance period); annual
        + final foundation typical'
      content_required:
      - Progress against work-plan milestones (buyers contacted, sales meetings held, contracts signed, units sold, revenue,
        etc.)
      - Buyer commitment status updates (LOIs converted to POs, POs converted to contracts, repeat purchase data)
      - Channel development progress (distributors signed, retail accounts opened, institutional accounts won)
      - Production capacity status (scale-up completion, certifications obtained, inspection findings)
      - Marketing / outreach metrics (trade shows attended, leads captured, conversion rates)
      - Match documentation (cash + in-kind expenditures matching grant burn rate or ahead per VAPG criterion c requirement)
      - Variance from work plan + rationale + corrective actions
      - Lessons learned + market-condition adjustments
    financial_reporting:
      frequency: quarterly_federal_typical; quarterly_or_semi_annual_foundation
      content_required:
      - SF-425 Federal Financial Report (quarterly federal)
      - Expenditure by budget category
      - Burn rate vs. timeline
      - Match documentation (cash + in-kind, with basis-of-valuation)
      - Drawdown requests + supporting documentation
      - Variance explanation
    final_report_required: true
    source_citation: 'pipeline/rubrics/vapg_fy26.json (performance_period_max_years: 3) + https://www.ams.usda.gov/services/grants/lamp
      + https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200'
    note: 'USDA VAPG: 3-year performance period max; semi-annual + annual + final reports; SF-425 quarterly. USDA LAMP: annual
      + final per AMS template. USDA AMS SCBGP: per state DOA reporting schedule (varies by state). EDA Build to Scale: quarterly
      + annual + final per 2 CFR 200. SBA Growth Accelerator: final report. Federal SF-425 + SF-PPR baseline across federal
      portfolio.'
