  narrative_section_patterns:
  - section_name: Executive Summary / Project Abstract
    typical_word_count: 300-500
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
    note: Problem, applicant, market opportunity, ask, expected outcomes. VAPG and LAMP both require an abstract / project
      summary near the front of the application.
  - section_name: Market Opportunity
    typical_word_count: 500-1200
    source_citation: https://www.ams.usda.gov/services/grants/lamp
    note: Defined target market with TAM → SAM → obtainable arithmetic; market size sources cited; trends + growth drivers;
      opportunity-window justification (why now). VAPG criterion a.iii reviewers read this section for market expansion strategy.
  - section_name: Customer Profile / Buyer Identification
    typical_word_count: 400-1000
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
    note: Named buyer segments + profiles; named prospect / customer accounts where commitments exist; buyer decision-makers
      + decision criteria. Strong customer profiles tie directly to attached LOI / PO / contract evidence.
  - *id030
  - section_name: Distribution and Channels
    typical_word_count: 400-1000
    source_citation: https://www.ams.usda.gov/services/grants/lamp
    note: Channel mix detail — direct, wholesale, institutional, e-commerce, retail, foodservice, export. Per-channel addressable
      buyer count, margin profile, fulfillment requirements. Distributor / broker agreements attached as evidence.
  - *id031
  - *id032
  - section_name: Production Capacity
    typical_word_count: 400-1000
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion a.ii)
    note: Current capacity, planned scale-up with timing + capital, bottleneck identification, contingencies. VAPG criterion
      a.ii ('Operational efficiency') treats this as a 10-pt section — labor, expertise, facility, equipment, logistics, risks
      all required.
  - *id033
  - section_name: Risk and Mitigation
    typical_word_count: 300-700
    source_citation: 'pipeline/rubrics/vapg_fy26.json (criterion a.ii must_address: ''Anticipated challenges or risks'')'
    note: Buyer concentration, demand seasonality, distribution disruption, raw-material variability, competitor entry, regulatory
      shift, food-safety exposure, climate exposure. Each risk + named mitigation.
  - section_name: Work Plan and Timeline
    typical_word_count: 600-1500
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion c)
    note: Detailed task / activity breakdown with timing, accountable Key Personnel, expense breakdown, sources/uses of grant
      + matching funds. VAPG criterion c (20 pts) requires this be exhaustive — orphan tasks or orphan budget lines lose points.
  - section_name: Key Personnel / Qualifications
    typical_word_count: 400-1000
    source_citation: pipeline/rubrics/vapg_fy26.json (criterion b)
    note: Named Key Personnel for each major activity with relevant experience. VAPG criterion b (20 pts) — unfilled positions
      must specify required qualifications. Resumes / CVs as attachments.
  - section_name: Budget Justification / Narrative
    typical_word_count: 500-1500
    source_citation: blueprint:section_18_card_system.md#§18.10-CLC-05
    note: Per-line budget rationale tied to work-plan tasks; sources/uses; basis of valuation for cash + in-kind match (where
      applicable). VAPG cash match scores higher than in-kind under criterion d (5 pts).
  - *id034
  budget_structure_conventions:
    direct_cost_categories:
    - personnel (sales / marketing / business-development staff)
    - fringe_benefits
    - consultants_and_contractual (brokers, distributors, marketing agencies, qualified consultants for VAPG feasibility /
      business plan work)
    - marketing_and_advertising (digital ad spend, trade publications, sample / promotional product, brochure design)
    - trade_shows_and_industry_events (booth fees, travel, sample product, lead-capture tools)
    - travel (sales calls, buyer meetings, trade shows)
    - equipment (production scale-up; for VAPG Working Capital track equipment is allowable; for many LAMP contexts equipment
      is restricted)
    - supplies (sample product, packaging prototypes, market-research data subscriptions)
    - training_and_certification (food-safety certifications, GAP / HACCP / SQF audits, organic certification — where required
      for buyer eligibility)
    - indirect_costs (per program rules)
    indirect_cost_treatment: 'Federal Market Access programs honor recipient''s federally negotiated rate or de minimis 10%
      MTDC per 2 CFR 200.414. USDA VAPG: indirect allowable per recipient''s negotiated rate or de minimis. USDA LAMP: indirect
      capped per FY RFA (often 25% of total project costs or equivalent). USDA AMS SCBGP: per state-DOA RFP (state determines
      indirect treatment). EDA Build to Scale: federally-negotiated rate. Foundation Market Access programs typically cap
      10-15%; some (W.K. Kellogg food-systems portfolio) honor higher. Operator must check each NOFO + state RFP.'
    match_requirements_typical: 'USDA VAPG: 1:1 match required (cash + in-kind); cash scores higher than in-kind under criterion
      d (5 pts); federal funds prohibited as match per pipeline/rubrics/vapg_fy26.json. USDA LAMP: 25% non-federal cost share.
      USDA AMS SCBGP: state-DOA-pass-through varies; typically no federal match required but state may encourage. EDA Build
      to Scale: 50% non-federal match (cash + in-kind acceptable). SBA Growth Accelerator: cash awards no match. State ag-marketing
      programs: typically 10-50% match.'
    source_citation: pipeline/rubrics/vapg_fy26.json (matching_requirements)
  reviewer_profile_typical:
    reviewer_types:
    - usda_rd_state_office_program_specialist (VAPG criterion d + e + f scoring; first-tier review)
    - usda_rd_business_programs_review_panel (VAPG criterion a + b + c scoring; merit panel)
    - usda_ams_lamp_review_panel (LAMP merit reviewers — agricultural economists, market specialists, food-systems practitioners)
    - 'state_doa_scbgp_reviewers (per-state composition: extension specialists, ag-economy specialists, industry representatives)'
    - eda_regional_office_program_officer (Build to Scale first-tier eligibility + merit)
    - eda_economic_development_review_panel (regional ecosystem + commercialization focus)
    - sba_program_reviewers (entrepreneur-development + impact-evaluation focus)
    - agriculture_market_specialist (USDA AMS Market News reviewers, state ag economists)
    - commercialization_reviewer (NSF I-Corps, SBIR Phase II commercialization, EDA Build to Scale)
    - lender_or_financial_review (where loan guarantee or revenue-projection scrutiny dominant)
    - buyer_or_industry_practitioner (where peer review by industry insiders — common in foundation buyer-development programs)
    reviewer_priorities:
    - Are buyers verified, with signed commitment artifacts at the strongest available rung?
    - Does the channel strategy survive scrutiny — per-channel buyer count, margin, fulfillment, named accounts?
    - Do unit economics work — does the per-unit margin cover variable + allocated overhead with defensible assumptions?
    - Does production capacity match projected demand, with contingencies for spikes / disruptions?
    - Is customer acquisition cost named, with the work plan reflecting the acquisition labor and spend?
    - Does the pro forma reconcile to LOI / contract evidence, sales history, and named industry benchmarks?
    - Is the work plan exhaustive — every task with timing, accountable person, expense, evidence?
    - 'Does cash match meet program rules (VAPG: cash > in-kind; EDA: 50% non-federal; LAMP: 25%)?'
    - Does the applicant understand the channel they're entering — distributor terms, slotting fees, payment cycles?
    - Is the competitive landscape honestly mapped, or is the applicant claiming false novelty?
    note: 'The 10 priorities above are the union across reviewer registers; per-register weighting differs materially (rendered
      as note prose to avoid schema-extension risk per §18.6 Wave 2 Cycle-2 FIX-IN-PLACE). Federal program-officer register
      (USDA RD VAPG specialists, USDA AMS LAMP panels, state DOA SCBGP, EDA regional offices, SBA program reviewers) reads
      buyer-commitment-rung + match-composition + work-plan exhaustiveness early; unit-economics is evaluated rigorously but
      buyer-commitment evidence often carries decisive weight (especially under VAPG criterion a.iii + criterion c). Business-reviewer
      / lender / commercialization-reviewer register (commercialization peer reviewers at EDA Build to Scale / SBIR Phase
      II / NSF I-Corps; agriculture-market specialists; buyer-or-industry practitioners; lender-style review at SBA-context)
      reads unit-economics + cash-flow + creditworthiness early; buyer-commitment-rung + production-capacity-vs-demand follow;
      match composition typically last. Scribe should dialect-switch by funder type — do not flatten federal-program-officer
      priorities onto business-reviewer dialect or vice versa. Note: both registers care about unit economics + buyer-commitment-rung
      at high priority; the difference is sequencing + relative weighting, not exclusion.'
    common_red_flags_from_reviewer_pov:
    - Buyer 'interest' letters with no volume / price / term
    - Market-size substitution — TAM presented as obtainable demand
    - Pro-forma assumptions opaque — revenue projections without underlying volume × price × conversion math
    - Production capacity insufficient to meet projected demand at peak
    - CAC ignored or buried — no sales-staff time, marketing spend, broker commission in budget
    - Pricing below cost (sustainability impossible) or above market (no premium-positioning evidence)
    - Single-buyer concentration with no diversification timeline
    - Distribution unsolved — 'we will find distributors' is not a channel strategy
    - Match commitment uncertain or in-kind only when cash scores higher
    - Work plan + budget mismatch — orphan tasks or orphan budget lines
    - Key Personnel without commercial / sales experience for a Working Capital application
    - '''No direct competitors'' claim'
    source_citation: pipeline/rubrics/vapg_fy26.json + https://www.ams.usda.gov/services/grants/lamp + https://www.eda.gov/funding/programs/build-to-scale
