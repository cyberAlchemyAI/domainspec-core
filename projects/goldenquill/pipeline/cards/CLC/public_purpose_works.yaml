# Card — TILTH-CLC-01 Public Purpose & Works
# Wave 2 research draft 2026-05-15. Phase 3 output per blueprint §18.11.
# Content populated per blueprint §18.10 starter requirements for CLC-01.
# Operator review + cross-family thesis + Ed25519 signature COMPLETE.
# SIGNED — runtime-loadable; lifecycle truth enforced by loader preflight.
#
# Coupling discipline (architecture v7.0.11 §6.1 + §4 v2.x F-CARDS-COUPLING-VIOLATION-EXTENSION):
# This card contains NO eligible_cic_subset, cic_allowlist, cic_denylist,
# preferred_cics, cic_win_rate, or cic_ranking_preferences fields. CLC × CIC
# matching is opportunity-driven at runtime, never archetype-driven at design time.
# Any CIC may pursue Public Purpose & Works funding when the opportunity's
# statutory authority + public-benefit obligation align with the applicant's work.
#
# Operator OQ resolutions applied (Wave 2, 2026-05-15):
#   - Output path: pipeline/cards/CLC/public_purpose_works.yaml (UPPERCASE per Wave 2 pin).
#   - Verbatim-quote cap: ≤2 sentences per quote with URL + access_date.
#   - admin_risk_term_register entries: approval_required: true on every entry
#     until Lessons Memory absorbs settled substitutions across 12+ CycleReceipts.
#   - Win-rate / frequency: qualitative only (HIGH/MEDIUM/LOW/UNKNOWN). No numeric rates.
#   - Lifecycle: draft / pending / pending / unsigned / not_loaded. ed25519_signature: null.

schema_version: "1.0-clc"
card_axis: "CLC"
card_id: "TILTH-CLC-01"
slug: "public_purpose_works"
display_name: "Public Purpose & Works"
funding_mechanism_summary: "Mandate, eligibility, allowable-use, and civic-benefit funding for public works and public-purpose infrastructure where statutory authority, documented public benefit, procurement compliance, secured match, and project readiness drive underwriting."
tilth_clc_id: "TILTH-CLC-01"

# ---------------------------------------------------------------------------
# UNDERWRITING CRITERIA — what reviewers evaluate (per §18.10 starter content)
# ---------------------------------------------------------------------------
underwriting_criteria:
  # NOTE (Phase D Group A.4 cleanup 2026-05-16): the prior description on this
  # entry contained literal "Customer Identity Card" + "CIC × CLC coupling"
  # prose added at Wave 2 Cycle 1 fold-in. That literal prose would fail-close
  # the hardened F-CARDS-COUPLING-VIOLATION-EXTENSION regex (CC-3 from Wave 2
  # close). Per operator directive 2026-05-16: anti-coupling intent stays here
  # in comment form (operator-readable, gate-invisible); the field description
  # below carries no literal CIC/CLC references. Eligibility is statute-driven
  # and entity-type-driven — any applicant satisfying the statutory criteria
  # qualifies on this CLC regardless of applicant archetype.
  - criterion: "eligibility_statutory_authority"
    description: "Applicant is an eligible entity under the program's authorizing statute or program regulation. Any entity satisfying the statutory eligibility criteria qualifies. Eligibility citation must reference the authorizing statute or program regulation, not just the NOFO. Entity types named in current federal program statutes vary by program (illustrative-only, not constraining): unit of local government, public housing authority, federally-recognized tribe, qualified nonprofit, state agency, special-purpose district, regional planning organization, transit authority, water authority."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "https://www.ecfr.gov/current/title-24/subtitle-B/chapter-V/subchapter-C/part-570"

  - criterion: "public_benefit"
    description: "Demonstrated benefit to a defined public — low-and-moderate-income persons (LMI), residents of a service area, beneficiaries of a hazard mitigation, users of a transportation facility. CDBG requires that at least 70% of funds benefit LMI persons over the program cycle."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.hud.gov/program_offices/comm_planning/cdbg"

  - criterion: "statutory_program_purpose_alignment"
    description: "Project activities map directly to the program's authorizing purpose (e.g., CDBG national objectives; USDA Community Facilities essential community facilities; FEMA BRIC pre-disaster hazard mitigation; EPA SRF clean water or drinking water; DOT BUILD/RAISE surface transportation)."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "https://www.rd.usda.gov/programs-services/community-facilities/community-facilities-direct-loan-grant-program"

  - criterion: "allowable_use"
    description: "Proposed costs are allowable under the program's regulation and 2 CFR 200 Subpart E. Unallowable costs (lobbying, alcohol, entertainment, bad debts, certain pre-award costs without authorization) are excluded from the budget."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-E"

  - criterion: "readiness"
    description: "Project is ready to proceed within program timelines — engineering design status (preliminary engineering report, 30%/60%/90% design), permits in hand or in process, environmental review pathway identified, site control secured. DOT BUILD/RAISE explicitly scores 'project readiness' as a primary merit criterion."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.transportation.gov/RAISEgrants"

  - criterion: "procurement_compliance"
    description: "Procurement policy aligns with 2 CFR 200.317-327 (full and open competition, no organizational conflicts of interest, geographic-preference limits, methods proportional to cost). Federal-funded construction triggers Davis-Bacon prevailing-wage compliance and, for many programs, Build America Buy America (BABA)."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFRea20080eff2ea53/section-200.317"

  - criterion: "match_committed"
    description: "Structural mandate: required match is identified, committed in writing, and from an allowable source — non-federal where 2 CFR 200.306 prohibits federal-fund-as-match. Program-specific match percentages (illustrative baselines only; verify the active NOFO for current rates): CDBG entitlement typically 0%; USDA Community Facilities varies (often 0% grant share for highly distressed areas); FEMA BRIC FY24 baseline 25% non-federal (10% for tribes / disadvantaged communities); EPA SRF principal-forgiveness terms set by state IUPs; DOT BUILD/RAISE FY24 baseline 20% non-federal (waivers for rural). FY26+ NOFOs may revise — runtime Scout layers current-NOFO match rules."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "https://www.fema.gov/grants/mitigation/building-resilient-infrastructure-communities"

  - criterion: "site_control"
    description: "Deed, lease (with adequate term), easement, or option-to-purchase securing the project site. Unresolved site control is a top procedural disqualifier across CDBG, CF, BRIC, and DOT programs."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"

  - criterion: "maintenance_plan"
    description: "Post-construction operations + maintenance plan with identified funding source for the facility's useful life. FEMA BRIC and DOT capital programs explicitly require a maintenance commitment; community-facility funders increasingly do."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.fema.gov/grants/mitigation/building-resilient-infrastructure-communities"

  - criterion: "service_area_need"
    description: "Documented need in the defined service area using objective data — census ACS, hazard maps, water quality reports, transportation crash data, broadband-availability data. Disadvantaged-community designation (Justice40 covered programs) where applicable; LMI-area benefit math for CDBG; rural/distressed designation for USDA RD."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.census.gov/programs-surveys/acs"

  - criterion: "audit_readiness"
    description: "Two most-recent fiscal years of single audits available (where federal expenditures ≥ $750K/year; threshold rising to $1M for FY beginning Oct 2024 per 2024 Uniform Guidance update); financial systems documented; no outstanding audit findings or all findings corrective-action complete."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-F"

  - criterion: "environmental_review_pathway"
    description: "NEPA tier identified (CATEX / EA / EIS) with environmental review owner named. Section 106 historic-preservation consultation initiated where applicable. State-level review (e.g., PA Act 14 notifications) accounted for."
    weight_in_typical_rubric: "qualitative_threshold"
    source_citation: "https://ceq.doe.gov/laws-regulations/regulations.html"

# ---------------------------------------------------------------------------
# SCORING WEIGHT PATTERNS — representative federal/state rubrics
# Qualitative weights per OQ-6. Specific NOFO numerics cited only where the
# rubric weight is publicly published; otherwise 'weighted' qualitative.
# ---------------------------------------------------------------------------
scoring_weight_patterns:
  - rubric_example: "HUD CDBG Entitlement (Annual Action Plan / Consolidated Plan structure)"
    weights:
      national_objective_compliance: "threshold"
      lmi_benefit_math: "weighted"
      consolidated_plan_alignment: "weighted"
      activity_readiness: "weighted"
      financial_management_capacity: "weighted"
    source_citation: "https://www.hud.gov/program_offices/comm_planning/cdbg"
    note: "CDBG Entitlement uses a formula allocation, not a competitive rubric; CDBG-State and CDBG-DR are competitive with state-set rubrics. National-objective compliance + LMI benefit ≥70% are statutory thresholds."

  - rubric_example: "USDA Community Facilities (Direct Loan/Grant Program — RD-Apply)"
    weights:
      essential_community_facility_purpose: "threshold"
      population_size: "weighted"
      median_household_income: "weighted"
      health_safety_priority: "weighted"
      project_readiness: "weighted"
    source_citation: "https://www.rd.usda.gov/programs-services/community-facilities/community-facilities-direct-loan-grant-program"
    note: "USDA RD weights MHI and population for distressed-area priority; grant share scales inversely with MHI per 7 CFR 3570."

  - rubric_example: "FEMA BRIC (Building Resilient Infrastructure and Communities) FY24"
    weights:
      risk_reduction_lifeline: "weighted"
      benefit_cost_analysis: "threshold"
      community_lifelines: "weighted"
      mitigation_action_implementation: "weighted"
      population_impacted_disadvantaged_community: "weighted"
    source_citation: "https://www.fema.gov/grants/mitigation/building-resilient-infrastructure-communities/after-apply/scoring"
    note: "FEMA BRIC FY24 published a 100-point qualitative + technical structure; BCA ≥1.0 is a threshold gate. Justice40 'disadvantaged community' designation carried additional points; FY26+ administration may revise."

  - rubric_example: "EPA Clean Water/Drinking Water State Revolving Fund (SRF) — Intended Use Plan"
    weights:
      public_health_priority: "weighted"
      environmental_priority: "weighted"
      affordability_disadvantaged_community: "weighted"
      project_readiness: "weighted"
      consistency_with_planning_documents: "weighted"
    source_citation: "https://www.epa.gov/cwsrf/clean-water-state-revolving-fund-cwsrf"
    note: "SRF is state-administered; each state's Intended Use Plan publishes its own priority-ranking criteria. Principal forgiveness percentages set by state, often tied to disadvantaged-community designation."

  - rubric_example: "DOT BUILD/RAISE Discretionary Grants"
    weights:
      safety: "weighted"
      environmental_sustainability: "weighted"
      quality_of_life: "weighted"
      mobility_and_community_connectivity: "weighted"
      economic_competitiveness: "weighted"
      state_of_good_repair: "weighted"
      partnership_and_innovation: "weighted"
      project_readiness: "weighted"
    source_citation: "https://www.transportation.gov/RAISEgrants"
    note: "DOT BUILD/RAISE merit criteria are qualitative-weighted; published NOFO each cycle assigns relative emphasis. 'Project readiness' is consistently treated as a primary criterion."

  - rubric_example: "EDA Public Works and Economic Adjustment Assistance"
    weights:
      economic_distress_eligibility: "threshold"
      ceds_alignment: "weighted"
      regional_economic_impact: "weighted"
      project_readiness: "weighted"
      collaborative_regional_innovation: "weighted"
    source_citation: "https://www.eda.gov/funding/programs/public-works"
    note: "EDA Public Works requires economic-distress eligibility (unemployment, per-capita income, or special-need criteria) as a threshold + CEDS alignment as a primary merit factor."

# ---------------------------------------------------------------------------
# EVIDENCE WEIGHTS — what reviewers look for
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# EVIDENCE WEIGHTS BASELINE NOTE (Cycle 1 Thesis FOLD-IN per Red Team RT-7 + RT-10):
# FY24-baseline weights and threshold values are encoded for card-floor utility
# (e.g., FEMA BRIC 25% non-federal cost-share, BCA ≥ 1.0; single-audit threshold
# $750K legacy vs $1M FY-beginning-Oct-2024+). Runtime Scout MUST layer the current
# FY NOFO numerics over this baseline before any binding scoring or recommendation.
# Card is intentionally agency-baseline; card does not chase NOFO-by-NOFO drift.
# ---------------------------------------------------------------------------
evidence_weights:
  eligibility_citation:
    weight: "HIGH"
    rationale: "Specific reference to the authorizing statute, program regulation, and applicant-type qualification. Without it, application risks threshold rejection. Reviewers look for citation-to-authority, not paraphrase."
    source_citation: "https://www.ecfr.gov/current/title-24/subtitle-B/chapter-V/subchapter-C/part-570"

  board_resolution:
    weight: "HIGH"
    rationale: "Authorizing resolution from the governing body (council, board of supervisors, commissioners, board of directors) approving the application, accepting match obligations, and designating the authorized representative. Standard requirement across CDBG, USDA CF, FEMA BRIC."

  engineering_estimate:
    weight: "HIGH"
    rationale: "Stamped engineer's opinion of probable construction cost (OPCC) or preliminary engineering report. Reviewers discount budgets supported only by vendor quotes; PE-stamped estimates are the credibility standard."
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"

  capital_plan_reference:
    weight: "HIGH"
    rationale: "Project is identified in the applicant's adopted capital improvement plan (CIP), comprehensive plan, hazard mitigation plan, or consolidated plan. Reviewers cross-check that the project is not an out-of-plan add-on."

  service_area_data:
    weight: "HIGH"
    rationale: "Census ACS demographics, LMI benefit math (low/mod income survey or HUD-published LMI data), service-population counts. CDBG LMI math is reviewer-verified."
    source_citation: "https://www.hud.gov/program_offices/comm_planning/cdbg"

  census_data:
    weight: "HIGH"
    rationale: "American Community Survey 5-year estimates for population, MHI, poverty, race/ethnicity (where applicable). For DOT/EDA, ACS supports distress-area eligibility math."
    source_citation: "https://www.census.gov/programs-surveys/acs"

  match_commitment_letter:
    weight: "HIGH"
    rationale: "Written, signed commitment of cash match (or board-resolution-backed in-kind valuation) naming the source, amount, and authorized signer. Verbal or 'anticipated' match is reviewed unfavorably."

  site_control:
    weight: "HIGH"
    rationale: "Deed, signed lease (with term equal to or exceeding the federal interest period — typically 20 years for facilities), easement, or executed option-to-purchase. Site control is a frequent procedural disqualifier."

  procurement_policy:
    weight: "MEDIUM"
    rationale: "Written procurement policy meeting 2 CFR 200.317-327 standards (or 2 CFR 200.318-326 for non-state recipients). Required attachment or certification on many federal applications."
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFRea20080eff2ea53/section-200.317"

  maintenance_plan:
    weight: "MEDIUM"
    rationale: "Written O&M plan with identified post-grant funding source for the facility's useful life. FEMA BRIC and DOT capital programs require it explicitly; community-facility funders increasingly do."

  environmental_review_pathway:
    weight: "HIGH"
    rationale: "NEPA tier (CATEX / EA / EIS) identified, environmental review owner named, Section 106 consultation initiated if applicable. Programs differ on whether the applicant or the agency leads the review."
    source_citation: "https://ceq.doe.gov/laws-regulations/regulations.html"

  hazard_or_need_data:
    weight: "HIGH"
    rationale: "FEMA flood maps + risk-MAP data (BRIC); state water-quality reports (EPA SRF); DOT crash data + safety performance reports (BUILD/RAISE); USDA RD distress designation."

  benefit_cost_analysis:
    weight: "HIGH"
    rationale: "FEMA BRIC requires BCA ≥1.0 as a threshold gate. DOT BUILD/RAISE encourages monetized BCA. EDA Public Works values regional economic impact estimates. BCA tools published by each agency."
    source_citation: "https://www.fema.gov/grants/mitigation/benefit-cost-analysis"

  audit_documentation:
    weight: "HIGH"
    rationale: "Two most-recent single audits with no material weaknesses or all findings remediated. Threshold selector by award fiscal year: legacy single-audit threshold ≥ $750,000/year federal expenditures (FY beginning pre-Oct-2024, 90-day closeout window per legacy §200.344); current single-audit threshold ≥ $1,000,000/year federal expenditures (FY beginning Oct 2024+, 120-day closeout window per 2024 Uniform Guidance update). Reviewers apply the threshold appropriate to the audit period; pre-award screening evaluates the applicant's audits under whichever rule was active in those fiscal years."
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-F"

  davis_bacon_compliance_certification:
    weight: "MEDIUM"
    rationale: "Construction over the Davis-Bacon trigger requires prevailing-wage compliance — certified payrolls, posted wage decisions, contractor compliance. Reviewer expects applicant to acknowledge the obligation."
    source_citation: "https://www.dol.gov/agencies/whd/government-contracts/construction"

  baba_compliance_plan:
    weight: "MEDIUM"
    rationale: "Build America Buy America Act applies to most federal-assistance infrastructure projects. Applicants identify iron/steel, manufactured products, and construction-materials sourcing strategy + waiver pathway if domestic sourcing infeasible."
    source_citation: "https://www.whitehouse.gov/wp-content/uploads/2023/08/M-24-02-Buy-America-Implementation-Guidance-Update.pdf"

