# ---------------------------------------------------------------------------
# NARRATIVE SECTION PATTERNS
# Word counts vary widely by NOFO; ranges below reflect common federal/state
# patterns for public-works applications.
# ---------------------------------------------------------------------------
narrative_section_patterns:
  - section_name: "Project Summary / Executive Summary"
    typical_word_count: "250-500"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"
    note: "One-page snapshot — project name, location, applicant, total cost, federal request, match, timeline, primary public benefit."

  - section_name: "Eligibility / Applicant Qualification"
    typical_word_count: "300-600"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"
    note: "Specific citation of the authorizing statute + applicant-type qualification + program eligibility category (e.g., CDBG entitlement / state / non-entitlement)."

  - section_name: "Need / Problem Statement"
    typical_word_count: "750-2000"
    source_citation: "https://www.hud.gov/program_offices/comm_planning/cdbg"
    note: "Carries the most reviewer weight. Anchored in objective data: census ACS, hazard maps, water-quality reports, crash data, broadband-availability data. Service-area boundaries defined; LMI math (for CDBG); disadvantaged-community designation (where program-relevant)."

  - section_name: "Public Benefit / National Objective / Program Purpose"
    typical_word_count: "500-1500"
    source_citation: "https://www.hud.gov/program_offices/comm_planning/cdbg"
    note: "For CDBG: which national objective the project meets (LMI benefit / slum-blight / urgent need) with math. For USDA CF: essential-community-facility framing. For BRIC: hazard-mitigation lifeline served. For DOT: which merit criteria + how."

  - section_name: "Project Description / Scope of Work"
    typical_word_count: "750-2500"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"
    note: "Engineering description, design basis, alternatives considered (where required), phasing if multi-phase. References preliminary engineering report or stamped plans."

  - section_name: "Readiness / Implementation Plan"
    typical_word_count: "500-1500"
    source_citation: "https://www.transportation.gov/RAISEgrants"
    note: "Design status, permitting status, environmental review pathway, site control status, procurement schedule, construction-start and substantial-completion dates. DOT BUILD/RAISE scores readiness directly."

  - section_name: "Environmental Review / NEPA"
    typical_word_count: "300-1000"
    source_citation: "https://ceq.doe.gov/laws-regulations/regulations.html"
    note: "NEPA tier identification (CATEX / EA / EIS), Section 106 consultation status, applicable state environmental review. Some programs require completed review before award; others permit concurrent."

  - section_name: "Budget Narrative / Cost Justification"
    typical_word_count: "500-1500"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-E"
    note: "Line-item justification tied to engineering estimate. Construction contingency typically 10-15% of construction cost. Indirect costs per recipient's negotiated rate or 10% de minimis MTDC where applicable."

  - section_name: "Match / Leverage"
    typical_word_count: "300-800"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"
    note: "Match source(s), amount(s), allowability under program rules, commitment-letter status. Cash vs in-kind. Documentation that match is non-federal where required."

  - section_name: "Procurement Approach"
    typical_word_count: "300-800"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFRea20080eff2ea53/section-200.317"
    note: "Procurement-policy reference; Davis-Bacon compliance approach; BABA sourcing strategy + waiver pathway; M/W/DBE outreach approach where required."

  - section_name: "Operations and Maintenance"
    typical_word_count: "300-800"
    source_citation: "https://www.fema.gov/grants/mitigation/building-resilient-infrastructure-communities"
    note: "Post-construction O&M responsibility, annual cost estimate, funding source (general fund, user fees, special assessment, restricted reserve), useful-life commitment."

  - section_name: "Timeline / Schedule"
    typical_word_count: "200-500"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"
    note: "Gantt or milestone schedule from award through closeout. Construction milestones (NTP, mobilization, substantial completion, final acceptance). Compliance milestones (Davis-Bacon certifications, M/WBE reporting)."

  - section_name: "Capacity / Management Plan"
    typical_word_count: "500-1500"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"
    note: "Applicant's prior federal grant management experience, project-management staffing, financial controls, audit status, fiscal agent (if non-applicant)."

# ---------------------------------------------------------------------------
# BUDGET STRUCTURE CONVENTIONS
# ---------------------------------------------------------------------------
budget_structure_conventions:
  direct_cost_categories:
    - "personnel"
    - "fringe_benefits"
    - "travel"
    - "equipment"
    - "supplies"
    - "contractual_construction"
    - "professional_services_engineering_architecture"
    - "land_acquisition_easements"
    - "permits_and_environmental_review"
    - "other_direct"
    - "construction_contingency"
  indirect_cost_treatment: "Construction-heavy budgets emphasize direct construction costs; indirect costs honored at the recipient's federally negotiated rate or 10% de minimis MTDC per 2 CFR 200.414(f). Some programs cap indirect at lower rates — check each NOFO. CDBG entitlement allows administrative costs up to 20% of grant; CDBG-State limits administrative + planning to 20%; FEMA BRIC management costs capped per FEMA guidance."
  match_requirements_typical: "CDBG entitlement: typically 0% (formula). CDBG-State: state-set, often 0-25%. USDA Community Facilities Grant: grant share inversely proportional to MHI (0-75%). FEMA BRIC: 25% non-federal (10% for tribes / federally-designated disadvantaged communities under FY24 rules; FY26+ check current NOFO). EPA Clean Water/Drinking Water SRF: principal forgiveness percentages set by state IUP. DOT BUILD/RAISE: 20% non-federal (waivers for rural / persistent-poverty / federally-designated areas). EDA Public Works: typically 50% non-federal, reduced for distressed areas."
  source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-E"
  note: "Davis-Bacon prevailing-wage requirements increase construction-line costs; budget should reflect prevailing-wage estimate, not non-prevailing-wage market rates."

# ---------------------------------------------------------------------------
# REVIEWER PROFILE TYPICAL
# ---------------------------------------------------------------------------
reviewer_profile_typical:
  reviewer_types:
    - "federal_program_officer"
    - "state_pass_through_program_officer"
    - "compliance_reviewer"
    - "professional_engineer_reviewer"
    - "financial_capacity_reviewer"
    - "economic_development_reviewer"
    - "environmental_review_specialist"
    - "subject_matter_expert_panel"
  reviewer_priorities:
    - "Is the applicant eligible under the statute? Threshold gate."
    - "Does the project meet a national objective / program purpose? Threshold gate."
    - "Is the public benefit measurable, defensible, and tied to objective data?"
    - "Is the project ready — engineering, permits, environmental review, site control?"
    - "Is the budget realistic and tied to a stamped engineering estimate?"
    - "Is the match committed in writing from an allowable source?"
    - "Does the applicant have the capacity (audit-clean, staffed, experienced) to deliver?"
    - "Is the maintenance plan funded for the facility's useful life?"
  common_red_flags_from_reviewer_pov:
    - "Vague or absent eligibility citation — no statute reference, only NOFO restatement."
    - "Public-benefit framing that uses jargon ('community impact') instead of LMI math or service-population counts."
    - "Match described as 'anticipated' or 'pending' with no commitment letter."
    - "Engineering estimate replaced by a contractor verbal quote."
    - "Site control 'in process' with no executed instrument."
    - "Procurement silence — no written policy referenced."
    - "Construction timeline starting before NEPA review could plausibly be complete."
    - "Davis-Bacon and BABA not acknowledged — signals applicant unfamiliarity with federal construction compliance."
    - "Operations and maintenance unfunded or vaguely described."
    - "Single audit not submitted or audit findings not addressed."
  source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"

