# ---------------------------------------------------------------------------
# COMMON RED FLAGS — adversarial probes
# ---------------------------------------------------------------------------
common_red_flags:
  - flag: "vague_eligibility_citation"
    severity: "HIGH"
    red_team_probe: "Which authorizing statute and program regulation specifically qualifies this applicant for this program? Cite section and subsection."
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"

  - flag: "weak_public_benefit_framing"
    severity: "HIGH"
    red_team_probe: "How many specific persons / households / properties benefit? What is the LMI percentage (CDBG)? What is the disadvantaged-community designation (Justice40 / state equivalent)? Show the math, not the framing."
    source_citation: "https://www.hud.gov/program_offices/comm_planning/cdbg"

  - flag: "uncommitted_match"
    severity: "HIGH"
    red_team_probe: "Where is the signed match commitment letter? Who authorized it? When? Is the source allowable under program rules (e.g., non-federal where required)?"

  - flag: "procurement_silence"
    severity: "HIGH"
    red_team_probe: "What is the procurement policy? Does it meet 2 CFR 200.317-327? How will Davis-Bacon prevailing wages be administered? What is the BABA sourcing strategy?"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFRea20080eff2ea53/section-200.317"

  - flag: "unresolved_site_control"
    severity: "HIGH"
    red_team_probe: "What instrument secures site control — deed, lease, easement, executed option? What is its term? Does it cover the federal-interest period (typically 20 years for facilities)?"

  - flag: "missing_planning_citations"
    severity: "MEDIUM"
    red_team_probe: "Is this project identified in the applicant's adopted capital improvement plan / hazard mitigation plan / comprehensive plan / consolidated plan? Cite the document and page."

  - flag: "unrealistic_construction_timeline"
    severity: "HIGH"
    red_team_probe: "Does the construction-start date assume environmental review is complete? When will NEPA finding be issued? What is the procurement timeline before notice-to-proceed? Have permits been applied for?"

  - flag: "no_nepa_pathway"
    severity: "HIGH"
    red_team_probe: "What is the NEPA tier — CATEX, EA, or EIS? Who is the responsible federal official? Is Section 106 historic-preservation consultation initiated? Are there environmental-justice implications under EO 12898?"
    source_citation: "https://ceq.doe.gov/laws-regulations/regulations.html"

  - flag: "davis_bacon_nonresponsive"
    severity: "HIGH"
    red_team_probe: "Does the budget reflect prevailing-wage construction costs? Does the procurement plan include posting wage decisions and certified-payroll review? Who at the applicant administers Davis-Bacon? Failure to address Davis-Bacon on a federally-assisted construction grant is treated as a HIGH-severity compliance breach by DOT BUILD/RAISE, FEMA construction programs, and HUD — and can disqualify the application."
    source_citation: "https://www.dol.gov/agencies/whd/government-contracts/construction"

  - flag: "baba_waiver_no_rationale"
    severity: "HIGH"
    red_team_probe: "Are iron/steel/manufactured products/construction materials sourced domestically? If a waiver is sought, on what basis — non-availability, public-interest, or unreasonable cost? Has the waiver request been pre-screened with the funding agency? Several federal infrastructure programs treat BABA waiver-without-rationale as a HIGH-severity scoring or compliance hit; mandatory prevailing-wage certifications and waiver justification must be included where applicable."
    source_citation: "https://www.whitehouse.gov/wp-content/uploads/2023/08/M-24-02-Buy-America-Implementation-Guidance-Update.pdf"

  - flag: "unfunded_maintenance"
    severity: "MEDIUM"
    red_team_probe: "What is the annual O&M cost? What is the funding source — general fund, user fees, special assessment, restricted reserve? Is the funding source committed for the facility's useful life?"

  - flag: "single_audit_findings_unaddressed"
    severity: "MEDIUM"
    red_team_probe: "What were the findings on the most-recent two single audits? Are corrective actions complete? Are there material weaknesses or significant deficiencies in financial-management systems?"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-F"

  - flag: "engineering_estimate_quality"
    severity: "HIGH"
    red_team_probe: "Is the budget supported by a PE-stamped engineer's opinion of probable construction cost, or by contractor verbal quotes? At what design level was the estimate prepared (conceptual, 30%, 60%, 90%)? Per evidence_weights.engineering_estimate (card line 184), PE-stamped estimates are the credibility standard and reviewers discount budgets supported only by vendor verbal quotes — CDBG, FEMA BRIC, DOT BUILD/RAISE, and USDA Community Facilities routinely treat vendor-quote-only construction budgets as disqualifying-risk evidence. Cycle-1 F7 davis_bacon + baba severity-bump pattern applies."

# ---------------------------------------------------------------------------
# REPORTING REQUIREMENTS TYPICAL
# ---------------------------------------------------------------------------
reporting_requirements_typical:
  performance_reporting:
    frequency: "quarterly_or_semi_annual"
    content_required:
      - "Project milestone progress (design / permit / procurement / construction / closeout phases)"
      - "Performance indicators (units of facility delivered, beneficiaries served, jobs created/retained)"
      - "Beneficiary demographics for CDBG (LMI compliance verification)"
      - "Compliance status (Davis-Bacon, M/WBE, BABA, Section 3 where applicable)"
      - "Variance from original timeline + corrective action"
  financial_reporting:
    frequency: "quarterly"
    content_required:
      - "SF-425 Federal Financial Report"
      - "Drawdowns (CDBG via IDIS, FEMA via FEMA-GO, USDA via online RD systems)"
      - "Match documentation"
      - "Variance from approved budget + budget-modification requests as needed"
  final_report_required: true
  source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFR682eb148525a1ed/section-200.344"
  note: "CDBG Entitlement files CAPER (Consolidated Annual Performance and Evaluation Report) annually. FEMA BRIC requires quarterly progress + financial reports. DOT BUILD/RAISE files quarterly progress + SF-425 + annual NTIA-style outcome reports. Closeout reports due within 120 days of period-of-performance end per 2024 Uniform Guidance update (was 90 days)."

# ---------------------------------------------------------------------------
# COMPLIANCE OBLIGATIONS
# ---------------------------------------------------------------------------
compliance_obligations:
  - framework: "2 CFR Part 200 (Uniform Guidance)"
    applicability: "All federal grants and pass-throughs"
    typical_filings:
      - "SF-425 Federal Financial Report"
      - "SF-PPR Performance Progress Report (or program-specific equivalent)"
      - "Single Audit if federal expenditures ≥ $750,000/year (legacy threshold for FY beginning pre-Oct-2024; raised to $1,000,000/year for FY beginning Oct 2024+ per 2024 Uniform Guidance update — selector by award fiscal year)"
      - "Indirect-cost-rate negotiation or 10% de minimis MTDC election"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"

  - framework: "2 CFR 200.306 — Federal funds prohibited as match"
    applicability: "All federal grants where the program statute requires non-federal match"
    typical_filings:
      - "Match documentation demonstrating non-federal source (cash, in-kind, third-party contributions)"
      - "Match commitment letter signed by the non-federal contributor with source identified"
      - "Match expenditure tracking and reporting per the grant agreement"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFRf78b8bb6dffa70d/section-200.306"

  - framework: "Davis-Bacon Act and Related Acts"
    applicability: "Federally-funded construction over the contract trigger (typically $2,000 for direct federal contracts; varies for federal-assistance programs)"
    typical_filings:
      - "Posted wage decisions at construction site"
      - "Certified weekly payrolls from contractors and subcontractors"
      - "Compliance monitoring and worker interviews"
    source_citation: "https://www.dol.gov/agencies/whd/government-contracts/construction"

  - framework: "Build America Buy America Act (BABA / 2 CFR 184)"
    applicability: "Federal-assistance infrastructure projects per Public Law 117-58 §70914"
    typical_filings:
      - "Iron/steel/manufactured-products/construction-materials sourcing documentation"
      - "Waiver request and approval where domestic sourcing is infeasible (non-availability, public-interest, unreasonable cost)"
    source_citation: "https://www.whitehouse.gov/wp-content/uploads/2023/08/M-24-02-Buy-America-Implementation-Guidance-Update.pdf"

  - framework: "National Environmental Policy Act (NEPA)"
    applicability: "Most federal-funded construction projects"
    typical_filings:
      - "Categorical Exclusion (CATEX), Environmental Assessment (EA), or Environmental Impact Statement (EIS)"
      - "Finding of No Significant Impact (FONSI) or Record of Decision (ROD)"
    source_citation: "https://ceq.doe.gov/laws-regulations/regulations.html"

  - framework: "Section 106 of the National Historic Preservation Act"
    applicability: "Federal undertakings with potential to affect historic properties"
    typical_filings:
      - "State Historic Preservation Office (SHPO) consultation"
      - "Tribal Historic Preservation Office (THPO) consultation where applicable"
      - "Programmatic Agreement or Memorandum of Agreement where adverse effects identified"
    source_citation: "https://www.achp.gov/protecting-historic-properties/section-106-process"

  - framework: "Americans with Disabilities Act (ADA)"
    applicability: "Public facilities and programs receiving federal financial assistance"
    typical_filings:
      - "ADA accessibility certification for new construction"
      - "Self-evaluation and transition plan (Title II entities)"
    source_citation: "https://www.ada.gov/"

  - framework: "Title VI of the Civil Rights Act"
    applicability: "All federal financial-assistance recipients"
    typical_filings:
      - "Title VI assurance + nondiscrimination plan"
      - "Limited-English-Proficiency (LEP) plan where applicable"
    source_citation: "https://www.justice.gov/crt/fcs/T6Manual"

  - framework: "Section 504 of the Rehabilitation Act"
    applicability: "Federal financial-assistance recipients"
    typical_filings:
      - "Section 504 self-evaluation and accessibility certifications"
    source_citation: "https://www.hhs.gov/civil-rights/for-providers/laws-regulations-guidance/section-504/index.html"

  - framework: "Federal Funding Accountability and Transparency Act (FFATA)"
    applicability: "Prime recipients of federal awards ≥ $30,000 with sub-awards ≥ $30,000"
    typical_filings:
      - "FSRS sub-award reporting"
      - "Executive compensation disclosure where applicable"
    source_citation: "https://www.fsrs.gov/"

  - framework: "Uniform Guidance §200.344 Closeout"
    applicability: "All federal grants"
    typical_filings:
      - "Final SF-425 Federal Financial Report"
      - "Final performance report"
      - "Property inventory and disposition (where applicable)"
      - "Submitted within 120 days of period-of-performance end per 2024 Uniform Guidance update"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFR682eb148525a1ed/section-200.344"

# ---------------------------------------------------------------------------
# COMMITMENT TRACKING PATTERN — Report Generator (v0.2) feed
# ---------------------------------------------------------------------------
commitment_tracking_pattern:
  typical_commitments_extracted:
    - commitment_type: "construction_milestone_groundbreaking"
      measurement_method: "notice-to-proceed date + mobilization date + photo documentation"
    - commitment_type: "construction_milestone_substantial_completion"
      measurement_method: "substantial-completion certificate date + punch-list status"
    - commitment_type: "construction_milestone_final_acceptance"
      measurement_method: "final-acceptance certificate date + owner sign-off"
    - commitment_type: "procurement_executed"
      measurement_method: "RFP issue date + award date + contract execution date + contractor name + contract value"
    - commitment_type: "match_expenditure"
      measurement_method: "match-source name + amount drawn + cumulative percentage of committed match + documentation reference"
    - commitment_type: "beneficiary_count"
      measurement_method: "service-area population served + LMI percentage (CDBG) + disadvantaged-community-area benefit count (where program-relevant)"
    - commitment_type: "facility_units_delivered"
      measurement_method: "named facility type (water main feet / treatment plant capacity gpd / housing units / square footage / trail miles) + baseline → post-construction value"
    - commitment_type: "jobs_created_or_retained"
      measurement_method: "construction jobs FTE during build + permanent jobs FTE post-occupancy (where applicable per EDA / CDBG-econ-dev)"
    - commitment_type: "davis_bacon_payrolls_filed"
      measurement_method: "certified-payroll count + worker count + any wage-decision violations + corrective actions"
    - commitment_type: "baba_compliance_filing"
      measurement_method: "iron/steel/manufactured-products/materials sourcing log + waiver requests filed + waivers approved"
    - commitment_type: "single_audit_filing"
      measurement_method: "fiscal-year audit completion date + findings count + corrective-action status"
    - commitment_type: "ffata_subaward_reporting"
      measurement_method: "FSRS-filed sub-award count + cumulative sub-award value"
    - commitment_type: "closeout_completion"
      measurement_method: "final-SF-425 submission date + final performance report date + property disposition status + closeout-letter receipt date"
    - commitment_type: "final_federal_financial_report"
      measurement_method: "final SF-425 submission date + total federal expenditures + total non-federal share expended + unliquidated obligations cleared (submission required within 120 days of period-of-performance end per 2 CFR 200.344)"
    - commitment_type: "final_performance_report"
      measurement_method: "final performance report submission date + cumulative beneficiary count + facility-units-delivered actuals vs commitment + variance narrative (submission required within 120 days of period-of-performance end per 2 CFR 200.344)"
    - commitment_type: "property_inventory_and_disposition"
      measurement_method: "real-property and equipment inventory (where applicable) + disposition documentation per 2 CFR 200.310-316 + federal-interest period continuation where applicable"
  proposal_commitments_yaml_extension:
    field_name: "public_purpose_works_commitments"
  source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-01"

