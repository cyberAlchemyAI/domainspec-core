# This card contains NO eligible_cic_subset, cic_allowlist, cic_denylist,
# preferred_cics, cic_win_rate, or cic_ranking_preferences fields. CLC × CIC
# matching is opportunity-driven at runtime, never archetype-driven at design time.
# Any CIC may pursue Credit & Underwriting capital when the opportunity's
# underwriting logic centers repayment capacity, debt service coverage, collateral,
# financial controls, and use-of-funds.
#
# CRITICAL FRAMING: This CLC is debt-side underwriting, NOT grants. Many funding
# applications routed through a CDFI, SBA lender, or USDA RD intermediary become
# loans, loan guarantees, or revolving-fund advances rather than grants. CDFIs
# and intermediary lenders frequently combine grant + loan + technical-assistance
# (TA) packages where each instrument carries its own terms. Reviewers underwrite
# repayment capacity even when the applicant came in expecting "grant-like"
# treatment. Tilth must surface the debt-vs-grant distinction during Intake +
# Scout VERIFY so applicants do not draft in grant-language for debt instruments.
#
