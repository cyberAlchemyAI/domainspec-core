_review_handback:
  card_axis_and_slug: CLC:credit_underwriting
  card_file: pipeline/cards/CLC/credit_underwriting.yaml
  research_hours_actual: 3.0
  schema_completeness:
    required_fields_populated: 15/15
    fields_needing_review: 0
    total_citations: 47
    unique_primary_sources: 17
  decision_queue:
  - 'DEBT-VS-GRANT FRAMING (load-bearing): Card encodes that this CLC funds debt + guarantees + revolving funds, NOT grants.
    Confirm that Tilth''s Intake + Scout VERIFY surfaces this distinction to the applicant when an opportunity routes to a
    CDFI / SBA lender / USDA RD lender. Mis-framing a debt application as a grant proposal is a structural draft failure that
    this card cannot prevent at runtime — needs Intake / Scout-VERIFY surface.'
  - 'admin_risk_term_register MIGRATION TRACKING (Wave 2 Thesis Cycle 2 FIX-IN-PLACE 2026-05-16): The CLC-06-scoped admin_risk_term_register
    block was REMOVED from this card at Cycle 2 fix-in-place per Wave 1 CLC-03 + Wave 2 CLC-02 + CLC-04 + CLC-05 precedent
    (§18.6 CLC schema does not declare this field; CIC-only per §18.5). The 13 substantive flagged terms (predatory lending
    / financial inclusion / underbanked / community wealth-building / wealth-building loans / alternative credit / responsible
    lending / mission-aligned capital / patient capital / credit-invisible / minority depository institution / creditworthy
    / stakeholder re-noted) carry runtime value and require migration to workspace-wide pipeline/institutional_memory/admin_risk_register.yaml
    v2.3 follow-on dispatch (compound migration with CLC-03 + CLC-02 + CLC-04 + CLC-05). Federal-vs-CDFI-vs-conventional dialect
    split is the load-bearing operator decision when v2.3 lands: ''community wealth-building'' / ''patient capital'' / ''mission-aligned
    capital'' / ''wealth-building loans'' PREFERRED in CDFI + foundation-PRI contexts; conventional bank applications need
    substitutions toward ''community-rooted capital'' / ''long-horizon capital'' / ''asset-building credit products''. Operator
    decision: when to fire the v2.3 compound migration dispatch.'
  - Cross-family Thesis dispatch (Editor + Judge + Red Team via openclaw bridge per AGENTS.md) before promoting lifecycle
    to 'reviewed'.
  - Ed25519 signature once operator + Thesis pass — pending publisher key pin per architecture v7.0.11 §6.1 (mirrors v7.0.7
    router-template trust mechanism).
  - 'scoring_weight_patterns: SBA SOP 50 10 enumerates required underwriting elements but does NOT publish a numeric scoring
    rubric; CDFI underwriting policies are board-approved and proprietary; USDA RD B&I has program-published equity-position
    requirements but no comprehensive scoring rubric. Card cites the 5C framework (universal heuristic) + SBA SOP + USDA RD
    per-program requirements + CDFI mission-plus-credit composite; weights are qualitative per Wave 1 OQ-6. Confirm this matches
