    or capital_readiness_grant; final naming pending v0.2 Wave 3 dispatch) for grant-side capital matching such as capitalization
    grants, loan loss reserve grants, CDFI Fund Financial Assistance / Technical Assistance grant cycles, and USDA RD grant-loan-combo
