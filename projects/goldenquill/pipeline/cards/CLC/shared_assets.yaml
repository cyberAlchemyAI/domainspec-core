# Card — TILTH-CLC-08 Shared Assets
# Wave 2 research draft 2026-05-15. Phase 3 output per blueprint §18.11.
# Content populated per blueprint §18.10 starter requirements for CLC-08.
# Operator review + cross-family thesis + Ed25519 signature COMPLETE.
# SIGNED — runtime-loadable; lifecycle truth enforced by loader preflight.
#
# Coupling discipline (architecture v7.0.11 §6.1 + §4 v2.x F-CARDS-COUPLING-VIOLATION-EXTENSION):
# This card contains NO eligible_cic_subset, cic_allowlist, cic_denylist,
# preferred_cics, cic_win_rate, or cic_ranking_preferences fields. CLC × CIC
# matching is opportunity-driven at runtime, never archetype-driven at design time.
# Shared Assets covers a broad asset-governance spectrum — cooperative-
# operated assets among many other forms. Examples spanning the breadth: a
# 501(c)(3) operating a food hub; a municipality operating a public-library
# facility or community tool library; a community land trust (CLT) holding
# title to a CSA farm; a school district running a shared community kitchen;
# an arts collective sharing a maker space; a farm cooperative pooling cold-
# storage capacity; a public agency operating an equipment library; an
# ecosystem intermediary stewarding a regional food hub. The card's
# historical vocabulary (commons, community wealth, cooperative ownership)
# reflects funding-source language patterns and applies opportunity-driven,
# not archetype-driven. Any CIC may pursue Shared Assets funding when the
# opportunity's underwriting logic centers shared need, governance, equitable
# access, utilization, and maintenance-reserve discipline.
#
# Operator OQ resolutions applied (Wave 2 carry-over from Wave 1, 2026-05-15):
#   Directory: pipeline/cards/CLC/ (uppercase canonical).
#   Verbatim-quote cap: ≤2 sentences per quote with URL + access_date citation.
#   admin_risk_term_register: REMOVED at Cycle-2 FIX-IN-PLACE (2026-05-16). The
#     §18.6 CLC schema declares this field on the CIC axis only (§18.5). 9
#     CLC-08-scoped flagged terms migrate to workspace-wide
#     `pipeline/institutional_memory/admin_risk_register.yaml` v2.3 in a
#     compound migration with sibling CLCs (CLC-02 / CLC-03 / CLC-04 / CLC-05
#     / CLC-06 / CLC-07). Operator approval_required:true discipline preserved
#     at the workspace-wide register.
#   Frequency / win-rate: qualitative-only (HIGH/MEDIUM/LOW/UNKNOWN). No numeric rates.
#   Schema-current as-on-disk; uses lifecycle.review_status terminology.

schema_version: "1.0-clc"
card_axis: "CLC"
card_id: "TILTH-CLC-08"
slug: "shared_assets"
display_name: "Shared Assets"
funding_mechanism_summary: "Shared infrastructure, commons, cooperative infrastructure, community facilities, and collective-benefit funding where shared need across multiple users, governance authority, equitable access policy, utilization evidence, and maintenance reserves drive underwriting. Spans the full asset-governance breadth — cooperative-operated assets among many other forms: 501(c)(3)-operated food hubs and shared-use kitchens, municipal community facilities and tool libraries, school-district shared community kitchens, community land trusts (CLTs), maker spaces and arts-collective shared studios, cooperative-operated shared services, and public-agency equipment libraries — funded via USDA RD Community Facilities, USDA RCDG, USDA HFFI, USDA AMS LAMP food hubs, CDFI shared-asset financing, and foundation community-development grants."
tilth_clc_id: "TILTH-CLC-08"

# ---------------------------------------------------------------------------
# UNDERWRITING CRITERIA — what reviewers evaluate (per §18.10 starter content)
# ---------------------------------------------------------------------------
underwriting_criteria:
  - criterion: "shared_need"
    description: "Multiple users / member organizations have a documented need for the asset — not a single-applicant need being reframed as shared. Reviewers test: would the asset still be needed if any one named user withdrew? Single-party capture (one applicant uses ≥80% of capacity) flags the request as a de-facto sole-applicant ask using shared-asset framing."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

  - criterion: "user_base"
    description: "Member roster, signed commitment letters, or utilization forecast naming each user with their projected use (hours/year, units, cycles). USDA RCDG explicitly funds work that organizes producer + consumer cooperatives where multi-member benefit is documented. For new shared-use facilities, a demand study with named prospective users substitutes for an established roster."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.rd.usda.gov/programs-services/business-programs/rural-cooperative-development-grants"

  - criterion: "governance"
    description: "Formal decision structure for the shared asset — steering committee, member governance, board oversight, scheduling authority, dispute resolution. USDA RD Community Facilities loans require governance documentation showing the borrower has authority to operate and maintain the asset. Cooperatives need bylaws + patronage model; public agencies need authorizing resolution + operating ordinance; nonprofits need board minutes approving the asset acquisition."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.rd.usda.gov/programs-services/community-facilities/community-facilities-direct-loan-grant-program"

  - criterion: "access_policy"
    description: "Written, equitable, scheduled, transparent access rules. Reviewers expect the access policy to enumerate, at minimum: (i) booking rules (who reserves time, how far in advance, cancellation and no-show consequences); (ii) member-class structure and equity protections — member vs. non-member rates, founding-member vs. general-member windows, priority categories, AND the equity safeguards (one-member-one-vote on access disputes for cooperative-operated assets; capped-per-user-usage for foundation- and public-agency-operated assets); (iii) conflict-resolution process (who decides when two members both want the asset on the same day; appeals path); (iv) fee schedule and fee-waiver / sliding-scale tiers; (v) non-discrimination assurances for federally-funded assets (USDA RD CF requires civil-rights compliance); (vi) onboarding / training requirements before first use. Vague access rules (no enumerated components) read as a HIGH-severity red flag at underwriting."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

  - criterion: "utilization"
    description: "Forecast utilization vs design capacity for new assets, baseline utilization for existing assets being expanded. Reviewers look for credible demand evidence (waitlists, pilot bookings, signed reservations) rather than projections from spreadsheet alone. Underutilization risk is the modal failure mode for shared-asset projects per CDFI underwriting practice."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.cdfifund.gov/programs-training/programs/healthy-food-financing"

  - criterion: "maintenance"
    description: "Operating model showing who maintains the asset, on what schedule, funded by what revenue. Includes routine maintenance + scheduled servicing + repairs + insurance. The reserve fund question (next criterion) is separate from operating maintenance — both must be funded."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

  - criterion: "asset_control"
    description: "Prerequisite-level clarity on the legal entity holding title and the form of asset control. Reviewers cannot evaluate governance, access, utilization, maintenance, or cost-recovery downstream without first knowing who owns the asset. Applicants must surface, upfront: (a) the legal-structure category of the title-holder (501(c)(3) nonprofit / LLC / LLP / cooperative / municipality / school district / public-agency authority / community land trust / land bank / federally-recognized Tribe / faith-based 501(c)(3) / for-profit with public-benefit covenant); (b) the form of asset control — deed (fee simple), lease (with term ≥ useful life of the asset for capital purchases), recorded easement, equipment title, or shared-use-agreement-with-title-holder-consent; (c) any covenants, encumbrances, or reverter clauses. These legal-structure categories are illustrative of possible title-holders and are NOT tied to any specific CIC archetype — any eligible applicant may hold title regardless of their CIC classification; runtime CIC × CLC matching remains opportunity-driven. Federally-funded capital must vest with an eligible recipient (USDA RD CF: public bodies, nonprofits, federally-recognized Tribes). Ambiguous ownership (e.g., shared site without recorded easement; equipment purchased by one party but used by many without title transfer; expired or month-to-month lease for a capital improvement) is a frequent underwriting hold."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-XLII/subchapter-B/part-3570"

  - criterion: "cost_recovery"
    description: "Operating revenue model — user fees, member dues, operating subsidy from a parent organization, in-kind services. Reviewers compare projected operating revenue to projected operating expense; gap must be explained (subsidy source, fundraising plan, etc.). For CDFI-financed shared assets, debt service must be covered (DSCR ≥ 1.20 typical)."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.reinvestment.com/policy-solutions/sustainable-food-systems/"

  - criterion: "equitable_access"
    description: "No single-party capture — protections against the largest user crowding out smaller users. Acceptable mechanisms: scheduled allocation by member class, capped per-user usage, priority windows for under-served users, sliding-scale fees, transparent booking with audit trail. Reviewers ask: 'In year three, will the smallest member still be able to book the asset?'"
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://kresge.org/our-work/community-development/"

  - criterion: "replacement_reserve"
    description: "Asset depreciation + replacement schedule funded via reserve contributions. Typical convention: 5-15% of capital cost annualized, banked in a restricted reserve fund. USDA RD CF Direct Loan amortization assumes asset useful life; reserve adequacy is a covenant condition. Foundation funders increasingly require replacement-reserve plans for capital-asset grants. Absent a reserve, the project rebuilds the same shared-asset funding gap on a 10-20 year horizon."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.communityfoodservices.com/uploads/4/0/2/9/40292553/replacement_reserve_planning_for_shared_use_kitchens.pdf"

  - criterion: "community_member_benefit"
    description: "Downstream impact attribution — what the shared asset enables for members and the broader community that would not otherwise exist. For food hubs: producer income gains + buyer access; for shared-use kitchens: licensed-product launches + jobs; for tool libraries: avoided household tool purchases + skill development; for community facilities: service-population reach + service-cost reduction."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.ams.usda.gov/services/grants/rfsp"

# ---------------------------------------------------------------------------
# SCORING WEIGHT PATTERNS — funder-specific rubrics observed
# ---------------------------------------------------------------------------
# OQ-6 enforcement: qualitative-only weight tiers per Wave 2 operator pin.
# Per-rubric exact percentages vary cycle-to-cycle and are surfaced at Scout's
# fetchOpportunity step; card encodes the durable structural pattern.
scoring_weight_patterns:
  - rubric_example: "USDA RD Community Facilities Direct Loan / Grant (CF) — typical scoring structure"
    weights:
      eligibility_and_program_purpose: "HIGH"
      financial_feasibility_and_repayment: "HIGH"
      community_need_and_benefit: "HIGH"
      project_readiness: "MEDIUM"
      operations_and_maintenance: "MEDIUM"
    source_citation: "https://www.rd.usda.gov/programs-services/community-facilities/community-facilities-direct-loan-grant-program"
    note: "Qualitative tier (HIGH/MEDIUM/LOW) per OQ-6. CF Direct Loan emphasizes financial feasibility + repayment as a loan instrument; CF Grant (where partial-grant available, typically for low-population highly-distressed communities) shifts weight toward community need. Per-NOFO weights vary; see annual program notice."

  - rubric_example: "USDA Rural Cooperative Development Grants (RCDG) — typical scoring structure"
    weights:
      cooperative_development_focus: "HIGH"
      qualifications_of_personnel: "HIGH"
      potential_economic_impact: "HIGH"
      potential_for_serving_smaller_cooperatives: "MEDIUM"
      work_plan_budget: "HIGH"
    source_citation: "https://www.rd.usda.gov/programs-services/business-programs/rural-cooperative-development-grants"
    note: "Qualitative tier per OQ-6. RCDG funds Cooperative Development Centers that establish + operate shared-services cooperatives (a frequent shared-asset modality). Scoring rewards documented cooperative-development methodology and economic-impact projections."

  - rubric_example: "USDA AMS Local Agriculture Marketing Program (LAMP) — Regional Food System Partnerships (RFSP) sub-program — typical scoring structure"
    weights:
      partnership_and_coordination: "HIGH"
      project_design_and_workplan: "HIGH"
      community_benefit_and_equity: "MEDIUM"
      organizational_capacity: "MEDIUM"
      sustainability_post_grant: "MEDIUM"
    source_citation: "https://www.ams.usda.gov/services/grants/rfsp"
    note: "Qualitative tier per OQ-6. RFSP funds regional partnerships that include shared-infrastructure development (food hubs, aggregation facilities, shared cold storage). Scoring weights observable in the RFSP NOFO are illustrative — exact percentages vary by NOFO cycle. Per-NOFO weights confirmed at Scout fetchOpportunity."

  - rubric_example: "Foundation community-development capacity grants — typical anatomy across major national community-development foundation portfolios (specific funder names removed from binding field per Law 5 + Phase F 2026-05-16 cleanup; one canonical pattern source URL preserved below)"
    weights:
      community_need_and_engagement: "HIGH"
      organizational_capacity_and_governance: "HIGH"
      equity_and_access_design: "HIGH"
      financial_sustainability: "MEDIUM"
      learning_and_evaluation: "LOW"
    source_citation: "https://kresge.org/our-work/community-development/"
    note: "Qualitative tier per OQ-6. Foundation rubrics for shared-asset / community-facility grants commonly anchor on community engagement + governance + equity-of-access. Cited Kresge source establishes the typical foundation rubric anatomy but does NOT enumerate per-criterion tier assignments — the tier assignments are ILLUSTRATIVE patterns based on author qualitative judgment about typical foundation capital-grant rubric weighting, subject to Lessons Memory revision over 12+ CycleReceipts (per OQ-6 quantification threshold)."

  - rubric_example: "CDFI shared-asset financing underwriting — typical anatomy across major mission-aligned community lenders (specific CDFI names removed from binding field per Law 5 + Phase F 2026-05-16 cleanup)"
    weights:
      mission_alignment_and_community_impact: "HIGH"
      repayment_capacity_dscr: "HIGH"
      management_and_governance: "HIGH"
      collateral_and_site_control: "HIGH"
      construction_or_acquisition_readiness: "MEDIUM"
    source_citation: "https://www.reinvestment.com/policy-solutions/sustainable-food-systems/"
    note: "Qualitative tier per OQ-6. CDFI underwriting for shared-use food infrastructure (shared-use kitchens, food hubs, aggregation facilities) typically requires DSCR ≥ 1.20, 10-30% borrower equity, and mission-aligned community-benefit covenants. Cited Reinvestment Fund source establishes the structural pattern; per-deal weights vary by lender."

# ---------------------------------------------------------------------------
# EVIDENCE WEIGHTS — what reviewers look for
# ---------------------------------------------------------------------------
# §18.6 canonical shape: evidence_kind: {weight, rationale}.
# Card extends with optional source_citation per entry (Wave 1 OD-3
# convention from operating_capacity.yaml). Loader treats source_citation
# as additional metadata under "additionalProperties": true (schema line 93).
evidence_weights:
  user_member_commitments:
    weight: "HIGH"
    rationale: "Signed commitment letters from each prospective user / member naming projected use (hours, units, cycles) and willingness to pay user fees or dues. Strongest evidence of shared need; weakest framing is 'we surveyed potential users and 87% expressed interest' without commitments."
    source_citation: "https://www.rd.usda.gov/programs-services/business-programs/rural-cooperative-development-grants"

  governance_agreement:
    weight: "HIGH"
    rationale: "Formal document — bylaws, operating agreement, MOU, joint powers agreement, board resolution — establishing the decision authority for the shared asset. Names voting structure, dispute resolution, scheduling authority, fee-setting authority."
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

  access_policy:
    weight: "HIGH"
    rationale: "Written rules enumerating: booking rules + member-class structure-and-equity (differentiation tiers AND equity safeguards in one component) + conflict-resolution process + fee schedule (and fee-waiver / sliding-scale tiers) + non-discrimination assurances (federal) + onboarding / training requirements. Reviewers compare the policy as written against the equitable-access criterion — does the policy prevent single-party capture? Generic access policy that lists none of these components reads as 'vague access rules' (HIGH-severity red flag)."
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

  site_control:
    weight: "HIGH"
    rationale: "Deed, lease (with term ≥ useful life of capital improvements), easement, or equipment title. USDA RD CF Direct Loan requires evidence of site control before loan closing. Foundation capital grants typically require it before disbursement."
    source_citation: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-XLII/subchapter-B/part-3570"

  equipment_quote:
    weight: "HIGH"
    rationale: "For capital purchases — vendor quotes (typically three for federally-funded procurement), specifications, delivery timeline. Procurement rules under 2 CFR 200 require competitive bids above the small-purchase threshold."
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"

  utilization_forecast:
    weight: "HIGH"
    rationale: "Hour-by-hour or day-by-day projection of asset usage by named user / member class. For existing assets: baseline utilization history (booking logs, sign-in sheets) + projection of post-investment change."

  maintenance_budget:
    weight: "HIGH"
    rationale: "Annual operating + maintenance budget separated from capital budget. Includes utilities, insurance, repairs, custodian / operator labor, replenishables. Frequent failure mode: capital budget perfect, maintenance budget absent."
    source_citation: "https://www.communityfoodservices.com/uploads/4/0/2/9/40292553/replacement_reserve_planning_for_shared_use_kitchens.pdf"

  scheduling_policy:
    weight: "MEDIUM"
    rationale: "Booking system, conflict-resolution rules, cancellation policy, no-show consequences. Often deferred until post-award; reviewers want to see at least the framework even if the system itself is post-implementation."

  insurance:
    weight: "MEDIUM"
    rationale: "Commercial property + general liability + (where applicable) product liability for shared-use kitchens, professional liability for technical-service shared assets. Carrier letter or insurance binder; for federal financing, lender often holds the certificate."

  replacement_reserve_documentation:
    weight: "HIGH"
    rationale: "Multi-year reserve schedule showing annual contribution rate (typically 5-15% of capital cost annualized — industry-modal, not regulatory) and projected reserve balance against the major-replacement schedule. Reviewers test whether the reserve will cover the most-expensive single replacement (e.g., HVAC, walk-in cooler, kiln, vehicle, roof) at scheduled end-of-life. Weight upgraded from MEDIUM to HIGH at Cycle-1 fold-in to match §18.10 paragraph-8 emphasis ('unfunded maintenance, ignored replacement cost' as red flag) and card's own common_red_flags.ignored_replacement_cost (HIGH). Without a documented reserve, the project rebuilds the same shared-asset funding gap on a 10-20 year horizon, which reviewers increasingly read as a sustainability defect."
    source_citation: "https://www.communityfoodservices.com/uploads/4/0/2/9/40292553/replacement_reserve_planning_for_shared_use_kitchens.pdf"

  shared_use_agreement_template:
    weight: "HIGH"
    rationale: "Template agreement that each user / member signs to access the asset — covers terms of use, fees, liability, conduct, equipment-care obligations, dispute resolution. For shared-use kitchens, this is typically reviewed against state retail food code + lender requirements."

  demand_study:
    weight: "MEDIUM"
    rationale: "Independent or commissioned market analysis showing demand for the shared asset in the service area. Strongest for new-asset projects in service areas without existing comparable infrastructure. Customer-survey data is supporting; demand-study commissioned to a third party with published methodology is load-bearing."

# ---------------------------------------------------------------------------
# COMMON APPLICATION FORMS
# ---------------------------------------------------------------------------
common_application_forms:
  - form_id: "SF-424 (Application for Federal Assistance)"
    form_version: "OMB Approved"
    required_for: "All federal Shared Assets grants (USDA RD, USDA AMS, EPA, EDA, HUD shared-asset programs)"
    source: "https://www.grants.gov/forms/sf-424-family.html"

  - form_id: "SF-424A (Budget Information — Non-Construction)"
    form_version: "OMB Approved"
    required_for: "Non-construction shared-asset grants (equipment, planning, capacity)"
    source: "https://www.grants.gov/forms/sf-424-family.html"

  - form_id: "SF-424C (Budget Information — Construction)"
    form_version: "OMB Approved"
    required_for: "USDA RD CF construction-financed shared-asset projects"
    source: "https://www.grants.gov/forms/sf-424-family.html"

  - form_id: "SF-424D (Assurances — Construction Programs)"
    form_version: "OMB Approved"
    required_for: "USDA RD CF construction-financed shared-asset projects"
    source: "https://www.grants.gov/forms/sf-424-family.html"

  - form_id: "USDA RD CF Direct Loan/Grant Application Package"
    form_version: "Per FY program notice — RD Apply portal"
    required_for: "USDA RD Community Facilities Direct Loan or Grant"
    source: "https://www.rd.usda.gov/programs-services/community-facilities/community-facilities-direct-loan-grant-program"
    note: "Application via RD Apply (the agency's online intake) or paper submission to the USDA RD State Office. Packet includes environmental assessment, engineering report or feasibility study, evidence of site control, governance documentation, financial statements."

  - form_id: "USDA AMS LAMP application (FMPP / LFPP / RFSP / TOPP)"
    form_version: "Per FY NOFO via Grants.gov / Workspace"
    required_for: "USDA AMS Local Agriculture Marketing Program shared-infrastructure projects"
    source: "https://www.ams.usda.gov/services/grants/lamp"
    note: "Sub-programs: Farmers Market Promotion Program (FMPP), Local Food Promotion Program (LFPP), Regional Food System Partnerships (RFSP), Transition to Organic Partnership Program (TOPP). Each NOFO publishes its own application packet through Grants.gov."

  - form_id: "USDA RCDG application"
    form_version: "Per FY NOFO via Grants.gov / Workspace"
    required_for: "USDA Rural Cooperative Development Grants (Cooperative Development Centers funding shared-services cooperatives)"
    source: "https://www.rd.usda.gov/programs-services/business-programs/rural-cooperative-development-grants"

  - form_id: "USDA NIFA Community Food Projects (CFP) application"
    form_version: "Per FY RFA via Grants.gov / Workspace"
    required_for: "USDA NIFA Community Food Projects (community-controlled food systems infrastructure)"
    source: "https://www.nifa.usda.gov/grants/funding-opportunities/community-food-projects-competitive-grant-program"

  - form_id: "Foundation portals (Foundant GLM, Submittable, Fluxx)"
    form_version: "Platform-hosted, per-funder"
    required_for: "Foundation community-development + shared-asset capital grants"
    source: "https://www.plinth.org.uk/en-US/complete-guide/grant-management-systems-compared"
    note: "Surdna, Knight, Kresge, regional / community foundations typically host shared-asset capital applications on these platforms with funder-specific narrative templates."

  - form_id: "CDFI lender application packet"
    form_version: "Per-lender — Reinvestment Fund, Capital Impact Partners, regional CDFIs vary"
    required_for: "Debt-financed shared-asset projects (shared-use kitchens, food hubs, community facilities)"
    source: "https://www.reinvestment.com/"
    note: "CDFI lender packets typically require pro forma financials, three-year operating projections, DSCR analysis, governance documentation, site control, equipment quotes, and borrower equity verification."

  - form_id: "State community-development authority applications"
    form_version: "Varies by state"
    required_for: "State-level capital + shared-infrastructure grants (e.g., PA DCED Keystone Communities, NY ESD, CA Strategic Growth Council)"
    source: "https://dced.pa.gov/programs/keystone-communities-program-kcp/"

# ---------------------------------------------------------------------------
# NARRATIVE SECTION PATTERNS
# ---------------------------------------------------------------------------
narrative_section_patterns:
  - section_name: "Shared Need (with Multi-User Demonstration)"
    typical_word_count: "500-1000"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"
    note: "The single most weight-bearing section. Reviewers look for evidence that multiple users genuinely need the asset; absent multi-user demonstration the request is interpreted as a single-applicant ask in shared-asset framing."

  - section_name: "Asset Description"
    typical_word_count: "300-600"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"
    note: "Specifications, capacity, dimensions, components, condition (for existing assets), upgrade scope (for renovation), site location, regulatory classification."

  - section_name: "User Base + Commitments"
    typical_word_count: "500-1000"
    source_citation: "https://www.rd.usda.gov/programs-services/business-programs/rural-cooperative-development-grants"
    note: "Each named user / member with role, commitment level (hours/year, dues, fees), and supporting attachment (signed letter, MOU, board resolution)."

  - section_name: "Governance + Decision Structure"
    typical_word_count: "300-600"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"
    note: "Operating entity (cooperative, nonprofit, public agency, joint powers authority); voting structure; scheduling authority; dispute resolution; fee-setting authority; bylaws or operating agreement reference."

  - section_name: "Access + Equity Policy"
    typical_word_count: "300-500"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"
    note: "Written rules preventing single-party capture; non-discrimination assurances (federal); member-class equity (cooperative); sliding-scale or capped-usage protections."

  - section_name: "Operations Plan"
    typical_word_count: "500-1000"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"
    note: "Day-to-day operating model — staffing, hours, booking system, key control, on-site supervision, replenishables, training for new users, opening/closing procedures."

  - section_name: "Maintenance + Replacement Reserve"
    typical_word_count: "300-600"
    source_citation: "https://www.communityfoodservices.com/uploads/4/0/2/9/40292553/replacement_reserve_planning_for_shared_use_kitchens.pdf"
    note: "Routine maintenance schedule + funded budget; major-replacement schedule + reserve fund contribution rate (typically 5-15% of capital cost annualized) + reserve balance projection against scheduled replacements."

  - section_name: "Budget + Capital Cost"
    typical_word_count: "500-1000"
    source_citation: "https://www.tgci.com/blog/2020/08/understanding-capacity-building-grant-proposals"
    note: "Capital cost (real estate, construction, equipment, soft costs) + operating cost (utilities, insurance, maintenance, staffing) + reserve contribution + match documentation. Each line tied to budget-justification narrative."

  - section_name: "Sustainability + Cost Recovery"
    typical_word_count: "300-600"
    source_citation: "https://nlctb.org/featured/how-to-respond-to-sustainability-questions-in-grant-proposals/"
    note: "Operating revenue model — user fees, member dues, operating subsidy, in-kind. Reviewers compare projected operating revenue to projected operating expense; gap requires explanation."

  - section_name: "Community / Member Benefit"
    typical_word_count: "300-600"
    source_citation: "https://www.ams.usda.gov/services/grants/rfsp"
    note: "Downstream impact attribution — what the shared asset enables for members and the broader community that would not otherwise exist. Quantified where possible."

