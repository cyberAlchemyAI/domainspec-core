# ---------------------------------------------------------------------------
# COMMON RED FLAGS — adversarial probes
# ---------------------------------------------------------------------------
common_red_flags:
  - flag: "single_party_capture_of_shared_asset"
    severity: "HIGH"
    red_team_probe: "If the largest projected user withdrew, would the remaining users still need this asset at this scale? If projected utilization concentrates 80%+ on one party, what makes this 'shared'?"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

  - flag: "unclear_governance"
    severity: "HIGH"
    red_team_probe: "When two members both want the asset on the same day, who decides? Where is the dispute-resolution clause? Who has fee-setting authority? Show the bylaws / MOU / authorizing resolution language."

  - flag: "vague_access_rules"
    severity: "HIGH"
    red_team_probe: "Where is the written access policy? What is the booking process? What is the cancellation policy? What protects smaller users from being crowded out by larger users?"

  - flag: "unfunded_maintenance"
    severity: "HIGH"
    red_team_probe: "The capital budget is complete. Where is the operating + maintenance budget? Who pays for utilities, insurance, repairs, replenishables in year two when the grant has ended?"
    source_citation: "https://www.communityfoodservices.com/uploads/4/0/2/9/40292553/replacement_reserve_planning_for_shared_use_kitchens.pdf"

  - flag: "assumed_utilization_no_demand_evidence"
    severity: "HIGH"
    red_team_probe: "What evidence supports the projected utilization? Waitlists? Pilot bookings? Demand study with named methodology? 'Great need exists' is not evidence."

  - flag: "no_scheduling_or_conflict_process"
    severity: "MEDIUM"
    red_team_probe: "What system handles bookings — paper, software, named person? What happens when two users book the same time? What are the consequences for no-shows or damage?"

  - flag: "unresolved_site_control"
    severity: "HIGH"
    red_team_probe: "Where is the deed, lease, easement, or equipment title? If lease, does the term extend at least the useful life of the capital improvements? Does the lessor have authority to consent to the federally-financed improvements?"
    source_citation: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-XLII/subchapter-B/part-3570"

  - flag: "ignored_replacement_cost"
    severity: "HIGH"
    red_team_probe: "What is the useful life of the most expensive asset component (HVAC, walk-in cooler, kiln, vehicle)? When does it need replacement? What replacement-reserve contribution rate funds that replacement?"

  - flag: "no_insurance_plan"
    severity: "MEDIUM"
    red_team_probe: "What commercial property + general liability + (where applicable) product liability coverage is in place? Which carrier? Has the carrier confirmed willingness to cover a shared-use facility / equipment library / shared-use kitchen?"

  - flag: "missing_user_member_commitments"
    severity: "HIGH"
    red_team_probe: "Where are the signed commitment letters from each named user? What level of commitment — hours, dues, fees? If commitments are only verbal at application time, what plan binds them post-award?"

  - flag: "single_applicant_shaped_as_shared_asset"
    severity: "HIGH"
    red_team_probe: "Who currently uses similar capacity owned by the lead applicant? If the lead applicant has substantial existing capacity, why does this need to be a shared asset rather than a capacity-expansion grant for the lead applicant under a different CLC (Operating Capacity, Market Access)? What changes for non-lead members vs. status quo?"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

  - flag: "commons_framing_in_conservative_federal_context"
    severity: "MEDIUM"
    red_team_probe: "Is the proposal using 'commons' / 'community wealth' / 'collective ownership' language in a federal NOFO whose reviewer pool may read these terms as anti-property-rights? Has the dialect been code-switched (with applicant approval) to 'shared infrastructure' / 'cooperative facility' / 'community facility'?"

# ---------------------------------------------------------------------------
# REPORTING REQUIREMENTS TYPICAL
# ---------------------------------------------------------------------------
reporting_requirements_typical:
  performance_reporting:
    frequency: "semi_annual"
    content_required:
      - "Construction or acquisition milestones (for capital projects)"
      - "Asset commissioning + first-use date"
      - "User / member onboarding count"
      - "Utilization (hours used / bookings / units processed) vs. projected utilization"
      - "Access equity indicators (distribution of usage across members)"
      - "Maintenance log + downtime summary"
      - "Community / member benefit outcomes against application projections"
      - "Variance from original timeline + rationale"
  financial_reporting:
    frequency: "quarterly"
    content_required:
      - "Capital expenditure by budget category (during construction / acquisition)"
      - "Operating revenue + expense (post-commissioning)"
      - "Reserve fund contributions + balance"
      - "Match expenditure documentation"
      - "Burn rate vs. timeline + variance explanation"
  final_report_required: true
  ongoing_reporting_for_term_of_loan: "USDA RD CF Direct Loans require annual financial reporting + covenant compliance for the full amortization period (typically 30-40 years for facility loans)."
  source_citation: "https://www.rd.usda.gov/programs-services/community-facilities/community-facilities-direct-loan-grant-program"
  note: "USDA RD CF: semi-annual + annual + final + ongoing for term of loan. USDA AMS LAMP: annual + final. USDA RCDG: annual + final. Foundation capital grants: per agreement, modal pattern is semi-annual + final for grant period plus a one-time follow-up at +12 / +24 months. CDFI loan reporting: covenant testing per loan agreement (often quarterly or annually)."

# ---------------------------------------------------------------------------
# COMPLIANCE OBLIGATIONS
# ---------------------------------------------------------------------------
compliance_obligations:
  - framework: "2 CFR Part 200 (Uniform Guidance)"
    applicability: "All federally-financed Shared Assets projects"
    typical_filings:
      - "SF-425 Federal Financial Report"
      - "SF-PPR Performance Progress Report"
      - "Single Audit if federal expenditures ≥ $750,000/year (rising to $1M under 2024 update)"
      - "Procurement records under §200.317-326 for any sub-contracts or equipment purchases"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"

  - framework: "USDA RD Community Facilities program regulations (7 CFR Part 3570)"
    applicability: "USDA RD CF Direct Loan or Grant projects"
    typical_filings:
      - "Environmental review (RD Instruction 1970)"
      - "Civil rights compliance (Form RD 400-1, 400-4)"
      - "Loan covenants — annual financial statements, insurance certificates, reserve documentation, debt-service coverage"
      - "Site control documentation at closing"
    source_citation: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-XLII/subchapter-B/part-3570"

  - framework: "USDA AMS LAMP regulations (7 CFR Part 1463)"
    applicability: "USDA AMS LAMP-financed shared-infrastructure projects"
    typical_filings:
      - "Match documentation"
      - "Annual + final performance + financial reports"
      - "Project-period extension requests where applicable"
    source_citation: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-IX/part-1463"

  - framework: "Single Audit Act"
    applicability: "Recipients with federal expenditures ≥ $750,000/year (rising to $1M under 2024 update)"
    typical_filings:
      - "Independent auditor report under 2 CFR 200 Subpart F"
      - "Schedule of Expenditures of Federal Awards (SEFA)"
      - "Audit submission to Federal Audit Clearinghouse"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-F"

  - framework: "State cooperative or LLC governance"
    applicability: "Cooperative- or LLC-operated shared assets"
    typical_filings:
      - "Annual filing with state corporations bureau"
      - "Member meeting minutes + voting records"
      - "Bylaws amendment filings where applicable"

  - framework: "Commercial property + liability insurance"
    applicability: "All shared-asset projects (lender / funder requirement + risk management)"
    typical_filings:
      - "Insurance binder / certificate at closing or grant disbursement"
      - "Annual renewal certificates"
      - "Loss reporting per carrier requirements"

  - framework: "Americans with Disabilities Act (ADA)"
    applicability: "Public-facing shared facilities (community facilities, food hubs with public access, shared-use kitchens with retail component)"
    typical_filings:
      - "ADA accessibility design certification at construction"
      - "Self-assessment + remediation plan for existing facilities undergoing alteration"
    source_citation: "https://www.ada.gov/"

  - framework: "FSMA Produce Safety Rule + Preventive Controls Rule + state retail food code"
    applicability: "Shared-use kitchens, food hubs, aggregation facilities handling produce or processed food"
    typical_filings:
      - "Food Safety Plan (FSMA Preventive Controls)"
      - "Produce Safety records (where applicable)"
      - "State / local retail food permit"
      - "Shared-use kitchen user-onboarding food-safety training records"
    source_citation: "https://www.fda.gov/food/food-safety-modernization-act-fsma"

  - framework: "State cottage food laws"
    applicability: "Shared-use kitchens producing cottage-food-eligible products under state exemptions"
    typical_filings:
      - "Cottage-food registration per state requirement"
      - "Product-labeling compliance"
    note: "Cottage food law eligibility varies widely by state; shared-use kitchen operators often need to differentiate cottage-food-eligible production from licensed-product production at the operational level."

  - framework: "Municipal zoning + permitting"
    applicability: "All physical-facility shared-asset projects"
    typical_filings:
      - "Use permit / conditional use permit"
      - "Building permit + certificate of occupancy"
      - "Health department permit (food facilities)"
      - "Fire marshal approval"

  - framework: "Davis-Bacon Act"
    applicability: "Federally-financed construction projects on public-purpose shared assets (USDA RD CF construction)"
    typical_filings:
      - "Certified payroll records (WH-347)"
      - "Wage determination compliance"
      - "Apprenticeship + journeyman ratio documentation"
    source_citation: "https://www.dol.gov/agencies/whd/government-contracts/construction"

  - framework: "National Environmental Policy Act (NEPA)"
    applicability: "Federally-financed construction projects requiring environmental review"
    typical_filings:
      - "Categorical exclusion documentation OR"
      - "Environmental Assessment (EA) OR"
      - "Environmental Impact Statement (EIS) per project class"
    source_citation: "https://www.ecfr.gov/current/title-40/chapter-V/subchapter-A/part-1500"

# ---------------------------------------------------------------------------
# COMMITMENT TRACKING PATTERN — Report Generator (v0.2) feed
# ---------------------------------------------------------------------------
commitment_tracking_pattern:
  typical_commitments_extracted:
    - commitment_type: "users_served"
      measurement_method: "count of distinct users / members + onboarding date + active-status flag"
    - commitment_type: "utilization_hours"
      measurement_method: "booked + actual hours of asset use per reporting period; baseline + projected + actual"
    - commitment_type: "bookings_count_and_diversity"
      measurement_method: "booking count + count of distinct users booking + distribution metric (Gini-like or quartile share) capturing whether usage concentrated on few members or distributed"
    - commitment_type: "maintenance_logs_completed"
      measurement_method: "count + dates of scheduled maintenance entries logged against the asset's maintenance schedule"
    - commitment_type: "downtime_planned_and_unplanned"
      measurement_method: "hours of asset unavailability per period + categorization (planned maintenance vs. unplanned failure) + mean-time-to-repair for unplanned events"
    - commitment_type: "cost_recovery_revenue_vs_expense"
      measurement_method: "operating revenue (user fees + member dues + subsidy) ÷ operating expense per period; ratio + per-line breakdown"
    - commitment_type: "access_equity_distribution"
      measurement_method: "Uniquely Shared Assets — no other CLC reports access-equity. Lorenz curve / Gini coefficient (or simpler quartile share, smallest-user-share, top-decile-concentration) of usage hours across the user base; tracks whether the smallest members continue accessing the asset over the reporting period. Report Generator surfaces this as a distinct reporting axis vs. vanity 'users served' metrics. Reporting requirements typical (line 486) include 'Access equity indicators (distribution of usage across members)' as a required performance-reporting element. Decline in smallest-user-share over time is an early-warning indicator that access-policy enforcement is failing in practice."
    - commitment_type: "repairs_completed"
      measurement_method: "count + cost + downtime per repair event; cumulative cost per asset component vs. budget"
    - commitment_type: "replacement_reserve_contributions"
      measurement_method: "dollar amount contributed to reserve per period + cumulative reserve balance + projected balance against scheduled major-replacement events"
    - commitment_type: "community_benefit_outcomes"
      measurement_method: "downstream impact attributable to the shared asset — e.g., licensed products launched (shared-use kitchens), producer income gains (food hubs), avoided household tool purchases (tool libraries), service-population reached (community facilities) — each with named measurement method and baseline"
  proposal_commitments_yaml_extension:
    # CLC-namespaced field per Wave 1 F6 fold-in convention. Downstream §11
    # AWARD_INGEST + §14 Report Generator read this field by exact match.
    field_name: "clc_shared_assets_commitments"
  source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-08"

