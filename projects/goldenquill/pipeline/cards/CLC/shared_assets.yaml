    - "insurance"
    - "maintenance_labor_and_supplies"
    - "operations_staffing"
    - "training_and_user_onboarding"
    - "replacement_reserve_contributions"
    - "other_direct"
  indirect_cost_treatment: "Federal capital grants (USDA RD CF) generally do not honor indirect rates on construction lines; soft-cost lines may carry indirect per federally negotiated rate or 10% de minimis MTDC under 2 CFR 200. USDA AMS LAMP and similar program-grants honor the recipient's federally negotiated rate or de minimis. Foundation capital grants typically cap or exclude indirect. Operator must check each NOFO."
  match_requirements_typical: "USDA RD CF Direct Loan: no match required (loan instrument). USDA RD CF Grant: match varies by program notice — partial-grant tier typically requires 50-75% match. USDA AMS LAMP (FMPP/LFPP/RFSP): typically 25% non-federal match required. CDFI shared-asset financing: typically 10-30% borrower equity. Foundation capital grants: match expectations vary widely; some require 1:1 match for capital, others provide 100% capital with no match expectation."
  source_citation: "https://www.rd.usda.gov/programs-services/community-facilities/community-facilities-direct-loan-grant-program"

# ---------------------------------------------------------------------------
# REVIEWER PROFILE TYPICAL
# ---------------------------------------------------------------------------
reviewer_profile_typical:
  reviewer_types:
    - "community_development_reviewer"
    - "cooperative_development_reviewer"
    - "facilities_reviewer_engineering_cost_estimation"
    - "foundation_program_officer_community_development"
    - "public_agency_program_officer"
    - "cdfi_underwriter"
    - "usda_rd_state_office_specialist"
    - "usda_ams_grants_specialist"
  reviewer_priorities:
    - "Is the need genuinely shared, or is this a single-applicant ask in shared-asset framing?"
    - "Is governance formal enough to absorb member disputes and access conflicts? (Cooperative-development reviewers read for cooperative-methodology and patronage discipline; public-agency reviewers read for authorizing-resolution and authority-to-operate; foundation reviewers read for community engagement and equity-of-governance.)"
    - "Does the access policy as written enumerate the standard components (booking + member-class + conflict-resolution + fee tiers + non-discrimination) and prevent single-party capture? (Public-agency reviewers focus on civil-rights compliance and procurement; foundation reviewers focus on equity-of-access; cooperative-development reviewers focus on member-class-equity.)"
    - "Is utilization grounded in demand evidence (waitlists, pilot bookings, commissioned demand study), or is it spreadsheet projection?"
    - "Is the maintenance budget funded — separately from the capital budget?"
    - "Is there a replacement reserve, or will this asset rebuild the same funding gap in 10-20 years?"
    - "Does the operating entity have authority to operate and maintain the asset? (Public-agency reviewers read for authorizing ordinance / resolution; foundation reviewers read for board approval and operational capacity; CDFI underwriters read for DSCR and management depth.)"
    - "Is site control resolved — deed, lease with adequate term, easement, equipment title? Has the legal-entity title-holder been clearly named upfront?"
    - "(Reviewer-type dialect cue) Foundation program officers in community development weight community-engagement + equity + governance most. Public-agency program officers weight authority-to-operate + civil-rights + procurement-compliance most. Cooperative-development reviewers weight cooperative-methodology + member-economic-impact most. CDFI underwriters weight DSCR + collateral + management-and-governance most. Facilities/engineering reviewers weight construction-readiness + cost-estimation + replacement-reserve-adequacy most. USDA RD CF state-office specialists weight site-control + financial-feasibility + community-need-and-benefit most."
  common_red_flags_from_reviewer_pov:
    - "Single dominant member uses ≥80% of projected capacity — de-facto sole-applicant ask"
    - "Capital budget complete but operating + maintenance budget absent or thin"
    - "No replacement reserve — asset will need re-funding at end of useful life"
    - "Vague access rules — no booking process, no conflict-resolution mechanism"
    - "Member commitments described but not attached as signed letters / MOUs"
    - "Site control unresolved — verbal landlord agreement, expired lease, no easement"
    - "Demand asserted ('there is great need') without evidence (waitlists, pilot bookings, demand study)"
    - "Insurance plan absent or named without carrier confirmation"
    - "Governance described informally ('our group decides together') without bylaws / MOU / authorizing resolution"
  source_citation: "https://www.athensfoundation.org/5-red-flags-that-could-hurt-your-grant-application"

