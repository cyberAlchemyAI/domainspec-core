  disqualifier_terms:
    - term: "religious instruction"
      reason: "Most federal education programs (Title I, IV, EIR, 21st CCLC) carry First Amendment Establishment-Clause constraints on direct funding of religious instruction. Faith-based organizations CAN apply for secular activities but cannot use funds for religious content. Verify per RFA + Equal Treatment regs (34 CFR 75/76 appendix)."
    - term: "for-profit only"
      reason: "Most USDE programs require LEA, IHE, nonprofit, or state agency applicants. For-profit education-services vendors may serve as sub-grantees but typically not primary recipients. Verify eligibility per program."
    - term: "adult-only programming"
      reason: "If applicant's beneficiary roster is fully adults (e.g., adult literacy with no K-12 component), this CIC may mis-fit; consider Public Agency or workforce-development framings. AEFLA (adult education) is its own statutory category."
    - term: "individual research only"
      reason: "Education-grant scope is typically institutional (LEA / IHE / nonprofit). Individual researchers without institutional affiliation generally cannot directly apply (except certain NSF career awards)."
    - term: "out-of-school youth without LEA partner"
      reason: "Many K-12 funding pathways require LEA partnership or sub-recipient relationship; serving out-of-school youth without an LEA partner often surfaces a CIC mis-fit. Consider DOL YouthBuild / WIOA Title I Youth (workforce pathway) instead."
    - term: "K-12 charter without authorizer-approval status"
      reason: "USDE Charter Schools Program (CSP) + most state-pass-through K-12 funding requires active authorization status from a recognized charter authorizer. Pre-authorization applicants generally ineligible."
    - term: "international beneficiary scope"
      reason: "USDE programs (Title I / IV / VI / EIR / GEAR UP / TRIO / IDEA-funded) require U.S.-based beneficiary scope; international student / school programming requires distinct funding pathway (e.g., USDE OPE international education programs, USAID, State Department ECA)."

# ─────────────────────────────────────────────────────────────────────────────
# Evidence signals — Scribe consumption per §18.8
#
# ESSA evidence-tier posture: ESSA § 8101(21) defines four evidence tiers —
# strong (Tier 1, RCT) / moderate (Tier 2, QED) / promising (Tier 3) /
# demonstrates rationale (Tier 4, logic-model + research base). Tier 4 is a
# fully valid evidence posture for most USDE programs that admit any of the
# four tiers (Title I, Title IV-A, Title IV-B / 21st CCLC, Title II), and
# many state pass-through programs. Tier 1 / Tier 2 are required ONLY when
# the active RFA explicitly requires moderate or strong evidence (e.g., EIR
# Mid-Phase / Expansion tiers; some IES programs). The card supports
# the full Tier 4 → Tier 1 spectrum; applicants without RCT-tier evidence
# should NOT be redirected away from competitive programs that admit
# demonstrates-rationale. Operator + Scribe verify the active RFA's
# evidence-tier floor before composing the evaluation_plan narrative.
# ─────────────────────────────────────────────────────────────────────────────
evidence_signals:
  - kind: "enrollment_report"
    source_pattern: "State-collected enrollment counts (federal-fiscal-year October child count; state SIS extract); disaggregated by grade band, race/ethnicity, FRPL eligibility, EL status, IDEA status"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDE ED Facts / EDFacts Data Groups; state SIS"
  - kind: "attendance_records"
    source_pattern: "Daily / monthly attendance rates; chronic-absenteeism rate; participation logs for OST programs (sign-in / sign-out)"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "ESSA chronic-absenteeism indicator; 21st CCLC GPRA participation measures"
  - kind: "assessment_data"
    source_pattern: "State summative assessments; district common assessments; pre/post program-specific assessments with named instrument + psychometric reference"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "ESSA Title I assessment requirement; ESSA evidence tiers § 8101(21) require pre/post for moderate+ evidence"
  - kind: "curriculum_documentation"
    source_pattern: "Adopted curriculum name + publisher + alignment-to-standards map; scope-and-sequence; instructional minutes"
    weight: "MEDIUM"
    freshness_tolerance_days: 730
    source_citation: "USDE EIR + GEAR UP + Magnet Schools narrative expectations"
  - kind: "staff_credentials"
    source_pattern: "State certification status for teaching staff; bachelor's degree + relevant experience for paraprofessionals + OST staff; background-check completion per state code"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "ESSA highly-qualified-teacher residue; state OST staff regs (e.g., PA Act 153 background checks)"
  - kind: "school_partnership_agreement"
    source_pattern: "Signed MOU with LEA naming target schools + grade levels + access terms + data-sharing scope + FERPA agreement"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "21st CCLC + EIR + GEAR UP partnership requirements; FERPA 34 CFR 99"
  - kind: "evaluation_plan"
    source_pattern: "External or internal evaluator named with biosketch; research questions; design (RCT / QED / single-case / pre-post); instrument list; analysis plan; reporting timeline"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "ESSA evidence-tier requirements; EIR external-evaluator-required component"
  - kind: "privacy_protocols"
    source_pattern: "FERPA-compliant data-sharing agreement; PPRA-compliant survey protocols; parental-consent forms; COPPA-compliant online-tool review"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "FERPA 34 CFR 99; PPRA 20 USC 1232h; COPPA 16 CFR 312"
  - kind: "partner_letter_of_commitment"
    source_pattern: "LEA superintendent / principal / IHE-PI / community partner signed letter naming role, contribution (hours / space / data / staff time), term"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "EIR / GEAR UP / 21st CCLC / Magnet Schools partnership-evidence expectations"
  - kind: "logic_model_or_theory_of_change"
    source_pattern: "Visual logic model: inputs → activities → outputs → short / medium / long-term outcomes; references to evidence tier(s)"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "EIR + i3-legacy logic-model expectation; USDE proposal-guidance template"
  - kind: "prior_award_performance"
    source_pattern: "Past-performance evidence: prior federal awards + final report excerpts + impact data; audit-clean record"
    weight: "MEDIUM"
    freshness_tolerance_days: 1095
    source_citation: "USDE selection criterion — Quality of Project Personnel + Adequacy of Resources"
  - kind: "dosage_documentation"
    source_pattern: "Per-participant contact hours / weeks / total dose; sufficient-dose argument tied to evidence base"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "21st CCLC Performance Measures (participation thresholds); IES What Works Clearinghouse dosage standards"
  - kind: "match_or_indirect_documentation"
    source_pattern: "Cash + in-kind match commitments by source; sustained-funding plan beyond grant; indirect-cost rate agreement (NICRA) for IHE/nonprofit"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "Various USDE programs require match or matching-supplementary not supplanting; 34 CFR 75.564 indirect-cost rules"
  - kind: "english_learner_services_dosage"
    source_pattern: |
      EL services dosage per Title III: ESL / ELD / SIOP / sheltered-content
      instruction minutes per week; per-student EL plan documentation;
      qualified-EL-teacher credential; exit criteria; bilingual paraprofessional
      documentation if applicable.
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "ESEA Title III + 34 CFR 200.24–200.27 + ACCESS for ELLs assessment framework (WIDA Consortium)"
  - kind: "mckinney_vento_identification_and_services"
    source_pattern: |
      LEA McKinney-Vento liaison designation; identification protocol;
      immediate-enrollment + transportation-provision documentation; services
      tracking; per-pupil count + disaggregation reporting.
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "McKinney-Vento Homeless Assistance Act + 42 USC § 11431 et seq."
  - kind: "idea_part_b_or_c_compliance_documentation"
    source_pattern: |
      IEP / IFSP samples (de-identified); FAPE / LRE compliance narrative;
      Section 504 plan templates; maintenance-of-effort documentation;
      supplement-not-supplant compliance memo.
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "IDEA + 34 CFR Part 300 (Part B) + 34 CFR Part 303 (Part C)"
  - kind: "cipa_internet_safety_compliance"
    source_pattern: |
      Internet-safety policy on file; Technology Protection Measure (TPM)
      documentation; public-notice / hearing record for policy adoption.
    weight: "MEDIUM"
    freshness_tolerance_days: 730
    source_citation: "Children's Internet Protection Act (CIPA) 47 USC § 254(h)(5) + 47 CFR 54.520"
  - kind: "safeguarding_portfolio_completeness"
    source_pattern: |
      Designated child-protection officer name + role; background-check
      completion records for all adult staff + volunteers with student
      contact; state-specific clearance documentation (e.g., PA Act 153 of
      2014 cited as example; equivalent in CA / NY / TX / IL / FL);
      mandated-reporter training completion logs; transportation /
      supervision protocols.
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "State-specific child-protection statutes (PA Act 153 of 2014; equivalent state codes in CA / NY / TX / IL / FL)"

# ─────────────────────────────────────────────────────────────────────────────
# KFR fact classes — Intake / Logician consumption
# ─────────────────────────────────────────────────────────────────────────────
kfr_fact_classes:
  - fact_class: "enrollment"
    description: "Total students served — applicant-level (district/CMO/school/program); current and prior 2-3 years."
    typical_provenance: "State SIS extract; EDFacts; school report card"
  - fact_class: "grade_bands_served"
    description: "Grade-level scope (PreK / K-5 / 6-8 / 9-12 / postsecondary)."
    typical_provenance: "Program design doc; SIS extract"
  - fact_class: "demographics_disaggregated"
    description: "Race/ethnicity, FRPL eligibility, EL status, IDEA status, gender (biological), age — disaggregated for need + equity analysis. State-level data uses USDE-required race/ethnicity categories."
    typical_provenance: "EDFacts; state report card; district SIS"
  - fact_class: "title_i_status"
    description: "Schoolwide vs. targeted-assistance Title I designation; FRPL percentage; CSI/TSI school-improvement designation."
    typical_provenance: "State Title I determinations; school report card"
  - fact_class: "ferpa_relevance"
    description: "Personally-identifiable-information categories the project will collect/access; existing FERPA agreement with LEA(s); IRB or equivalent review status if research."
    typical_provenance: "Signed FERPA agreement; IRB approval letter; data-sharing MOU"
  - fact_class: "curriculum_in_use"
    description: "Curriculum/program name + publisher + version + alignment-to-standards documentation; EBI evidence-tier classification if applicable."
    typical_provenance: "Adoption record; publisher documentation; WWC review"
  - fact_class: "instructional_hours_or_dosage"
    description: "Weekly / monthly / total program contact hours per participant; comparison to evidence-base dosage."
    typical_provenance: "Schedule; program design doc; sign-in logs"
  - fact_class: "staff_credentials"
    description: "Teaching staff (certified / not certified / temporary), paraprofessional credentials, OST staff backgrounds, supervisor-to-staff ratio."
    typical_provenance: "State certification database; HR file; background-check completion record"
  - fact_class: "partner_schools_and_LEAs"
    description: "Named partner LEAs / schools / IHEs / CBOs with role + access scope + signed MOU."
    typical_provenance: "Signed MOU; LOC roster"
  - fact_class: "evaluation_design"
    description: "Evaluator (internal/external + name + qualifications); design tier (RCT / QED / single-case / pre-post); IES What Works Clearinghouse evidence tier targeted."
    typical_provenance: "Evaluation plan; evaluator biosketch; published prior work"
  - fact_class: "consent_requirements"
    description: "Parental consent (FERPA + PPRA + IRB as applicable); minor-assent protocol; opt-out vs opt-in posture; consent-form templates."
    typical_provenance: "IRB-approved consent forms; LEA-approved opt-out notices"
  - fact_class: "performance_measures"
    description: "Federal program-specific GPRA measures (21st CCLC, GEAR UP, TRIO); state accountability measures; project-specific SMART outcomes."
    typical_provenance: "Federal program GPRA documentation; state plan; logic model"
  - fact_class: "nonprofit_or_lea_status"
    description: "Applicant legal form (LEA / SEA / IHE / 501(c)(3) / charter authorizer / tribal education department); UEI; SAM.gov status."
    typical_provenance: "501(c)(3) determination letter; LEA charter; SAM.gov record; UEI"
  - fact_class: "youth_safeguarding_policy"
    description: "Background-check policy; mandated-reporter training; transportation / supervision protocols; named child-protection officer."
    typical_provenance: "Policy doc; training completion log; state background-check records"
  - fact_class: "el_services_designation"
    description: "EL identification protocol + per-student EL plan + qualified-EL-staff credential roster + ACCESS for ELLs assessment cycle."
    typical_provenance: "EL identification protocol document; HQ-EL-teacher certification record; state-administered ACCESS reports"
  - fact_class: "mckinney_vento_compliance_status"
    description: "Designated McKinney-Vento liaison; identification and service-tracking system; per-pupil count + disaggregation by school + transportation arrangement count."
    typical_provenance: "Liaison-designation document; LEA McKinney-Vento policy; SEA reporting submissions"
  - fact_class: "tribal_education_partnership_status"
    description: "Tribal Education Department(s) involved as partners / sub-recipients; Tribal Nation consultation status; Title VI Part A formula grant participation; Native American Languages Act consideration if Indigenous-language instruction."
    typical_provenance: "Tribal Education Department MOU; Tribal consultation record; Title VI Part A application materials if applicant invokes"
  - fact_class: "safeguarding_clearance_portfolio_completeness"
    description: "Per-adult-staff-and-volunteer-with-student-contact clearance status; designated child-protection officer roster; mandated-reporter training cycle."
    typical_provenance: "HR file portfolio per state-specific code (PA Act 153 cited as example); designated-CPO documentation; training-completion logs"

# ─────────────────────────────────────────────────────────────────────────────
# Provenance requirements per fact class
# ─────────────────────────────────────────────────────────────────────────────
provenance_requirements:
  enrollment:
    required_citation_type: "State SIS extract or EDFacts published table — with reporting year + level (school / district / state)"
    verbatim_quote_required: false
  demographics_disaggregated:
    required_citation_type: "State report card or EDFacts disaggregated table; do NOT report cell sizes that violate USDE / state n-size suppression rules"
    verbatim_quote_required: false
  title_i_status:
    required_citation_type: "State Title I designation letter or state-published list; reporting year required"
    verbatim_quote_required: false
  ferpa_relevance:
    required_citation_type: "Signed FERPA agreement / data-sharing MOU between applicant and LEA — verbatim party names + data-element scope + retention terms"
    verbatim_quote_required: true
  curriculum_in_use:
    required_citation_type: "Adoption record OR publisher documentation OR What Works Clearinghouse review citation"
    verbatim_quote_required: false
  partner_schools_and_LEAs:
    required_citation_type: "Signed MOU + signed Letter of Commitment from authorized signatory (superintendent / principal / IHE PI / executive director)"
    verbatim_quote_required: true
  evaluation_design:
    required_citation_type: "Evaluation plan signed/dated by named evaluator; evaluator biosketch; published prior work or registered protocol"
    verbatim_quote_required: false
  consent_requirements:
    required_citation_type: "IRB-approved consent form template OR LEA-approved opt-out notice — verbatim consent language + signature lines + retention statement"
    verbatim_quote_required: true
  performance_measures:
    required_citation_type: "Federal GPRA-measures source citation per program (21st CCLC / GEAR UP / TRIO / EIR); state accountability source"
    verbatim_quote_required: false
  nonprofit_or_lea_status:
    required_citation_type: "501(c)(3) determination OR LEA charter OR state designation; UEI active in SAM.gov; reporting date"
    verbatim_quote_required: false
  grade_bands_served:
    required_citation_type: "Program design document OR district SIS extract OR school report card naming grade-band scope (PreK / K-5 / 6-8 / 9-12 / postsecondary); reporting year"
    verbatim_quote_required: false
  instructional_hours_or_dosage:
    required_citation_type: "Program schedule OR program-design document OR sign-in/sign-out logs documenting per-participant contact hours; comparison to evidence-base dosage where claimed"
    verbatim_quote_required: false
  staff_credentials:
    required_citation_type: "State certification database record OR HR file copy OR background-check completion record per state code (e.g., PA Act 153); reporting date"
    verbatim_quote_required: false
  youth_safeguarding_policy:
    required_citation_type: "Safeguarding documentation portfolio: written policy document AND/OR training-completion logs AND/OR state-specific clearance records (e.g., PA Act 153) AND/OR background-check completion records for all adult staff + volunteers with student contact; designated child-protection officer named"
    verbatim_quote_required: false
  el_services_designation:
    required_citation_type: "EL identification protocol document; HQ-EL-teacher certification record; state-administered ACCESS for ELLs report; per-student EL plan template (de-identified)"
    verbatim_quote_required: false
  mckinney_vento_compliance_status:
    required_citation_type: "LEA McKinney-Vento liaison designation letter; LEA McKinney-Vento policy; SEA reporting submission record with reporting year"
    verbatim_quote_required: false
  tribal_education_partnership_status:
    required_citation_type: "Signed MOU with Tribal Education Department; Tribal consultation record; Title VI Part A application or determination if applicant invokes; Native American Languages Act citation where Indigenous-language instruction is in scope"
    verbatim_quote_required: true
  safeguarding_clearance_portfolio_completeness:
    required_citation_type: "HR file portfolio per state-specific code (PA Act 153 cited as example); designated-CPO documentation; training-completion logs; reporting date"
    verbatim_quote_required: false

# ─────────────────────────────────────────────────────────────────────────────
# Register defaults — Scribe consumption
# ─────────────────────────────────────────────────────────────────────────────
register_defaults:
  language_register: "formal"
  narrative_voice: "first_person_plural"
  tone: "technical_precise"
  operator_override: "PROJECT_CONTEXT match_overrides take precedence"
  sub_registers:
    - register_id: "student_centered"
      applicability_description: |
        Outcomes-framed prose centered on student learning, achievement,
        well-being, and growth — NOT staff outputs or institutional capacity.
        Used when the funder rubric weighs student-level evidence and the
        active opportunity prioritizes participant outcomes.
      dialect_alignment_note: |
        Pairs naturally with centrist + conservative dialect routing where
        outcomes / achievement vocabulary reads as the dominant frame.
    - register_id: "technical_precise"
      applicability_description: |
        Compliance + technical-precise prose for FERPA, IDEA, ESSA evidence
        tiers, dosage / fidelity-of-implementation, methodology + measurement.
        Used when the funder rubric weighs design rigor, statutory
        compliance, and evaluator-grade methodology disclosure.
      dialect_alignment_note: |
        Default register for federal applications and evidence-tiered
        foundation programs (IES / EIR / DRK-12 / Spencer research grants).
    - register_id: "family_community_engagement"
      applicability_description: |
        Partnership, accessibility, parent leadership, family + caregiver
        partnership prose. Used when the funder rubric weighs co-design,
        family voice, and community partnership — without sliding into
        DEI-coded framing under conservative review climates.
      dialect_alignment_note: |
        Pairs naturally with progressive + soul_fire dialect routing;
        adjacent to centrist when partnership is the rubric-relevant frame.
  sub_register_selection_rule: |
    Scribe selects the sub_register per active opportunity at runtime — driven
    by the RFA rubric + funder dialect, NOT by any design-time CIC × CLC
    binding. Per architecture v7.0.11 §6.1, CIC × CLC matching is opportunity-
    driven; no sub_register names a CLC slug, no sub_register is mapped to a
    CLC at design time, and no CLC slugs appear in `applicability_description`
    or `dialect_alignment_note`. Operator override per PROJECT_CONTEXT
    match_overrides takes precedence over Scribe's runtime selection.

# Educator applicants commonly need to balance three register layers within
# the same proposal — the sub_registers list above is the structured surface
# Scribe consumes; the prose below is the human-readable rationale only.
# Scribe MUST select the active sub_register per opportunity at runtime
# (opportunity-driven CLC selection per architecture v7.0.11 §6.1) and MUST
# NOT collapse all three into one tone or default to advocacy register
# without operator approval.

# ─────────────────────────────────────────────────────────────────────────────
# Dialect routing table — Scribe per Law 4
# ─────────────────────────────────────────────────────────────────────────────
dialect_routing_table:
  - funder_political_axis: "conservative"
    dialect: "scribe.formal_outcomes_centered"
    example_funder: "Federal education programs under current-administration framing (achievement / academic outcomes / parental-rights register); large-donor K-12 foundation portfolios emphasizing school choice + traditional academic outcomes"
  - funder_political_axis: "centrist"
    dialect: "scribe.technical_precise"
    example_funder: "Major K-12 education foundations operating from a technical-rigor / evidence-tier posture; state Departments of Education; federal evidence-tier-required technical reviewer panels (IES / EIR / NSF education research)"
  - funder_political_axis: "progressive"
    dialect: "scribe.movement_aligned"
    example_funder: "Education-portfolio foundations with social-impact orientation; community foundations; youth-development intermediaries emphasizing community-driven design + open-educational-resources adoption"
  - funder_political_axis: "soul_fire"
    dialect: "scribe.cooperative_solidarity"
    example_funder: "Racial-justice-aligned education funders; small + mid-size foundations centering community ownership, abolition-adjacent education organizing, and Indigenous education sovereignty"

# ─────────────────────────────────────────────────────────────────────────────
# Admin-risk term register — Law 4 axis (b)
# Per operator OQ-5: approval_required: true defaults on every entry.
# Severity tiers consistent with admin_risk_register.yaml v2.2 EO-context tiers.
# Under current administration framing (EO 14151 + EO 14168 — see citations in
# `_research_metadata.primary_sources`), several terms common in education-
# grant writing have shifted to elevated risk in federal review climates.
# Substitution candidates are funder-aware and operator-grade; substitutions
# do NOT fire silently — Tilth flags the term, presents the substitution
# candidates, and the operator decides (Law 4 enforcement).
#
# Law 4 neutrality posture: `reviewer_context` prose describes the regulatory
# environment as a fact (the EO has been issued, agencies have published
# implementing guidance, foundation funders vary). It does NOT endorse, adopt,
# or repeat the EO's policy substance as Tilth's position. Tilth has no policy
# position on DEI / gender identity / SEL / restorative justice / culturally
# responsive vocabulary — it flags the term as administratively-risky for
# federal applications and surfaces operator-grade substitution candidates.
# ─────────────────────────────────────────────────────────────────────────────
admin_risk_term_register:
  - flagged_term: "DEI / diversity, equity, inclusion"
    severity: "HIGH"
    substitution_candidates:
      - "broad participation"
      - "inclusive access (for non-DEI contexts only)"
      - "underserved-student outreach"
      - "community representation"
      - "expanded student access"
    reviewer_context: |
      Under EO 14151 (2025-01-20 — see `_research_metadata.primary_sources`),
      federal agencies have been directed to terminate DEI activities + DEI-
      related grant criteria; USDE has correspondingly restructured competitive
      priorities. In federal review climates this term currently reads as
      immediate-disqualifier-risk; foundation funders vary widely (progressive
      foundations may expect or accept; centrist may flag; conservative tend
      to avoid). Statutory categories (Title I FRPL, IDEA disability, EL
      status) remain valid and are the operator-defensible federal framing.
      Tilth flags this term for operator decision and surfaces the
      substitution candidates; Tilth does not endorse the EO posture. Verify
      per active RFA.
    approval_required: true

  - flagged_term: "equity"
    severity: "MEDIUM"
    substitution_candidates:
      - "access"
      - "opportunity gap closure"
      - "student outcomes across groups"
      - "Title I FRPL-eligible students"
      - "underserved learners (use cautiously)"
    reviewer_context: |
      NSF leaked keyword list includes 'equity'; federal reviewers flag
      equity-focused framing. Note: 'equity' has both social and financial
      uses — financial / accounting equity is unflagged. Education-context
      'equity' is the social usage and reads as DEI-coded. Substitute with
      access / opportunity / outcomes language for federal proposals; keep
      verbatim only when the active RFA uses the term.
    approval_required: true

  - flagged_term: "trauma-informed"
    severity: "MEDIUM"
    substitution_candidates:
      - "supportive care protocols"
      - "patient-centered student supports"
      - "wraparound student services"
      - "evidence-based behavioral supports"
    reviewer_context: |
      Clinical use (trauma-informed care in a school nurse / counselor role)
      more tolerant; policy-framing use ("trauma-informed schools" as a system
      reform claim) flagged. Foundation funders accept; conservative
      federal reviewers may treat as activist framing. Verify per RFA.
    approval_required: true

  - flagged_term: "restorative justice / restorative practices"
    severity: "MEDIUM"
    substitution_candidates:
      - "alternative dispute-resolution"
      - "community-based discipline practices"
      - "restorative approaches (use cautiously)"
      - "positive behavioral interventions and supports (PBIS — federally-recognized framework)"
    reviewer_context: |
      Under current federal-administration framing the term has been
      cautioned in federal applications; state-level limits exist in some
      states (e.g., FL, TX). PBIS (Positive Behavioral Interventions and
      Supports) is federally recognized via OSEP and is a substitution
      candidate when the substance is positive-behavior / alternative-
      discipline work. Some progressive and soul-fire foundation funders
      accept or prefer the verbatim term. Tilth flags the term for operator
      decision; Tilth does not endorse any reading.
    approval_required: true

  - flagged_term: "gender identity / gender-affirming"
    severity: "HIGH"
    substitution_candidates:
      - "student well-being supports"
      - "individual student needs"
      - "anti-bullying program"
      - "biological sex (where active RFA explicitly requires this framing)"
    reviewer_context: |
      Under EO 14168 (2025-01-20 — see `_research_metadata.primary_sources`),
      federal agencies have been directed to recognize only male/female
      biological sex in federal documents and programs; "gender identity"
      framing triggers scrutiny in current federal review climates. NEA 2026
      funding conditions reportedly prohibit projects promoting "gender
      ideology"; NIH has terminated some trans-health research grants; several
      state education departments under matching state-level executive orders
      have similar restrictions. Foundation funders vary sharply; LGBTQ-
      focused foundations (Astraea, Arcus, Ford Sexuality & Gender Justice)
      expect this vocabulary while most others are variable. Tilth has no
      policy position; this is operator-decision-required territory and the
      substitution-candidate "biological sex (where statutorily required per
      EO 14168)" is offered as an operator option to consider, NOT a Tilth
      recommendation.
    approval_required: true

  - flagged_term: "culturally responsive / culturally relevant"
    severity: "MEDIUM"
    substitution_candidates:
      - "locally adapted curriculum"
      - "community-informed instruction"
      - "place-based learning"
      - "student-centered curriculum"
    reviewer_context: |
      Education-sector DEI framing; NSF leaked list adjacent. Foundation
      funders (Gates, Hewlett, Spencer) generally accept; federal reviewers
      under current administration may flag. Substitution candidates preserve
      substance without DEI-coded vocabulary.
    approval_required: true

  - flagged_term: "social-emotional learning / SEL"
    severity: "MEDIUM"
    substitution_candidates:
      - "life-skills curriculum"
      - "student-development supports"
      - "self-regulation and goal-setting instruction"
      - "non-cognitive skill development"
    reviewer_context: |
      State-level bans exist (FL, TX) under current administration framing.
      USDE under current administration deprioritizes SEL-framed priorities;
      CASEL framework still widely accepted in foundation portfolios. Verify
      per active RFA + state RFA pass-through context.
    approval_required: true

  - flagged_term: "marginalized / underrepresented"
    severity: "MEDIUM"
    substitution_candidates:
      - "Title I FRPL-eligible students"
      - "first-generation college students (TRIO statutory category)"
      - "students in low-income communities"
      - "rural learners"
      - "students with disabilities (IDEA statutory category)"
    reviewer_context: |
      NSF leaked keyword list flags 'marginalized' + 'underrepresented'.
      USDE statutory categories (Title I FRPL, TRIO first-generation, IDEA
      disability, ESEA Title III EL) remain valid and are the preferred
      federal framing. Foundations vary.
    approval_required: true

  - flagged_term: "anti-racist / anti-racism"
    severity: "HIGH"
    substitution_candidates:
      - "fair and consistent treatment"
      - "bias reduction (use cautiously)"
      - "equal access to opportunity"
    reviewer_context: |
      Under current federal-administration framing this vocabulary reads as
      explicit DEI framing and is flagged immediately by federal reviewers.
      Some progressive foundation funders expect or accept the term. Tilth
      flags the term for operator decision; Tilth does not endorse any
      reading. Verify per active funder.
    approval_required: true

  - flagged_term: "systemic / structural inequity / racism"
    severity: "HIGH"
    substitution_candidates:
      - "long-standing outcome differences"
      - "opportunity-access differences"
      - "(NOTE: 'persistent achievement gaps' was removed at Cycle 2; the term 'achievement gap' itself carries residual risk per its own admin_risk_term_register entry — operator decides per active funder)"
    reviewer_context: |
      Explicit DEI / critical-theory framing; under EO 14151 framing federal
      reviewers flag immediately. Foundation usage varies. Tilth flags the
      term for operator decision and presents substitution candidates;
      Tilth does not endorse any reading.
    approval_required: true

  - flagged_term: "LGBTQ / LGBTQ+ / queer / trans"
    severity: "HIGH"
    substitution_candidates:
      - "all students"
      - "student well-being (operator decision)"
      - "anti-bullying"
    reviewer_context: |
      EO 14168 framing; federal disqualifier zone. Trans-specific terms
      especially high-risk; Williams Institute documented 360+ federal
      data-collection removals. LGBTQ-focused foundations PREFER these
      terms; the substitution is dialect-dependent. Operator decides per
      application.
    approval_required: true

  - flagged_term: "decolonize curriculum / Indigenous knowledge centering"
    severity: "HIGH"
    substitution_candidates:
      - "Native American + Alaska Native heritage curriculum (statutory framing)"
      - "Tribal education department partnership"
      - "Indigenous-language instruction (Native American Languages Act framing)"
    reviewer_context: |
      Activist register; federal reviewers flag. Tribal-specific statutory
      categories (BIE, Native Hawaiian education, Native American Languages
      Act, Indian Education Title VI Part A) preserve substance under valid
      federal framings. Verify program-specific language.
    approval_required: true

  - flagged_term: "white privilege / whiteness"
    severity: "HIGH"
    substitution_candidates:
      - "(typically omit; reframe as opportunity-access analysis)"
      - "barriers to access"
    reviewer_context: |
      DEI analytical framework; immediate disqualifier in federal review
      climates. Foundation acceptance varies; soul-fire funders expect.
    approval_required: true

  - flagged_term: "achievement gap"
    severity: "MEDIUM"
    substitution_candidates:
      - "outcome differences between student groups"
      - "differences in proficiency rates across student groups"
      - "differences in growth across student groups (where supported by SIS data)"
      - "Title I FRPL-eligible students' outcomes vs comparison"
    reviewer_context: |
      Aligned with admin_risk_register.yaml v2.2 YELLOW tier — the term has
      been characterized in some federal reviewer commentary as DEI-coded;
      foundation and academic-research usage remains widespread and accepted.
      The term is also commonly used in a structurally-neutral statistical
      sense (proficiency or growth differences across groups), which keeps
      it operator-defensible across centrist + most progressive contexts.
      Tilth flags the term for operator decision and surfaces neutral
      statistical-framing substitution candidates; Tilth does not endorse
      either reading. Per Judge Cycle 2 finding, this entry replaces the
      earlier substitution-candidate "persistent achievement gaps" used
      under "systemic / structural inequity / racism" — that substitution
      may itself carry residual risk, so this entry is now Tilth's primary
      register for the vocabulary.
    approval_required: true

  - flagged_term: "intersectional / intersectionality"
    severity: "MEDIUM"
    substitution_candidates:
      - "multiple student characteristics"
      - "overlapping student needs"
      - "students with combined eligibility (e.g., EL + IDEA)"
    reviewer_context: |
      Academic-origin DEI analytical frame; YELLOW tier per
      admin_risk_register v2.2 — landscape has shifted but term has not been
      singled out at the level of 'DEI'. Federal reviewers may flag;
      foundations accept.
    approval_required: true

  - flagged_term: "equity audit / racial equity audit"
    severity: "HIGH"
    substitution_candidates:
      - "disaggregated student-outcomes analysis"
      - "achievement-data disaggregation"
      - "student-population-group analysis"
      - "Title I FRPL / IDEA / EL / TRIO first-generation analysis per statutory categories"
    reviewer_context: |
      Equity-audit framing appears in foundation applications and consultant-
      delivered LEA studies; under EO 14151 framing federal reviewers flag
      immediately. Statutory-category disaggregation (FRPL, IDEA, EL, TRIO
      first-generation) preserves the analytical substance under operator-
      defensible federal framings. Foundation funders vary widely. Tilth
      flags the term for operator decision; Tilth does not endorse any
      reading.
    approval_required: true

  - flagged_term: "disrupt(ing) inequity"
    severity: "MEDIUM"
    substitution_candidates:
      - "addressing outcome differences"
      - "improving student access to opportunity"
      - "closing opportunity gaps (use cautiously per achievement-gap entry above)"
    reviewer_context: |
      Movement-aligned framing common in foundation applications + LEA
      strategic-plan vocabulary; under EO 14151 framing federal reviewers
      flag. Substitution candidates preserve substance without movement-
      coded register. Operator decides per active funder.
    approval_required: true

# ─────────────────────────────────────────────────────────────────────────────
# Reporting cadence
# ─────────────────────────────────────────────────────────────────────────────
reporting_cadence_typical:
  default_frequency: "annual"
  per_funder_overrides:
    USDE_EIR: "annual performance + final report; final external-evaluation report at project close"
    USDE_GEAR_UP: "annual performance + final; GPRA + state-defined indicators; cohort tracking through postsecondary entry"
    USDE_TRIO: "annual performance + final; APR (Annual Performance Report) on grants.ed.gov"
    USDE_21st_CCLC: "annual federal GPRA reporting via state lead; state-specific subgrant performance schedule"
    USDE_Title_I: "ongoing — embedded in state ESSA report card + LEA consolidated application"
    USDE_Magnet_Schools: "annual + final; GPRA achievement / diversity indicators (note: under review under current administration)"
    USDA_Farm_to_School: "annual + final"
    DOL_YouthBuild: "quarterly + annual + final; PIRL participant-level data + performance outcomes"
    AmeriCorps: "quarterly progress; annual financial; member-record reporting"
    NSF_DRK_12: "annual + final; project outcomes report at close"
    NSF_ITEST: "annual + final; project outcomes report at close"
    Foundation_typical: "annual narrative + financial; some quarterly check-ins; final at close"
    State_pass_through: "varies — per state SEA / SDE / DOE subgrant schedule"
    USDE_Title_VI_Part_A_Indian_Education: "annual performance + final; Title VI Part A Formula reporting cycle via SEA / OIE"
    USDE_OSEP_Personnel_Preparation: "annual performance + final; OSEP grants management cycle"
    DOL_Apprenticeship: "quarterly PIRL data + annual + final; apprentice-completion + retention tracking"
    USDA_SFSP: "monthly claim submission during operating season + annual reporting via state agency"

# ─────────────────────────────────────────────────────────────────────────────
# Metrics table template
# ─────────────────────────────────────────────────────────────────────────────
metrics_table_template:
  - metric: "students served (unduplicated)"
    unit: "count"
    typical_target_range: "applicant-specific"
    source_for_target: "program design + capacity"
  - metric: "regular attendees (≥30 days / 30 hours per 21st CCLC GPRA)"
    unit: "count"
    typical_target_range: "applicant-specific"
    source_for_target: "21st CCLC GPRA + program design"
  - metric: "average attendance rate"
    unit: "percent"
    typical_target_range: "≥80% common foundation benchmark"
    source_for_target: "evaluation plan"
  - metric: "academic outcome — proficiency / growth"
    unit: "percent / scale score"
    typical_target_range: "applicant-specific vs. matched-comparison"
    source_for_target: "state assessment + evaluation design"
  - metric: "graduation / promotion / retention"
    unit: "percent"
    typical_target_range: "applicant-specific"
    source_for_target: "SIS + cohort tracking"
  - metric: "postsecondary enrollment (where applicable)"
    unit: "percent"
    typical_target_range: "applicant-specific"
    source_for_target: "NSC StudentTracker + cohort design"
  - metric: "certifications / credentials earned (CTE)"
    unit: "count + named credential"
    typical_target_range: "applicant-specific"
    source_for_target: "Perkins V state plan + program design"
  - metric: "staff trained / credentialed"
    unit: "FTE + count"
    typical_target_range: "applicant-specific"
    source_for_target: "PD plan"
  - metric: "family / community participation"
    unit: "count of caregivers / events"
    typical_target_range: "applicant-specific"
    source_for_target: "engagement plan"
  - metric: "evidence-base level achieved (ESSA tier)"
    unit: "tier (strong / moderate / promising / rationale)"
    typical_target_range: "tier required per active RFA; demonstrates-rationale (Tier 4) typical for community-based programs and is fully valid for most ESSA-aligned programs; promising / moderate / strong required only where the active RFA specifies (e.g., EIR Mid-Phase / Expansion)"
    source_for_target: "ESSA § 8101(21); IES What Works Clearinghouse"

# ─────────────────────────────────────────────────────────────────────────────
# Cross-references — Program Rule Packs (PRP)
# ─────────────────────────────────────────────────────────────────────────────
# Cards capture customer-archetype pattern recognition. Program-law content
# (cost principles, prevailing-wage thresholds, environmental review triggers)
# lives in PRPs per §19. Cross-references below surface PRPs that frequently
# apply to opportunities routed through this CIC; Logician consumes at runtime
# per opportunity-driven matching (architecture v7.0.11 §6.1).
cross_references_prp:
  - prp_id: "TILTH-PRP-2CFR200"
    applicability: "Federal training and education grant administration (USDE / NEA / IMLS / DOE / NSF) — applicants are federal recipients subject to Uniform Guidance cost principles, procurement standards, Single Audit threshold, supplement-not-supplant compliance, and 2 CFR 200.331-200.333 sub-recipient monitoring."
    fires_when: "Any federal USDE / NEA / IMLS / NSF / DOE / DOL training grant flows to applicant or LEA / IHE sub-recipient; intensifies when federal expenditures exceed Single Audit threshold; supplement-not-supplant compliance fires on every Title I / IDEA aligned use."

# ─────────────────────────────────────────────────────────────────────────────
# Narrative sections typical
# ─────────────────────────────────────────────────────────────────────────────
narrative_sections_typical:
  - "Project Abstract / Executive Summary"
  - "Significance and Need (with disaggregated need-data citations)"
  - "Project Design (logic model / theory of change)"
  - "Curriculum / Intervention Description + Evidence Base"
  - "Population and Participant Recruitment"
  - "Partner / LEA / IHE Roles"
  - "Indigenous / Tribal Nation Consultation Record (where applicable)"
  - "Project Personnel Qualifications"
  - "Project Management Plan"
  - "Safeguarding and Child Protection Plan"
  - "Evaluation Plan (design tier + measures + analysis)"
  - "Dissemination / Sustainability Plan"
  - "Budget Narrative + Match / Cost-Share Documentation"
  - "Appendices — Logic Model, Resumes, Letters of Commitment, Indirect-Cost Agreement"

# ─────────────────────────────────────────────────────────────────────────────
# Capacity signals required
# ─────────────────────────────────────────────────────────────────────────────
capacity_signals_required:
  - signal: "active SAM.gov registration + UEI"
    evidence_type: "SAM.gov record (current, not expired)"
    required_for_competitive: true
  - signal: "FERPA-compliance plan + signed LEA data-sharing agreement"
    evidence_type: "Written FERPA / data-sharing MOU"
    required_for_competitive: true
  - signal: "named external evaluator with relevant prior work"
    evidence_type: "Evaluator biosketch + publications + IES WWC alignment"
    required_for_competitive: true
  - signal: "IRB or equivalent review status (if research-tied)"
    evidence_type: "IRB approval letter or pending submission"
    required_for_competitive: false
  - signal: "signed LEA / IHE partnership Letters of Commitment"
    evidence_type: "LOCs from superintendents / principals / PIs with role + contribution"
    required_for_competitive: true
  - signal: "current good standing on prior federal awards"
    evidence_type: "Prior-award compliance + audit-clean record"
    required_for_competitive: true
  - signal: "qualified key personnel identified"
    evidence_type: "Resumes + role-to-task mapping; certified-teacher status where required"
    required_for_competitive: true
  - signal: "background-check / safeguarding policy in force"
    evidence_type: "Written policy + state-specific clearances (e.g., PA Act 153)"
    required_for_competitive: true

# ─────────────────────────────────────────────────────────────────────────────
# Compliance burdens
# ─────────────────────────────────────────────────────────────────────────────
compliance_burdens:
  - framework: "SAM.gov + UEI registration"
    applicability: "all federal grant applicants"
    required_filings:
      - "SAM.gov annual renewal"
      - "Unique Entity Identifier on every application"
  - framework: "2 CFR 200 Uniform Guidance"
    applicability: "all federal grant recipients"
    required_filings:
      - "Single Audit if federal expenditures > $750,000 in a year"
      - "Procurement standards compliance"
      - "Indirect-cost rate agreement (NICRA) or de minimis rate election"
  - framework: "FERPA — Family Educational Rights and Privacy Act"
    applicability: "any project accessing student-level PII from LEAs / IHEs"
    required_filings:
      - "Signed data-sharing agreement with LEA / IHE"
      - "Annual notice of FERPA rights (LEA responsibility)"
      - "Studies-exception or audit-exception qualifying documentation when applicable"
  - framework: "PPRA — Protection of Pupil Rights Amendment"
    applicability: "any project surveying students on protected topics (politics, religion, family income, mental health, sexual behavior)"
    required_filings:
      - "Parental notice + opt-out (or opt-in for some topics)"
      - "Survey instruments available for parental inspection"
  - framework: "COPPA — Children's Online Privacy Protection Act"
    applicability: "any project using online tools collecting data from children under 13"
    required_filings:
      - "Verifiable parental consent (or LEA-school-official consent under FTC guidance)"
      - "COPPA-compliant vendor review of online tools"
  - framework: "IDEA — Individuals with Disabilities Education Act"
    applicability: "any project including students with disabilities"
    required_filings:
      - "IEP-aligned service delivery"
      - "Section 504 plan adherence"
      - "Maintenance-of-effort + supplement-not-supplant compliance for IDEA fund use"
  - framework: "ESSA — Every Student Succeeds Act"
    applicability: "Title I / II / III / IV programs and any project claiming evidence-base alignment"
    required_filings:
      - "Evidence-tier classification per § 8101(21)"
      - "Equitable services provision (LEA shared with non-public schools)"
      - "Supplement-not-supplant compliance"
  - framework: "State education code (per applicant state)"
    applicability: "all in-state operations"
    required_filings:
      - "State teacher certification compliance"
      - "State background-check completion (PA Act 153, etc.)"
      - "State curriculum standards alignment"
      - "State child-protection mandated-reporter training"
  - framework: "EDGAR — Education Department General Administrative Regulations (34 CFR)"
    applicability: "USDE-funded grants"
    required_filings:
      - "Per-program EDGAR subpart compliance"
      - "Construction-grant Davis-Bacon (where applicable)"
  - framework: "CIPA — Children's Internet Protection Act"
    applicability: "schools / libraries receiving E-rate or LSTA discounts and any project deploying internet-connected technology to minors"
    required_filings:
      - "Internet safety policy on file"
      - "Technology Protection Measure (filtering) on minor-accessible devices"
      - "Public-notice + hearing on internet-safety policy"
  - framework: "Section 504 of the Rehabilitation Act / ADA Title II"
    applicability: "all public schools + any program receiving federal financial assistance"
    required_filings:
      - "Section 504 plans for qualifying students"
      - "Program-accessibility plan + reasonable-accommodation procedure"
      - "Designated Section 504 / ADA coordinator"
  - framework: "McKinney-Vento Homeless Assistance Act"
    applicability: "any LEA / SEA receiving Title I funds; programs serving students experiencing homelessness"
    required_filings:
      - "McKinney-Vento liaison designation"
      - "Immediate enrollment + transportation provisions documented"
      - "Identification + service-tracking for homeless students"
  - framework: "Title IX of the Education Amendments of 1972"
    applicability: "all educational institutions receiving federal financial assistance"
    required_filings:
      - "Designated Title IX coordinator"
      - "Grievance procedure + sexual-harassment / sex-discrimination policy"
      - "Notice of nondiscrimination on the basis of sex"
      - "Per active federal-regulation cycle: Tilth flags Title IX as a regulatory-environment-in-flux compliance area and verifies the active rule before drafting"

# ─────────────────────────────────────────────────────────────────────────────
# Common risk register entries
# ─────────────────────────────────────────────────────────────────────────────
common_risk_register_entries:
  - risk: "FERPA exposure / PII leak in proposal narrative or appendices"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      No student PII in proposal text. Aggregate / de-identified data only.
      LEA-approved data-sharing agreement signed before any data exchange.
      Logician PRE-gate scan flagged-PII categories prior to submission.
  - risk: "Unsupported achievement / outcome claims"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Tie every quantitative outcome to a named data source (state SIS,
      EDFacts, evaluator-collected). Use ESSA evidence-tier language
      precisely; do NOT claim 'strong evidence' without WWC-meeting design.
      Pre/post + comparison required for moderate+ claims.
  - risk: "Weak evaluation design"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Named external evaluator with relevant published work; pre-registered
      evaluation plan when feasible; named instruments with psychometric
      references; explicit comparison strategy; sample-size justification.
  - risk: "Low dosage relative to evidence-base"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: |
      Compare proposed dosage (hours/week, weeks/year, total dose) to
      evidence-base dosage. If lower, explain explicitly and adjust outcome
      claims downward.
  - risk: "Missing LEA / IHE authorization"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Signed Letter of Commitment from authorized signatory (superintendent /
      principal / PI / executive director) with role + contribution + term.
      For LEA / IHE applicants, board resolution or equivalent governance
      authorization where applicable.
  - risk: "Safeguarding / background-check gap"
    likelihood: "LOW"
    impact: "HIGH"
    mitigation_pattern: |
      Documented background-check policy + state-specific clearances current
      for all adult staff + volunteers with student contact. Named child-
      protection officer. Mandated-reporter training current.
  - risk: "Privacy risk in photos / testimonials / dissemination"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Parental media-release on file for every minor pictured / quoted in
      proposal narrative + dissemination products. Default to no PII in
      dissemination unless specific consent + LEA approval. Layered consent
      controls:
        (a) LEA-approved media-release form (distinct from FERPA-release;
            covers photography / video / audio / quotation in funder
            applications + dissemination products);
        (b) COPPA-compliant consent for any online dissemination tool that
            will collect data from or about children under 13 (FTC COPPA
            guidance + vendor review);
        (c) Differentiated consent: minor-assent + parental-permission for
            students under 18; adult-consent for any 18+ alumni or family
            members quoted;
        (d) Explicit social-media-dissemination boundary: parental opt-in
            required before posting minor's image / name / quote to social
            channels, distinct from the press / publication release;
        (e) Retention + removal: documented retention timeline + parental-
            removal-request procedure for any minor's content under
            dissemination.
  - risk: "Law 4 boundary drift on DEI / SEL / gender language"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Per admin_risk_term_register, every flagged term substitution flows
      through operator approval (approval_required: true default). No silent
      rewrites. EO 14151 + EO 14168 context is live; substitutions are
      operator-decision-required especially for federal applications under
      current administration framing.
  - risk: "Supplanting (rather than supplementing) Title I / IDEA funds"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Budget narrative explicitly distinguishes supplemental services from
      base obligations. Documented compliance with supplement-not-supplant
      provisions for any Title I / IDEA-aligned use.
  - risk: "Indirect-cost rate dispute"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Documented NICRA OR 10% de minimis election OR program-specific cap
      (USDE training-grant 8% cap on indirect under 34 CFR 75.562 for some
      programs). State rules where state pass-through applies.
  - risk: "Equitable-services obligation overlooked"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      For LEA applicants on Title I / Title IV / Title III / Title II,
      timely-and-meaningful-consultation with private-school officials
      documented per ESSA § 1117 / § 8501.
  - risk: "Tribal consultation gap"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      For projects on or near Indigenous lands, in Tribal Nation school
      districts, or invoking Indigenous-knowledge curriculum: Tribal
      consultation record + Tribal Education Department engagement +
      Title VI Part A formula-grant participation status verification
      before application submission.
  - risk: "English Learner services dosage mismatch"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Title III dosage minimums + WIDA ACCESS for ELLs assessment cycle +
      per-student EL plan + qualified-EL-teacher staffing ratio verified
      against state-specific Title III plan.
  - risk: "McKinney-Vento liaison or service-tracking gap"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      LEA McKinney-Vento liaison designation current; identification protocol
      active; per-pupil count + disaggregation reporting current;
      transportation arrangement documentation per district policy.

