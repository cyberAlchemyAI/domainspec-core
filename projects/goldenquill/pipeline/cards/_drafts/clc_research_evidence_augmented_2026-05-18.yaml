# ---------------------------------------------------------------------------
# COMMON RED FLAGS — adversarial probes
# ---------------------------------------------------------------------------
common_red_flags:
  - flag: "vague_research_question"
    severity: "HIGH"
    red_team_probe: "What specific testable hypothesis or aim does this proposal address? If you removed the word 'explore' or 'investigate' from the aims, what remains? Can the proposed methods actually answer the question?"
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"

  - flag: "method_mismatch"
    severity: "HIGH"
    red_team_probe: "Why this design rather than the alternatives? If the question is causal, why is observation/correlation acceptable? If the question is mechanistic, why a survey rather than an experiment? Does the design produce the evidence the aims claim?"

  - flag: "underbudgeted_evaluation"
    severity: "HIGH"
    red_team_probe: "How many statistician hours are budgeted relative to data complexity? Is qualitative coding budgeted with realistic intercoder-reliability time? Does the budget reflect the analysis plan, or are evaluation costs invisible? Non-academic applicants typically under-budget evaluation activities by 2-3x relative to academic PI-led projects. Illustrative examples (not binding, not eligibility-coupled): community organizations, finance intermediaries, advocacy groups, member-owned enterprises, government departments without dedicated research staff. Common omissions include dedicated statistician / methodologist hours, qualitative-coding labor, evaluation-consultant retainer, data-cleaning and dataset-preparation labor, evaluation-software licenses, and incentives for follow-up data collection. Operator should compare evaluation-line items against the analysis plan task-by-task before submission."

  - flag: "human_subjects_ignored_or_glossed"
    severity: "HIGH"
    red_team_probe: "Where is the IRB plan? Are vulnerable populations (children, prisoners, pregnant women, cognitively impaired) involved without explicit protections? What is the consent procedure for digital/remote data collection? Where is the data-protection scheme for identifiable data?"
    source_citation: "https://www.hhs.gov/ohrp/regulations-and-policy/regulations/45-cfr-46/index.html"

  - flag: "missing_or_weak_data_management_plan"
    severity: "HIGH"
    red_team_probe: "Is a generalist or domain repository named for data deposit? Are persistent identifiers (DOIs) committed? Is the sharing timeline specified? For NIH 2023 DMSP applications: does the plan address the six required elements (data type, related tools, standards, preservation/access, oversight, factors limiting sharing)?"
    source_citation: "https://sharing.nih.gov/data-management-and-sharing-policy/about-data-management-and-sharing-policies/data-management-and-sharing-policy-overview"

  - flag: "unrealistic_sample_size_or_no_power_calculation"
    severity: "HIGH"
    red_team_probe: "What is the minimum detectable effect size at the proposed N? Is the power calculation shown with stated alpha, beta, effect size, and assumptions? Is recruitment feasible at the proposed rate given the population and timeline?"

  - flag: "overclaimed_causality"
    severity: "HIGH"
    red_team_probe: "If the design is correlational/observational, are the conclusions phrased causally? Are confounders identified and controlled (or acknowledged as limits)? Is the language 'effects', 'impact', 'caused' supported by the design, or should it be 'associated', 'related', 'predicts'?"

  - flag: "vague_dissemination"
    severity: "MEDIUM"
    red_team_probe: "Which named journals or conferences? On what timeline? Are practitioner / policy / community audiences served by the products listed? Is there a dataset deposit and a code-release commitment if applicable?"

  - flag: "team_expertise_gaps"
    severity: "HIGH"
    red_team_probe: "For each major aim, who on the team has the methodological expertise to execute it? Is there a methodologist for stats-heavy aim? A clinician for clinical aim? A community partner with role and authority for community-engaged work?"

  - flag: "no_preliminary_data_when_required"
    severity: "MEDIUM_TO_HIGH"
    red_team_probe: "Does the mechanism (R01, AFRI standard) require preliminary data, and is it present? Is preliminary data padded with unrelated work? For early-stage mechanisms (R21, EAGER, SBIR Phase I) the absence is by design — confirm mechanism choice."
    source_citation: "https://grants.nih.gov/grants/funding/r21.htm"

  - flag: "scope_creep_beyond_budget"
    severity: "MEDIUM"
    red_team_probe: "Are aims so broad that the budgeted personnel time cannot complete them? Have you estimated effort per aim and matched it to FTE budgeted?"

  - flag: "broader_impacts_boilerplate_nsf"
    severity: "MEDIUM_TO_HIGH"
    red_team_probe: "(NSF only) Does Broader Impacts list activities (give a workshop, train students) without a logic model linking activities to societal outcomes? Are partners named with roles, or is it an unfunded aspiration?"
    source_citation: "https://www.nsf.gov/funding/preparing/broaderimpacts.jsp"

  - flag: "wrong_mechanism_choice"
    severity: "MEDIUM"
    # Sidecar augmentation 2026-05-18 per handback §4.1: IES + NIH mechanism distinction enumerated.
    red_team_probe: "Is the budget request appropriate to the mechanism (R01 vs R21, AFRI Foundational standard vs CAP, NSF standard vs Career)? Does the project scope fit the mechanism's intent (planning vs full project, exploratory vs confirmatory)? For IES, is the goal correctly coded (Goal 1 Exploration / Goal 2 Development & Innovation / Goal 3 Efficacy & Replication / Goal 4 Effectiveness / Goal 5 Measurement)? For NIH, is the activity code correctly chosen (F-series fellowships, K-series career-development, T-series training, R-series research project grants — R01 standard / R21 exploratory / R03 small / R34 planning) and is the mechanism aligned to the project stage?"

  # Sidecar augmentation 2026-05-18 per handback §4.1 + §4.6 NEW common_red_flags.
  - flag: "participatory_research_partnership_without_substance"
    severity: "HIGH"
    red_team_probe: "Where is the community advisory board roster? When does it meet? What is its decision-making authority over the research design? How is the budget allocated between academic team and community partner — and does the academic team retain >85% of direct costs? Is there a community-partner co-authorship commitment for dissemination? Or is the community partner relegated to 'recruitment / outreach' with no research-design authority?"

  - flag: "field_trial_design_underspecified"
    severity: "MEDIUM"
    red_team_probe: "Is the field trial design randomized-block, split-plot, latin-square, or none-stated? How many replications per treatment? How is location-by-treatment variance handled? Are control treatments included? How are weather-cycle confounders managed across growing seasons?"

  - flag: "repository_named_only_aspirationally"
    severity: "MEDIUM"
    red_team_probe: "Does the DMSP / DMP name a specific repository with a persistent-identifier strategy and a timeline? Or does it say 'data will be deposited in an appropriate repository upon publication' without naming the repository? NIH 2023 DMSP and NSF DMP both expect named-repository commitment at proposal time."

  - flag: "sbir_phase_iii_funding_pathway_unspecified"
    severity: "MEDIUM"
    red_team_probe: "What is the named Phase III financing pathway? Private investment + LOI? Strategic partnership + MOU? Federal sole-source contract? Customer LOI + revenue projection? 'We will commercialize the technology' without a named pathway is a reviewer red flag. Note: commercial-readiness scoring lives on Market Access track_b (sbir_phase_iii); the research-rigor side of this question (technical-feasibility-supports-Phase-III-commercialization) belongs here."

# ---------------------------------------------------------------------------
# REPORTING REQUIREMENTS TYPICAL
# ---------------------------------------------------------------------------
reporting_requirements_typical:
  performance_reporting:
    frequency: "annual"
    content_required:
      - "Progress against aims / milestones"
      - "Personnel + percent effort changes"
      - "Publications, presentations, datasets generated (cumulative)"
      - "Participants recruited / enrolled (where human subjects)"
      - "Variance from original timeline + rationale"
      - "Plans for next reporting period"
      - "Inclusion enrollment report (NIH)"
      - "Use of equipment / facilities purchased with grant funds"
      # Sidecar augmentation 2026-05-18 per handback §4.7.
      - "DMSP / DMP compliance status per element (NIH 2023 six elements: data type / related tools / standards / preservation+access / reuse considerations / oversight)"
  financial_reporting:
    frequency: "annual_minimum_quarterly_for_some"
    content_required:
      - "SF-425 Federal Financial Report — annual + final"
      - "Expenditure by budget category"
      - "Carryover request if balance > threshold"
      - "Unobligated balance reporting"
  final_report_required: true
  source_citation: "https://grants.nih.gov/grants/rppr/rppr_instruction_guide.pdf"
  note: "NIH RPPR (Research Performance Progress Report) due annually 60 days before each budget period start; final RPPR due within 120 days of project end. NSF annual project report due 90 days before each anniversary of award start; final report due within 120 days of award end. USDA NIFA REEport annual + final. IES annual + final per cooperative agreement schedule. Foundation reporting per agreement (typically annual + final). Closeout per 2 CFR 200.344 (90-120 days)."

# ---------------------------------------------------------------------------
# COMPLIANCE OBLIGATIONS
# ---------------------------------------------------------------------------
compliance_obligations:
  - framework: "2 CFR Part 200 (Uniform Guidance)"
    applicability: "All federal research grants"
    typical_filings:
      - "SF-425 Federal Financial Report"
      - "RPPR / annual project report"
      - "Single Audit if federal expenditures ≥ $750,000/year (rising to $1M under 2024 update)"
      - "Subaward Reporting (FFATA)"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"

  - framework: "45 CFR 46 / Common Rule (Human Subjects)"
    applicability: "Any research involving human subjects or identifiable human data"
    typical_filings:
      - "IRB approval before data collection"
      - "Annual IRB continuing review (where required)"
      - "Adverse-event reporting per protocol"
      - "Single IRB (sIRB) for multi-site NIH research"
    source_citation: "https://www.hhs.gov/ohrp/regulations-and-policy/regulations/45-cfr-46/index.html"

  - framework: "HIPAA Privacy Rule"
    applicability: "Research using Protected Health Information from covered entities"
    typical_filings:
      - "Authorization or IRB Waiver of Authorization"
      - "Data Use Agreement for Limited Data Set"
      - "Business Associate Agreement where applicable"
    source_citation: "https://www.hhs.gov/hipaa/for-professionals/privacy/index.html"

  - framework: "FDA IND / IDE"
    applicability: "Research involving investigational drugs (IND) or investigational devices (IDE)"
    typical_filings:
      - "IND/IDE application to FDA"
      - "Annual IND/IDE report"
      - "Adverse-event reporting to FDA + IRB"
    source_citation: "https://www.fda.gov/regulatory-information/search-fda-guidance-documents"

  - framework: "PHS Policy on Humane Care and Use of Laboratory Animals (IACUC)"
    applicability: "Research involving vertebrate animals"
    typical_filings:
      - "IACUC protocol approval before research begins"
      - "Annual IACUC review"
      - "Animal Welfare Assurance with OLAW"
    source_citation: "https://olaw.nih.gov/policies-laws/phs-policy.htm"

  - framework: "NIH Data Management and Sharing Policy (2023)"
    applicability: "Nearly all NIH research applications submitted on or after Jan 25, 2023"
    typical_filings:
      - "DMS Plan submitted with application"
      - "DMS Plan compliance reported in RPPR"
      - "Data deposit per plan timeline"
    source_citation: "https://sharing.nih.gov/data-management-and-sharing-policy/about-data-management-and-sharing-policies/data-management-and-sharing-policy-overview"

  - framework: "NSF Public Access Policy + Data Management Plan"
    applicability: "All NSF-funded research"
    typical_filings:
      - "DMP submitted with proposal (2 pages max)"
      - "Publications deposited in NSF Public Access Repository (PAR) within 12 months"
      - "Data shared per DMP commitments"
    source_citation: "https://www.nsf.gov/data/"

  - framework: "Public Access Policy (NIH)"
    applicability: "All peer-reviewed publications arising from NIH funding"
    typical_filings:
      - "Manuscript deposit in PubMed Central (PMC) within 12 months of publication"
      - "PMCID required in subsequent NIH applications and RPPRs"
    source_citation: "https://publicaccess.nih.gov/"

  - framework: "Responsible Conduct of Research (RCR) training"
    applicability: "NIH (T-, F-, K-mechanisms; some others); NSF (all undergrad + grad + postdoc supported)"
    typical_filings:
      - "Documented RCR training plan"
      - "RCR training completion records"
    source_citation: "https://grants.nih.gov/grants/guide/notice-files/NOT-OD-10-019.html"

  - framework: "Conflict of Interest disclosure (Federal financial disclosure)"
    applicability: "All federal research; NIH FCOI per 42 CFR 50 Subpart F"
    typical_filings:
      - "Investigator FCOI disclosure annually + within 30 days of new SFI"
      - "Institutional FCOI management plan where conflict identified"
      - "Public posting of FCOI within 5 days of request"
    source_citation: "https://www.ecfr.gov/current/title-42/chapter-I/subchapter-D/part-50/subpart-F"

  - framework: "FFATA Subaward Reporting"
    applicability: "Federal grants ≥ $30,000 with subawards ≥ $30,000"
    typical_filings:
      - "Subaward reporting in FSRS by end of month following month of obligation"
    source_citation: "https://www.fsrs.gov/"

  - framework: "FERPA (Family Educational Rights and Privacy Act, 34 CFR Part 99)"
    applicability: "Research using personally identifiable information from education records of students, common in IES-funded research and NSF education research conducted in K-12 or postsecondary settings"
    typical_filings:
      - "Data-use agreement with the educational agency or institution releasing records"
      - "FERPA-permitted disclosure pathway documented (audit/eval, studies, written-consent, directory information, etc.)"
      - "IRB protocol cross-referencing FERPA limits where applicable"
    source_citation: "https://studentprivacy.ed.gov/"

  - framework: "NIH Inclusion of Women & Minorities (NIH Policy 4.1) and Inclusion Across the Lifespan (2019)"
    applicability: "NIH clinical research involving human subjects (including secondary data with identifiable participants)"
    typical_filings:
      - "Inclusion-of-Women-and-Minorities plan in PHS Human Subjects and Clinical Trials Information form"
      - "Inclusion-Across-the-Lifespan justification (children, older adults)"
      - "Inclusion enrollment report annually in RPPR"
    source_citation: "https://grants.nih.gov/policy-and-compliance/policy-topics/inclusion"

  - framework: "Bayh-Dole Act (35 U.S.C. 200-212) Intellectual Property in Federally Funded Research"
    applicability: "All federal research grants where inventions may arise; SBIR / STTR carry additional data-rights protections"
    typical_filings:
      - "Invention disclosure to funding agency within statutory window"
      - "Election of title decision"
      - "Government use license / march-in-rights acknowledgment"
      - "Annual utilization reporting via iEdison (NIH) or equivalent agency system"
    source_citation: "https://www.uspto.gov/ip-policy/bayh-dole"

# ---------------------------------------------------------------------------
# COMMITMENT TRACKING PATTERN — Report Generator (v0.2) feed
# ---------------------------------------------------------------------------
commitment_tracking_pattern:
  typical_commitments_extracted:
    - commitment_type: "protocol_completion"
      measurement_method: "study protocol final + IRB-approved version + completion against timeline milestones"
    - commitment_type: "irb_approval_or_continuing_review"
      measurement_method: "IRB approval letter + protocol number + approval date + continuing review date"
    - commitment_type: "participant_recruitment_and_enrollment"
      measurement_method: "target enrollment N + actual enrollment N (cumulative + by demographic strata per NIH inclusion) + screening logs + consent rate"
    - commitment_type: "data_collection_waves"
      measurement_method: "wave name + planned start/end + actual start/end + completion percentage + missing-data summary"
    - commitment_type: "analysis_milestones"
      measurement_method: "analysis name + planned date + actual date + dataset version analyzed + analyst"
    - commitment_type: "interim_findings"
      measurement_method: "finding summary + supporting analysis + date observed + dissemination status (preprint, presentation, paper)"
    - commitment_type: "performance_reports_filed"
      measurement_method: "report type (RPPR / project report / REEport / IES annual) + filing date + acceptance status"
    - commitment_type: "publications"
      measurement_method: "citation + status (submitted/in revision/accepted/published) + DOI + PMCID + open-access status"
    - commitment_type: "presentations"
      measurement_method: "venue + date + audience type + slides/poster archived"
    - commitment_type: "datasets_deposited"
      measurement_method: "dataset name + repository + DOI/persistent ID + access tier (open/restricted) + deposit date"
    - commitment_type: "code_released"
      measurement_method: "code repository URL + version tag + license + Zenodo DOI for archived release"
    - commitment_type: "dms_plan_compliance"
      measurement_method: "DMS Plan element + planned action + actual status + variance explanation"
    - commitment_type: "sbir_sttr_commercialization_milestones"
      measurement_method: "SBIR / STTR only. Phase I: feasibility milestones (technical demonstration, customer-discovery interviews, IP filings, Phase II readiness). Phase II: TRL advancement against target, Phase III financing commitments (private investment, strategic partnerships, customer LOIs, follow-on federal contracts), product/service launch, revenue milestones if relevant. Track against the Commercialization Plan submitted with the application."
    # Sidecar augmentation 2026-05-18 per handback §4.7 NEW commitment_types.
    - commitment_type: "community_engagement_milestones"
      measurement_method: "community advisory board meeting cadence + decision authority + community partner sub-award disbursement schedule + community-partner co-authorship status on dissemination products"
    - commitment_type: "irb_continuing_review_schedule"
      measurement_method: "IRB approval date + continuing review schedule (annual default; less frequent for minimal-risk; institution-specific) + adverse event reporting trail"
  proposal_commitments_yaml_extension:
    field_name: "research_evidence_commitments"
  source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-04"

