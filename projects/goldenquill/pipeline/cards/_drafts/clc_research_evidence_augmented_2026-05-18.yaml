schema_version: "1.0-clc"
card_axis: "CLC"
card_id: "TILTH-CLC-04"
slug: "research_evidence"
display_name: "Research & Evidence"
funding_mechanism_summary: "Inquiry, evaluation, pilots, and proof-building funding where research design rigor, methods fit, IRB/data management, and dissemination drive underwriting (USDA SARE/AFRI, NSF, NIH, IES, university partners, foundation evaluation funds)."
tilth_clc_id: "TILTH-CLC-04"

# ---------------------------------------------------------------------------
# UNDERWRITING CRITERIA — what reviewers evaluate (per §18.10 starter content)
# ---------------------------------------------------------------------------
underwriting_criteria:
  - criterion: "research_question"
    description: "A specific, answerable question (or set of aims) bounded enough that the proposed methods can address it. Reviewers look for falsifiable framing — not 'we will explore', but 'we will test whether X causes Y under conditions Z'."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-04"

  - criterion: "significance"
    description: "Documented gap in knowledge, practice, or policy that the work will address — what changes if the question is answered. NIH calls this 'Significance' (scored 1-9); NSF folds it into Intellectual Merit; IES requires explicit 'Significance' section."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"

  - criterion: "method_fit"
    # Sidecar augmentation 2026-05-18 per handback §4.1: field-experimental designs enumerated.
    description: "The proposed design (RCT, quasi-experimental, mixed methods, qualitative, observational, computational) is the right tool for the question. Wrong-design-for-question is among the most common reviewer rejections. For USDA SARE / AFRI / NRCS / land-grant field research, field-experimental designs (randomized block, split-plot, latin-square) with replication-and-control discipline carry equivalent rigor weight to clinical RCTs in the agricultural-research peer-review tradition."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"

  - criterion: "data_collection_plan"
    description: "Concrete instruments, sampling frame, recruitment plan, data sources, collection schedule, quality-control procedures. Reviewers look for executable specificity, not aspirational gestures."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-04"

  - criterion: "evaluation_rigor"
    description: "Analysis plan named in advance: statistical methods, sample-size justification / power calculation, handling of missing data, sensitivity analyses. For qualitative/mixed designs: coding scheme, intercoder reliability, triangulation."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"

  - criterion: "team_qualifications"
    description: "PI + co-PIs + key personnel with demonstrated capacity to execute the proposed work. NIH/NSF biosketches, prior funding, publications relevant to the aims, methodologist on staff for statistical work."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://grants.nih.gov/grants/forms/biosketch.htm"

  - criterion: "human_subjects_irb"
    description: "Where humans (or identifiable human data) are involved, an IRB plan keyed to 45 CFR 46 / Common Rule: protocol summary, consent procedures, risk minimization, vulnerable-population protections, data-protection scheme. NIH and IES require explicit Human Subjects sections; NSF requires IRB approval before data collection. Operational expectations: (a) IRB model — single-IRB (sIRB) for multi-site NIH research per the 2018 NIH sIRB policy; reliance agreements (IAA / SMART IRB) named where applicable; local-IRB-only for single-site studies. (b) Vulnerable populations — explicit subpart protections for children (Subpart D), prisoners (Subpart C), pregnant women / fetuses / neonates (Subpart B), and additional protocol-level safeguards for cognitively impaired adults. (c) Consent procedure — including digital / remote / electronic consent workflows (DocuSign-eConsent, REDCap consent, or equivalent) with documentation of comprehension verification where literacy / language / capacity warrant. (d) Identifiable-data protection scheme — encryption at rest and in transit, access-log retention, role-based access controls, named storage location (institutional vs cloud, HIPAA-eligible cloud where PHI), data-destruction policy at study close. (e) FERPA intersect — for research with student educational records (often IES and NSF education work), data-use agreements with school districts and FERPA-permitted-disclosure pathway must be named separately from the IRB pathway."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.hhs.gov/ohrp/regulations-and-policy/regulations/45-cfr-46/index.html"

  - criterion: "data_management_plan"
    description: "How data will be collected, stored, secured, preserved, and shared. NSF DMP required since 2011; NIH 2023 Data Management & Sharing Policy requires a DMS Plan in nearly all NIH research applications. Federal expectation: deposit in a recognized repository unless justified otherwise."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://sharing.nih.gov/data-management-and-sharing-policy/about-data-management-and-sharing-policies/data-management-and-sharing-policy-overview"

  - criterion: "dissemination_plan"
    description: "How findings will reach intended audiences — peer-reviewed publications, conference presentations, practitioner briefs, datasets deposited, code released. Vague 'we will publish' is a reviewer red flag; reviewers want named venues and audience-specific products."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-04"

  - criterion: "broader_impacts"
    description: "NSF criterion (formal): the potential to benefit society and contribute to specific desired societal outcomes beyond the intellectual contribution. Many federal research programs have an analogous public-value criterion. Reviewers expect concrete pathways, not boilerplate."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.nsf.gov/funding/preparing/broaderimpacts.jsp"

  - criterion: "feasibility"
    description: "Timeline + resources + institutional environment + risk mitigation are realistic for the proposed scope. Reviewers ask: can this team finish this work in this time on this budget?"
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-04"

  - criterion: "preliminary_data"
    description: "Required at HIGH weight for NIH R01 and many AFRI standard projects; lower weight for NIH R21 / R03 / NSF EAGER / SBIR Phase I and other early-stage mechanisms by design. Operator must check the specific RFA — preliminary-data expectations are mechanism-coded."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"

  # Sidecar augmentation 2026-05-18 per handback §4.1 NEW underwriting_criterion.
  - criterion: "community_engagement_rigor"
    description: "Where the proposal is participatory, community-engaged research (CBPR), or co-design / co-research with community partners — reviewers look for: community advisory board structure with named members and meeting cadence; co-PI / co-investigator structure where appropriate; equitable budget distribution to community partners (typical floor 15–25% to community partner sub-awards); partner co-authorship commitment in dissemination; training-and-capacity-building commitments to community partners; bidirectional benefit articulation. Empty 'we engaged the community' prose is a reviewer red flag."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-04"

# ---------------------------------------------------------------------------
# SCORING WEIGHT PATTERNS — funder-specific rubrics observed
# ---------------------------------------------------------------------------
# Qualitative only per OQ-6. Numeric weights deferred until 12+ CycleReceipts
# seed Lessons Memory with quantified observations.
scoring_weight_patterns:
  - rubric_example: "NIH peer review (R01 and most research grants)"
    weights:
      significance: "scored_1_to_9_overall_impact_anchor"
      investigators: "scored_1_to_9_overall_impact_anchor"
      innovation: "scored_1_to_9_overall_impact_anchor"
      approach: "scored_1_to_9_overall_impact_anchor"
      environment: "scored_1_to_9_overall_impact_anchor"
      overall_impact: "scored_1_to_9_priority_score"
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"
    note: "NIH uses five scored criteria (1=exceptional, 9=poor) plus an overall Impact Score. Approach typically drives the Overall Impact more than any single other criterion. Effective 2025, NIH uses a simplified review framework grouping criteria into Factor 1 (Importance of the Research), Factor 2 (Rigor and Feasibility), Factor 3 (Expertise and Resources)."

  - rubric_example: "NSF merit review (NSF Proposal & Award Policies & Procedures Guide)"
    weights:
      intellectual_merit: "scored_qualitatively_per_solicitation"
      broader_impacts: "scored_qualitatively_per_solicitation"
    source_citation: "https://www.nsf.gov/pubs/policydocs/pappg/index.jsp"
    note: "Two statutory criteria (since 1997). Both are weighted in panel discussion; the relative weight is not numerically fixed but most program officers report Intellectual Merit dominates discussion while Broader Impacts is gating — weak Broader Impacts can sink an otherwise-strong proposal."

  - rubric_example: "USDA NIFA AFRI peer review"
    weights:
      per_rfa_scoring_dimensions: "qualitative_per_program_area"
    source_citation: "https://www.nifa.usda.gov/grants/funding-opportunities/agriculture-food-research-initiative-foundational-applied-science"
    # Sidecar augmentation 2026-05-18 per handback §4.5: Scout signal added under additionalProperties:true permissiveness.
    scout_runtime_fetch_required: true
    note: "AFRI scoring is per-RFA: each of the six AFRI Foundational priority areas (plant health & production; animal health & production; food safety, nutrition & health; bioenergy, natural resources & environment; agricultural systems & technology; agricultural economics & rural communities) publishes its own scoring dimensions in the program-area RFA. Operator must read the active-cycle RFA — there is no static USDA AFRI rubric. Sidecar 2026-05-18: scout_runtime_fetch_required:true signals Scout to dispatch live fetch of active-cycle RFA at runtime."

  - rubric_example: "USDA SARE (regional grant programs)"
    weights:
      per_grant_type_per_region: "qualitative_per_program"
    source_citation: "https://www.sare.org/grants/"
    # Sidecar augmentation 2026-05-18 per handback §4.5: per-region anchor URLs enumerated.
    per_region_anchors:
      northeast: "https://northeast.sare.org/grants/"
      north_central: "https://northcentral.sare.org/grants/"
      southern: "https://southern.sare.org/grants/"
      western: "https://western.sare.org/grants/"
    note: "SARE has four regional offices (Northeast, North Central, South, Western) each running multiple grant programs (Research & Education, Producer, Partnership, Graduate Student, Professional Development). Scoring criteria vary by program and region — operator must consult the active call. SARE Producer grants generally weight on-farm research practicality + farmer involvement + outcome dissemination. Sidecar 2026-05-18: per-region anchor URLs added to enable Scout to dispatch per-region per-program scoring fetch."

  - rubric_example: "IES (Institute of Education Sciences) education research"
    weights:
      significance: "weighted"
      research_plan: "weighted"
      personnel: "weighted"
      resources: "weighted"
    source_citation: "https://ies.ed.gov/funding/grants.asp"
    note: "IES research grants use four scored criteria across most NCER and NCSER programs. Across the IES Education Research Grants (84.305A) RFA series and Special Education Research (84.324A) RFA series, the Research Plan criterion covers conceptual framework + research design + methods + analysis + dissemination, and is typically the longest and most heavily-detailed scored section per the published RFAs — operator should verify the active-cycle RFA for the per-program scoring distribution. Different topic areas (Effective Teachers, English Learners, etc.) and goals (Exploration, Development, Impact, Measurement) tune the rubric."

  # Sidecar augmentation 2026-05-18 per handback §4.1 NEW: NIH simplified review framework.
  - rubric_example: "NIH simplified review framework (3-factor; effective January 2025)"
    weights:
      factor_1_importance_of_research: "scored_1_to_9"
      factor_2_rigor_and_feasibility: "scored_1_to_9"
      factor_3_expertise_and_resources: "scored_1_to_9"
      overall_impact: "scored_1_to_9_priority_score"
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"
    note: "Active for most NIH FOAs effective January 2025. Three factors replace prior five-criterion framework; criteria are grouped (Significance/Innovation → Factor 1; Approach → Factor 2; Investigators/Environment → Factor 3). Legacy 5-criteria framework still applies to some institute-specific FOAs — operator must read the active FOA."

  # Sidecar augmentation 2026-05-18 per handback §4.5 NEW: foundation-evaluation rubric.
  - rubric_example: "Foundation evaluation grants (typical pattern)"
    weights:
      significance: "weighted"
      theory_of_change: "weighted"
      measurement_strategy: "weighted"
      capacity_to_execute: "weighted"
      dissemination: "weighted"
    source_citation: "https://www.rwjf.org/en/grants.html"
    note: "Foundation evaluation grants emphasize theory-of-change clarity + measurement strategy + utility-of-findings-for-practice over inferential statistical rigor; mixed-methods and qualitative are typically welcomed where well-designed; the rubric is less standardized than federal — operator must read each foundation's published guidance."

  # Sidecar augmentation 2026-05-18 per handback §4.5 NEW: AHRQ health-services rubric.
  - rubric_example: "AHRQ health-services research (NIH-derivative)"
    weights:
      significance: "scored_1_to_9"
      approach: "scored_1_to_9"
      investigators: "scored_1_to_9"
      innovation: "scored_1_to_9"
      environment: "scored_1_to_9"
      overall_impact: "scored_1_to_9_priority_score"
    source_citation: "https://www.ahrq.gov/funding/grant-mgmt/index.html"
    note: "AHRQ rubrics are NIH-derivative but health-services-specific (implementation science, dissemination science, patient-safety, comparative effectiveness). Mechanisms include R01, R03, R18, R36, K01/K08/K23. Operator must read the active FOA for per-mechanism scoring distribution."

# ---------------------------------------------------------------------------
# EVIDENCE WEIGHTS — what reviewers look for
# ---------------------------------------------------------------------------
evidence_weights:
  specific_aims:
    weight: "HIGH"
    rationale: "The single most-read page in NIH applications and analogous in NSF/IES — establishes whether the science is significant, the question answerable, and the team credible. Reviewers form their first impression here."
    source_citation: "https://grants.nih.gov/grants/how-to-apply-application-guide/format-and-write/develop-your-research-plan.htm"

  literature_review:
    weight: "HIGH"
    rationale: "Establishes the gap the work fills; demonstrates the team knows the field. Cursory or out-of-date literature signals weak scholarship."
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-04"

  preliminary_data:
    weight: "HIGH"
    rationale: "HIGH for NIH R01, AFRI standard projects, NSF mid-career programs, and any mechanism that explicitly assesses 'feasibility'. MEDIUM for early-stage mechanisms (NIH R21/R03, NSF EAGER, SBIR Phase I, IES Exploration goal) where the design accommodates less prior data. Operator must read the RFA."
    source_citation: "https://grants.nih.gov/grants/funding/r21.htm"

  study_protocol:
    weight: "HIGH"
    rationale: "Detailed protocol — study procedures, instruments, timing, fidelity monitoring — gives reviewers confidence the team can execute. For clinical/intervention research, often required as an attachment."

  evaluation_design:
    weight: "HIGH"
    rationale: "Analysis plan named in advance, sample-size justification with power calculation, handling of missing data. Vague 'we will analyze using appropriate methods' is a reviewer red flag."
    source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"

  data_management_plan:
    weight: "HIGH"
    rationale: "NSF requires DMP since 2011; NIH 2023 DMSP required for nearly all research applications; many private funders (Gates, Wellcome, RWJF) follow suit. Reviewers and program officers check for: storage during project, preservation after, sharing mechanism, repository identified, persistent identifiers (DOIs). NIH 2023 DMSP requires the plan to address six elements: (1) Data Type — types of scientific data generated, amount, modality, level of aggregation, processing state, metadata standards; (2) Related Tools, Software, and/or Code — what is needed to access or interpret the data; (3) Standards — applicable community-accepted data and metadata standards; (4) Data Preservation, Access, and Associated Timelines — repository selection, persistent identifier strategy, timeline relative to publication or end-of-award; (5) Access, Distribution, or Reuse Considerations — privacy / IRB / consent / legal limits on sharing, ethical considerations for sensitive data, controlled-access pathways; (6) Oversight of Data Management and Sharing — institutional roles responsible for ongoing DMSP compliance during the award. NSF DMP is a 2-page max supplementary document and varies in element coverage by directorate."
    source_citation: "https://sharing.nih.gov/data-management-and-sharing-policy/about-data-management-and-sharing-policies/data-management-and-sharing-policy-overview"

  irb_plan:
    weight: "HIGH"
    rationale: "Required HIGH where human subjects involved. NIH Human Subjects section is reviewed and scored separately. Vague risk language or missing vulnerable-population protections sink the application. Reviewers check for: (a) IRB-model declaration — single-IRB (sIRB) for multi-site NIH research, reliance agreement (SMART IRB / IAA), or local IRB-of-record; (b) explicit Subpart B (pregnant women / fetuses / neonates), Subpart C (prisoners), Subpart D (children) protections where applicable, plus added safeguards for cognitively impaired adults; (c) consent workflow for digital / remote / electronic data collection with comprehension verification where literacy / language / capacity warrants; (d) identifiable-data protection scheme — encryption, access controls, storage location (institutional / HIPAA-eligible cloud / etc.), retention and destruction policy. NIH PHS Human Subjects and Clinical Trials Information form pulls each element separately."
    source_citation: "https://www.hhs.gov/ohrp/regulations-and-policy/regulations/45-cfr-46/index.html"

  research_partner_letter:
    weight: "MEDIUM"
    rationale: "Letters from data providers, school districts, clinical sites, community partners, institutional collaborators. MEDIUM weight typical; can rise to HIGH for community-engaged research (CBPR) and IES (where partner commitments gate Development/Impact goals). Operational expectations: (a) signatory at appropriate authority (PI, department chair, district superintendent, clinical-site PI, executive director — NOT a junior staffer); (b) explicit commitment language naming the partner role (data provision, recruitment access, site hosting, co-investigation, sub-recipient sub-award) rather than generic 'we support this work'; (c) for institutional partners, statement of negotiated F&A / indirect-cost rate that will apply to any sub-award; (d) data-access provisions where the partner controls data (IRB-approval pathway, data-use-agreement intent, FERPA / HIPAA scope where applicable); (e) timing — signed letter dated within the funder's freshness window (typically within 12 months of submission, often within 6); for federal research, signed letters on partner letterhead are the norm. Typical applicant-partner configurations: community organization + R1 university; CDFI + research institute; school district + research firm; clinical practice + academic medical center."
    source_citation: "https://ies.ed.gov/ncer/projects/program.asp"

  biosketches:
    weight: "HIGH"
    rationale: "NIH biosketch (5-page max, SciENcv) and NSF biosketch (SciENcv format) are standardized and required. Reviewers look at: prior funding alignment, recent publications, key personnel methodological fit. Misformatted biosketches (wrong format, over page limit) trigger return without review."
    source_citation: "https://grants.nih.gov/grants/forms/biosketch.htm"

  dissemination_plan:
    weight: "MEDIUM"
    rationale: "MEDIUM baseline for fundamental research where peer-reviewed publication is the implicit norm. SHIFTS UPWARD in reviewer weighting (functionally HIGH) for translational, applied, education, and community-engaged research where the burden is on the team to specify named venues and audience-specific products — operator should treat as HIGH when the RFA names dissemination as a scored dimension or when the mechanism (IES Development/Impact, NSF AISL, NIH R34, foundation translational) presumes practitioner reach. Schema §18.6 enum constrains the field to HIGH | MEDIUM | LOW; the upward-shift conditions are documented in this rationale rather than encoded as a compound enum."

  methodology_linked_budget:
    weight: "HIGH"
    rationale: "Every personnel line and major direct cost should map to a named methodological task. Reviewers commonly compare budget to methods narrative — orphan line items or methods without budget support both sink scores."

  data_sharing_repository_named:
    weight: "MEDIUM"
    # Sidecar augmentation 2026-05-18 per handback §4.2: enumerate named repositories + persistent-identifier commitment.
    rationale: "NIH 2023 DMSP expects a named generalist repository (e.g., Dataverse, Zenodo, Figshare, ICPSR, OSF, Data Dryad) or domain-specific repository (GEO, dbGaP, ChEMBL, OpenNeuro, etc.). NSF Public Access Repository (PAR) for publications. Naming the repository in advance is a positive signal; reviewers expect a persistent-identifier commitment (DOI strategy) in the narrative — repository-named-only-aspirationally is a reviewer red flag."
    source_citation: "https://sharing.nih.gov/faqs"

  commercialization_plan:
    weight: "HIGH"
    rationale: "SBIR / STTR mechanisms only. Phase I requires commercialization intent; Phase II carries a heavily weighted standalone Commercialization Plan covering market opportunity, end-user definition, IP & data rights, financing strategy, competition, revenue projection, and Phase III pathway. Federal SBIR/STTR programs vary in emphasis (NIH SBIR weights scientific feasibility higher; DoD SBIR weights TRL advancement and commercialization track record higher; DOE SBIR favors clear path to market). Operator must read the agency-specific solicitation."
    source_citation: "https://www.sbir.gov/about"

  # Sidecar augmentation 2026-05-18 per handback §4.2 NEW evidence_weights.
  community_advisory_board_documentation:
    weight: "MEDIUM"
    rationale: "Names + affiliations + meeting cadence + decision-making authority + IRB-approved consent if board is a research subject vs research partner. MEDIUM at default; rises to HIGH for CBPR / IES Development & Impact / participatory grants. Reviewer red flag if board is named but not described, or described but has no decision authority. Schema §18.6 enum constrains the field to HIGH | MEDIUM | LOW; the upward-shift condition is documented in this rationale rather than encoded as a compound enum."

  irb_pre_approval_or_pre_submission_consult:
    weight: "MEDIUM"
    rationale: "For institutions with formal IRB processes, evidence that the team has consulted IRB pre-submission shortens post-award startup time. Names + institutional IRB contact + pre-consultation date. Reviewers (especially NIH study sections + IES peer reviewers) treat pre-submission IRB engagement as a soft positive signal indicating institutional readiness."

# ---------------------------------------------------------------------------
# PROVENANCE REQUIREMENTS — Logician-side citation discipline
# Sidecar augmentation 2026-05-18 per handback §4.3 NEW SECTION.
# Schema-optional under CLC schema; canonical item shape applies; item-level
# not.anyOf defense-in-depth enforced per §18 v1.1 RT-02 fold-in.
# ---------------------------------------------------------------------------
provenance_requirements:
  irb_documentation:
    required_citation_type: "IRB approval letter or pre-submission consultation note with institutional IRB contact + protocol number + approval date if approved."
    verbatim_quote_required: false
  dms_plan_repository_named:
    required_citation_type: "Named repository with persistent-identifier commitment; for non-generalist repositories, statement of why that repository is the right fit for the data type."
    verbatim_quote_required: false
  data_management_plan_six_elements_addressed:
    required_citation_type: "DMSP that addresses NIH 2023 six elements (data type / related tools / standards / preservation+access / reuse considerations / oversight). For NSF, the 2-page DMP addresses agency-specific elements per directorate."
    verbatim_quote_required: false
  human_subjects_protections_documented:
    required_citation_type: "PHS Human Subjects and Clinical Trials Information form completed; Subpart B / C / D protections where applicable; consent procedure with comprehension verification where literacy / language / capacity warrants; FERPA pathway for student educational records (IES / NSF education work)."
    verbatim_quote_required: false
  commercialization_plan_for_sbir_sttr:
    required_citation_type: "Commercialization Plan section per agency-specific SBIR/STTR template; addresses market opportunity + end-user + IP + financing + competition + Phase III pathway. Note: stays research-rigor-side per CLC-04 thesis; Market Access track_a / track_b carries commercial-readiness scoring."
    verbatim_quote_required: false

# ---------------------------------------------------------------------------
# COMMON APPLICATION FORMS
# ---------------------------------------------------------------------------
common_application_forms:
  - form_id: "SF-424 (R&R) Research and Related"
    form_version: "OMB Approved (current Grants.gov package)"
    required_for: "Most federal research grants (NIH, NSF, USDA NIFA, IES, ED, DOE Office of Science)"
    source: "https://www.grants.gov/forms/r-r-family.html"
    note: "Distinct from SF-424 (used for non-research federal grants). R&R family includes R&R Cover, R&R Other Project Information, R&R Senior/Key Person Profile, R&R Budget, R&R Subaward Budget Attachment Form."

  - form_id: "PHS 398 / PHS 2590 (NIH program-specific)"
    form_version: "Per FOA"
    required_for: "Some legacy NIH program announcements; mostly migrated to SF-424 (R&R) via ASSIST/Workspace"
    source: "https://grants.nih.gov/grants/funding/phs398/phs398.html"

  - form_id: "NIH ASSIST (Application Submission System & Interface for Submission Tracking)"
    form_version: "Online — NIH-hosted SF-424 (R&R) wrapper"
    required_for: "Most NIH FOAs (alternative to Workspace)"
    source: "https://public.era.nih.gov/assist/"

  - form_id: "NSF Research.gov"
    form_version: "Online (NSF migrated all proposals from FastLane to Research.gov; FastLane decommissioned)"
    required_for: "All NSF proposal submissions"
    source: "https://www.research.gov/research-web/"
    note: "FastLane was decommissioned for proposal preparation in 2023; all NSF preparation is now in Research.gov. Operator should verify current status — NSF migration is an ongoing program."

  - form_id: "Grants.gov Workspace"
    form_version: "Online — federal-wide submission portal"
    required_for: "Most federal research grants (alternative to agency-specific portals like ASSIST)"
    source: "https://www.grants.gov/applicants/apply-for-grants/workspace-overview.html"

  - form_id: "USDA NIFA AFRI online application (Grants.gov + NIFA Reporting/eRA)"
    form_version: "Per RFA"
    required_for: "USDA NIFA AFRI applications"
    source: "https://www.nifa.usda.gov/grants/apply-grant"

  - form_id: "USDA SARE regional submission systems"
    form_version: "Per region (Northeast/North Central/South/Western) per program"
    required_for: "USDA SARE grants — each region runs its own portal"
    source: "https://www.sare.org/grants/"

  - form_id: "IES eApplication"
    form_version: "Online — IES-hosted"
    required_for: "Some IES grants (mixed with Grants.gov for others)"
    source: "https://ies.ed.gov/funding/grants.asp"

  - form_id: "NIH Biosketch (SciENcv)"
    form_version: "5-page maximum, SciENcv-generated preferred"
    required_for: "NIH applications and inclusion in NSF applications"
    source: "https://grants.nih.gov/grants/forms/biosketch.htm"
    note: "SciENcv (Science Experts Network Curriculum Vitae) is the federally endorsed biosketch tool; auto-populates from ORCID + ERA Commons + NSF accounts."

  - form_id: "NSF Biosketch (SciENcv-generated, NSF format)"
    form_version: "Per current PAPPG"
    required_for: "All NSF proposals"
    source: "https://www.nsf.gov/bfa/dias/policy/nsfapprovedformats/biosketch.pdf"

  - form_id: "Data Management Plan (DMP) — DMPTool common"
    form_version: "Per agency template"
    required_for: "NSF (since 2011), NIH (DMSP since 2023), most federal research"
    source: "https://dmptool.org/"

# ---------------------------------------------------------------------------
# NARRATIVE SECTION PATTERNS
# ---------------------------------------------------------------------------
narrative_section_patterns:
  - section_name: "Project Summary / Abstract"
    typical_word_count: "250-500 (NIH 30 lines; NSF 1 page; IES varies)"
    source_citation: "https://grants.nih.gov/grants/how-to-apply-application-guide/format-and-write/develop-your-research-plan.htm"
    note: "Posted publicly if funded. Must be intelligible to a non-specialist reader. NSF format requires three labeled sections: Overview, Intellectual Merit, Broader Impacts."

  - section_name: "Specific Aims (NIH) / Project Description introduction (NSF)"
    typical_word_count: "1 page (NIH hard cap)"
    source_citation: "https://grants.nih.gov/grants/how-to-apply-application-guide/format-and-write/develop-your-research-plan.htm"
    note: "The single most-read page; sets the frame for the rest of the application."

  - section_name: "Significance"
    typical_word_count: "Section of NIH Research Strategy (12 pages total for R01); NSF folds into Project Description"
    source_citation: "https://grants.nih.gov/grants/how-to-apply-application-guide/format-and-write/develop-your-research-plan.htm"

  - section_name: "Background / Innovation"
    typical_word_count: "Section of NIH Research Strategy; NSF folds into Project Description"

  - section_name: "Approach (Research Plan / Methods)"
    typical_word_count: "Bulk of NIH Research Strategy; bulk of NSF Project Description (15 pages typical for standard NSF research)"
    source_citation: "https://www.nsf.gov/pubs/policydocs/pappg/index.jsp"
    note: "Reviewers spend the most reading time here. Approach typically dominates Overall Impact in NIH and Intellectual Merit in NSF."

  - section_name: "Evaluation / Analysis Plan"
    typical_word_count: "Embedded in Approach; for IES Impact and AFRI program-area projects often a named subsection"
    source_citation: "https://ies.ed.gov/funding/pdf/2024_84305A.pdf"

  - section_name: "Data Management Plan (DMP / DMS Plan)"
    typical_word_count: "NSF 2 pages (max); NIH DMS Plan no strict cap but typically 2-4 pages; varies by funder"
    source_citation: "https://sharing.nih.gov/data-management-and-sharing-policy/about-data-management-and-sharing-policies/data-management-and-sharing-policy-overview"

  - section_name: "Human Subjects (Protection of Human Subjects + Inclusion)"
    typical_word_count: "NIH PHS Human Subjects and Clinical Trials Information form; varies"
    source_citation: "https://grants.nih.gov/policy-and-compliance/policy-topics/human-subjects"
    note: "Where applicable. Includes Protection of Human Subjects, Inclusion of Women & Minorities, Inclusion of Children/Across the Lifespan, and Clinical Trials information."

  - section_name: "Broader Impacts (NSF)"
    typical_word_count: "Section of Project Description; not a separate document but distinct subsection per PAPPG"
    source_citation: "https://www.nsf.gov/funding/preparing/broaderimpacts.jsp"

  - section_name: "Dissemination Plan"
    typical_word_count: "200-500; longer for IES Development/Impact and translational programs"

  - section_name: "Investigator Qualifications / Personnel"
    typical_word_count: "Biosketches as separate attachments (NIH 5-page; NSF per PAPPG)"
    source_citation: "https://grants.nih.gov/grants/forms/biosketch.htm"

  - section_name: "References Cited / Bibliography"
    typical_word_count: "No page limit (NIH); included in main page count for some programs"

  - section_name: "Facilities & Other Resources / Equipment"
    typical_word_count: "Per agency template"

  - section_name: "Budget Justification"
    typical_word_count: "NIH 5 years modular = brief; non-modular = detailed; NSF page-limit varies; AFRI per RFA"

  - section_name: "Commercialization Plan (SBIR / STTR)"
    typical_word_count: "Phase I: brief commercialization-intent summary embedded in narrative; Phase II: standalone Commercialization Plan typically 10-15 pages including market opportunity, customer/end-user definition, IP & data rights, financing strategy, competition, revenue projection, and Phase-III-funding pathway"
    source_citation: "https://www.sbir.gov/about"
    note: "Required for SBIR / STTR mechanisms only. Phase II Commercialization Plan is heavily weighted in review; Phase III commercialization must be sustained without further SBIR/STTR funds. NIH SBIR/STTR has supplemental commercialization-readiness mechanisms (CRP, I-Corps at NIH) that operators should review when active."

  - section_name: "Intellectual Property & Technology Readiness (SBIR / STTR)"
    typical_word_count: "Embedded in Commercialization Plan; explicit TRL (Technology Readiness Level) staging where the funder requests it (DoD SBIR, DOE SBIR, NASA SBIR)"
    source_citation: "https://www.sbir.gov/about"
    note: "Names the IP position at award (background IP, foreground IP, ownership/license arrangement with partner institution under STTR), and the technology readiness level the project starts at and targets. Federal SBIR/STTR data rights protections (FAR 27.4xx; SBA Policy Directive) govern downstream use."

# ---------------------------------------------------------------------------
# BUDGET STRUCTURE CONVENTIONS
# ---------------------------------------------------------------------------
budget_structure_conventions:
  direct_cost_categories:
    - "personnel_salary_and_wages"
    - "fringe_benefits"
    - "equipment"
    - "travel"
    - "materials_and_supplies"
    - "consultants"
    - "subawards_subcontracts"
    - "publication_costs"
    - "participant_incentives_and_support_costs"
    - "computer_services_and_data"
    - "other_direct"
  indirect_cost_treatment: "Federal research grants honor the recipient organization's federally negotiated F&A (indirect cost) rate per 2 CFR 200, or de minimis 10% MTDC if no negotiated rate. Foundations vary widely — many private foundations cap indirect at 10-15% of direct, some prohibit indirect entirely. Operator must check each RFA / grant agreement. Effective 2025, federal F&A rate caps for NIH and other agencies are subject to executive-action volatility — Operator must verify the active rate at submission."
  match_requirements_typical: "NIH: no match required by default. NSF: varies — most research programs prohibit voluntary cost share unless solicitation specifies; some programs (EPSCoR, MRI) require cost share. USDA AFRI: match varies by program-area and project type — Foundational typically no match for standard research; AFRI Sustainable Agricultural Systems may require partner contributions per the RFA. USDA SARE Producer grants: no formal match. IES: no match required for most goals. Operator must read each RFA — match is mechanism-coded."
  source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"
  note: "Per A12 Decimal mandate — all monetary fields in proposal_commitments.yaml extracted from this card MUST be Decimal cents per §17 v1; no float arithmetic anywhere in budget composition."

# ---------------------------------------------------------------------------
# REVIEWER PROFILE TYPICAL
# ---------------------------------------------------------------------------
reviewer_profile_typical:
  reviewer_types:
    - "peer_reviewer_subject_matter_expert"
    - "nih_study_section_member"
    - "nsf_panelist"
    - "usda_nifa_panelist"
    - "ies_peer_reviewer"
    - "program_officer_gatekeeper_advisor_non_voting"
    - "statistical_or_methodological_reviewer"
    - "clinical_reviewer_nih_where_applicable"
    - "external_ad_hoc_reviewer"
    - "early_stage_investigator_reviewer_some_programs"
    # Sidecar augmentation 2026-05-18 per handback §4.1.
    - "nih_simplified_framework_reviewer"
  reviewer_priorities:
    - "(peer-reviewer) Is the question significant — does this work matter to the field?"
    - "(peer-reviewer) Is the team qualified — can they actually execute this?"
    - "(peer-reviewer) Is the approach rigorous — are the methods right for the question, with adequate sample size and analysis plan?"
    - "(peer-reviewer + program-officer) Is the work feasible — can it be done in the time and budget?"
    - "(peer-reviewer) Is the data management plan credible — repository named, sharing pathway clear?"
    - "(peer-reviewer + program-officer) Are human subjects protections adequate (where applicable)?"
    - "(peer-reviewer) Does dissemination reach the audiences who need the findings?"
    - "(peer-reviewer) (NSF) Are Broader Impacts substantive — concrete pathways, not boilerplate?"
    - "(program-officer) Does the proposal align with FOA priorities and the funder's current portfolio?"
    - "(program-officer) Is the budget realistic against agency benchmarks and program ceilings?"
    - "(program-officer) What is the programmatic risk profile — institutional stability, prior award performance, audit history?"
  common_red_flags_from_reviewer_pov:
    - "(peer-reviewer) Aims that don't connect to the methods — what you said you'd test is not what your design tests"
    - "(peer-reviewer) No power calculation or sample size justification — reviewer cannot tell if you can detect the effect you claim"
    - "(peer-reviewer) Vague analysis plan ('appropriate statistical methods') — reviewer assumes you don't know which"
    - "(peer-reviewer) Preliminary data missing where the mechanism expects it (R01, AFRI standard) or padded with unrelated work"
    - "(peer-reviewer) Methodologist absent from team for stats-heavy aim, or no clinician on a clinical aim"
    - "(peer-reviewer) DMP that says 'data will be available upon request' — NIH 2023 DMSP and NSF expect repository deposit"
    - "(peer-reviewer) Dissemination plan that says 'we will publish' without naming venues or timeline"
    - "(peer-reviewer) Broader Impacts (NSF) that just lists outreach activities without a logic model"
    - "(program-officer) Wrong mechanism — pitching an R01-scale project to an R21 budget cap, or vice versa"
    - "(program-officer) Misaligned with active FOA priorities or out-of-scope for the funding program"
    - "(program-officer) Budget anomalies — outsized travel, unjustified equipment, unallowable cost categories"
  source_citation: "https://grants.nih.gov/grants/peer/critiques/rpg.htm"

# ─────────────────────────────────────────────────────────────────────────────
# Reviewer culture subtypes — DRAFT per Run 4 synthesis §1.3 item 3
# ─────────────────────────────────────────────────────────────────────────────
# reviewer_culture_subtypes — draft per Run 4 synthesis §1.3 item 3. Operator
# reviews; field requires schema amendment before LOCK ceremony permits it.
reviewer_culture_subtypes:
  - subtype: "blind_peer_review"
    differentiation_note: "NIH study sections, NSF panels, USDA AFRI panels, IES peer review operate on blind / semi-blind peer review structure. Reviewers may not know applicant identity in some configurations; in NIH study sections reviewers ARE identified but operate under explicit conflict-of-interest disclosure. Decision logic emphasizes scientific merit + methodology + investigator track record + DMSP + IRB completeness."
    rubric_signal: "Rewards: specific aims clarity, methods rigor, named repository for data, complete IRB pathway, sample-size justification, falsifiable framing. Penalizes: vague research questions, missing power calculation, 'we will publish' boilerplate, anonymous community partner."
  - subtype: "federal_program_officer"
    differentiation_note: "Federal program officers (NIH, NSF, USDA NIFA, IES, AHRQ) operate as gatekeepers + advisors; non-voting at scoring panels but make funding decisions on programmatic alignment + budget + portfolio fit. Operate against FOA priorities + agency mission + Uniform Guidance + agency-specific compliance frameworks (NIH PHS forms, NSF PAPPG, USDA NIFA RFA series, IES research goal structure)."
    rubric_signal: "Rewards: explicit FOA-priority alignment, mechanism-appropriate scope, realistic budget against benchmarks, audit-clean institutional history, complete compliance paperwork. Penalizes: wrong-mechanism pitches, out-of-scope work, budget anomalies, missing compliance pre-requisites."
  - subtype: "foundation_program_officer"
    differentiation_note: "Foundation evaluation grants (RWJF, Spencer, Annie E. Casey, Doris Duke, Wellcome Trust health) operate against theory-of-change clarity + measurement strategy + utility-of-findings-for-practice. Mixed-methods and qualitative welcomed where well-designed; less standardized than federal — relationship + portfolio fit matter more."
    rubric_signal: "Rewards: explicit theory-of-change linking research to practice, measurement strategy with utility framing, named dissemination channels to practitioner audiences, capacity-to-execute evidence. Penalizes: methods-heavy with no practice connection, generic dissemination, missing utility framing."

