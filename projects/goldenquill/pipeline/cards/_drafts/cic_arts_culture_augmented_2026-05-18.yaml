evidence_signals:
  - kind: "work_samples"
    source_pattern: "audio / video / image / manuscript samples per NEA + funder discipline-specific work-sample requirements; uploaded URLs or hosted media"
    weight: "HIGH"
    freshness_tolerance_days: 1825
    source_citation: "NEA Grants for Arts Projects application — work-sample requirements drive substantial reviewer scoring weight"
  - kind: "artist_statement"
    source_pattern: "artist's own first-person statement of practice, intention, and current project — distinct from the funder-legible narrative"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "NEA + NEH applicant guidance; artist-residency + fellowship program common requirement"
  - kind: "artist_bio_and_cv"
    source_pattern: "bio, training, recognitions, exhibition / performance / publication history, teaching / community engagement record"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "NEA Key Personnel qualifications criterion; state arts council artist-fellowship application standard"
  - kind: "curatorial_or_program_plan"
    source_pattern: "curatorial premise, season programming, exhibition concept, performance lineup, artist roster — written program rationale"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "NEA Project Description criterion; IMLS Museums for America project-narrative requirement"
  - kind: "venue_agreement"
    source_pattern: "signed venue contract, letter of agreement, or rental confirmation — date-bound, with capacity + technical specs"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "NEA project-readiness criterion; foundation arts-grant venue-confirmation expectations"
  - kind: "audience_data"
    source_pattern: "prior-program attendance counts + demographics + geographic reach; ticket sales / box office; door counts; verified audience metrics"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "NEA + NEH narrative criterion — projected audience reach with prior-program substantiation"
  - kind: "prior_programming_history"
    source_pattern: "list of prior productions / exhibitions / performances / publications with dates, venues, audiences, press"
    weight: "HIGH"
    freshness_tolerance_days: 1825
    source_citation: "NEA Project History criterion; foundation-applicant track-record framing"
  - kind: "documentation_plan"
    source_pattern: "plan for documenting the funded work — photo / video / audio / written / archival — with rights-cleared protocol"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "NEA Documentation requirement; NEH Public Programs documentation expectations"
  - kind: "press_coverage"
    source_pattern: "reviews, interviews, features in arts press / regional press / specialty media — clipping or URL list"
    weight: "MEDIUM"
    freshness_tolerance_days: 1825
    source_citation: "Foundation arts-grant + NEA evaluation track-record framing"
  - kind: "partner_letters"
    source_pattern: "signed letters of commitment from venue, presenter, collaborator, school district (for educational components), tribal community (where applicable), municipal partner (for Our Town)"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "NEA Our Town partnership requirement (nonprofit + local-government MUST partner); NEA Grants for Arts Projects partnership criterion"
  - kind: "accessibility_plan"
    source_pattern: "ADA + Section 504 compliance plan — physical accessibility, sensory accessibility (ASL, audio description, captioning, sensory-friendly programming), program accessibility"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "NEA Office of Accessibility + Section 504 mandate; required-by-law for federal grant recipients"
  - kind: "production_budget"
    source_pattern: "line-item project budget — artist fees, technical costs, venue, marketing, documentation, accessibility, indirect — tied to work plan"
    weight: "HIGH"
    freshness_tolerance_days: 90
    source_citation: "NEA Budget criterion; foundation arts-grant budget-narrative standard"
  - kind: "artist_fee_documentation"
    source_pattern: "named artist fees with rate justification — W.A.G.E.-aligned where applicable; union scale (AEA, AGMA, SAG-AFTRA, Local 802) where applicable"
    weight: "HIGH"
