  disqualifier_terms:
    - term: "for-profit production company"
      reason: "NEA + NEH + IMLS direct grants generally require 501(c)(3) nonprofit status, units of state/local government, or federally recognized tribal communities. For-profit production companies are generally ineligible for direct federal arts grants. Fiscal sponsorship is only a route if the sponsor itself is a 501(c)(3) AND the sponsored project meets the sponsor's eligibility rules — the for-profit applicant cannot independently use fiscal sponsorship to bypass the 501(c)(3) requirement. Verify per active RFA."
    - term: "personal hobby project"
      reason: "Federal arts agencies and major foundations require demonstrable artistic practice with public dimension (work samples, prior programming, audience-engagement plan). Personal hobby framing flags mismatch."
    - term: "general operating support without project frame"
      reason: "NEA + NEH project lines (Grants for Arts Projects, Public Programs) require a defined project, not unrestricted operating funds. State arts councils and some foundations DO offer GOS — verify program type before routing."
    - term: "academic research grant"
      reason: "NEH does fund academic humanities research; NEA does not fund pure academic research. Route academic research projects to NEH research divisions, not NEA project lines."
    # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.1) ──
    - term: "non-501(c)(3) without fiscal sponsor"
      reason: "NEA + NEH + IMLS direct-grant eligibility requires 501(c)(3) status, unit of state/local government, or federally recognized tribal community. Non-501(c)(3) applicants WITHOUT a qualifying fiscal sponsor are categorically ineligible. Surface fiscal-sponsorship pathway at intake if applicable."
    - term: "religious-purpose-only programming"
      reason: "Federal arts grants are subject to First Amendment Establishment Clause limits — programming whose sole or primary purpose is religious worship, religious instruction, or proselytization is ineligible for direct federal arts funding. Cultural / heritage / artistic programming involving religious content may be eligible; verify the primary-purpose distinction per active RFA."
    - term: "for-profit-only commercial production"
      reason: "NEA + NEH eligibility excludes for-profit-only commercial entertainment / commercial production where there is no nonprofit, government, or tribal-community applicant or qualifying fiscal sponsor."
    - term: "non-US-domestic project"
      reason: "Most US federal arts grants (NEA / NEH / IMLS) require the project to occur within the United States or its territories. International-only projects route to Ford Foundation / Bertha Foundation / other internationally-scoped funders; verify per active RFA."

