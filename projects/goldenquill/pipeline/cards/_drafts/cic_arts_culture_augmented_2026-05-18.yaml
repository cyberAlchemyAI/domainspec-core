# ─────────────────────────────────────────────────────────────────────────────
# KFR fact classes — Intake / Logician consumption
# ─────────────────────────────────────────────────────────────────────────────
kfr_fact_classes:
  - fact_class: "discipline"
    description: "Primary artistic / cultural discipline — Visual Arts / Theater / Musical Theater / Opera / Dance / Music / Folk & Traditional / Media Arts / Design / Literary / Crafts / Interdisciplinary / Artist Communities / Local Arts Agencies / Presenting & Multidisciplinary Works / Public Humanities."
    typical_provenance: "applicant self-attestation; aligned with NEA / NEH / state arts council discipline taxonomy on application form"
  - fact_class: "project_history"
    description: "Prior productions / exhibitions / performances / publications / programs by year + venue + audience + collaborators."
    typical_provenance: "applicant CV / programs / press archive; published reviews; venue archives"
  - fact_class: "artist_credentials"
    description: "Artist CV — training, education, residencies, fellowships, recognitions, awards, teaching positions, commissions."
    typical_provenance: "CV; institutional letters; award announcements; press"
  - fact_class: "audience"
    description: "Prior + projected audience size, demographic composition, geographic reach (zip code / county / region), accessibility-served audience."
    typical_provenance: "ticket sales records; door counts; surveys; demographic studies; venue reports"
  - fact_class: "venue_or_site"
    description: "Production / exhibition / performance / installation site — owned, leased, partnered, public site (for public art)."
    typical_provenance: "venue agreement; deed; lease; municipal-partner letter; tribal-council letter (where applicable)"
  - fact_class: "confirmed_dates"
    description: "Project start + end dates; performance / opening dates; rehearsal / install / strike windows; tour dates (for touring work)."
    typical_provenance: "venue contract; production schedule; tour itinerary"
  - fact_class: "work_samples"
    description: "Sample audio / video / image / text / digital media representative of artistic practice + current project."
    typical_provenance: "uploaded media files; URLs; portfolio site; published recordings"
  - fact_class: "partner_organizations"
    description: "Co-presenting organizations, collaborating artists' companies, school district partners (educational programming), tribal community partners (cultural-heritage work), municipal partners (Our Town requirement)."
    typical_provenance: "signed letters of commitment; MOUs; co-presentation agreements"
  - fact_class: "artist_fees"
    description: "Named artist fees by role + rate + justification — W.A.G.E. or union-scale alignment where applicable."
    typical_provenance: "budget narrative; union contracts; W.A.G.E. fee calculator output"
  - fact_class: "production_budget"
    description: "Full project budget by line item — personnel, artist fees, technical, venue, marketing, documentation, accessibility, indirect."
    typical_provenance: "applicant budget spreadsheet; budget narrative"
  - fact_class: "accessibility"
    description: "ADA / Section 504 accessibility provisions — physical (ramps, seating), sensory (ASL, audio description, captioning), program (sensory-friendly performances, accessible programming, accessible website / materials)."
    typical_provenance: "accessibility plan; venue accessibility audit; ADA coordinator letter"
  - fact_class: "documentation_plan"
    description: "Plan for capturing + archiving the funded work — photo / video / audio / written / archival — with rights-cleared protocol."
    typical_provenance: "documentation plan narrative; archival agreement; documenter contract"
  - fact_class: "rights_and_permissions"
    description: "Performing rights, reproduction rights, image rights, music sync rights, public-performance licenses, talent releases, image-of-minor releases."
    typical_provenance: "ASCAP / BMI / SESAC license; rights-holder permission letter; signed releases"
  - fact_class: "fiscal_sponsor"
    description: "501(c)(3) fiscal sponsor — name, EIN, determination-letter date, sponsor fee schedule, fund-routing protocol — for fiscally sponsored applicants only."
    typical_provenance: "sponsor 501(c)(3) determination letter; signed fiscal-sponsorship agreement; sponsor fee schedule"
  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.3) ──
  - fact_class: "accessibility_compliance_status"
    description: "Designated accessibility coordinator (orgs 15+ employees per Section 504); written accessibility plan (cultural accessibility plan covering physical / program / sensory access); recent accessibility evaluation; venue / facility accessibility-audit record; accommodation-request protocol."
    typical_provenance: "accessibility coordinator designation document; written cultural accessibility plan; recent accessibility audit report; NEA Office of Accessibility self-evaluation"
  - fact_class: "fiscal_sponsor_relationship"
    description: "501(c)(3) status of sponsor verified; fiscal-sponsor agreement terms (signed, current); expense-pass-through fee structure transparent; project-vs-sponsor expense allocation documented."
    typical_provenance: "501(c)(3) determination letter; signed fiscal-sponsor agreement; recent expense allocation memo + fee schedule"
  - fact_class: "artist_fee_practice_documentation"
    description: "Per-artist-day rates; honoraria scale; W.A.G.E. certification status (where applicant pursues certification); commission fee structure for visual / public art; union-scale alignment (AEA / AGMA / SAG-AFTRA / Local 802) where applicable."
    typical_provenance: "artist-fee schedule; W.A.G.E. certification letter if applicable; commission-fee contract template; union contract references"

# ─────────────────────────────────────────────────────────────────────────────
# Provenance requirements per fact class
# ─────────────────────────────────────────────────────────────────────────────
provenance_requirements:
  work_samples:
    required_citation_type: "URL or hosted-media reference with discipline + date + role; verbatim title/credits required for reviewer-facing samples"
    verbatim_quote_required: true
  artist_credentials:
    required_citation_type: "CV with verifiable institutions / programs / dates; named recognitions with conferring body + year"
    verbatim_quote_required: false
  audience:
    required_citation_type: "ticket-sales record, door-count log, survey instrument, or venue-attendance report — verbatim figures preserved"
    verbatim_quote_required: true
  venue_or_site:
    required_citation_type: "signed venue agreement or letter of intent — verbatim venue name + dates + capacity preserved"
    verbatim_quote_required: true
  partner_organizations:
    required_citation_type: "signed letter of commitment (LOC) or MOU — verbatim partner name + role + commitment terms preserved"
    verbatim_quote_required: true
  artist_fees:
    required_citation_type: "budget narrative line item with rate justification (W.A.G.E. fee calculator output or union scale citation)"
    verbatim_quote_required: false
  fiscal_sponsor:
    required_citation_type: "IRS 501(c)(3) determination letter + signed fiscal-sponsorship agreement — verbatim sponsor legal name + EIN preserved"
    verbatim_quote_required: true
  rights_and_permissions:
    required_citation_type: "rights-holder permission letter, license agreement, or performing-rights organization (ASCAP/BMI/SESAC) license"
    verbatim_quote_required: false
  accessibility:
    required_citation_type: "accessibility plan narrative + venue ADA assessment; ADA Coordinator attestation where org has one"
    verbatim_quote_required: false
  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.3) ──
  accessibility_compliance_status:
    required_citation_type: "accessibility coordinator designation document + written cultural accessibility plan + recent accessibility audit record"
    verbatim_quote_required: false
  fiscal_sponsor_relationship:
    required_citation_type: "501(c)(3) determination letter + signed fiscal-sponsor agreement + fee schedule"
    verbatim_quote_required: true
  artist_fee_practice_documentation:
    required_citation_type: "artist-fee schedule with rate justification (W.A.G.E. calculator output, union-scale reference, or commission-fee template)"
    verbatim_quote_required: false

# ─────────────────────────────────────────────────────────────────────────────
# Register defaults — Scribe consumption
# ─────────────────────────────────────────────────────────────────────────────
register_defaults:
  language_register: "hybrid"
  narrative_voice: "applicant_as_character"
  tone: "custom"
  operator_override: "PROJECT_CONTEXT match_overrides take precedence"
  # Voice-preservation discipline — machine-readable structured cue for Scribe.
  # Arts-culture applicants are uniquely vulnerable to silent register-
  # flattening. The named sections below MUST be preserved verbatim from the
  # applicant; light-touch clarity edits only with explicit operator
  # authorization. All other narrative sections receive standard funder-
  # legible translation. Operator may extend this list per PROJECT_CONTEXT.
  preserve_voice_sections:
    - "artist_statement"
    - "curatorial_premise"
    - "work_sample_narration"
    - "artist_self_identification"  # protects Law 4 — verbatim self-ID
                                    # by named artist must not be rewritten

# Arts & Culture register has a distinctive double-voice requirement that
# distinguishes it from every other CIC:
#
#   - The artist's voice (work-sample narration, artist statement, curatorial
#     premise) must be PRESERVED as the artist wrote it. Reviewers look at the
#     artist statement specifically to hear the artist, not the grant writer.
#     Flattening this voice into "neutral_institutional" destroys the artistic
#     merit signal reviewers depend on. Scribe MUST NOT rewrite artist-voice
#     sections without explicit operator authorization (and even then, edits
#     stay light-touch — clarity, not voice replacement).
#
#   - The funder-legible frame (project description, audience reach,
#     sustainability, evaluation, capacity) translates the artistic work into
#     reviewer-scorable language. This is where Scribe earns its keep — taking
#     the artist's substance and putting it in language a panelist who reviews
#     30 applications a day can score quickly against a rubric.
#
# The hybrid register + applicant_as_character voice + custom tone enum
# captures this. Operator override at PROJECT_CONTEXT level sets the artist-
# voice / funder-frame split per applicant. Default: artist statement + work
# sample narration = preserve verbatim; everything else = funder-legible
# translation with the artist's substance intact.
#
# Anti-pattern (Scribe must avoid): treating an arts grant like a research
# grant. Research-grant register flattens artistic specificity into generic
# "innovation / impact / outcomes" language and reads to arts panels as a
# capacity-building proposal that wandered into the wrong stack.

# ─────────────────────────────────────────────────────────────────────────────
# Dialect routing table — Scribe per Law 4
# ─────────────────────────────────────────────────────────────────────────────
dialect_routing_table:
  - funder_political_axis: "conservative"
    dialect: "scribe.formal_civic_heritage"
    example_funder: "NEA Folk & Traditional Arts (preservation + heritage emphasis); NEH Public Programs (preservation + heritage emphasis); state heritage commissions"
  - funder_political_axis: "centrist"
    dialect: "scribe.technical_precise"
    example_funder: "Pennsylvania Council on the Arts; state arts councils generally; NEH Sustaining Cultural Heritage Collections; NEH Preservation & Access (technical / institutional framing)"
  - funder_political_axis: "progressive"
    dialect: "scribe.movement_aligned"
    example_funder: "Mellon Foundation; Doris Duke Charitable Foundation; Ford Foundation Creativity and Free Expression; Surdna Thriving Cultures; Heinz Endowments Creativity"
  - funder_political_axis: "soul_fire"
    dialect: "scribe.cultural_sovereignty"
    example_funder: "Native Arts and Cultures Foundation (NACF); First Peoples Fund; NDN Collective arts portfolio; cultural-sovereignty-aligned regional grantmakers"

# ─────────────────────────────────────────────────────────────────────────────
# Admin-risk term register — Law 4 axis (b)
# Per operator OQ-5: approval_required: true defaults. Per L-005 (lessons
# memory): substitutions that settle across enough cycles may flip to false
# per-term per-card at a future Archivist Reflection sub-mode pass.
#
# CRITICAL CONTEXT (illustrative, not normative across administrations): As
# of authoring date (2026-05-15), NEA + NEH grant terms following EO 14151
# (DEI executive order) and EO 14168 ("Defending Women From Gender Ideology
# Extremism") have carried explicit funding-clause restrictions. Recipients
# have been required to attest they will not "operate any programs promoting
# gender ideology" and will not "use Federal funds to promote DEI." This has
# made both DEI- and gender-identity-coded vocabulary HIGH severity for any
# NEA / NEH route under the administration in force at authoring time. State
# arts councils that pass through NEA partnership funds inherit downstream
# restrictions on the federal portion. Substitution candidates here are
# operator-grade — every term requires operator review; never silent rewrite.
#
# DEFER-TO-ACTIVE-RFA DISCIPLINE (Tilth-wide): EO 14151 + EO 14168 are
# named here as illustrative reviewer-context anchors for the authoring-time
# administration, NOT as permanent ground truth. Federal arts-grant
# attestation language has changed mid-cycle and will continue to change
# across administrations. Scribe + Logician MUST defer to the per-active-RFA
# attestation language at runtime. Operator re-reads NEA grant terms at
# every cycle. Between-administration refresh of admin_risk_term_register
# is an Archivist Reflection backlog item (see _review_handback).
#
# IMPORTANT — operational severity preserved: the illustrative-anchor
# reframing above applies ONLY to the EO 14151 / EO 14168 framing context.
# Per-term severity values (HIGH / MEDIUM / LOW) in each admin_risk_term_
# register entry remain operationally NORMATIVE at runtime. Operator MUST
# honor each term's severity tier per its reviewer_context — the
# illustrative-anchor framing does NOT downgrade the operational HIGH on
# entries like queer / trans / DEI / racial justice / anti-racist / gender
# ideology. The reframing prevents the card from aging poorly across
# administrations; it does not soften the operational defense at runtime.
# ─────────────────────────────────────────────────────────────────────────────
admin_risk_term_register:
  - flagged_term: "radical"
    severity: "MEDIUM"
    substitution_candidates:
      - "ambitious"
      - "field-shifting"
      - "transformative artistic vision"
      - "bold artistic risk-taking"
    reviewer_context: |
      Reads as activist signaling to conservative review climates and many
      state arts councils. Progressive philanthropy + experimental-arts
      funders (MAP Fund, Creative Capital) accept; cultural-sovereignty
      funders accept. Match to funder dialect; verify if active RFA uses
      the term.
    approval_required: true

  - flagged_term: "abolition"
    severity: "HIGH"
    substitution_candidates:
      - "reimagining systems"
      - "post-carceral cultural practice"
      - "transformative justice through art"
      - "alternatives to incarceration"
    reviewer_context: |
      Activist register that carries explicit political demand framing in
      conservative + centrist review climates. Even progressive arts
      foundations may prefer functional descriptions of the work rather
      than the abolitionist frame. Cultural-sovereignty funders accept the
      term. Operator decides per application.
    approval_required: true

  - flagged_term: "decolonial"
    severity: "HIGH"
    substitution_candidates:
      - "centering Indigenous knowledge"
      - "Indigenous-led cultural practice"
      - "tradition-bearer-led work"
      - "community-rooted methodology"
    reviewer_context: |
      Activist register; conservative + centrist panels reject. NACF, First
      Peoples Fund, and similar cultural-sovereignty funders accept and
      expect. Mellon and Ford accept selectively. Match to funder dialect
      precisely.
    approval_required: true

  - flagged_term: "liberation"
    severity: "MEDIUM"
    substitution_candidates:
      - "self-determination"
      - "creative autonomy"
      - "community agency"
      - "freedom of artistic expression"
    reviewer_context: |
      Reads as activist framing in conservative + centrist climates;
      progressive philanthropy accepts. Soul-fire-aligned + cultural-
      sovereignty funders expect. The First Amendment / free-expression
      reframe ("freedom of artistic expression") is reviewer-neutral
      across all four political axes.
    approval_required: true

  - flagged_term: "resistance"
    severity: "MEDIUM"
    substitution_candidates:
      - "response to current conditions"
      - "civic engagement through art"
      - "First Amendment artistic practice"
      - "critical cultural commentary"
    reviewer_context: |
      Reads as activist framing in conservative + centrist climates;
      progressive philanthropy accepts; soul-fire funders expect. The
      First Amendment reframe lands across the spectrum if the actual work
      is critical/commentary-based.
    approval_required: true

  - flagged_term: "queer"
    severity: "HIGH"
    substitution_candidates:
      - "LGBTQ-identified artists and audiences"
      - "(verbatim self-identification by named artist with their consent)"
      - "(no substitution — operator decides per RFA whether to retain or omit identity framing)"
    reviewer_context: |
      Under EO 14168 + post-EO 14151 NEA + NEH funding-clause environment,
      identity-based vocabulary on federal arts grants carries documented
      enforcement risk. State arts councils that pass NEA partnership
      funds inherit federal-portion restrictions. Foundation funders vary;
      progressive + cultural-sovereignty funders explicitly fund queer
      arts work and expect the vocabulary. CRITICAL: when an artist self-
      identifies as queer in their own statement, that artist-voice
      remains theirs — Scribe MUST NOT rewrite verbatim self-
      identification. Operator decides per RFA whether to route to a
      funder where retention is safe, or whether identity framing should
      be omitted from the funder-legible frame while artist-voice
      sections preserve self-identification.
    approval_required: true

  - flagged_term: "trans"
    severity: "HIGH"
    substitution_candidates:
      - "(verbatim self-identification by named artist with their consent)"
      - "(no substitution — operator decides per RFA whether to retain or omit identity framing)"
      - "LGBTQ-identified (where applicant authorizes umbrella framing)"
    reviewer_context: |
      Under EO 14168 ("Defending Women From Gender Ideology Extremism") +
      NEA funding clause requiring recipients to attest they will not
      "operate any programs promoting gender ideology", trans-identified
      vocabulary carries documented federal enforcement risk on NEA + NEH
      and state-pass-through portions. Foundation funders vary; many
      progressive + cultural-sovereignty foundations explicitly fund work
      by and about trans artists and expect the vocabulary. CRITICAL
      same as "queer": artist-voice self-identification must NOT be
      rewritten; operator decides per RFA on routing and on funder-
      legible framing.
    approval_required: true

  - flagged_term: "gender ideology"
    severity: "HIGH"
    substitution_candidates:
      - "(do not use this term in applicant materials — it is the federal-restriction-side framing, not the applicant-side framing)"
      - "gender + identity in artistic practice (where applicant has work in this domain and funder accepts)"
      - "(operator-only flag — Scribe surfaces the federal-restriction context for operator review)"
    reviewer_context: |
      FRAMING NOTE: This term is the federal-restriction-side framing
      (introduced under EO 14168 as illustrative of the authoring-time
      attestation environment), NOT applicant-side vocabulary. Tilth
      surfaces it so Logician can detect it in an applicant draft as a
      Scribe error to flag for operator review — not as a substitution
      target for applicant-voice content. If it appears anywhere in
      applicant draft material, that is a Scribe error to surface for
      operator review. Logician should treat any draft containing this
      phrase as a HIGH-severity admin-risk hit requiring operator
      confirmation. Verify exact federal-restriction language per
      active RFA — defer-to-RFA discipline applies.
    approval_required: true

  - flagged_term: "racial justice"
    severity: "HIGH"
    substitution_candidates:
      - "racial equity"
      - "underrepresented-artist support"
      - "BIPOC artistic leadership"
      - "historically excluded community artists"
      - "(no substitution — operator decides per RFA)"
    reviewer_context: |
      Under EO 14151 + downstream NEA + NEH funding-clause environment
      restricting "DEI" framing on federal arts grants, racial-justice
      vocabulary carries documented enforcement risk. Foundation funders
      vary widely — Mellon, Ford, Surdna explicitly fund racial-justice-
      framed arts work. State arts councils that pass NEA partnership
      funds inherit federal-portion restrictions. Operator decides per
      RFA. (Mirrors admin_risk_register.yaml v2.2 entry; severity tier
      consistent with RED → HIGH map.)
    approval_required: true

  - flagged_term: "censorship"
    severity: "MEDIUM"
    substitution_candidates:
      - "First Amendment protection of artistic expression"
      - "free expression"
      - "artistic freedom"
      - "content restriction concerns"
    reviewer_context: |
      Reads as advocacy / litigation framing in conservative + centrist
      review climates if used as a primary frame. The First Amendment
      reframe ("free expression / artistic freedom") lands across the
      spectrum and is reviewer-neutral. Use only when the work itself is
      anti-censorship-themed and the funder explicitly funds free-
      expression work (e.g., NCAC partners, Ford Foundation Creativity
      and Free Expression).
    approval_required: true

  - flagged_term: "occupation"
    severity: "HIGH"
    substitution_candidates:
      - "(operator decides per context — political-occupation framing carries explicit risk)"
      - "site-specific intervention (for art-installation context)"
      - "civic presence / public-art intervention (for placemaking context)"
    reviewer_context: |
      Term carries multiple meanings across arts contexts: (a) site-
      specific or durational artistic practice (Marina Abramović "The
      Artist Is Present" tradition), (b) explicit political-protest
      framing (Occupy Wall Street descendants, contested-territory
      framing). (b) reads as activist signaling in conservative + centrist
      panels and may carry foreign-policy political weight. Operator
      decides per RFA + per artwork context. Substitute only after
      verifying the artist's intended meaning.
    approval_required: true

  - flagged_term: "DEI / equity / inclusion"
    severity: "HIGH"
    substitution_candidates:
      - "underrepresented-artist outreach"
      - "expanded artist pool"
      - "broader audience engagement"
      - "historically excluded community artists"
      - "accessibility (where ADA / Section 504 framing applies)"
    reviewer_context: |
      Under current federal administration framing (EO 14151 + downstream
      NEA + NEH funding-clause language), DEI / equity / inclusion
      vocabulary carries documented enforcement risk on federal arts
      grants and state-pass-through NEA partnership portions. ADA /
      Section 504 accessibility framing remains separately required-by-
      law and is reviewer-neutral. Foundation funders vary widely.
      Operator decides per RFA. (Mirrors admin_risk_register.yaml v2.2
      entry; severity tier RED → HIGH map.)
    approval_required: true

  - flagged_term: "social justice"
    severity: "MEDIUM"
    substitution_candidates:
      - "civic engagement through art"
      - "community-responsive art-making"
      - "artistic practice in dialogue with current conditions"
      - "publicly engaged practice"
    reviewer_context: |
      Reads as movement-aligned framing in conservative review climates;
      centrist panels accept selectively; progressive + cultural-
      sovereignty funders accept and expect. Match to funder dialect.
    approval_required: true

  - flagged_term: "anti-racist"
    severity: "HIGH"
    substitution_candidates:
      - "broadly inclusive artistic programming"
      - "(no substitution — operator decides per RFA)"
      - "expanded artist pool reflecting community demographics"
    reviewer_context: |
      Under EO 14151 + post-EO NEA / NEH funding-clause environment,
      anti-racist framing carries documented enforcement risk on federal
      arts grants. Some progressive foundations expect the vocabulary
      (Surdna Thriving Cultures); others have moved to indirect framing
      to maintain funding-clause compliance for cross-funded grantees.
      Operator decides per RFA + per applicant funder mix.
    approval_required: true

  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.4) ──
  - flagged_term: "cultural appropriation"
    severity: "MEDIUM"
    substitution_candidates:
      - "cross-cultural artistic exchange (with named cultural-partner consent documentation)"
      - "Indigenous-knowledge centering (with tribal-partner consent)"
      - "cultural-bearer-led practice (operator-grade with cultural-partner attestation)"
      - "(no substitution — operator decides per RFA when active RFA uses critical-discourse framework)"
    reviewer_context: |
      Term reads as activist framing in conservative review climates;
      reads as critical-discourse framework in academic / cultural-
      sovereignty-aligned funder contexts. When applicant work involves
      cross-cultural practice with named cultural partners, the cultural-
      partner-consent-documentation framing is operator-defensible across
      all four political axes. Tilth flags the term for operator decision;
      never silent substitution.
    approval_required: true

  - flagged_term: "Indigenous knowledge"
    severity: "MEDIUM"
    substitution_candidates:
      - "traditional knowledge (with tribal-partner attribution)"
      - "tradition-bearer-led methodology"
      - "Native American Languages Act-anchored Indigenous-language practice"
      - "cultural-bearer-led cultural-heritage work"
      - "(no substitution — retain verbatim for NACF / First Peoples Fund / cultural-sovereignty-aligned funders)"
    reviewer_context: |
      Term carries cultural-sovereignty-practice provenance in NACF /
      First Peoples Fund / cultural-sovereignty-aligned funder contexts.
      Conservative federal review climates accept the term when paired
      with tribal-partner attribution; centrist climates accept selectively.
      Tilth respects cultural-sovereignty-practice provenance; substitution
      applies only for funder-legible-frame routing, never for artist-
      voice content. Defer-to-active-RFA discipline applies.
    approval_required: true

# ─────────────────────────────────────────────────────────────────────────────
# Reporting cadence
# ─────────────────────────────────────────────────────────────────────────────
reporting_cadence_typical:
  default_frequency: "project_based"
  per_funder_overrides:
    NEA_Grants_for_Arts_Projects: "Final Descriptive Report + Federal Financial Report (SF-425) at project close; interim per project schedule"
    NEA_Our_Town: "annual progress + final descriptive + Federal Financial Report (SF-425); 2-year project period typical"
    NEA_Challenge_America: "Final Descriptive Report + SF-425 at close; flat $10,000 award structure"
    NEA_Folk_and_Traditional_Arts: "Final Descriptive + SF-425; some apprenticeship grants require interim documentation"
    NEH_Public_Programs: "Annual Performance Report + Federal Financial Report; final at project close (typically 2-3 year period)"
    NEH_Preservation_and_Access: "Annual Performance Report + Federal Financial Report; longer project periods (1-3 years)"
    NEH_Sustaining_Cultural_Heritage_Collections: "Annual Performance Report + Federal Financial Report; 1-3 year project periods"
    IMLS_Museums_for_America: "Annual Performance Report + final; 1-3 year project periods"
    PA_Council_on_the_Arts: "Final Report; some lines (PPA Re-grant) require interim midpoint report"
    State_arts_councils_general: "Final Report typical; annual where multi-year"
    Mellon_Foundation: "Annual narrative + financial; final at project close (typically multi-year)"
    Doris_Duke_Charitable_Foundation: "Annual narrative + financial; final at project close"
    Ford_Foundation: "Annual narrative + financial; final at project close"
    Knight_Foundation: "Final report typical; some Knight Arts Challenge lines have specific midpoint requirements"
    Native_Arts_and_Cultures_Foundation: "Final narrative + financial; some fellowship lines require interim reflection"
    # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.7) ──
    IMLS_Native_American_Library_Services: "Annual Performance Report + Federal Financial Report (SF-425); Basic + Enhancement Grant cycles"
    AARP_Foundation_arts_and_aging: "Annual narrative + financial; final at project close (creative-aging program lines)"
    Creative_Capital: "Final narrative + financial; some lines require multi-year check-ins for risk-taking experimental-arts projects"
    MAP_Fund: "Final narrative + financial; performing-arts project grant cycle reporting"
    State_humanities_councils_general: "Final Report typical; annual where multi-year; per-state NEH partnership variation"

# ─────────────────────────────────────────────────────────────────────────────
# Metrics table template
# ─────────────────────────────────────────────────────────────────────────────
metrics_table_template:
  - metric: "audience reached (total attendance)"
    unit: "count"
    typical_target_range: "applicant-specific; tied to venue capacity × performances"
    source_for_target: "venue-capacity × number-of-performances; prior-program attendance baseline"
  - metric: "audience demographics (under-served-community served)"
    unit: "count + percentage"
    typical_target_range: "applicant-specific"
    source_for_target: "venue location + program design; demographic survey instrument"
  - metric: "audience geographic reach (zip codes / counties / regions served)"
    unit: "count of zip codes / counties / regions"
    typical_target_range: "applicant-specific"
    source_for_target: "ticket data; survey; program-distribution map"
  - metric: "works produced / exhibited / performed / published"
    unit: "count of works"
    typical_target_range: "applicant-specific"
    source_for_target: "project work plan"
  - metric: "performances / showings / exhibitions / screenings"
    unit: "count of events"
    typical_target_range: "applicant-specific"
    source_for_target: "venue contract + production schedule"
  - metric: "artists engaged + artist fees paid"
    unit: "count of artists + USD"
    typical_target_range: "applicant-specific (W.A.G.E.-aligned where applicable)"
    source_for_target: "production budget; artist contracts"
  - metric: "press coverage / earned media (impressions / placements)"
    unit: "count of placements + estimated impressions"
    typical_target_range: "applicant-specific"
    source_for_target: "press tracking; PR firm report; clipping service"
  - metric: "accessibility accommodations served"
    unit: "count of ADA / Section 504 accommodations provided"
    typical_target_range: "applicant-specific (varies by program type)"
    source_for_target: "accessibility plan; venue ADA assessment"
  - metric: "partner organizations engaged"
    unit: "count of partner orgs + named partner roster"
    typical_target_range: "applicant-specific"
    source_for_target: "partnership LOCs / MOUs"
  - metric: "communities served"
    unit: "count of named communities / neighborhoods / municipalities"
    typical_target_range: "applicant-specific"
    source_for_target: "community partner letters; venue location; outreach plan"
  - metric: "post-grant continuation indicators"
    unit: "narrative + revenue / commitment indicators"
    typical_target_range: "applicant-specific"
    source_for_target: "sustainability plan; renewal venue commitments; downstream revenue projections"

# ─────────────────────────────────────────────────────────────────────────────
# Cross-references — Program Rule Packs (PRP)
# Sidecar augmentation pass 2026-05-18
# ─────────────────────────────────────────────────────────────────────────────
cross_references_prp:
  - prp_id: "TILTH-PRP-2CFR200"
    applicability: "NEA / NEH / IMLS federal arts grants apply 2 CFR 200 Uniform Guidance administrative requirements; canonical federal-admin PRP for any direct federal arts grant or state-arts-council NEA partnership pass-through portion."
    fires_when: "Active opportunity is federal arts agency (NEA / NEH / IMLS) OR state-arts-council NEA partnership pass-through; CIC-04 applicant; federal funds in scope."
  - prp_id: "TILTH-PRP-DAVIS-BACON"
    applicability: "CONDITIONAL — fires only when arts facility construction or covered renovation is in scope (NEA Our Town infrastructure components, IMLS Museums for America facility upgrades, NEH SCHC environmental-management facility work)."
    fires_when: "Opportunity scope includes covered construction (>$2000) under federal contract; applicability conditional on construction component within arts/cultural facility scope."
  - prp_id: "TILTH-PRP-NEPA-24CFR58"
    applicability: "CONDITIONAL — fires only when federally-funded facility construction / renovation triggers NEPA environmental review (Our Town facility components, IMLS facility infrastructure, NEH SCHC building-systems work)."
    fires_when: "Federal financial assistance funds facility construction / renovation / ground disturbance / historic-property modification; NEPA categorical-exclusion / EA / EIS determination required per 24 CFR 58 or agency-specific NEPA framework."

# ─────────────────────────────────────────────────────────────────────────────
# Narrative sections typical
# ─────────────────────────────────────────────────────────────────────────────
narrative_sections_typical:
  - "Project Description / Artistic Vision"
  - "Artistic Merit Narrative (work samples + artist statement framing)"
  - "Artist Qualifications + Key Personnel"
  - "Audience and Community Impact"
  - "Venue and Production Plan"
  - "Partnerships and Collaborations"
  - "Accessibility Plan (ADA + Section 504)"
  - "Documentation and Evaluation Plan"
  - "Organizational Capacity (for org applicants) / Fiscal Sponsor Profile (for sponsored applicants)"
  - "Project Budget and Budget Narrative"
  - "Match / Cost Share Documentation (1:1 non-federal match for NEA Grants for Arts Projects)"
  - "Timeline and Milestones"
  - "Sustainability / Post-Grant Continuation"
  - "Rights and Permissions Plan"
  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.5) ──
  - "Cultural Accessibility Plan (where applicable; NEA / NEH accessibility-aligned proposals)"
  - "Artist Voice and Voice Preservation Discipline (where applicable; soul-fire / cultural-sovereignty-aligned applicants)"
  - "Rights, Permissions, and Sensitive-Material Handling (where applicable; exhibition / public art / documentation projects)"

# ─────────────────────────────────────────────────────────────────────────────
# Capacity signals required
# ─────────────────────────────────────────────────────────────────────────────
capacity_signals_required:
  - signal: "active SAM.gov registration + UEI"
    evidence_type: "SAM.gov record"
    required_for_competitive: true
  - signal: "501(c)(3) determination letter (org applicants) OR fiscal sponsor 501(c)(3) determination + fiscal-sponsorship agreement (sponsored applicants)"
    evidence_type: "IRS determination letter + sponsor agreement (for sponsored case)"
    required_for_competitive: true
  - signal: "current good standing on prior arts grants (federal + foundation)"
    evidence_type: "prior-award compliance record; final reports submitted on time"
    required_for_competitive: true
  - signal: "venue confirmation"
    evidence_type: "signed venue contract or LOI with dates + capacity + technical specs"
    required_for_competitive: true
  - signal: "demonstrated artistic-practice track record"
    evidence_type: "artist CV + prior-work samples + press coverage + venue history"
    required_for_competitive: true
  - signal: "rights and permissions cleared (or plan to clear before project start)"
    evidence_type: "rights-holder permission letters; performing-rights licenses; talent releases"
    required_for_competitive: true
  - signal: "general liability insurance for public events / installations"
    evidence_type: "insurance certificate naming venue + funder as additional insureds where required"
    required_for_competitive: true
  - signal: "1:1 non-federal match commitment (NEA Grants for Arts Projects)"
    evidence_type: "match commitment letters from non-federal sources; cash + in-kind disclosed separately"
    required_for_competitive: true
  - signal: "accessibility plan + ADA Coordinator (for orgs with one)"
    evidence_type: "accessibility plan narrative; ADA Coordinator attestation or job description"
    required_for_competitive: true

# ─────────────────────────────────────────────────────────────────────────────
# Compliance burdens
# ─────────────────────────────────────────────────────────────────────────────
compliance_burdens:
  - framework: "SAM.gov + UEI registration"
    applicability: "all federal grant applicants (NEA / NEH / IMLS)"
    required_filings:
      - "SAM.gov annual renewal"
      - "Unique Entity Identifier on every application"
  - framework: "2 CFR 200 Uniform Guidance"
    applicability: "all federal grant recipients"
    required_filings:
      - "Single Audit if federal expenditures exceed threshold (currently $750,000; rising to $1,000,000 per OMB revisions)"
      - "Procurement standards compliance"
      - "Cost principles compliance"
  - framework: "ADA Title II / Title III"
    applicability: "all arts grant recipients (Title II = state/local government recipients; Title III = private nonprofit places of public accommodation)"
    required_filings:
      - "Accessibility plan in application narrative"
      - "Reasonable accommodations on request"
      - "Accessible communications (alternative formats; ASL / audio description / captioning where applicable)"
  - framework: "Section 504 of the Rehabilitation Act"
    applicability: "all federal grant recipients"
    required_filings:
      - "Section 504 Self-Evaluation"
      - "Designated Section 504 Coordinator (orgs with 15+ employees)"
      - "Notice of nondiscrimination on basis of disability"
  - framework: "NEA-specific funding-clause attestations (current administration)"
    applicability: "NEA + NEH grant recipients (and state arts council pass-through portions of NEA partnership funds)"
    required_filings:
      - "Attestation per current NEA grant terms — verify exact language per active RFA"
      - "Compliance with EO 14151 + EO 14168 funding-clause restrictions on federal portion of grant"
      - "Operator review required before signing — funding clauses have changed mid-cycle and may change again"
  - framework: "Copyright + performing rights (ASCAP / BMI / SESAC)"
    applicability: "performing-arts + media-arts + literary-arts projects"
    required_filings:
      - "Performing-rights organization licenses where music is performed"
      - "Sync licenses for film / video / digital media"
      - "Reproduction rights for visual works"
      - "Public-performance licenses for film screenings"
  - framework: "Talent / model / image releases"
    applicability: "all projects with documented participants, performers, or audience footage"
    required_filings:
      - "Talent releases for performers"
      - "Model releases for image use"
      - "Image-of-minor releases (parental consent) for any participant under 18"
      - "Right-of-publicity compliance (state law varies)"
  - framework: "NEH Sustaining Cultural Heritage Collections technical guidelines"
    applicability: "NEH SCHC applicants"
    required_filings:
      - "Environmental management plan per NEH SCHC technical specs"
      - "Pre/post environmental monitoring data"
      - "Conservation assessment reports"
  - framework: "State arts council per-state requirements"
    applicability: "state arts council applicants (50 states + 6 territories + DC)"
    required_filings:
      - "State-specific compliance per state council guidelines (varies)"
      - "Pennsylvania Council on the Arts: PA-resident-artist requirement for PCA Entry + Project Stream lines"
      - "PCA Pennsylvania Partners in the Arts (PPA) re-grant: regional partner administers per regional rules"

# ─────────────────────────────────────────────────────────────────────────────
# Common risk register entries
# ─────────────────────────────────────────────────────────────────────────────
common_risk_register_entries:
  - risk: "flattened artist voice (Scribe rewriting artist statement / curatorial premise as institutional language)"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Hardcode artist-voice preservation in Scribe prompts for arts CIC.
      Artist statement + work-sample narration + curatorial premise =
      verbatim from applicant, light-touch clarity edits only with
      operator authorization. Funder-legible frame (audience reach,
      sustainability, evaluation, capacity) = full Scribe translation.
      Editor seat second-checks the artist-voice preservation before
      Judge.
  - risk: "treating arts grant like a research grant"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Arts panels score artistic merit + audience reach + sustainability
      + capacity. They do NOT score "innovation / impact / outcomes" the
      way research panels do. Scribe must select arts-CIC narrative
      sections (not research-CIC sections) and arts-CIC metrics (not
      research-CIC metrics). Logician should fail-closed on a draft that
      reads like a research grant when the active CIC is arts_culture.
  - risk: "unsupported audience projections"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Tie projected audience to (venue capacity × performances) +
      prior-program attendance baseline + outreach plan deliverables.
      Reviewers flag projections that have no math. Maintain ticket-
      sales records, door counts, and survey data as KFR baseline facts.
  - risk: "underbudgeted artist fees (W.A.G.E. or union-scale violation)"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Reviewers flag underbudgeted artist fees as exploitative. Default
      to W.A.G.E. (Working Artists and the Greater Economy) fee
      calculator output for visual + performance artist commissions and
      to union scale (AEA, AGMA, SAG-AFTRA, Local 802) for unionized
      performers. Document rate justification in budget narrative.
  - risk: "weak documentation plan"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Federal arts agencies + foundation funders expect a documentation
      plan with named documenter, format, archival protocol, and
      rights-cleared distribution plan. Boilerplate "we will document"
      language fails. Include named photographer / videographer /
      archivist + format spec + storage location + access plan.
  - risk: "unconfirmed venue at application"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Reviewers expect signed venue contract or LOI at application.
      "Venue TBD" reads as project-readiness gap. Lock venue commitments
      before submission; if logistically impossible, document the venue-
      selection plan + alternates with named candidates.
  - risk: "rights and permissions ambiguity"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Performing rights, image rights, music sync, public-performance
      licenses, talent releases must all be documented or have a clear
      pre-project clearance plan. Ambiguity at application reads as
      future-compliance risk to federal funders.
  - risk: "diluted cultural specificity"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Substituting culturally specific terminology with generic language
      ("traditional dance" instead of the named tradition + community
      origin) flattens artistic specificity. NEA Folk & Traditional Arts
      + NACF + tradition-bearer-led work specifically score cultural
      specificity. Operator decides per RFA whether to retain or
      generalize; default = retain culturally specific language.
  - risk: "accessibility gaps (ADA / Section 504 noncompliance)"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Federal arts grants require ADA + Section 504 compliance as a
      condition of award. Accessibility plan must address physical +
      sensory + program accessibility — not just venue ramps. Include
      ASL / audio description / captioning plan where program type
      warrants. NEA Office of Accessibility provides technical
      assistance.
  - risk: "political-register mismatch (progressive language to conservative funder, or vice versa)"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Per dialect_routing_table — Scribe selects register matching
      funder political axis. Per admin_risk_term_register — every
      flagged term substitution flows through operator approval. No
      silent rewrites.
  - risk: "NEA / NEH funding-clause violation (current administration)"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      EO 14151 + EO 14168 + downstream NEA funding-clause restrictions
      mean draft language using DEI / gender-identity / racial-justice
      vocabulary on a federal arts grant carries documented enforcement
      risk on the federal portion. Logician should fail-closed on draft
      containing flagged HIGH-severity terms when CLC route is federal
      arts agency. Operator decides per RFA whether to substitute,
      route to a different funder, or accept the risk with explicit
      sign-off.
  - risk: "fiscal-sponsor agreement gaps (sponsored applicants)"
    likelihood: "LOW"
    impact: "HIGH"
    mitigation_pattern: |
      Fiscal-sponsorship agreement must be signed and current before
      application. Sponsor IS the legal applicant for federal grants.
      Sponsor fee schedule should be transparent in budget narrative.
      Verify sponsor's prior federal-grant compliance record before
      routing through them.

  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.6) ──
  - risk: "Artist-voice rewrite without consent"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Scribe + Logician artifacts that distinguish artist-voice content
      (verbatim, no rewrite) from funder-legible-frame content (operator-
      approved substitution per active RFA). Operator approval at every
      admin-risk-flagged-term substitution per OQ-5 default. CRITICAL:
      when artist self-identifies (queer / trans / Indigenous / etc.) in
      their own artist statement, Scribe MUST NOT rewrite verbatim self-
      identification. Editor seat second-checks the artist-voice
      preservation before Judge.
  - risk: "Cultural-sovereignty practice misframing"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      When applicant invokes cultural-sovereignty practice or Indigenous-
      knowledge centering, route to soul-fire dialect + cultural-bearer-
      attributed-source-citation; never substitute to centrist /
      conservative dialect without operator + cultural-partner approval.
      Cultural-partner consent documentation surfaced at intake.
  - risk: "Accessibility-plan absence on accessibility-eligible programs"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Pre-application accessibility-plan audit; NEA Office of
      Accessibility framework as anchor; section-by-section coverage of
      physical / program / staff access components. Section 504
      accessibility-coordinator designation surfaced at intake for orgs
      with 15+ employees.

