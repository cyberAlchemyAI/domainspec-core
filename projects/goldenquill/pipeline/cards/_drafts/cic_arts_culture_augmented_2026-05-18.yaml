# Card — TILTH-CIC-04 Arts & Culture
# Wave 2 research draft 2026-05-15. Phase 3 output per blueprint §18.11.
# Content populated per §18.9 starter requirements for TILTH-CIC-04.
# Operator review + cross-family Thesis dispatch + Ed25519 signature PENDING.
# SIGNED — runtime-loadable; lifecycle truth enforced by loader preflight.
#
# Coupling discipline (architecture v7.0.11 §6.1 + §4 v2.x F-CARDS-COUPLING-
# VIOLATION-EXTENSION): NO common_clc_patterns_observed, eligible_clc_subset,
# clc_allowlist, clc_denylist, preferred_clcs, clc_win_rate, or
# clc_ranking_preferences field. CIC × CLC matching is opportunity-driven at
# runtime (Scout / Logician identify CLC per opportunity; CIC determines seat
# configuration only). NEVER reintroduce. common_funders_observed below is
# funder-side observational metadata only — NOT a CIC × CLC binding.
#
# Wave 2 operator-pinned operating posture applied:
#   - Directory: UPPERCASE pipeline/cards/CIC/ (canonical).
#   - Schema: as-on-disk; review_status / frequency_observed enum
#     {FREQUENT, OCCASIONAL, RARE, UNKNOWN} / dialect_routing_table item
#     shape {funder_political_axis, dialect, example_funder} / provenance_
#     requirements keys = KFR fact_class names with required_citation_type +
#     verbatim_quote_required.
#   - All admin_risk_term_register entries: approval_required: true.
#   - Win-rate / frequency: qualitative-only (FREQUENT/OCCASIONAL/RARE/
#     UNKNOWN; HIGH/MEDIUM/LOW). No numeric rates.
#   - Verbatim quotes ≤2 sentences each with URL + access_date citation.
#
# Severity tier mapping for admin_risk_term_register (consistent with Wave 1
# food_systems.yaml + pipeline/institutional_memory/admin_risk_register.yaml
# v2.2 EO-context tiers):
#   HIGH    ≈ admin_risk_register RED  (documented federal enforcement action)
#   MEDIUM  ≈ admin_risk_register YELLOW (cautioned / leaked-list / scrutiny)
#   LOW     ≈ admin_risk_register GREEN (precautionary)
#
# Arts & Culture nickname: "Merit-plus-sustainability funding world" — a
# distinct register from research-grant evidence rigor. Merit reviewers want
# work samples + artistic vision; sustainability reviewers want audience
# math + revenue diversification + post-grant continuation. Voice preservation
# (artist's own register) lives in tension with funder-legibility (rubric-
# scorable language). Scribe must hold both without flattening either.

