    applicability: "USDA grant administration (VAPG / RCDG / BFRDP / SCBGP / LAMP / NRCS / SARE / AFRI / UAIPG / Farm-to-School) — applicants are federal recipients subject to Uniform Guidance cost principles, procurement standards, Single Audit threshold, and 2 CFR 200.331-200.333 sub-recipient monitoring."
