# Card — TILTH-CIC-01 Food Systems
# Wave 1 research draft. Cards Wave 1 dispatch 2026-05-15 (Cowork session).
# Operator decisions on the 6 OQs baked in: sectors retire when 6 CICs land (OQ-1);
# Shape B self-hostable Brain (OQ-2); pipeline/cards/<axis>/<slug>.yaml convention
# with UPPERCASE axis (OQ-3 — operator confirmed 2026-05-15 PM: uppercase CIC/ + CLC/
# canonical, matching on-disk scaffold); verbatim quotes ≤2 sentences each (OQ-4);
# approval_required: true defaults (OQ-5); qualitative-only frequency tags until 12+
# CycleReceipts (OQ-6).
#
# Wave 1 handback decision-queue resolutions applied (operator 2026-05-15 PM):
#  - directory case: uppercase canonical (no change to this card).
#  - lifecycle field name: review_status canonical (already used here).
#  - dialect_routing_table schema item shape: standardized; card passes.
#  - common_funders_observed.frequency_observed enum: added per entry.
#  - provenance_requirements additionalProperties: standardized; card passes.
#  - regenerative agriculture severity: kept MEDIUM. Reviewer context neutralized
#    to describe funder-language landscape only — Tilth does NOT adjudicate
#    greenwashing per operator directive.
#  - EPA NEETP: kept (RARE) per operator OK.
#  - Soul Fire / NEFOC LT named exemplars: kept; flagged for follow-up decision.
#
# NEVER include common_clc_patterns_observed or any CLC eligibility / preference /
# win-rate / ranking field (F-CARDS-COUPLING-VIOLATION-EXTENSION fail-closes loader).
# common_funders_observed below is funder-side observational metadata only — NOT a
# CIC × CLC binding (Tilth's runtime matches opportunity-driven CLC at scout/judge
# time, never archetype-driven).
#
# Lifecycle: draft. NO Ed25519 signature. Operator review pending before Wave 1 LOCK
# ceremony as separate dispatch.

