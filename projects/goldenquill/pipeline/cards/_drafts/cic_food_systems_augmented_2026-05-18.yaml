      - "Unique Entity Identifier on every application"
  - framework: "2 CFR 200 Uniform Guidance"
    applicability: "all federal grant recipients"
    required_filings:
      - "Single Audit if federal expenditures > $750,000 in a year"
      - "Procurement standards compliance"
  - framework: "7 CFR 4284 (USDA Rural Business-Cooperative Service)"
    applicability: "VAPG, RCDG, related RD programs"
    required_filings:
      - "Program-specific NOFO requirements per 7 CFR Subpart"
  - framework: "FSMA Produce Safety Rule"
    applicability: "produce growers above small-farm exemption threshold"
    required_filings:
      - "Produce Safety Alliance training documentation"
      - "Inspection readiness records"
  - framework: "TTB / 27 CFR Chapter 1"
    applicability: "VAPG alcohol projects only"
    required_filings:
      - "TTB permit / federal basic permit"
  - framework: "state hemp licensure"
    applicability: "VAPG hemp projects only"
    required_filings:
      - "Valid active hemp license prior to award"

# ─────────────────────────────────────────────────────────────────────────────
# Common risk register entries
# ─────────────────────────────────────────────────────────────────────────────
common_risk_register_entries:
  - risk: "weather variance / crop failure"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "crop insurance; diversified rotation; contingency timeline buffers in work plan"
  - risk: "yield volatility year-over-year"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: "three-year pro forma with explicit yield assumptions + sensitivity"
  - risk: "food safety incident"
    likelihood: "LOW"
    impact: "HIGH"
    mitigation_pattern: "named cert maintenance; written SOPs; insurance"
  - risk: "buyer concentration"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: "diversify buyer pipeline; multi-channel marketing plan; explicit pipeline depth metric"
  - risk: "undercapitalization / working capital gap"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: "operating-line-of-credit relationship; cash-on-hand documentation; phased deployment"
  - risk: "seasonality / cash flow mismatch"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: "monthly cash-flow schedule; storage / preservation capability; off-season revenue lines"
  - risk: "equipment delivery delays"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: "secured vendor quotes with delivery commits; backup vendor identification; timeline buffer"
  - risk: "overclaiming regenerative / sustainable / organic impact"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Cite NRCS practice codes (named, measurable) instead of unqualified
      regenerative / sustainable claims. Maintain third-party cert or verifier
      documentation. Use Logician admin-risk register on every flagged term.
      Tightened from MEDIUM × HIGH per Run 2 handback §4.6: every
      regenerative-framed proposal Tilth touches hits this risk; calibrating
      MEDIUM understates the practical hit rate.
  - risk: "seasonal labor compliance gap"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      H-2A documentation completeness if applicable; state seasonal-employment
      labor certification; for cooperative-producer applicants, member-vs-
      employee classification clarity per state law. VAPG / RCDG applicants
      employing seasonal labor at any scale encounter H-2A or state-equivalent
      compliance routinely.
  - risk: "FSMA Produce Safety Rule exemption-loss risk"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Track Produce Safety Rule small-farm exemption threshold (~$25K–$500K
      sliding scale per 21 CFR Part 112 — verify per FDA reissuance); any
      project that crosses applicant past the threshold or that brings new
      produce onto the operation triggers full FSMA covered-farm compliance.
      Surface threshold-crossing analysis at intake.
  - risk: "Law 4 boundary drift on movement terminology"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Per admin_risk_term_register, every flagged term substitution flows through
      operator approval (approval_required: true default). No silent rewrites.

