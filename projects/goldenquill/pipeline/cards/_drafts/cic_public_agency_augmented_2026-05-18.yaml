  disqualifier_terms:
    - term: "non-governmental applicant only"
      reason: "Several CDBG, USDA CF, FEMA BRIC, EDA Public Works, DOT BUILD/RAISE programs are unit-of-general-local-government / public-agency eligible; if applicant is purely nonprofit / private entity with no public-agency partner, that program is mismatched (sub-recipient pathways may apply — verify per RFA)."
    - term: "Tribal-only set-aside"
      reason: "Certain federal programs carve out Tribal Nation set-asides where municipal applicants are ineligible; verify per active RFA. Tribal-specific funding has its own statutory category per CLAUDE.md additional-pathways research backlog."
    - term: "rural-only"
      reason: "USDA RD CF + WEP + ReConnect require rural geography (typically population ≤20,000 or ≤50,000 depending on program); urban / suburban municipalities are ineligible. Verify population threshold per RFA."
    - term: "urban-only"
      reason: "HUD entitlement CDBG goes to entitlement jurisdictions; non-entitlement municipalities apply through state CDBG (state-administered). Verify entitlement status per HUD allocation tables."
    - term: "for-profit applicant only"
      reason: "Some programs (e.g., specific EDA tracks) include for-profit entities; most public-agency programs in this CIC require unit-of-government applicants. Verify eligibility roster per active RFA."
    - term: "private commercial product launch (no public-benefit framing)"
      reason: "Public-agency-CIC funding pathways require public-benefit / public-purpose framing anchored to statutory national objective (CDBG LMI / EDA distressed-area / FEMA hazard-mitigation / EPA water-quality / DOT public-transportation). Pure private-commercial-launch scope without public-benefit framing mis-fits this CIC."
    - term: "Tribal-only set-aside (where municipal applicant)"
      reason: "Refines existing Tribal-only set-aside disqualifier: when applicant is a municipal entity (not a Tribal Nation / BIE-funded / Tribal-housing-authority / Tribal-college), Tribal-set-aside programs are statutorily ineligible. Verify per RFA + applicant entity type."
    - term: "pre-existing federal-funds-as-match-without-statutory-carve-out"
      reason: "Default-prohibited under 2 CFR 200.306 cost-sharing rules: federal funds may NOT serve as match for another federal award absent a Congressional statutory carve-out (e.g., specific CDBG-DR appropriations-act provisions). Applicants citing federal-source match must surface the per-program statutory authorization."

# ─────────────────────────────────────────────────────────────────────────────
# Evidence signals — Scribe consumption per §18.8
# ─────────────────────────────────────────────────────────────────────────────
evidence_signals:
  - kind: "governing_body_resolution"
    source_pattern: "signed board, council, commissioners, or authority resolution authorizing the application and designating authorized representative"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "Universal federal + state public-agency application requirement; 2 CFR 200.415 sub-recipient certifications; HUD CDBG application checklist; USDA RD CF Form RD 442-1; FEMA BRIC application templates"
  - kind: "capital_improvement_plan"
    source_pattern: "adopted multi-year CIP showing project on funded or planned schedule; reference to project line item + estimated cost + funding sources"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "EPA SRF Intended Use Plan integration; HUD CDBG Consolidated Plan integration; EDA Comprehensive Economic Development Strategy (CEDS) project listing"
  - kind: "engineering_estimate"
    source_pattern: "preliminary or final engineering estimate by licensed professional engineer (P.E. stamp), itemized to construction component level; recent (≤24 months) for SRF / BRIC / CF eligibility"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "EPA SRF Project Priority List requirements; USDA RD CF preliminary engineering report (PER); FEMA BRIC benefit-cost analysis (BCA) cost input"
  - kind: "feasibility_study"
    source_pattern: "third-party feasibility / planning study supporting project scope and demand; HUD CDBG Section 108 / EDA Public Works expectation"
    weight: "HIGH"
    freshness_tolerance_days: 1095
    source_citation: "EDA Public Works PWEAA application — feasibility for non-CEDS-listed projects; HUD Section 108 underwriting requirement"
  - kind: "site_control_documentation"
    source_pattern: "deed, easement, lease, or option-to-purchase demonstrating applicant control of project site for required period (typically 20 years for construction; 5+ years for non-construction)"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "USDA RD CF + EDA Public Works + HUD CDBG site-control standards; LWCF 6(f)(3) conversion-of-use perpetuity for parks"
  - kind: "procurement_policy"
    source_pattern: "adopted procurement policy meeting 2 CFR 200.317–200.327 standards; bid threshold; competition documentation"
    weight: "HIGH"
    freshness_tolerance_days: 1825
    source_citation: "2 CFR 200 Uniform Guidance procurement standards; HUD CDBG procurement; FEMA Public Assistance procurement"
  - kind: "match_commitment"
    source_pattern: "signed match-commitment letter or budget action identifying cash and/or in-kind match source(s); cash-vs-in-kind breakdown; non-federal vs federal source disclosed; federal-funds-as-match prohibition status declared (default-prohibited under 2 CFR 200.306 cost-sharing rules; per-program statutory carve-outs e.g. CDBG-DR specifically cited where applicable)"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "2 CFR 200.306 cost-sharing rules (default federal-as-match prohibition); FEMA BRIC 25% non-federal cost share standard (10% small / impoverished communities); EDA Public Works 50% match (lower in distressed); USDA RD CF match by population tier; CDBG-DR appropriations-act-specific federal-as-match carve-outs (cite per-active-RFA)"
  - kind: "census_and_disadvantaged_community_data"
    source_pattern: "Census ACS tables for service-area demographics; CDC SVI / EPA EJScreen / CEJST / USDA distressed-community indices as applicable to active RFA"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "HUD CDBG LMI national-objective documentation 24 CFR 570.208; USDA RD CF rural-poverty priority points; CEJST Justice40-era programs (verify per active administration framing)"
  - kind: "service_area_map"
    source_pattern: "GIS or PDF map identifying service-area boundaries; for water/sewer projects: distribution-system map; for brownfields: parcel map + adjacent-parcels context"
    weight: "MEDIUM"
    freshness_tolerance_days: 730
    source_citation: "EPA SRF + USDA RD WEP + EPA Brownfields application templates"
  - kind: "environmental_review_status"
    source_pattern: "NEPA Categorical Exclusion / Environmental Assessment / Environmental Impact Statement determination; Section 106 NHPA / Section 7 ESA / state SEPA equivalents as applicable"
    weight: "HIGH"
    freshness_tolerance_days: 1095
    source_citation: "HUD CDBG 24 CFR Part 58 (responsible-entity NEPA); USDA RD 7 CFR 1970; DOT 23 CFR 771; 36 CFR 800 Section 106"
  - kind: "public_meeting_minutes"
    source_pattern: "minutes of public hearing or council meeting where project was discussed and / or authorized; public comment record"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "HUD CDBG citizen-participation requirement 24 CFR 91.105; FEMA mitigation-plan public-meeting record"
  - kind: "audit_findings_clean_or_remediated"
    source_pattern: "most recent Single Audit (or annual financial audit if below Single Audit threshold) with material findings disclosed; corrective action plans for any open findings"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "2 CFR 200 Subpart F Single Audit; HUD CDBG grantee monitoring; SAM.gov FAPIIS record"
  - kind: "maintenance_and_operations_plan"
    source_pattern: "written O&M plan for proposed asset; identified maintenance budget line; replacement-reserve framework where applicable"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "USDA RD CF managerial/financial/technical (MFT) capacity (HIGH scoring weight); EPA asset-management program expectation (MEDIUM-HIGH); LWCF perpetuity stewardship (HIGH for parks). Weight raised from MEDIUM to HIGH per Run 2 handback §4.2 — reflects most stringent applicable context across this CIC's program set."
  - kind: "davis_bacon_workforce_documentation"
    source_pattern: "certified payroll records (WH-347), Davis-Bacon wage determinations referenced by project, contractor responsibility plan"
    weight: "MEDIUM"
    freshness_tolerance_days: 90
    source_citation: "40 USC §3141 (Davis-Bacon Act); HUD CDBG Section 110; FEMA Public Assistance; USDA RD construction projects"
  - kind: "build_america_buy_america_documentation"
    source_pattern: "BABA compliance certifications for iron, steel, manufactured products, construction materials; waiver requests where applicable"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "Build America Buy America Act §70901-70927 (IIJA); 2 CFR Part 184; OMB M-22-11"
  - kind: "slfrf_compliance_status"
    source_pattern: |
      ARPA SLFRF expenditure-reporting submission record; remaining-balance
      attestation; SEFA inclusion if Single Audit threshold crossed; project-
      categorization compliance (revenue replacement / public health /
      negative economic impacts / premium pay / water-sewer-broadband /
      capital expenditure).
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "Treasury Final Rule 31 CFR Part 35 + SLFRF Compliance and Reporting Guidance v4.1 (post-2024 cycle)"
  - kind: "regional_coordination_partnership"
    source_pattern: |
      Regional planning organization (COG / MPO / regional planning commission)
      MOU + role designation + sub-recipient relationship documentation if
      regional entity is implementing partner; member-jurisdiction
      resolutions where applicant is a regional entity.
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "DOT BUILD / RAISE / SS4A / RCP regional-applicant eligibility; EDA Public Works regional-eligibility; HUD CDBG entitlement consortia (24 CFR 570 Subpart D)"

# ─────────────────────────────────────────────────────────────────────────────
# KFR fact classes — Intake / Logician consumption
# ─────────────────────────────────────────────────────────────────────────────
kfr_fact_classes:
  - fact_class: "public_entity_type"
    description: "Statutory category of applicant: municipality / city / borough / township / county / authority / special district / school district acting as public entity / regional council of governments / state agency. Determines program eligibility roster."
    typical_provenance: "state code (e.g., PA Title 8 boroughs / Title 53 cities/townships); Articles of Incorporation for authorities; Municipal Authorities Act 1945; HUD entitlement roster"
  - fact_class: "uei_sam_registration"
    description: "Active SAM.gov registration with Unique Entity Identifier; expiration date; CAGE code if applicable."
    typical_provenance: "SAM.gov record + screenshot; annual renewal confirmation"
  - fact_class: "authorized_representative"
    description: "Name + title + signature authority of person authorized to sign applications and bind the entity; references board/council resolution."
    typical_provenance: "governing-body resolution; signature card on file with funder; SAM.gov electronic business POC"
  - fact_class: "board_or_council_authorization"
    description: "Specific resolution or motion authorizing the application, project scope, match commitment, and designating authorized representative."
    typical_provenance: "signed and dated resolution with motion number; meeting minutes excerpt"
  - fact_class: "population_and_service_area"
    description: "Current population (decennial Census + ACS estimate); service area boundary for water / sewer / utility / transit projects; LMI percentage for CDBG."
    typical_provenance: "U.S. Census Bureau ACS 5-year estimates; state demographic estimates; HUD LMISD; service-area certification by P.E. or planner"
  - fact_class: "capital_plan_reference"
    description: "Citation of project in adopted Capital Improvement Plan: line item, year, estimated cost, identified funding sources."
    typical_provenance: "adopted CIP document + page reference; council adoption resolution; CIP summary table"
  - fact_class: "procurement_threshold_and_policy"
    description: "Bid threshold (often statutory: PA $22,500 written-bid / $11,800 telephonic as of 2024 inflation-indexed); adopted procurement policy reference."
    typical_provenance: "state code citation (e.g., 53 P.S. §46402 PA Borough Code, equivalent); adopted procurement policy with revision date"
  - fact_class: "engineering_estimate_and_designer_of_record"
    description: "Preliminary or final engineering estimate by licensed P.E.; date stamped; designer-of-record firm + lead engineer."
    typical_provenance: "P.E.-stamped preliminary engineering report (PER); USDA RD CF PER template; SRF Step 1 planning document"
  - fact_class: "match_source_and_commitment_type"
    description: "Match identified by source: own funds / bond / state grant / other federal / private / in-kind. Cash vs in-kind breakdown. Federal-funds-as-match prohibition is the DEFAULT under 2 CFR 200.306 — federal funds may NOT be used as match for another federal award except where Congress has statutorily authorized the carve-out (e.g., specific CDBG-DR appropriations-act provisions). The card requires per-program statutory carve-out citation where federal-source match is proposed."
    typical_provenance: "council appropriation; bond ordinance; state grant award letter; in-kind valuation memo; per-program statutory citation when federal-source match is invoked"
  - fact_class: "environmental_review_status"
    description: "NEPA tier (CatEx / EA / EIS); status (not started / in process / complete); responsible federal agency or HUD responsible-entity status; Section 106 / Section 7 status."
    typical_provenance: "HUD ERR (Environmental Review Record); USDA RD environmental assessment; SHPO Section 106 concurrence letter"
  - fact_class: "audit_status_and_single_audit_history"
    description: "Most recent audit type (Single Audit / financial-only); audit firm; opinion (unmodified / modified / adverse / disclaimer); material findings; corrective action status; federal-expenditure threshold determination ($1,000,000 threshold for fiscal years beginning on or after October 1, 2024 per 2024-04-22 OMB final rule (89 FR 30046); prior threshold $750,000 for fiscal years before that date)."
    typical_provenance: "Federal Audit Clearinghouse submission; audit firm letter; Schedule of Federal Awards (SEFA)"
  - fact_class: "site_control_documentation"
    description: "Deed / easement / lease / option demonstrating applicant control of project site for required period; encumbrances disclosed."
    typical_provenance: "recorded deed; lease agreement; easement instrument; title-search certificate"
  - fact_class: "compliance_history_and_open_findings"
    description: "Open or recent findings under prior federal awards (FAPIIS, IPERA, Single Audit findings); debarment status; SAM.gov exclusion check."
    typical_provenance: "FAPIIS Performance and Integrity Information record; SAM.gov exclusions check; prior-award closeout letters"
  - fact_class: "fiscal_year_and_budget_cycle"
    description: "Adopted fiscal year (calendar / state-fiscal / federal-fiscal); operating budget cycle; capital budget cycle; current and prior-year general-fund balance."
    typical_provenance: "adopted budget ordinance; CAFR / ACFR; state DCED budget filings"
  - fact_class: "regional_coordination_status"
    description: "Membership in regional council of governments / MPO / regional planning commission; specific implementation partnerships; project-area coordination scope across multi-jurisdictional applicant cluster."
    typical_provenance: "regional org MOU; council resolution authorizing regional participation; project-area map"
  - fact_class: "slfrf_compliance_status_and_remaining_balance"
    description: "ARPA SLFRF allocation + obligation status; project-categorization status; remaining-balance status; SEFA inclusion if applicable."
    typical_provenance: "Treasury reporting submission record; council resolution per SLFRF project; SEFA"

# ─────────────────────────────────────────────────────────────────────────────
# Provenance requirements per fact class
# ─────────────────────────────────────────────────────────────────────────────
provenance_requirements:
  public_entity_type:
    required_citation_type: "state code citation + entity formation document (charter / articles / authorities act)"
    verbatim_quote_required: false
  uei_sam_registration:
    required_citation_type: "SAM.gov record dated within 30 days of application + UEI string verbatim"
    verbatim_quote_required: false
  authorized_representative:
    required_citation_type: "governing-body resolution citing name + title + signature authority; citation template: resolution number + adoption date + verbatim authorizing clause (≤2 sentences) excerpted from the official adopted resolution"
    verbatim_quote_required: true
  board_or_council_authorization:
    required_citation_type: "signed resolution with motion number + adoption date + verbatim 'resolved' clauses (≤2 sentences each) excerpted from the official adopted resolution; meeting minutes excerpt with page reference where the motion was passed"
    verbatim_quote_required: true
  population_and_service_area:
    required_citation_type: "for demographic component (population count + LMI percentage): U.S. Census Bureau ACS table reference (table ID + vintage year) OR HUD LMISD reference; AND separately for technical-service-area component (utility / infrastructure projects): P.E.-signed service-area certification with distribution-system or service-boundary map. Both components are required when the application invokes both demographic and technical service-area data; only one is required when the project scope invokes only one."
    verbatim_quote_required: false
  capital_plan_reference:
    required_citation_type: "adopted CIP document with page number citation + adoption resolution number"
    verbatim_quote_required: false
  procurement_threshold_and_policy:
    required_citation_type: "state code citation for statutory threshold + adopted procurement policy with revision date"
    verbatim_quote_required: false
  engineering_estimate_and_designer_of_record:
    required_citation_type: "P.E.-stamped report referenced by date and project number; engineer name + P.E. license number"
    verbatim_quote_required: false
  match_source_and_commitment_type:
    required_citation_type: "council appropriation ordinance citation (ordinance number + adoption date) OR signed match-commitment letter (with executing officer name + title + date) OR award letter from non-federal match source — verbatim commitment-amount language (≤2 sentences) excerpted from the source document; federal-funds-as-match prohibition disclosure (default-prohibited; per-program statutory carve-out cited where applicable)"
    verbatim_quote_required: true
  environmental_review_status:
    required_citation_type: "NEPA determination memo OR HUD ERR finding OR SHPO concurrence letter — by date and reviewing-agency citation"
    verbatim_quote_required: false
  audit_status_and_single_audit_history:
    required_citation_type: "Federal Audit Clearinghouse submission reference + auditor opinion paragraph; SEFA line items for relevant programs"
    verbatim_quote_required: false
  site_control_documentation:
    required_citation_type: "recorded deed / lease / easement with recording reference (book + page / instrument number)"
    verbatim_quote_required: false
  compliance_history_and_open_findings:
    required_citation_type: "FAPIIS record + SAM.gov exclusions screenshot + prior-award closeout letter (if applicable)"
    verbatim_quote_required: false
  fiscal_year_and_budget_cycle:
    required_citation_type: "adopted budget ordinance citation + ACFR / CAFR reference"
    verbatim_quote_required: false
  regional_coordination_status:
    required_citation_type: "Regional council of governments / MPO MOU with applicant; member-jurisdiction resolution(s) authorizing regional participation; project-area map identifying member-jurisdiction boundaries"
    verbatim_quote_required: true
  slfrf_compliance_status_and_remaining_balance:
    required_citation_type: "Treasury reporting submission record (SLFRF Compliance and Reporting submission); council resolution per SLFRF project categorization; SEFA inclusion if Single Audit threshold crossed; remaining-balance attestation with reporting date"
    verbatim_quote_required: false

# ─────────────────────────────────────────────────────────────────────────────
# Register defaults — Scribe consumption
# ─────────────────────────────────────────────────────────────────────────────
register_defaults:
  language_register: "formal"
  narrative_voice: "third_person"
  tone: "neutral_institutional"
  operator_override: "PROJECT_CONTEXT match_overrides take precedence"

# Public-agency applicants commonly require a tightly disciplined register:
#   - statutory / compliance register (cite the eligible-activity section, the
#     national objective, the CFR or USC reference; do NOT improvise eligibility
#     framing)
#   - public-benefit register (LMI service, distressed-community indicators,
#     beneficiary counts, public-meeting record)
#   - engineering / technical register (preliminary engineering report numbers,
#     design-life, capacity, regulatory-driver language e.g. SDWA / CWA)
#   - fiscal-stewardship register (debt service, ACFR references, match
#     commitment, audit posture)
# Scribe should select the register layer matching the funder reviewer profile;
# program officers want statutory + public-benefit; engineers want technical;
# financial reviewers want fiscal-stewardship; political bodies (council
# adoption hearings) want plain public-benefit + cost narrative. Do NOT collapse
# all four into a single "civic" tone — they are read by different reviewers
# with different acceptance criteria.

# ─────────────────────────────────────────────────────────────────────────────
# Dialect routing table — Scribe per Law 4
# ─────────────────────────────────────────────────────────────────────────────
dialect_routing_table:
  - funder_political_axis: "conservative"
    dialect: "scribe.statutory_compliance"
    example_funder: "USDA Rural Development Community Facilities + WEP (current administration framing); DOT under current administration; FEMA Public Assistance"
  - funder_political_axis: "centrist"
    dialect: "scribe.technical_precise"
    example_funder: "EPA CWSRF / DWSRF (state-administered); EDA Public Works; HUD CDBG state allocations; PA DCED CFA programs"
  - funder_political_axis: "progressive"
    dialect: "scribe.equitable_public_benefit"
    example_funder: "National philanthropic government-innovation programs + community foundations supporting municipal planning + some EPA programs under prior administration framing. Specific third-party org names removed from binding field per Law 5 + Phase F 2026-05-16 cleanup."
  - funder_political_axis: "soul_fire"
    dialect: "scribe.community_self_determination"
    example_funder: "Less common for public-agency applicants — rarely funds units of government directly. Where applicable: participatory-budgeting-aligned foundations; Tribal Nation co-management funders (verify Tribal-specific statutory category)."

# ─────────────────────────────────────────────────────────────────────────────
# Admin-risk term register — Law 4 axis (b)
# Per operator OQ-5: approval_required: true defaults.
#
# Important Wave-2 framing: under current federal administration, several terms
# that were standard language in 2021-2024 NOFOs (environmental justice,
# Justice40, racial justice, equity) carry RED severity in federal review
# climates as of 2026-05. Tilth does NOT recommend silently rewriting — operator
# approves each substitution per the Five Operating Laws.
# ─────────────────────────────────────────────────────────────────────────────
admin_risk_term_register:
  - flagged_term: "environmental justice"
    severity: "HIGH"
    substitution_candidates:
      - "equitable access to environmental infrastructure"
      - "service to underserved and distressed communities"
      - "disadvantaged-community-serving project"
      - "CDC SVI / EPA EJScreen / CEJST-tier service area (cite tool by name)"
    reviewer_context: |
      Term was standard federal language under prior administrations and
      appeared throughout EPA, DOT, HUD, and FEMA NOFOs. Federal-program
      adoption is in flux; verify per active RFA language before assuming
      "environmental justice" framing is operational. When the RFA itself
      uses "EJ" framing, keep the term verbatim with cite. Otherwise
      substitute to underlying functional descriptors (LMI service, CEJST-
      tier, distressed-community indicators). State agencies and foundation +
      progressive philanthropy panels often still use the term; keep dialect-
      aware substitution candidates. For soul_fire-oriented funders (rare
      for public-agency CIC but possible — Tribal Nation co-management
      funders, participatory-budgeting-aligned foundations), retain the term
      verbatim if the RFA itself uses it; otherwise substitute per the listed
      candidates.
    approval_required: true

  - flagged_term: "racial justice"
    severity: "HIGH"
    substitution_candidates:
      - "equitable service delivery"
      - "underserved community access"
      - "demographic-parity service outcomes"
      - "fair-housing-affirmative siting"
    reviewer_context: |
      Reads as activist framing in conservative federal review climates. Use
      functional descriptors anchored to statutory categories where available
      (e.g., HUD Affirmatively Furthering Fair Housing 24 CFR §5.150-180 is the
      statutory anchor; cite the rule). Foundation panels still accept the term.
      For soul_fire-oriented funders (rare for public-agency CIC but possible),
      retain the term verbatim if the RFA itself uses it; otherwise substitute
      per the listed candidates.
    approval_required: true

  - flagged_term: "Justice40"
    severity: "HIGH"
    substitution_candidates:
      - "investment in disadvantaged communities (cite specific tool: CEJST / EJScreen / SVI)"
      - "40% benefit-flow targeting to identified service area"
      - "(rescinded EO 14008 — cite only if active RFA still references)"
    reviewer_context: |
      Justice40 as a named policy framework is undergoing transition; some
      related federal investments may continue under different program names.
      Verify per active RFA before assuming Justice40 framework is operational.
      Some state and foundation programs still adopt Justice40-style targeting
      under different names; cite the underlying targeting tool by name
      (CEJST / EJScreen / SVI). For soul_fire-oriented funders, retain
      verbatim if the RFA itself uses it; otherwise substitute to the
      underlying targeting tool by name.
    approval_required: true

  - flagged_term: "equity"
    severity: "MEDIUM"
    substitution_candidates:
      - "fair access"
      - "equitable service delivery"
      - "underserved-community benefit"
      - "demographic-parity outcomes"
    reviewer_context: |
      Standard federal NOFO language 2021-2024; deprioritized in many current
      federal program announcements but still appears in state, foundation, and
      some federal NOFOs (especially EPA EJ-tagged programs where they survive).
      Match to active RFA + funder dialect. When funder is silent, default to
      functional descriptors anchored to LMI / distressed-community language.
      For soul_fire-oriented funders, retain the term verbatim if the RFA
      itself uses it; otherwise substitute per the listed candidates.
    approval_required: true

  - flagged_term: "gentrification"
    severity: "MEDIUM"
    substitution_candidates:
      - "involuntary displacement of existing residents"
      - "housing-cost-burden risk to existing households"
      - "anti-displacement strategy"
      - "preserve affordability for existing residents"
    reviewer_context: |
      Reads as politically loaded in conservative panels and to some HUD CDBG
      reviewers. Substitute to functional anti-displacement framing. HUD has
      statutory anti-displacement requirements (Uniform Relocation Act + Section
      104(d) of HCD Act); cite those when describing displacement risk.
    approval_required: true

  - flagged_term: "anti-displacement"
    severity: "MEDIUM"
    substitution_candidates:
      - "residential retention strategy"
      - "Uniform Relocation Act compliance"
      - "Section 104(d) one-for-one replacement housing plan"
      - "affordable-housing preservation"
    reviewer_context: |
      Less politically loaded than "gentrification" but still movement-flavored.
      For HUD CDBG, the statutory references (URA + 104(d)) are the safest
      framing in conservative federal review climates.
    approval_required: true

  - flagged_term: "sanctuary"
    severity: "HIGH"
    substitution_candidates:
      - "(no substitution — flag for operator review per active funder)"
      - "non-cooperative jurisdiction (descriptive only; verify per RFA)"
    reviewer_context: |
      Sanctuary-city / sanctuary-jurisdiction status is a politically charged
      classification that can disqualify applicants under specific administration
      framings or specific federal grant conditions (e.g., DOJ Byrne JAG
      conditions). Tilth does NOT recommend a default substitution; operator
      must review per active funder + jurisdiction posture. Note: under current
      administration, some federal grants include certification language
      regarding immigration cooperation — verify per RFA.
    approval_required: true

  - flagged_term: "activist"
    severity: "MEDIUM"
    substitution_candidates:
      - "community-engaged"
      - "resident-led"
      - "participatory"
      - "stakeholder-driven"
    reviewer_context: |
      Reads as politically loaded in conservative panels. Substitute to
      functional civic-participation descriptors. For public-agency applicants,
      "public engagement" + "citizen participation" are the safest CDBG-aligned
      framings.
    approval_required: true

  - flagged_term: "abolition"
    severity: "HIGH"
    substitution_candidates:
      - "(no functional substitution — flag operator review)"
      - "reform of [specific system being discussed]"
      - "alternative public-safety models"
    reviewer_context: |
      Reads as movement framing across federal + state + most foundation panels.
      For public-agency applicants, this term should rarely appear in proposals;
      substitute to functional reform language for the specific system in scope.
    approval_required: true

  - flagged_term: "anti-police"
    severity: "HIGH"
    substitution_candidates:
      - "alternative response model"
      - "non-police mental-health crisis response"
      - "co-responder model"
      - "community-based public-safety intervention"
    reviewer_context: |
      Politically loaded. For DOJ COPS or FEMA AFG/SAFER, substitute to
      functional alternative-response language. For DOJ alternative-response
      grants (e.g., BJA programs), cite the specific BJA program-language
      framing.
    approval_required: true

  - flagged_term: "anti-development"
    severity: "MEDIUM"
    substitution_candidates:
      - "context-sensitive design"
      - "phased growth management"
      - "conservation-priority land-use planning"
      - "smart-growth planning"
    reviewer_context: |
      For EDA Public Works + USDA RD + state DCED, this term may signal political
      opposition that disqualifies a project for economic-development scoring.
      Substitute to functional planning-discipline language. For
      conservation-focused funders (DCNR / LWCF / TPL), conservation-priority
      framing reads positively.
    approval_required: true

  - flagged_term: "climate justice"
    severity: "MEDIUM"
    substitution_candidates:
      - "equitable climate adaptation"
      - "frontline-community resilience"
      - "vulnerable-population hazard mitigation"
      - "BRIC distressed-community priority"
    reviewer_context: |
      Justice40-era framing; deprioritized in current federal climate of FEMA
      BRIC + EPA. For BRIC, the program's own "distressed and impoverished
      communities" priority language is the safest substitution. State
      hazard-mitigation programs vary. For soul_fire-oriented funders, retain
      verbatim if the RFA itself uses it; otherwise substitute to the program's
      own priority language (e.g., BRIC distressed-community priority).
    approval_required: true

  - flagged_term: "DEI / diversity / inclusion"
    severity: "MEDIUM"
    substitution_candidates:
      - "broad community engagement"
      - "stakeholder representation"
      - "(specific statutory category: LMI / disabled / veteran / elderly per program)"
      - "underserved-population outreach"
    reviewer_context: |
      Under current administration framing, DEI language has been deprioritized
      across federal programs. Statutory categories (LMI, ADA, Title VI,
      Section 504, USDA SDA, VOSB) remain live and are the preferred framing.
      Foundation funders vary. Verify per active RFA.
    approval_required: true

  - flagged_term: "community benefit agreement (CBA)"
    severity: "MEDIUM"
    substitution_candidates:
      - "public-private partnership benefit terms"
      - "community investment plan"
      - "project labor agreement (PLA) compliance documentation where applicable"
      - "anchor-institution commitment letter"
    reviewer_context: |
      Term reads as movement-aligned framing in conservative review climates
      and as standard public-private-partnership practice in centrist +
      progressive climates. Federal programs vary widely on acceptance. For
      HUD CDBG, statutory authority is the framework — cite 24 CFR 570
      directly. For DOT BUILD / RAISE, CBAs are routinely cited but no
      statutory anchor. Operator decides per RFA + applicant funder mix.
    approval_required: true

  - flagged_term: "displacement"
    severity: "MEDIUM"
    substitution_candidates:
      - "population-stability indicator"
      - "Uniform Relocation Act-anchored displacement-risk analysis"
      - "Section 104(d) one-for-one replacement housing analysis"
    reviewer_context: |
      Less politically loaded than "gentrification" but in the same vocabulary
      family. Statutory anchor (URA + Section 104(d) of HCD Act) preferred in
      conservative review climates. Foundation panels often accept verbatim;
      verify per active funder dialect.
    approval_required: true

# ─────────────────────────────────────────────────────────────────────────────
# Reporting cadence
# ─────────────────────────────────────────────────────────────────────────────
reporting_cadence_typical:
  default_frequency: "semi_annual_plus_annual_plus_final"
  per_funder_overrides:
    HUD_CDBG: "annual CAPER (Consolidated Annual Performance and Evaluation Report) + IDIS drawdowns; activity-level reporting per CDBG-DR / Section 108 schedules"
    HUD_Section_108: "semi-annual loan-servicing reports + annual CAPER; debt-service tracking"
    USDA_RD_CF: "construction milestone-based reporting (RD Form 442-2 financial); Form RD 1942-46 grant agreement reporting; final + closeout"
    USDA_RD_WEP: "milestone-based construction reporting; SF-PPR + SF-425; rate-design + MFT capacity reporting at closeout"
    EPA_CWSRF: "quarterly federal-cash-transactions report (SF-272) + annual report to EPA from state; project-level reporting to state administrator"
    EPA_DWSRF: "quarterly federal-cash-transactions + annual capacity-development + Intended Use Plan tracking"
    EPA_Brownfields: "semi-annual performance reports + annual financial (SF-425) + final; ACRES reporting for assessed/cleaned-up properties"
    EPA_WIFIA: "quarterly construction draw + semi-annual financial + annual"
    FEMA_BRIC: "quarterly performance + quarterly federal-financial (SF-425) + final"
    FEMA_HMGP: "quarterly performance + quarterly SF-425 + final; cost-benefit verification at closeout"
    FEMA_FMA: "quarterly performance + quarterly SF-425 + final"
    FEMA_Public_Assistance: "project-worksheet quarterly status + final"
    DOT_BUILD_RAISE: "quarterly performance + quarterly SF-425 + annual"
    DOT_SS4A: "quarterly performance + annual"
    DOT_RCP: "semi-annual performance + annual + final"
    EDA_Public_Works: "semi-annual ED-916 + final report; project performance metric reporting"
    EDA_EAA: "semi-annual + final"
    DOC_NTIA_BEAD: "quarterly performance + quarterly SF-425 + annual + final"
    PA_DCED_CFA_LSA: "milestone-based + final"
    PA_DCED_Keystone_Communities: "annual + final"
    PA_DCNR_C2P2: "construction-milestone + final inspection + LWCF perpetuity stewardship if federal funds used"
    PennVEST: "construction-draw-based + final; rate-design verification"
    EDA_Recompete: "semi-annual ED-916 + final; project performance metric reporting per Recompete Strategy + Implementation Plan structure"
    EDA_Tech_Hubs: "semi-annual + final; Tech Hub Consortium performance reporting"
    FEMA_Swift_Current: "quarterly performance + quarterly SF-425 + final (BRIC subprogram cadence)"
    USDA_NRCS_CIG: "annual progress + final; conservation-innovation outcomes reporting"

# ─────────────────────────────────────────────────────────────────────────────
# Metrics table template
# ─────────────────────────────────────────────────────────────────────────────
metrics_table_function:
  note: "field below is metrics_table_template per schema; this comment block kept for searchability"

metrics_table_template:
  - metric: "people served (project beneficiary count)"
    unit: "count"
    typical_target_range: "applicant-specific to service area"
    source_for_target: "Census ACS + LMISD + service-area certification"
  - metric: "low- and moderate-income persons benefited"
    unit: "count + percent"
    typical_target_range: "CDBG-LMI: ≥51% LMI for area-benefit national objective"
    source_for_target: "HUD LMISD + project service-area documentation"
  - metric: "linear feet of pipe / road / sidewalk installed or replaced"
    unit: "linear feet"
    typical_target_range: "applicant-specific (project scope)"
    source_for_target: "engineering plans and specifications"
  - metric: "housing units assisted / preserved / produced"
    unit: "count"
    typical_target_range: "applicant-specific"
    source_for_target: "HUD CDBG / HOME / NSP-style activity scope"
  - metric: "acres of land cleaned, restored, or protected"
    unit: "acres"
    typical_target_range: "applicant-specific"
    source_for_target: "EPA Brownfields / LWCF / DCNR project boundaries"
  - metric: "intersections improved / signalized / safety-redesigned"
    unit: "count"
    typical_target_range: "applicant-specific"
    source_for_target: "DOT SS4A Comprehensive Safety Action Plan"
  - metric: "match leveraged"
    unit: "USD"
    typical_target_range: "applicant-specific to program match minimums"
    source_for_target: "match commitment documentation"
  - metric: "jobs created or retained (construction + permanent)"
    unit: "FTE"
    typical_target_range: "applicant-specific"
    source_for_target: "HUD CDBG economic-development national objective; EDA RLF jobs reporting; construction-period FTE estimate from engineer"
  - metric: "capital deployed (federal + non-federal)"
    unit: "USD"
    typical_target_range: "applicant-specific to project budget"
    source_for_target: "project budget + match documentation"
  - metric: "structures or properties protected from flood / hazard (BRIC)"
    unit: "count"
    typical_target_range: "applicant-specific"
    source_for_target: "FEMA BRIC benefit-cost analysis"
  - metric: "tons of pollutant load reduced (Section 319 / SRF stormwater)"
    unit: "tons / year"
    typical_target_range: "applicant-specific"
    source_for_target: "engineering load-reduction model"
  - metric: "broadband locations passed / served"
    unit: "count"
    typical_target_range: "applicant-specific (BEAD funding model)"
    source_for_target: "FCC Broadband Data Collection + BEAD challenge-process record"

# ─────────────────────────────────────────────────────────────────────────────
# Cross-references — Program Rule Packs (PRP)
# ─────────────────────────────────────────────────────────────────────────────
# Cards capture customer-archetype pattern recognition. Program-law content
# (cost principles, prevailing-wage thresholds, environmental review triggers)
# lives in PRPs per §19. Cross-references below surface PRPs that frequently
# apply to opportunities routed through this CIC; Logician consumes at runtime
# per opportunity-driven matching (architecture v7.0.11 §6.1).
cross_references_prp:
  - prp_id: "TILTH-PRP-2CFR200"
    applicability: "Federal grant administration (HUD CDBG / EDA / EPA SRF / FEMA / DOT / USDA RD) — public-agency applicants are federal recipients subject to Uniform Guidance cost principles, procurement standards (200.317-200.327), Single Audit threshold (200 Subpart F), and 2 CFR 200.331-200.333 sub-recipient monitoring framework."
    fires_when: "Any federal HUD / EDA / EPA / FEMA / DOT / USDA RD award flows to applicant or sub-recipient; intensifies when federal expenditures exceed the Single Audit threshold; sub-recipient monitoring discipline fires on every pass-through structure (CDC / nonprofit / regional COG / housing authority implementing partner)."
  - prp_id: "TILTH-PRP-DAVIS-BACON"
    applicability: "Federally funded construction by public-agency applicants — Davis-Bacon Act 40 USC §3141 applies to federally funded construction contracts above the threshold; HUD CDBG (Section 110), FEMA Public Assistance, USDA RD, DOT, and EPA SRF (where covered) all trigger prevailing-wage compliance."
    fires_when: "Federally funded construction contract above the Davis-Bacon threshold; contractor responsibility plan and certified payroll (WH-347) compliance fires on every covered award; PRP carries wage-determination + apprenticeship-utilization detail Logician consumes at runtime."
  - prp_id: "TILTH-PRP-NEPA-24CFR58"
    applicability: "HUD-assumed-responsibility environmental review per 24 CFR Part 58 — canonical for CDBG entitlement / state-CDBG / HOME / Section 108 / CDBG-DR applicants; HUD responsible-entity NEPA framework where unit of general local government performs the NEPA review under HUD authority."
    fires_when: "HUD CDBG / HOME / Section 108 / CDBG-DR applicant initiates project requiring environmental review; Tier I or Tier II review per project scope; Section 106 NHPA + Section 7 ESA + floodplain / wetland review integrated; Environmental Review Record (ERR) consultation triggers PRP at runtime; non-HUD federal awards default to the federal-agency-led NEPA pathway (DOT 23 CFR 771, USDA 7 CFR 1970, etc.) — Logician selects the correct pathway per opportunity."

# ─────────────────────────────────────────────────────────────────────────────
# Narrative sections typical
# ─────────────────────────────────────────────────────────────────────────────
narrative_sections_typical:
  - "Project Description / Executive Summary"
  - "Eligibility Narrative (statutory category + national-objective or program-purpose citation)"
  - "Applicant Background and Governance"
  - "Need / Service-Area Documentation (with Census / LMISD / SVI / EJScreen / CEJST data as applicable to active RFA)"
  - "Public Benefit / National Objective"
  - "Readiness to Proceed (site control + engineering + environmental)"
  - "Project Approach / Scope of Work"
  - "Budget and Budget Justification"
  - "Match / Cost Share Documentation"
  - "Procurement and Build America Buy America Compliance"
  - "Build America Buy America (BABA) Compliance and Domestic-Content Certification"
  - "Environmental Review (NEPA / Section 106 / Section 7 / state SEPA)"
  - "Operations and Maintenance Plan"
  - "Timeline / Milestones"
  - "Performance Measures / Evaluation"
  - "Audit and Financial Management Capacity"
  - "Sustainability beyond grant period (replacement reserve + rate / fee structure for utilities)"
  - "Partnerships and Sub-recipients (if applicable — public-agency applicants frequently co-apply with nonprofits, CDFIs, housing authorities, regional councils of government (COG) / metropolitan planning organization (MPO) participation, community development corporation (CDC) sub-recipient relationships, or other implementing-partner subrecipients; surface regional-coordination posture and 2 CFR 200.331-200.333 sub-recipient monitoring framework explicitly)"

