# Capacity signals required
# ─────────────────────────────────────────────────────────────────────────────
capacity_signals_required:
  - signal: "active SAM.gov registration + UEI"
    evidence_type: "SAM.gov record"
    required_for_competitive: true
  - signal: "no SAM.gov exclusions / FAPIIS adverse records"
    evidence_type: "SAM.gov exclusions check + FAPIIS record"
    required_for_competitive: true
  - signal: "authorized representative + board/council resolution on file"
    evidence_type: "signed resolution"
    required_for_competitive: true
  - signal: "preliminary engineering estimate or feasibility study (project-type dependent)"
    evidence_type: "P.E.-stamped PER or third-party feasibility report"
    required_for_competitive: true
  - signal: "adopted procurement policy meeting 2 CFR 200 standards"
    evidence_type: "procurement policy document with revision date"
    required_for_competitive: true
  - signal: "environmental review path identified"
    evidence_type: "NEPA determination memo or HUD ERR documentation"
    required_for_competitive: true
  - signal: "audit findings clean or remediated"
    evidence_type: "Federal Audit Clearinghouse submission + corrective action plan"
    required_for_competitive: true
  - signal: "match source(s) identified and committed"
    evidence_type: "budget action / appropriation / commitment letter / bond ordinance"
    required_for_competitive: true
  - signal: "site control documentation"
    evidence_type: "deed / lease / easement / option"
    required_for_competitive: true
  - signal: "operations and maintenance commitment"
    evidence_type: "O&M plan + budget line item identification"
    required_for_competitive: true
  - signal: "partnership or subrecipient agreement (when co-applying with nonprofit / CDFI / housing authority / implementing partner)"
    evidence_type: "executed memorandum of understanding or subrecipient agreement identifying parties + roles + cost allocation + 2 CFR 200 subrecipient-monitoring responsibilities"
    required_for_competitive: false

# ─────────────────────────────────────────────────────────────────────────────
# Compliance burdens
# ─────────────────────────────────────────────────────────────────────────────
compliance_burdens:
  - framework: "SAM.gov + UEI registration"
    applicability: "all federal grant applicants"
    required_filings:
      - "SAM.gov annual renewal"
      - "Unique Entity Identifier on every application"
  - framework: "2 CFR 200 Uniform Guidance"
    applicability: "all federal grant recipients (states + local governments + tribes + non-profits)"
    required_filings:
      - "Single Audit if federal expenditures exceed $1,000,000 in a fiscal year for FYs beginning on or after October 1, 2024 per 2024-04-22 OMB final rule (89 FR 30046); prior threshold $750,000 applied to earlier fiscal years"
      - "Procurement standards compliance (2 CFR 200.317–200.327)"
      - "Property management standards (2 CFR 200.310–200.316)"
      - "Cost principles (2 CFR 200 Subpart E)"
      - "Reporting requirements (SF-PPR + SF-425 federal financial report)"
  - framework: "Davis-Bacon Act (40 USC §3141)"
    applicability: "federally funded construction projects above $2,000 threshold (HUD CDBG, FEMA PA, USDA RD construction, DOT, EPA SRF construction, etc.)"
    required_filings:
      - "Pre-construction wage determination request to DOL"
      - "Certified payroll records WH-347 weekly"
      - "Apprenticeship/training documentation if applicable"
  - framework: "Build America Buy America (BABA — IIJA §70901-70927)"
    applicability: "federal financial assistance for infrastructure projects post-May 14, 2022"
    required_filings:
      - "BABA compliance certification for iron + steel + manufactured products + construction materials"
      - "Public-interest / non-availability / unreasonable-cost waiver applications where applicable"
  - framework: "NEPA + Section 106 NHPA + Section 7 ESA"
    applicability: "all federal financial assistance with environmental footprint"
    required_filings:
      - "NEPA determination (CatEx / EA / EIS) per granting-agency regulations"
      - "HUD CDBG: 24 CFR Part 58 Responsible Entity Environmental Review Record"
      - "Section 106 SHPO consultation for ground-disturbing federal undertakings"
      - "Section 7 USFWS / NMFS consultation if listed species or critical habitat"
  - framework: "Title VI of the Civil Rights Act of 1964"
    applicability: "all federal financial-assistance recipients"
    required_filings:
      - "Title VI assurance signed at application"
      - "Limited English Proficiency (LEP) plan where applicable"
      - "Title VI complaint procedure"
  - framework: "Section 504 of the Rehabilitation Act + Americans with Disabilities Act"
    applicability: "all federal financial-assistance recipients + public-facing facilities"
    required_filings:
      - "Section 504 self-evaluation / transition plan"
      - "ADA Title II program-access plan"
      - "Accessibility design compliance (ADAAG / ABA)"
  - framework: "Uniform Relocation Assistance and Real Property Acquisition Policies Act (URA)"
    applicability: "federal-funded acquisition + displacement"
    required_filings:
      - "URA notices to displaced persons"
      - "Relocation assistance and payments"
      - "HUD CDBG: 104(d) one-for-one replacement housing plan where triggered"
  - framework: "HUD CDBG Citizen Participation"
    applicability: "HUD CDBG entitlement + state CDBG recipients"
    required_filings:
      - "Citizen Participation Plan (24 CFR 91.105)"
      - "Public hearings + comment periods"
      - "Plain-language summaries"
  - framework: "FEMA Hazard Mitigation Planning"
    applicability: "FEMA BRIC + HMGP applicants"
    required_filings:
      - "FEMA-approved Hazard Mitigation Plan (44 CFR Part 201)"
      - "Plan updated every 5 years"
  - framework: "Federal Funding Accountability and Transparency Act (FFATA)"
    applicability: "federal-grant recipients above subaward thresholds"
    required_filings:
      - "FFATA Subaward Reporting System (FSRS) reporting on subawards ≥$30,000"

# ─────────────────────────────────────────────────────────────────────────────
# Common risk register entries
# ─────────────────────────────────────────────────────────────────────────────
common_risk_register_entries:
  - risk: "missing or stale board / council authorization"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "schedule authorization on council agenda before application deadline; obtain resolution with explicit project scope, match commitment, authorized representative designation"
  - risk: "procurement noncompliance under 2 CFR 200.317-200.327"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "adopt procurement policy meeting Uniform Guidance standards; document competition; maintain procurement file with bid abstracts + selection memos"
  - risk: "match commitment uncommitted or in-kind-only when cash required"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: "verify program match rules (federal-as-match prohibition; cash vs in-kind breakdown); secure written match commitments before application; obtain bond / appropriation actions where required"
  - risk: "unresolved site control"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "secure deed / lease / option prior to application; for projects requiring 20-year control (USDA RD CF + LWCF perpetuity), confirm encumbrances and convert leases to long-term"
  - risk: "preliminary engineering estimate underdeveloped"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "engage qualified P.E. early; complete PER / Step 1 planning to estimate-class appropriate for funder (typically Class 3 for application, Class 1-2 for closeout); document basis of estimate"
  - risk: "environmental review delay"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: "start environmental review at application stage; HUD CDBG entitlement entities should initiate ERR early; obtain SHPO Section 106 concurrence + USFWS Section 7 letter; budget 90-180 days for EA, longer for EIS"
  - risk: "public controversy or community opposition"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "early and transparent public engagement; CDBG citizen-participation plan execution; public hearings before application submission; document mitigation of objections raised"
  - risk: "operations and maintenance ambiguity"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: "written O&M plan with identified maintenance budget line; rate / fee structure for utilities sized to cover lifecycle costs; replacement-reserve framework; for USDA RD CF, MFT capacity narrative"
  - risk: "audit exposure / open Single Audit findings"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "remediate prior-award findings before applying; obtain corrective-action-plan closure letters; disclose open findings transparently with remediation status; address material findings before next audit"
  - risk: "Davis-Bacon nonresponsiveness in contractor pool"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: "include Davis-Bacon compliance in bid documents; pre-bid contractor briefing; certified payroll review process; budget for compliance-monitoring labor"
  - risk: "Build America Buy America carve-out failure"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "BABA compliance certification from contractor; product-by-product domestic-content verification; waiver application early if non-domestic materials required; document non-availability or unreasonable-cost basis"
  - risk: "Section 106 NHPA finding of adverse effect"
    likelihood: "LOW"
    impact: "HIGH"
    mitigation_pattern: "early SHPO consultation; archaeological survey if ground-disturbing; design avoidance / minimization / mitigation measures; Memorandum of Agreement if adverse effect cannot be avoided"
  - risk: "Title VI / LEP service-area inequity claim"
    likelihood: "LOW"
    impact: "HIGH"
    mitigation_pattern: "document service-area demographics; LEP plan for jurisdictions with significant non-English-proficient population; equity analysis of project benefits + burdens"
  - risk: "Law 4 boundary drift on movement terminology"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Per admin_risk_term_register, every flagged term substitution flows through
      operator approval (approval_required: true default). No silent rewrites.
      Public-agency card has heavier substitution discipline than other CICs
      due to compliance-aware reviewer profile across federal + state + most
      foundation panels.
  - risk: "overstated beneficiary counts or LMI percentages"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "anchor beneficiary counts to Census ACS + LMISD + service-area certification; avoid double-counting; for CDBG area-benefit, document ≥51% LMI through HUD LMISD or income survey per 24 CFR 570.208(a)(1)"
  - risk: "federal-funds-as-match prohibition violation"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "verify per program statute whether federal funds may be used as match; most federal programs prohibit federal-as-match except where Congress authorizes (e.g., specific CDBG-DR provisions); document non-federal source of match"
  - risk: "applicant or activity ineligibility under active RFA (statutory category mismatch or out-of-scope activity)"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: "pre-submission eligibility cross-check: applicant's statutory entity type against RFA eligible-applicant roster (e.g., units of general local government, special districts, authorities); project scope against RFA eligible-activity roster (e.g., 24 CFR 570.201-570.207 for CDBG); rural-vs-urban / population threshold verification where applicable; Tribal-set-aside check; documentation of the eligibility determination retained for audit"
  - risk: "Sub-recipient monitoring discipline gap (2 CFR 200.331-200.333)"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Documented sub-recipient monitoring protocol; risk-assessment + Single
      Audit-status verification at sub-award + during-period-of-performance;
      pass-through-entity responsibilities per 2 CFR 200.332 mapped to
      applicant's compliance team.
  - risk: "Regional-coordination authority ambiguity"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      When applicant is regional council of governments (COG) or MPO,
      source-of-authority must be documented (state-enabling statute;
      member-jurisdiction resolutions); when applicant is a member
      jurisdiction acting under regional plan, regional org's role + scope of
      authority documented.
  - risk: "SLFRF remaining-balance + categorization-shift risk"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Project-categorization compliance per Treasury Final Rule (31 CFR Part 35);
      remaining-balance attestation current; remaining-allocation deployment per
      obligation deadlines; SEFA inclusion verified.

