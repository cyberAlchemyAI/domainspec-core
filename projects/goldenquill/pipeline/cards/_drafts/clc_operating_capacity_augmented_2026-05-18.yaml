# COMMITMENT TRACKING PATTERN — Report Generator (v0.2) feed
# ---------------------------------------------------------------------------
commitment_tracking_pattern:
  typical_commitments_extracted:
    - commitment_type: "staff_hired"
      measurement_method: "headcount + role + hire date + supervisor"
    - commitment_type: "systems_implemented"
      measurement_method: "system name + go-live date + user count + adoption rate"
    - commitment_type: "trainings_completed"
      measurement_method: "training type + attendee count + completion certifications"
    - commitment_type: "policies_adopted"
      measurement_method: "policy title + board-adoption date + implementation date"
    - commitment_type: "service_capacity_increased"
      measurement_method: "baseline service volume → post-investment service volume + measurement period"
    - commitment_type: "turnaround_time_reduced"
      measurement_method: "baseline duration → post-investment duration + measurement period + sample size"
    - commitment_type: "data_quality_improved"
      measurement_method: "named data-quality metric + baseline → post-investment value + measurement protocol"
    - commitment_type: "governance_strengthened"
      measurement_method: "named governance artifact (bylaws update, committee charter, policy) + adoption date"
    # Sidecar augmentation 2026-05-18 per handback §4.7 NEW commitment_types.
    - commitment_type: "organizational_strategic_plan_adopted"
      measurement_method: "strategic plan title + board adoption date + plan period (e.g., 2026–2030) + named priorities + implementation milestone schedule"
    - commitment_type: "baseline_metric_to_target_metric_movement"
      measurement_method: "named operational metric + baseline value at award + target value + measurement date + measurement protocol + audit method"
  proposal_commitments_yaml_extension:
    # Cycle-1 F6 fold-in: CLC-namespaced to prevent collision when CLC-04..08
    # cards populate. Convention: clc_<slug>_commitments. Downstream
    # §11 AWARD_INGEST + §14 Report Generator read this field by exact match.
    field_name: "clc_operating_capacity_commitments"
  source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

