# ---------------------------------------------------------------------------
# NARRATIVE SECTION PATTERNS
# ---------------------------------------------------------------------------
narrative_section_patterns:
  - section_name: "Organizational Background"
    typical_word_count: "300-500"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"
    note: "History, mission, current scale, prior capacity work."

  - section_name: "Capacity Need / Statement of Need"
    typical_word_count: "500-1000"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"
    note: "Specific bottleneck with evidence; this section carries the most reviewer weight."

  - section_name: "Proposed Investment"
    typical_word_count: "500-1000"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"
    note: "What will be hired, built, trained, or adopted."

  - section_name: "Staffing / Systems Plan"
    typical_word_count: "300-800"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - section_name: "Outcomes / Measurable Capacity Gain"
    typical_word_count: "300-600"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - section_name: "Sustainability Plan"
    typical_word_count: "300-600"
    source_citation: "https://nlctb.org/featured/how-to-respond-to-sustainability-questions-in-grant-proposals/"
    note: "Reviewers expect concrete revenue diversification math, not aspirational language."

  - section_name: "Budget Justification / Narrative"
    typical_word_count: "300-800"
    source_citation: "https://www.tgci.com/blog/2020/08/understanding-capacity-building-grant-proposals"

  # Sidecar augmentation 2026-05-18 per handback §4.5 NEW narrative_section_patterns.
  - section_name: "Theory of Change / Logic Model for the Capacity Investment"
    typical_word_count: "200-500"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"
    note: "Foundation reviewers (Ford BUILD, Kresge LIFT, MacArthur) expect a one-page theory-of-change linking the capacity bottleneck to mission outcomes. Source: Bridgespan Nonprofit Starvation Cycle + BoardSource governance framing."

  - section_name: "Lessons from Prior Capacity Work"
    typical_word_count: "200-400"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"
    note: "Foundation reviewers want evidence of organizational learning capacity — strategic plans implemented, systems adopted, governance changes that stuck. Distinguishes a capacity-investment-ready organization from a startup-shape capacity ask. Pairs with prior_capacity_work_history evidence_weight."

  - section_name: "Adoption / Change Management Plan"
    typical_word_count: "200-400"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"
    note: "When the capacity ask involves a system (CRM / analytics / case-management software / financial system), reviewers expect a discrete adoption plan: user-population, training schedule, ownership, fallback/rollback option, and post-go-live support model. Pairs with change_management_plan evidence_weight and data_systems_adoption_readiness underwriting criterion."

# ---------------------------------------------------------------------------
# BUDGET STRUCTURE CONVENTIONS
# ---------------------------------------------------------------------------
budget_structure_conventions:
  direct_cost_categories:
    - "personnel"
    - "fringe_benefits"
    - "consultants_and_contractual"
    - "travel"
    - "equipment"
    - "supplies"
    - "training_and_professional_development"
    - "technology_and_software"
    - "other_direct"
  indirect_cost_treatment: "Foundation capacity grants often cap or exclude indirect costs; federal capacity grants honor the recipient's federally negotiated rate or de minimis 10% MTDC per 2 CFR 200. Operator must check each NOFO."
  match_requirements_typical: "Foundation capacity grants typically do not require cash match; some require board-approved commitment or sustainability projections. Federal capacity grants (e.g., USDA 1890 CBG) often waive match for institutional capacity."
  source_citation: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-XXXIV/part-3406"

# ---------------------------------------------------------------------------
# REVIEWER PROFILE TYPICAL
# ---------------------------------------------------------------------------
reviewer_profile_typical:
  reviewer_types:
    - "foundation_program_officer"
    - "capacity_reviewer"
    - "public_agency_program_officer"
    - "national_service_reviewer"
    - "community_foundation_grants_committee"
    - "peer_reviewer_from_sector"
    # Sidecar augmentation 2026-05-18 per handback §4.1.
    - "public_sector_capacity_program_officer"
  reviewer_priorities:
    - "Is the bottleneck real and current, or aspirational?"
    - "Does this hire / system / training tie to measurable, time-bounded outcomes?"
    - "Is sustainability a plan with revenue math, or a paragraph of intentions?"
    # Sidecar augmentation 2026-05-18 per handback §4.1: refinement adds span-of-control evidence demand.
    - "Will management actually deploy and supervise this capacity — AND is there evidence the supervising role(s) have bandwidth, not just title authority?"
    - "Does the budget line up to the implementation plan task-by-task?"
    # Sidecar augmentation 2026-05-18 per handback §4.1.
    - "Is the evidence base for the capacity ask grounded in current organizational data (not 'we feel understaffed')?"
  common_red_flags_from_reviewer_pov:
    - "Vague operating support request with no specific bottleneck"
    - "New hire described without a job description or supervision plan"
    - "Sustainability section that names future grants as the sustainability plan"
    - "Budget that doesn't reconcile to the implementation timeline"
    - "Board not visibly engaged with the capacity investment"
  source_citation: "https://www.athensfoundation.org/5-red-flags-that-could-hurt-your-grant-application"

# ─────────────────────────────────────────────────────────────────────────────
# Reviewer culture subtypes — DRAFT per Run 4 synthesis §1.3 item 3
# ─────────────────────────────────────────────────────────────────────────────
# reviewer_culture_subtypes — draft per Run 4 synthesis §1.3 item 3. Operator
# reviews; field requires schema amendment before LOCK ceremony permits it.
reviewer_culture_subtypes:
  - subtype: "foundation_program_officer"
    differentiation_note: "Primary reviewer culture for operating-capacity grants from Ford BUILD, Kresge LIFT, MacArthur Field Support, Hewlett, Bush Foundation, RWJF. Mission-fit + organizational learning capacity + theory-of-change-for-capacity drive scoring."
    rubric_signal: "Rewards: explicit theory-of-change linking bottleneck to mission, prior capacity work evidence, baseline operational metrics with target deltas, change-management plan on systems asks, multi-line year-3 revenue projection. Penalizes: vague operating-support framing, future-grants-as-sustainability, over-fitted-to-single-hire designs, missing baseline."
  - subtype: "community_foundation_grants_committee"
    differentiation_note: "Community foundations (Capital Region CF, Vermont CF, regional CFs) underwrite local-organization durability — they weight governance + sustainability higher than national-foundation capacity rubrics. Grants committees combine community leaders + program officers; relationship + place-based mission anchoring matter."
    rubric_signal: "Rewards: Letter of Commitment from Board Chair, demonstrated local accountability, board engagement evidence, sustainability revenue math with named local revenue streams. Penalizes: missing board commitment, generic regional framing, vague local-impact claims."
  - subtype: "federal_program_officer"
    differentiation_note: "Federal capacity-building reviewers — HUD CB, USDA 1890 CBG, HRSA capacity, ETA workforce-system capacity. Operate against published NOFO scoring criteria + 2 CFR 200 + agency-specific capacity-building rubrics. Reward audit-clean financial systems + indirect-cost-rate documentation."
    rubric_signal: "Rewards: NICRA documentation or de minimis 10% MTDC election, audit-clean single-audit history, explicit baseline-to-target metrics, change-management plan. Penalizes: indirect-cost confusion, audit findings unaddressed, missing baseline metrics."
  - subtype: "public_sector_capacity_program_officer"
    differentiation_note: "Public-sector capacity programs (HUD CB, USDA CB, Workforce-system capacity grants) have program officers distinct from foundation capacity reviewers. Operate against statutory authority + public-purpose framing + measurable population-level capacity gains."
    rubric_signal: "Rewards: explicit public-benefit math, statutory authority citation, population-level capacity-gain projections, sub-recipient capacity flow-down. Penalizes: foundation-style mission language without public-benefit math."

# ---------------------------------------------------------------------------
# COMMON PORTALS
# ---------------------------------------------------------------------------
common_portals:
  - portal: "Foundant GLM"
    typical_use: "Mid-market community foundations and family foundations; capacity building common workflow."
    source_citation: "https://www.plinth.org.uk/en-US/complete-guide/grant-management-systems-compared"

  - portal: "Submittable"
    typical_use: "Foundations with corporate / CSR ecosystem; faster-to-deploy workflows."
    source_citation: "https://www.plinth.org.uk/en-US/complete-guide/grant-management-systems-compared"

  - portal: "Fluxx Grantmaker"
    typical_use: "Larger national / regional foundations; complex multi-stage capacity-building cycles."
    source_citation: "https://www.plinth.org.uk/en-US/complete-guide/grant-management-systems-compared"

  - portal: "Grants.gov / Workspace"
    typical_use: "Federal capacity-building grants (USDA 1890 CBG, HUD CB programs, HRSA, ETA)."
    source_citation: "https://www.grants.gov/"

  - portal: "SAM.gov"
    typical_use: "Required for any federal capacity-building application (UEI + active registration)."
    source_citation: "https://sam.gov/"

# ---------------------------------------------------------------------------
# COMMON RED FLAGS — adversarial probes
# ---------------------------------------------------------------------------
common_red_flags:
  - flag: "vague_operating_support_request"
    severity: "HIGH"
    red_team_probe: "What specific operational constraint will this funding relieve, in what timeframe, with what observable change?"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - flag: "no_measurable_capacity_gain"
    severity: "HIGH"
    red_team_probe: "After this investment, what specifically will be different — what number changes, what backlog clears, what response time shrinks?"

  - flag: "new_hire_not_tied_to_outcomes"
    severity: "HIGH"
    red_team_probe: "What outputs and outcomes does this new hire produce in the first six months? Who supervises? What does success look like?"

  - flag: "systems_purchase_without_adoption_plan"
    severity: "HIGH"
    red_team_probe: "Who is responsible for adoption? What is the training plan? What happens if staff resist the new system?"

  - flag: "sustainability_as_future_grants"
    severity: "HIGH"
    # Sidecar augmentation 2026-05-18 per handback §4.6: red_team_probe tightened to demand line-by-line year-3 revenue projection.
    red_team_probe: "If no future grant funded this capacity, what revenue would? Where is the diversification math? Show me the year-3 revenue line-by-line: which funder is committed, which is probable, which is speculative; what earned revenue tracks the new capacity; what's the cost-recovery model if applicable."
    source_citation: "https://www.fundsforngos.org/how-to-write-a-proposal/top-10-common-mistakes-in-grant-proposals-and-how-to-avoid-them/"

  - flag: "hidden_management_weakness"
    severity: "MEDIUM"
    red_team_probe: "Does the org chart support the new capacity, or are we adding a role under a supervisor who is already overcommitted?"

  - flag: "weak_budget_mapping"
    severity: "HIGH"
    # Sidecar augmentation 2026-05-18 per handback §4.6: red_team_probe tightened to bidirectional task↔budget mapping.
    red_team_probe: "For each budget line, name the implementation-plan task it funds. Are there orphan line items? And conversely: for each implementation-plan task, name the budget line that funds it. Are there orphan tasks?"
    source_citation: "https://www.tgci.com/blog/2020/08/understanding-capacity-building-grant-proposals"

  - flag: "no_board_engagement"
    severity: "MEDIUM"
    red_team_probe: "Has the board reviewed and approved this capacity investment? Where is the resolution / Letter of Commitment?"
    source_citation: "https://ourcommunity.org/nonprofit-support/grants-at-the-community-foundation/capacity-building-grants"

  # Sidecar augmentation 2026-05-18 per handback §4.5 + §4.6 NEW common_red_flags.
  - flag: "capacity_ask_without_baseline_operational_metrics"
    severity: "HIGH"
    red_team_probe: "Where is the current-state operational baseline against which we measure the post-investment gain? Show me last year's turnaround time / backlog size / service volume / staff retention rate; show me how we'll measure the same metric at grant close."
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - flag: "data_system_selected_before_bottleneck_identified"
    severity: "MEDIUM"
    red_team_probe: "Was the system chosen because the organization mapped its bottleneck to features the system provides — or because the system was attractive and a justification was built backward? Show the procurement evaluation criteria and the vendor-comparison matrix."

  - flag: "capacity_investment_over_fitted_to_single_key_hire"
    severity: "HIGH"
    red_team_probe: "What's the contingency if the named hire doesn't materialize or leaves in year one? Is the capacity ask resilient to that?"

# ---------------------------------------------------------------------------
# REPORTING REQUIREMENTS TYPICAL
# ---------------------------------------------------------------------------
reporting_requirements_typical:
  performance_reporting:
    frequency: "semi_annual"
    content_required:
      - "Progress against milestones in implementation plan"
      - "Staff hired / systems implemented / trainings completed"
      - "Measurable capacity gain indicators"
      - "Variance from original timeline + rationale"
      - "Lessons learned / mid-course adjustments"
      # Sidecar augmentation 2026-05-18 per handback §4.7.
      - "Baseline-vs-actual comparison for named capacity-gain metrics"
  financial_reporting:
    frequency: "quarterly"
    content_required:
      - "Expenditure by budget category"
      - "Burn rate vs. timeline"
      - "Match documentation (if applicable)"
      - "Variance explanation"
  final_report_required: true
  source_citation: "https://www.hud.gov/sites/dfiles/CPD/documents/Capacity-Building-Programs-Reporting-Guidance.pdf"
  # Sidecar augmentation 2026-05-18 per handback §4.7: foundation cadence variance acknowledgment.
  note: "HUD Capacity Building Programs guidance: Performance Output Data Collection Tool semi-annual + final report; foundations vary but semi-annual + final is the modal pattern. Foundation cadence varies (Ford BUILD: annual; Kresge LIFT: annual; community foundations: semi-annual or annual per grant agreement; some federal CB programs: quarterly). Operator should consult per-funder grant agreement; Tilth surfaces the modal pattern only as a starting default."

# ---------------------------------------------------------------------------
# COMPLIANCE OBLIGATIONS
# ---------------------------------------------------------------------------
compliance_obligations:
  - framework: "2 CFR Part 200 (Uniform Guidance)"
    applicability: "All federal capacity-building grants"
    typical_filings:
      - "SF-425 Federal Financial Report"
      - "SF-PPR Performance Progress Report"
      - "Single Audit if federal expenditures ≥ $750,000/year (rising to $1M under 2024 update)"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"

  - framework: "OMB Uniform Guidance §200.343 (Closeout)"
    applicability: "All federal capacity-building grants"
    typical_filings:
      - "Final reports within 90 days after grant award expires or is terminated"
    source_citation: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200/subpart-D/subject-group-ECFR682eb148525a1ed/section-200.344"

  - framework: "Foundation-specific grant agreement"
    applicability: "Foundation capacity-building grants"
    typical_filings:
      - "Interim narrative + financial reports per grant agreement schedule"
      - "Final report at grant close"
      - "Acknowledgment / branding obligations per agreement"

  - framework: "Board governance documentation"
    applicability: "Most foundation capacity grants requiring board commitment"
    typical_filings:
      - "Letter of Commitment from Board Chair"
      - "Authorizing resolution (where applicable)"
      - "Two fiscal years of revenue/expense statements"
    source_citation: "https://ourcommunity.org/nonprofit-support/grants-at-the-community-foundation/capacity-building-grants"

