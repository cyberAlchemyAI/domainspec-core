schema_version: "1.0-clc"
card_axis: "CLC"
card_id: "TILTH-CLC-03"
slug: "operating_capacity"
display_name: "Operating Capacity"
funding_mechanism_summary: "Unrestricted or program-tagged funding for staffing, systems, governance, and organizational readiness that relieves a documented capacity bottleneck and produces measurable durable gains."
tilth_clc_id: "TILTH-CLC-03"

# ---------------------------------------------------------------------------
# UNDERWRITING CRITERIA — what reviewers evaluate (per §18.10 starter content)
# ---------------------------------------------------------------------------
underwriting_criteria:
  - criterion: "capacity_bottleneck"
    description: "Specific, current operational constraint (staff gap, system gap, governance gap, knowledge gap) the requested capacity will relieve — not aspirational future need."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - criterion: "mission_relationship"
    description: "How the capacity investment connects to the organization's core mission, theory of change, and strategic plan."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - criterion: "staffing_or_systems_need"
    description: "Job description / role definition / system specification mapped to the bottleneck. Avoids vague 'we need more staff' framing."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - criterion: "implementation_plan"
    description: "Timeline, milestones, named accountable owners, and dependency map for putting the new capacity in place."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - criterion: "management_readiness"
    description: "Evidence that current leadership can absorb, deploy, and supervise the new capacity (onboarding plan, supervision structure, change management)."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - criterion: "governance"
    description: "Board approval, governance structure, and policy adoption supporting the capacity investment. Capital Region Community Foundation requires a Letter of Commitment from the Governing Board Chair."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://ourcommunity.org/nonprofit-support/grants-at-the-community-foundation/capacity-building-grants"

  - criterion: "measurable_capacity_gain"
    description: "Concrete, observable post-investment outcome (e.g., turnaround time reduced from X to Y; service capacity increased by Z; backlog cleared). Distinct from program outcomes."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  - criterion: "sustainability"
    description: "Plan for maintaining the new capacity beyond the grant period (revenue diversification, board commitment, cost-recovery model, succession). NOT a sustainability-as-language-token; reviewers want concrete revenue or commitment math."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.fundsforngos.org/how-to-write-a-proposal/top-10-common-mistakes-in-grant-proposals-and-how-to-avoid-them/"

  - criterion: "budget_to_task_integrity"
    description: "Line-item budget where every cost ties to a named task in the implementation plan; no orphan line items; salary loaded with realistic fringe; consultant fees defensible."
    weight_in_typical_rubric: "qualitative"
    source_citation: "https://www.tgci.com/blog/2020/08/understanding-capacity-building-grant-proposals"

  - criterion: "dependency_risk"
    description: "Identification of single-point-of-failure dependencies (one key hire, one untested vendor, one funder for sustainability) and mitigation."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

  # Sidecar augmentation 2026-05-18 per handback §4.1: separate data-systems-adoption-readiness
  # from generic staffing_or_systems_need; capacity-grant reviewers treat these differently.
  - criterion: "data_systems_adoption_readiness"
    description: "For data-systems / CRM / analytics capacity asks: explicit user-population, data-migration plan, training schedule, ownership / governance, and post-go-live support model. Distinguishes mature data-systems asks from naïve technology-pitch capacity asks."
    weight_in_typical_rubric: "qualitative"
    source_citation: "blueprint:section_18_card_system.md#§18.10-CLC-03"

# ---------------------------------------------------------------------------
# SCORING WEIGHT PATTERNS — funder-specific rubrics observed
# ---------------------------------------------------------------------------
# OQ-6 enforcement: see _oq6_anchor below. AST-lint hookup
# (R-CARDS-NO-NUMERIC-WEIGHT) deferred to v1.x amendment-realization checklist.
_oq6_anchor: true
scoring_weight_patterns:
  - rubric_example: "Foundation capacity-building rubrics (typical 4-6 criteria pattern)"
    weights:
      organizational_need: "HIGH"
      project_design: "HIGH"
      organizational_capacity: "HIGH"
      sustainability: "MEDIUM"
    source_citation: "https://www.sopact.com/use-case/grant-review-rubric"
    # Sidecar augmentation 2026-05-18 per handback §4.3: note cross-reference appended.
    note: "Qualitative tier (HIGH/MEDIUM/LOW) per OQ-6. The cited Sopact source establishes the typical foundation rubric anatomy (4-6 criteria + weighted scoring + 4-level anchor descriptions) but does NOT enumerate these specific per-criterion tier assignments — the tier assignments are ILLUSTRATIVE patterns based on author qualitative judgment about typical capacity-grant rubric weighting, subject to Lessons Memory revision over 12+ CycleReceipts (per OQ-6 quantification threshold). Cycle-2 Thesis fold-in (C2-J-1 + C2-RT-3). Judge: when the funder's actual published NOFO scoring criteria are available (federal NOFOs always; some foundation RFPs), consult those directly. These tier assignments serve as fallback when funder rubric is unpublished or in flux. Per OQ-6 quantification threshold (12+ CycleReceipts), numeric weights are NOT introduced from this dispatch."

  - rubric_example: "Federal NOFO capacity-building common structure"
    weights:
      program_design_and_capacity: "HIGH"
      organizational_experience: "HIGH"
      project_management_and_evaluation: "MEDIUM"
      budget_reasonableness: "MEDIUM"
    source_citation: "https://www.ecfr.gov/current/title-7/subtitle-B/chapter-XXXIV/part-3406"
    # Sidecar augmentation 2026-05-18 per handback §4.3: note cross-reference appended.
    note: "Qualitative tier (HIGH/MEDIUM/LOW) per OQ-6. USDA NIFA 1890 Capacity Building Grants Program (7 CFR Part 3406) establishes the federal capacity-building rubric framework but does NOT enumerate these specific per-criterion tier assignments — the tier assignments are ILLUSTRATIVE patterns based on author qualitative judgment, subject to Lessons Memory revision over 12+ CycleReceipts. Per-NOFO weights vary. Cycle-2 Thesis fold-in (C2-J-1 + C2-RT-3). Judge: when the funder's actual published NOFO scoring criteria are available (federal NOFOs always; some foundation RFPs), consult those directly. These tier assignments serve as fallback when funder rubric is unpublished or in flux. Per OQ-6 quantification threshold (12+ CycleReceipts), numeric weights are NOT introduced from this dispatch."

  # Sidecar augmentation 2026-05-18 per handback §4.3 NEW: community-foundation pattern.
  - rubric_example: "Community foundation capacity-rubric typical pattern"
    weights:
      organizational_capacity: "HIGH"
      governance: "HIGH"
      sustainability: "HIGH"
      measurable_capacity_gain: "HIGH"
      budget_to_task: "MEDIUM"
      dependency_risk: "MEDIUM"
    source_citation: "https://ourcommunity.org/nonprofit-support/grants-at-the-community-foundation/capacity-building-grants"
    note: "Community foundations weight governance + sustainability higher than national foundation capacity rubrics because community foundations underwrite local-organization durability. Tier assignments are author qualitative judgment; subject to Lessons Memory revision over 12+ CycleReceipts. Judge: when the funder's actual published NOFO scoring criteria are available, consult those directly."

# ---------------------------------------------------------------------------
# EVIDENCE WEIGHTS — what reviewers look for
# ---------------------------------------------------------------------------
# §18.6 canonical shape: evidence_kind: {weight, rationale}.
# OD-3 CLOSED at LOCK 2026-05-15 PM via path (a) — the optional
# source_citation extension is dropped on every entry. The card now
# conforms to canonical §18.6 shape; no schema extension is proposed.
# Per-evidence source backing is preserved in _research_metadata.
evidence_weights:
  workload_evidence:
    weight: "HIGH"
    rationale: "Reviewers want to see the operational pain point the capacity will solve — current workload data, backlog metrics, demand evidence."

  staffing_plan:
    weight: "HIGH"
    # Sidecar augmentation 2026-05-18 per handback §4.2: rationale refined to add bandwidth evidence.
    rationale: "Named role(s), job description scope, supervision structure, integration plan with existing team, and evidence the supervisor has bandwidth — span-of-control delta from current state, not just title authority."

  job_descriptions:
    weight: "MEDIUM"
    rationale: "Concrete role definition for proposed hires; required by some funders as attachment."

  org_chart:
    weight: "MEDIUM"
    rationale: "Shows where new capacity sits in reporting structure; surfaces span-of-control concerns."

  board_approval:
    weight: "HIGH"
    rationale: "Board commitment / authorizing resolution signals governance backing for the capacity investment."

  systems_audit:
    weight: "MEDIUM"
    rationale: "For technology / data systems requests — current-state assessment justifying the upgrade."

  strategic_plan:
    weight: "HIGH"
    rationale: "Links the capacity ask to the organization's strategic direction; reviewers look for alignment."

  backlog_or_demand_data:
    weight: "HIGH"
    rationale: "Quantitative evidence that demand exceeds current capacity (waitlists, turnaway counts, response-time data)."

  financial_statements:
    weight: "HIGH"
    rationale: "Two fiscal years of audited financials standard for community foundation capacity grants; demonstrates fiscal health."

  implementation_timeline:
    weight: "HIGH"
    rationale: "Month-by-month or quarter-by-quarter plan with named milestones and owners."

  # Sidecar augmentation 2026-05-18 per handback §4.2 NEW evidence_weights.
  current_state_baseline_metrics:
    weight: "HIGH"
    rationale: "Baseline operational metrics against which the post-investment gain will be measured: current turnaround time, current backlog size, current service volume, current data-quality scores, current staff retention rate. Distinguishes a capacity-grant ask from a vague 'we feel understaffed' pitch."

  prior_capacity_work_history:
    weight: "MEDIUM"
    rationale: "Documented prior capacity-building work (strategic plans completed, systems implemented, governance changes adopted): demonstrates organizational learning capacity and informs Ford BUILD / Kresge LIFT / community-foundation reviewers about capacity-investment absorption track record."

  change_management_plan:
    weight: "MEDIUM"
    rationale: "For systems-implementation or staffing-restructure asks: how the organization will absorb the change (communication plan, training cadence, resistance-management posture, rollback option). Distinguishes mature capacity asks from naïve technology-pitch capacity asks. Pairs with data_systems_adoption_readiness underwriting criterion."

