    required_filings:
      - "SAM.gov annual renewal"
      - "Unique Entity Identifier on every application"
  - framework: "2 CFR 200 Uniform Guidance"
    applicability: "all federal grant recipients"
    required_filings:
      - "Single Audit if federal expenditures > $750,000 in a year"
      - "Procurement standards compliance"
      - "Cost principles compliance"
  - framework: "state cooperative statute"
    applicability: "varies by state — CA Cal. Corp. Code Title 1 Div 3 Ch 22 (Consumer Coop) + Ch 23 (Worker Coop §12253.5); MA Ch. 157A; MN Ch. 308A/308B; IA Ch. 497A/501; OH Ch. 1729; WI Ch. 185/193; NY Coop Corp Law + BCL §1402; PA varies (no comprehensive cooperative statute — most use LLC-with-cooperative-bylaws form)"
    required_filings:
      - "Annual report to state per cooperative statute"
      - "Bylaws adoption + amendment filings where required"
      - "Member-meeting minutes per statute"
  - framework: "IRS Subchapter T (IRC §1381–1388)"
    applicability: "cooperatives claiming patronage tax treatment"
    required_filings:
      - "Form 1120-C (Cooperative Income Tax Return) where electing"
      - "Qualified written notices of allocation to members per IRC §1388(c)"
      - "Patronage / nonpatronage income separation in books"
  - framework: "ERISA"
    applicability: "ESOP-owned firms only (ESOPs are an ERISA-qualified retirement plan)"
    required_filings:
      - "Form 5500 annual return"
      - "Annual ESOP appraisal by independent appraiser"
      - "Trustee fiduciary obligations per ERISA §404"
  - framework: "Securities Act compliance for member capital raises"
    applicability: "cooperatives raising member equity beyond cooperative-statute exemption"
    required_filings:
      - "Regulation Crowdfunding (Reg CF) filings if using Reg CF intermediary"
      - "State intrastate offering exemption filings (varies)"
      - "Cooperative-securities-exemption filings per state statute (e.g., MN §80A.50; many states)"
  - framework: "Employment law (worker cooperatives)"
    applicability: "worker cooperatives + multi-stakeholder cooperatives with worker class"
    required_filings:
      - "Federal + state employment tax (FICA, FUTA, state unemployment)"
      - "Workers' compensation insurance per state"
      - "Employment classification compliance (worker-owners are generally W-2 employees per IRS Rev. Rul. 75-194)"
  - framework: "USDA RD program-specific requirements"
    applicability: "cooperatives applying for VAPG, REAP, RBDG, RCDG, SDGG"
    required_filings:
      - "Program-specific NOFO requirements per 7 CFR Subpart"
      - "Cooperative-eligibility documentation per program"

# ─────────────────────────────────────────────────────────────────────────────
# Common risk register entries
# ─────────────────────────────────────────────────────────────────────────────
common_risk_register_entries:
  - risk: "governance immaturity"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: |
      For new cooperatives: documented board-development plan; named cooperative
      development center TA partner; quarterly board training cadence; explicit
      first-three-years governance milestones in work plan.
  - risk: "informal member commitments"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Convert verbal / handshake member commitments to signed patronage /
      marketing / supply / equity agreements before funder application.
      Reviewers (especially CDFIs + USDA RCDG) discount unsigned commitments
      heavily.
  - risk: "slow decision-making"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Bylaws-defined delegation matrix (board / committee / staff); quorum
      rules tuned to membership scale; documented decision-rights map. Surface
      pre-emptively in capacity narrative.
  - risk: "legal-form mismatch (LLC operating as cooperative without bylaws update)"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Cooperative legal counsel review of Operating Agreement / Articles to
      confirm cooperative governance + patronage provisions before federal
      cooperative-priority application. Many PA / NJ / NC / TX cooperatives
      operate as LLCs because state cooperative statute is weak — this is
      legitimate but the operating agreement must explicitly include
      cooperative provisions.
  - risk: "capitalization gaps"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Documented capitalization plan with member-equity targets, CDFI debt,
      grant capital, retained patronage. Engagement with cooperative-CDFI
      lenders (Cooperative Fund of New England / Shared Capital / Capital
      Impact / LEAF) for technical assistance.
  - risk: "unclear patronage model"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Bylaws-codified allocation method with worked example; Subchapter T
      tax-counsel review where electing cooperative tax treatment; qualified-
      written-notice template prepared.
  - risk: "weak financial controls"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Separation-of-duties matrix; signature-authority limits; annual audit /
      review by CPA familiar with cooperative accounting; budgeted internal-
      controls implementation in capacity narrative.
  - risk: "member-class conflict"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      For multi-stakeholder cooperatives: bylaws-defined per-class voting
      rights with class-protective supermajority requirements on bylaws
      amendments; documented dispute-resolution process.
  - risk: "underutilized shared assets"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Documented utilization forecast with realistic assumptions; member-
      onboarding plan tied to asset capacity; scheduling-system + access
      policy in place; per-use cost-recovery model.
  - risk: "succession risk in single-founder co-ops"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Documented succession plan with timeline + governance-transition steps;
      board-level (not founder-only) decision rights established early;
      cooperative development center TA engagement.
  - risk: "Law 4 boundary drift on movement terminology"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: |
      Per admin_risk_term_register, every flagged term substitution flows
      through operator approval (approval_required: true default). No silent
      rewrites. Cooperative CIC has the densest movement-vocabulary register
      of any CIC; Scribe must check substitutions per-application.

  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.6) ──
  - risk: "Cooperative governance misalignment"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Bylaws-vs-practice alignment audit at intake; recent annual member
      meeting record verification; member-class-structure-vs-declared-form
      alignment check. Reviewers flag governance-documents-vs-operational-
      practice gaps as material risk for cooperative-priority programs.
  - risk: "Subchapter T election ambiguity"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Subchapter T election status verified before VAPG / RCDG / RBDG
      application; if non-elected, alternative tax-treatment narrative +
      rationale documented. For PA + other weak-cooperative-statute states,
      LLC-with-cooperative-bylaws may operate non-Subchapter-T — surface
      this at intake so reviewers see deliberate-not-accidental tax posture.
  - risk: "ERISA fiduciary-gap on ESOP"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      ESOP fiduciary committee membership current; annual ESOP appraisal
      cycle (independent valuator) verified; ERISA Section 408(e)
      compliance review; SBA 7(a) ESOP loan covenant compliance if
      applicable. DOL EBSA jurisdiction — ESOP applicants must show
      fiduciary discipline at federal-grant intake.
  - risk: "Member-equity dilution risk during growth"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      Capitalization plan models member-equity growth alongside debt +
      retained earnings; per-member-class dilution analysis + member-vote-
      required-for-significant-equity-change protocols documented in
      bylaws. Growth-stage cooperatives at risk of member-equity dilution
      surface this at intake.

