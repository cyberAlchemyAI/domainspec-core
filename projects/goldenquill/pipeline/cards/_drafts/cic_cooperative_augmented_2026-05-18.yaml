  disqualifier_terms:
    - term: "single-owner LLC"
      reason: "If applicant has no member-class structure, no democratic governance, no patronage model — it is not a cooperative for funder eligibility purposes. RCDG / SDGG / cooperative-priority programs require Mutually Owned Business or cooperative form. Verify governance documents."
    - term: "investor-owned"
      reason: "Investor-ownership (one-share-one-vote rather than one-member-one-vote) disqualifies from cooperative-priority programs. Subchapter T patronage tax treatment specifically excludes investor-owned firms."
    - term: "personal use"
      reason: "Cooperative-priority federal programs (USDA RBCS suite, DOL EOI) target commercial / member-serving enterprise; personal-use or hobby framing flags mismatch."
    - term: "for-profit conversion without member structure"
      reason: "Mainstreet Employee Ownership Act + DOL EOI focus on conversion to ESOP / worker co-op / EOT — conversion to a non-employee-ownership structure is out of scope."
    # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.1) ──
    - term: "for-profit-without-cooperative-bylaws applicant"
      reason: "Investor-owned for-profit applicants lacking cooperative bylaws (no one-member-one-vote / patronage allocation / democratic member control) are ineligible for cooperative-priority federal programs (RCDG / SDGG / VAPG cooperative-priority). LLC-with-cooperative-bylaws is eligible; verify governance documents."
    - term: "ESOP-only applicant for true-cooperative-priority funder"
      reason: "ESOP firms are eligible for SBA 7(a) ESOP loan guarantees + DOL EOI broadly, but USDA RCDG + USFWC-aligned cooperative-priority programs target true cooperatives (one-member-one-vote + Subchapter T patronage). ESOP applicants must verify program-specific eligibility before routing."
    - term: "non-rural applicant for USDA RD rural-only program"
      reason: "USDA RD RCDG / RBDG / VAPG / REAP require rural-applicant eligibility per USDA RD rural-area definitions (population thresholds; eligibility-map verification). Non-rural applicants route to non-rural cooperative funders (DOL EOI / cooperative CDFIs / community foundations)."

# ─────────────────────────────────────────────────────────────────────────────
# Evidence signals — Scribe consumption per §18.8
# ─────────────────────────────────────────────────────────────────────────────
evidence_signals:
  - kind: "bylaws"
    source_pattern: "current adopted bylaws PDF with adoption-date + amendment history; cooperative-specific provisions (one-member-one-vote, patronage allocation, member classes, board election) explicitly cited"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "USDA RCDG technical-assistance scope; DOL EOI cooperative-conversion documentation requirements; ICA Cooperative Identity Principles applied as governance baseline"
  - kind: "articles_of_incorporation"
    source_pattern: "state-filed articles establishing legal entity (cooperative corporation, LLC with cooperative operating agreement, statutory cooperative); state filing receipt + entity good-standing certificate"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "State cooperative-statute compliance (varies by state — CA, MN, IA, MA, OH, WI, NY, etc.); USDA RBCS eligibility-doc expectations"
  - kind: "member_roster_and_classes"
    source_pattern: "current member roster with member-class designation, voting rights per class, equity contribution per member, dated last-update; signed by board secretary"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "ICA Cooperative Identity Principle 1 (Voluntary and Open Membership); USDA RCDG + DOL EOI applicant-documentation expectations"
  - kind: "signed_member_commitments"
    source_pattern: "patronage agreements, marketing agreements, supply commitments, equity-contribution commitments — signed and dated by member + countersigned by board"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA VAPG cooperative-priority documentation; Subchapter T patronage-treatment requirements (IRC §1388(c) written notice of allocation)"
  - kind: "board_minutes"
    source_pattern: "minutes of last 12 months of board meetings demonstrating governance activity, member elections, patronage allocations, major decisions; secretary-attested"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA RCDG governance-maturity expectations; CDFI underwriting standard"
  - kind: "board_roster_or_steering_committee"
    source_pattern: "current board / steering committee roster with member-class affiliation, term length, election date, contact info"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "USDA RCDG + DOL EOI expectations; CDFI underwriting"
  - kind: "patronage_allocation_model"
    source_pattern: "documented method for allocating patronage dividends — formula tied to member usage / labor / patronage; written into bylaws or board policy; alignment with Subchapter T qualified-written-notice requirements where applicable"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "IRC §1388(c) qualified-written-notice-of-allocation requirement; USDA RCDG cooperative-development scope"
  - kind: "financial_projections"
    source_pattern: "three-year pro forma with explicit member-equity assumption, patronage-distribution assumption, working-capital assumption; sensitivity disclosed"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "CDFI underwriting; USDA RCDG / RBDG financial-projection expectations"
  - kind: "capitalization_plan"
    source_pattern: "documented capital structure — member equity (par value, retain), preferred-share class, retained earnings, external debt, patronage retained capital — with raise / draw schedule"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "Cooperative Fund of New England + Shared Capital Cooperative + Capital Impact Partners CDFI underwriting standards; USDA RBDG capital-stack documentation"
  - kind: "shared_asset_plan"
    source_pattern: "documented physical / digital / governance asset shared across members — equipment, facility, brand, IP, scheduling system; access policy; maintenance budget"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "USDA RCDG shared-asset framing; common reviewer expectations for shared-infrastructure cooperative projects (cooperative-development centers + cooperative CDFIs)"
  - kind: "technical_assistance_agreements"
    source_pattern: "MOUs / engagement letters with cooperative development centers (USDA RCDG-funded entities), Subchapter T tax counsel, cooperative-bylaws counsel; named TA partner with scope + duration"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "USDA RCDG TA-partner expectations; DOL EOI cooperative-development-center engagement model"
  - kind: "succession_plan"
    source_pattern: "for cooperatives serving conversion-from-conventional-business use case OR cooperatives planning founder-departure transition: documented governance + ownership-transition plan with timeline + membership-onboarding terms"
    weight: "MEDIUM"
    freshness_tolerance_days: 730
    source_citation: "DOL EOI conversion-use-case documentation; Project Equity / Aspen EOP succession-planning literature"
  - kind: "audited_financials"
    source_pattern: "audited financial statements (preferred) OR reviewed compilation (CPA) for last 1-3 fiscal years; for cooperatives subject to Single Audit (>$750k federal expenditures) the most recent Single Audit report"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "2 CFR 200 Subpart F (Single Audit); CDFI underwriting standard; USDA RBCS award-readiness expectations"
  - kind: "match_documentation"
    source_pattern: "cash and/or in-kind match commitments; cash preferred for federal cooperative-priority programs; documented per source"
    weight: "HIGH"
    freshness_tolerance_days: 90
    source_citation: "USDA RCDG match requirement; USDA VAPG cash-match-scores-higher criterion"
  - kind: "qualified_personnel_documentation"
    source_pattern: "resumes / biosketches for Key Personnel (cooperative-development manager, finance lead, board chair); job descriptions for unfilled roles"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA RCDG Key Personnel Qualifications scoring; CDFI underwriting"
  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.2) ──
  - kind: "cooperative_governance_documentation_portfolio"
    source_pattern: "Bylaws current; articles of incorporation under state cooperative statute or LLC-with-cooperative-bylaws (for weak-statute states like PA); member roster + member-class structure; board minutes (recent 12 months); patronage-allocation model + recent patronage-dividend payments; cooperative principles compliance attestation (ICA Statement on the Cooperative Identity)."
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA RCDG governance documentation expectations + ICA Cooperative Identity Statement + Subchapter T qualified-written-notice requirements"
  - kind: "subchapter_t_election_status_or_alternative"
    source_pattern: "Subchapter T election status (filed Form 1120-C if elected); if non-Subchapter-T: alternative tax-treatment narrative (corporate / LLC pass-through / other) + rationale for non-election."
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "IRC §1388(a) + Subchapter T statute + state cooperative-statute variation (PA weak-statute reality especially)"
  - kind: "esop_erisa_compliance_documentation"
    source_pattern: "ESOP fiduciary committee membership; ESOP trustee compliance status; ERISA Section 408(e) prohibited-transaction review; annual ESOP appraisal cycle (independent valuator); SBA 7(a) ESOP loan-guarantee status (if applicable)."
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "26 USC §4975(e)(7) + ERISA §407(d)(6) + Mainstreet Employee Ownership Act + SBA 7(a) ESOP guidance"
  - kind: "member_equity_capitalization_documentation"
    source_pattern: "Member equity contribution model + member-class share structure + member-equity-raised-to-date + retained-earnings allocation + per-member account balances per cooperative governance bylaws."
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA RCDG cooperative-development framework + ICA Cooperative Identity Principle 3 (Member Economic Participation)"

# ─────────────────────────────────────────────────────────────────────────────
# KFR fact classes — Intake / Logician consumption
# ─────────────────────────────────────────────────────────────────────────────
kfr_fact_classes:
  - fact_class: "cooperative_type"
    description: "Worker / producer / consumer / multi-stakeholder / shared-services / purchasing / platform cooperative — primary identity. Some cooperatives operate as multiple types simultaneously (e.g., multi-stakeholder food co-op = worker + consumer + producer)."
    typical_provenance: "bylaws + member roster + Articles of Incorporation"
  - fact_class: "legal_status"
    description: "Statutory cooperative corporation (state-specific cooperative law) / LLC with cooperative operating agreement / federal cooperative / Subchapter T pass-through / unincorporated association. Legal-form varies dramatically by state."
    typical_provenance: "Articles of Incorporation; state filing receipt; entity good-standing certificate; tax-status letter (IRS / state)"
  - fact_class: "member_count"
    description: "Current member count by class; member-onboarding pace last 12 months."
    typical_provenance: "member roster (signed + dated by board secretary)"
  - fact_class: "member_classes"
    description: "Defined member classes (e.g., worker / consumer / producer / supporter / investor non-voting) + per-class voting rights + per-class equity-contribution structure."
    typical_provenance: "bylaws + member roster"
  - fact_class: "voting_rights"
    description: "Voting structure — one-member-one-vote default per ICA Principle 2; per-class voting weights for multi-stakeholder; quorum rules; proxy voting allowed/disallowed."
    typical_provenance: "bylaws"
  - fact_class: "bylaws_revision_history"
    description: "Bylaws adoption date + amendment-history timeline; substantive amendments noted."
    typical_provenance: "bylaws document with revision marks; board minutes documenting amendments"
  - fact_class: "governance_history"
    description: "Board / steering committee composition over last 3 years; election cadence; major governance milestones (incorporation, statute conversion, multi-stakeholder expansion, founder transition)."
    typical_provenance: "board minutes; annual report; member-meeting minutes"
  - fact_class: "patronage_model"
    description: "Patronage allocation method (per labor hour / per supply volume / per purchase / per share-of-services-used); written-notice cadence; cash vs retained allocation split."
    typical_provenance: "bylaws + board policy + Subchapter T qualified-written-notices to members"
  - fact_class: "capitalization"
    description: "Capital stack — member equity (par + retain), preferred shares (class + voting), external debt (lender), retained earnings, patronage retained capital, grant capital. Distinguish member capital from external capital for cooperative-priority programs."
    typical_provenance: "audited financials; cap table; CDFI loan documents; member-equity ledger"
  - fact_class: "member_shared_assets"
    # Lever F rename 2026-05-17: was "shared_assets" — renamed to break the lexical
    # collision with CLC-08 slug "shared_assets" (CIC-05 KFR fact-class semantics
    # are member-pooled assets internal to the cooperative, distinct from the CLC-08
    # capital-mechanism semantics of shared infrastructure capital pools). No
    # semantic change; description preserved verbatim.
    description: "Physical / digital / governance assets shared across membership — facility, equipment, brand, scheduling system, supply-chain platform, shared services."
    typical_provenance: "asset list + shared-asset agreement + access policy"
  - fact_class: "member_commitments"
    description: "Signed member agreements (patronage commitments, supply commitments, marketing-through-co-op commitments, equity buy-in commitments) — count + dollar volume."
    typical_provenance: "signed member agreements; member ledger"
  - fact_class: "financial_controls"
    description: "Internal financial controls — separation of duties, signature-authority matrix, audit-trail discipline, annual audit / review cadence."
    typical_provenance: "internal control documentation; audit / review reports"
  - fact_class: "sector"
    description: "Industry sector — food / housing / energy / care / platform / agriculture / retail / manufacturing / professional services / technology — drives Scout opportunity matching + reviewer-expectation calibration."
    typical_provenance: "Articles of Incorporation; tax-return industry classification (NAICS); marketing materials"
  - fact_class: "annual_revenue"
    description: "Gross revenue last 1-3 fiscal years; broken out by member-source vs non-member-source for Subchapter T compliance where applicable."
    typical_provenance: "audited financials; tax returns; P&L"
  - fact_class: "operator_priority_category"
    description: "Socially-disadvantaged / beginning / veteran / women-owned / minority-owned cooperative status — drives federal cooperative-priority program eligibility (USDA SDGG, DOL EOI priority weighting)."
    typical_provenance: "USDA SDGG self-attestation; member-demographics roster"
  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.3) ──
  - fact_class: "cooperative_legal_form"
    description: "Entity legal form: state-statutory cooperative / LLC-with-cooperative-bylaws (for PA + other weak-statute states) / federal cooperative / Subchapter T pass-through / Section 521 farmer-cooperative-tax-exempt / non-Subchapter-T cooperative / ESOP / employee ownership trust. State of incorporation; state cooperative-statute reference if applicable."
    typical_provenance: "articles of incorporation; bylaws; state filing record; Subchapter T election record (Form 1120-C); ERISA filings for ESOPs"
  - fact_class: "member_class_and_governance_structure"
    description: "Member classes (worker / producer / consumer / multi-stakeholder); voting rights per class; board composition + member-elected seats; quorum + meeting cadence; conflict-of-interest policy."
    typical_provenance: "bylaws + member-class structure document + recent annual member meeting record"
  - fact_class: "patronage_model_and_allocation"
    description: "Patronage dividend rate; allocation cycle; per-member-account tracking; retained-earnings allocation; written-notice-of-allocation compliance (Subchapter T §1388(a))."
    typical_provenance: "patronage policy + recent allocation memo + member-account reports + Subchapter T qualified-written-notice records"
  - fact_class: "cooperative_capitalization_status"
    description: "Member equity to-date; equity-class structure; retained-earnings; debt-to-member-equity ratio; capitalization plan for growth + member-equity-raise targets."
    typical_provenance: "balance sheet + cooperative bylaws + capitalization plan"

# ─────────────────────────────────────────────────────────────────────────────
# Provenance requirements per fact class
# ─────────────────────────────────────────────────────────────────────────────
provenance_requirements:
  legal_status:
    required_citation_type: "state-filed Articles of Incorporation + good-standing certificate; entity-classification verbatim from filing"
    verbatim_quote_required: true
  member_count:
    required_citation_type: "signed-and-dated member roster (board secretary attested) with as-of date"
    verbatim_quote_required: false
  member_classes:
    required_citation_type: "bylaws section verbatim defining member classes + voting structure"
    verbatim_quote_required: true
  voting_rights:
    required_citation_type: "bylaws section verbatim defining voting structure (one-member-one-vote OR per-class weights)"
    verbatim_quote_required: true
  patronage_model:
    required_citation_type: "bylaws or board-policy section verbatim spelling out allocation method + Subchapter T qualified-written-notice if claimed"
    verbatim_quote_required: true
  capitalization:
    required_citation_type: "audited financials + cap table; member-equity ledger for member-capital portion"
    verbatim_quote_required: false
  member_commitments:
    required_citation_type: "signed member-agreement template + count of signed agreements + aggregate-dollar-volume figure"
    verbatim_quote_required: false
  operator_priority_category:
    required_citation_type: "USDA SDGG self-attestation form OR member-demographics roster OR equivalent statutory-category documentation"
    verbatim_quote_required: false
  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.3) ──
  cooperative_legal_form:
    required_citation_type: "articles of incorporation + state filing receipt + Subchapter T election record (Form 1120-C) if applicable; ERISA filings (Form 5500) if ESOP"
    verbatim_quote_required: true
  member_class_and_governance_structure:
    required_citation_type: "bylaws section verbatim defining member classes + voting rights + board composition"
    verbatim_quote_required: true
  patronage_model_and_allocation:
    required_citation_type: "patronage policy + Subchapter T qualified-written-notice records (where T-elected) + recent allocation memo"
    verbatim_quote_required: true
  cooperative_capitalization_status:
    required_citation_type: "balance sheet + capitalization plan + member-equity ledger"
    verbatim_quote_required: false

# ─────────────────────────────────────────────────────────────────────────────
# Register defaults — Scribe consumption
# ─────────────────────────────────────────────────────────────────────────────
register_defaults:
  language_register: "hybrid"
  narrative_voice: "first_person_plural"
  tone: "technical_precise"
  operator_override: "PROJECT_CONTEXT match_overrides take precedence"
  sub_registers:
    - name: "business_commercial"
      description: "Commercial enterprise / underwriting framing — focus on revenue, jobs, repayment, member-equity raised, working-capital adequacy."
      applies_when: "CDFI underwriting context; USDA RBDG enterprise-development context; SBA 7(a) ESOP loan-guarantee underwriting; centrist-leaning federal review climates."
    - name: "cooperative_development"
      description: "Technical cooperative-development framing — focus on governance maturity, member development, patronage methodology, sector-building, technical-assistance delivery."
      applies_when: "USDA RCDG technical-assistance applications; DOL EOI cooperative-development-center applications; cooperative-CDFI portfolio applications; cooperative-development-foundation grants."
    - name: "community_wealth"
      description: "Community wealth-building framing — focus on local ownership, wealth retention, member benefit, place-based impact, broad-based ownership."
      applies_when: "Community foundations with cooperative or community-wealth-building portfolios; progressive philanthropy explicitly funding community wealth-building; soul-fire-aligned cooperative-priority funders."
  sub_register_selection_rule: |
    Scribe selects the sub_register matching the active opportunity's funder dialect
    (see dialect_routing_table) at draft time. The selection is opportunity-driven
    runtime composition — NOT a design-time binding to any CLC slug. The
    first_person_plural voice ("we, the member-owners…") is durable across all
    three sub-registers and distinguishes cooperative applicants from investor-
    owned applicants; preserve it unless the funder's active form template
    requires third-person.

# ─────────────────────────────────────────────────────────────────────────────
# Dialect routing table — Scribe per Law 4
# ─────────────────────────────────────────────────────────────────────────────
dialect_routing_table:
  - funder_political_axis: "conservative"
    dialect: "scribe.formal_commercial"
    example_funder: |
      USDA Rural Development (RCDG / RBDG / VAPG / SDGG / REAP under current
      administration framing — emphasize jobs created/retained, small-business
      formation, rural employment, member equity raised); SBA 7(a) ESOP loan
      guarantees under Mainstreet Employee Ownership Act; state economic
      development agencies. Frame cooperative as small-business form + jobs
      engine; minimize movement vocabulary.
  - funder_political_axis: "centrist"
    dialect: "scribe.technical_precise"
    example_funder: |
      Cooperative-development-focused CDFIs + national cooperative-development
      intermediaries whose public materials use technical cooperative-development
      vocabulary (governance, patronage, member equity). Substituting to
      movement language reads as unprofessional at this register; substituting
      to plain commercial language misses the cooperative-form-specific
      underwriting cues these funders look for.
      No specific third-party orgs named here per Law 5 + operator directive
      2026-05-16 — Wave 2 subagent draft had named-org content that operator
      did not approve at the time of authoring; full anonymization applied
      at Phase E follow-on cleanup.
  - funder_political_axis: "progressive"
    dialect: "scribe.movement_aligned"
    example_funder: |
      Community-wealth-building-aligned community foundations + progressive
      philanthropy explicitly funding cooperative-priority portfolios.
      "Solidarity economy" / "community wealth-building" / "democratic
      enterprise" framing reads as core register here; commercial-tone framing
      misses the funder's actual underwriting cues.
      No specific third-party orgs named here per Law 5 + operator directive
      2026-05-16 — Wave 2 subagent draft had named-org content that operator
      did not approve at the time of authoring; full anonymization applied
      at Phase E follow-on cleanup.
  - funder_political_axis: "soul_fire"
    dialect: "scribe.cooperative_solidarity"
    example_funder: |
      Movement-aligned cooperative-priority funders + community-wealth-building
      intermediaries whose public materials explicitly center "solidarity
      economy" / "worker control" / "cooperative commonwealth" framing.
      Substituting to commercial language reads as evasive at this register.
      No specific third-party orgs named here per Law 5 + operator directive
      2026-05-16 — Wave 2 subagent draft had named-org content that operator
      did not approve at the time of authoring; full anonymization applied
      at Phase D A.1 cleanup.

# ─────────────────────────────────────────────────────────────────────────────
# Admin-risk term register — Law 4 axis (b)
# Per operator OQ-5: approval_required: true defaults. Per L-005 (lessons memory):
# substitutions that settle across enough cycles may flip to false per-term
# per-card at a future Archivist Reflection sub-mode pass.
# ─────────────────────────────────────────────────────────────────────────────
admin_risk_term_register:
  - flagged_term: "anti-capitalist"
    severity: "HIGH"
    substitution_candidates:
      - "shared ownership"
      - "democratic enterprise"
      - "member-owned business model"
      - "cooperative economics"
    reviewer_context: |
      Reads as ideological framing across most funder types — conservative
      federal review climates reject; centrist CDFIs may flag as off-putting.
      Substitute to functional enterprise / governance descriptors except when
      applying to soul-fire-aligned funder whose own materials use the term.
      Tilth never silently rewrites — operator approves each substitution.
    approval_required: true

  - flagged_term: "solidarity economy"
    severity: "HIGH"
    substitution_candidates:
      - "cooperative economy"
      - "shared-ownership economy"
      - "community wealth-building"
      - "democratic enterprise sector"
    reviewer_context: |
      Movement-aligned vocabulary (NEC / Schumacher Center / Cooperation
      Jackson core term; international-cooperative-movement provenance).
      Conservative federal review climates and most state economic-development
      agencies read it as activist signaling. Centrist foundation panels
      vary; progressive philanthropy + soul-fire funders expect it. Match to
      funder dialect; substitute to "cooperative economy" or "community
      wealth-building" for centrist + conservative routing.
    approval_required: true

  - flagged_term: "mutual aid"
    severity: "MEDIUM"
    substitution_candidates:
      - "member-to-member support"
      - "reciprocal services among members"
      - "cooperative member services"
      - "shared member benefits"
    reviewer_context: |
      Term carries movement-aligned political weight (anarchist + abolitionist
      organizing provenance via Kropotkin / Dean Spade contemporary usage).
      Conservative panels read as activist signaling; centrist + foundation
      panels usually accept; soul-fire panels expect. When applicant is
      describing internal member-services structure, "member-to-member support"
      or "reciprocal services among members" is the functional substitution.
    approval_required: true

  - flagged_term: "commons"
    severity: "MEDIUM"
    substitution_candidates:
      - "shared infrastructure"
      - "pooled resource"
      - "cooperatively-owned asset"
      - "shared-use facility"
    reviewer_context: |
      Academic + movement-aligned framing (Elinor Ostrom commons-governance
      provenance; David Bollier / Schumacher Center contemporary usage).
      Conservative panels may treat as ideological; centrist + technical
      panels accept "shared infrastructure" + "pooled resource" more readily.
      Acceptable in shared-infrastructure / pooled-asset contexts and many
      cooperative-development panels.
    approval_required: true

  - flagged_term: "worker control"
    severity: "HIGH"
    substitution_candidates:
      - "worker-owner governance"
      - "employee ownership and governance"
      - "democratic workplace governance"
      - "worker-owner decision-making"
    reviewer_context: |
      Phrase carries explicit labor-movement framing — conservative and many
      centrist panels read as adversarial-to-management-interest. Functional
      substitution to "worker-owner governance" preserves substance (the
      worker-owners govern the enterprise) without the labor-organizing
      register that triggers reviewer reaction. Soul-fire / USFWC-aligned
      funders expect "worker control" verbatim.
    approval_required: true

  - flagged_term: "collectivize"
    severity: "HIGH"
    substitution_candidates:
      - "form a cooperative"
      - "incorporate as a cooperative"
      - "convert to shared ownership"
      - "establish cooperative governance"
    reviewer_context: |
      Word carries explicit Soviet / state-collectivization historical
      register that triggers strong negative reaction in conservative federal
      review climates and many centrist panels. Functional substitution to
      "form a cooperative" / "convert to shared ownership" preserves substance
      without the historical loading. Almost no contemporary U.S. cooperative
      developer uses "collectivize" as a self-descriptor.
    approval_required: true

  - flagged_term: "abolition"
    severity: "HIGH"
    substitution_candidates:
      - "structural transformation"
      - "system redesign"
      - "alternative ownership structure"
      - "post-extraction enterprise model"
    reviewer_context: |
      Phrase carries explicit prison-abolition / police-abolition / racial-
      justice movement framing (contemporary usage). Conservative panels
      reject reflexively; centrist panels read as activist signaling. Even
      progressive philanthropy may prefer functional language unless applying
      to soul-fire-aligned funder whose RFA uses the term. Tilth never silently
      rewrites — operator approves each substitution.
    approval_required: true

  - flagged_term: "wealth redistribution"
    severity: "HIGH"
    substitution_candidates:
      - "community wealth-building"
      - "broad-based ownership"
      - "shared prosperity"
      - "member equity accumulation"
    reviewer_context: |
      Phrase carries explicit redistributive-tax-policy framing — conservative
      federal review climates reject; centrist panels read as policy-advocacy
      register. Functional substitution to "community wealth-building" is
      well-established (Democracy Collaborative provenance) and accepted
      across centrist + progressive funders + many CDFIs. Soul-fire funders
      may prefer the original.
    approval_required: true

  - flagged_term: "DEI / equity / inclusion"
    severity: "MEDIUM"
    substitution_candidates:
      - "underserved-member outreach"
      - "Socially Disadvantaged Group (USDA statutory category)"
      - "broad-based member ownership"
      - "member demographic diversity"
    reviewer_context: |
      Under current federal administration framing, DEI language has been
      deprioritized in some USDA + DOL program announcements. USDA *statutory*
      priority categories (Socially Disadvantaged Group, beginning, veteran,
      women-owned, minority-owned cooperative) remain live and are the
      preferred framing for federal cooperative-priority programs. Foundation
      funders vary widely. Verify per active RFA.
    approval_required: true

  - flagged_term: "stakeholder capitalism"
    severity: "MEDIUM"
    substitution_candidates:
      - "multi-stakeholder cooperative governance"
      - "broad-based stakeholder ownership"
      - "shared-ownership enterprise"
    reviewer_context: |
      Term reads differently across panels — some conservative panels treat as
      ESG-adjacent virtue signaling; centrist business-press panels accept
      readily; cooperative-development panels prefer the more precise
      "multi-stakeholder cooperative governance" (which has specific bylaws
      structure provenance). Match to funder dialect; default to the precise
      cooperative-development substitution.
    approval_required: true

  # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.4) ──
  - flagged_term: "cooperative commonwealth"
    severity: "HIGH"
    substitution_candidates:
      - "broad-based cooperative economy"
      - "shared-ownership commonwealth (operator decides per RFA)"
      - "community-wealth-building movement"
      - "cooperative-development economy"
    reviewer_context: |
      Term carries explicit cooperative-movement provenance (historically
      associated with the late-19th / early-20th-century cooperative-
      commonwealth political tradition). Conservative + most centrist
      climates read as ideological; USDA RD + SBA underwriting context
      expects more neutral cooperative-economics vocabulary. For soul-fire /
      USFWC-aligned funders + community-wealth-building intermediaries,
      retain verbatim where active RFA uses it; otherwise substitute toward
      precise cooperative-development or community-wealth-building framing.
      Operator decides per RFA per Law 4.
    approval_required: true

# ─────────────────────────────────────────────────────────────────────────────
# Reporting cadence
# ─────────────────────────────────────────────────────────────────────────────
reporting_cadence_typical:
  default_frequency: "project_based"
  per_funder_overrides:
    USDA_RCDG: "annual performance + annual financial; final at project close"
    USDA_VAPG: "semi-annual performance + annual financial; final at project close (max 3-year performance period)"
    USDA_SDGG: "annual + final report"
    USDA_RBDG: "annual + final"
    USDA_REAP: "milestone-based + annual + final"
    USDA_LFPP: "annual + final report; quarterly financial common"
    DOL_EOI: "annual + final per cooperative-development-center RFA"
    SBA_7a_ESOP_loan: "lender-required quarterly financial reporting + annual audited financials per loan covenants"
    CDFI_loan: "quarterly financial covenants + annual audited financials + annual program-impact reporting"
    Cooperative_Development_Foundation: "annual program report + financial summary"
    member_meeting_annual: "annual member meeting + annual report to members (separate from grant reporting; required by most cooperative bylaws + state cooperative statutes)"
    # ── Sidecar augmentation pass 2026-05-18 (per Run 2 handback §4.7) ──
    USDA_RBDG_general: "annual + final; cooperative-priority points where applicable; SF-PPR-A typical reporting"
    DOL_EOI_grant: "annual + final per cooperative-development-center RFA; quarterly financial common per RFA terms"
    SBA_7a_ESOP_loan_covenants: "lender quarterly financial reporting + annual ESOP appraisal + ERISA Form 5500 + annual audited financials per loan covenants"
    cooperative_development_center_reporting: "RCDG sub-recipient reporting cadence — annual progress + financial; final at project close; member-roster-served reporting"

