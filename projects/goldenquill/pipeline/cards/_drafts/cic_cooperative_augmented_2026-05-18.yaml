# Card — TILTH-CIC-05 Cooperative
# Wave 2 research draft. Cards Wave 2 dispatch 2026-05-15 (Cowork session).
# Operator decisions from Wave 1 carried forward: directory UPPERCASE (CIC/),
# verbatim quotes ≤2 sentences (OQ-4), approval_required: true defaults (OQ-5),
# qualitative-only frequency tags until 12+ CycleReceipts (OQ-6).
#
# Wave 1 handback resolutions applied:
#  - schema is current as-on-disk; do NOT modify; field names + enums exactly.
#  - lifecycle uses review_status; card passes.
#  - dialect_routing_table item shape {funder_political_axis, dialect,
#    example_funder} with enum {conservative, centrist, progressive, soul_fire}.
#  - common_funders_observed.frequency_observed enum per entry.
#  - provenance_requirements keys = KFR fact_class names with
#    required_citation_type + verbatim_quote_required.
#
# NEVER include common_clc_patterns_observed or any CLC eligibility / preference /
# win-rate / ranking field (F-CARDS-COUPLING-VIOLATION-EXTENSION fail-closes
# loader). common_funders_observed below is funder-side observational metadata
# only — NOT a CIC × CLC binding. Runtime matching is opportunity-driven
# (Scout / Logician identify CLC per opportunity; CIC determines seat configuration
# only).
#
# Important framing decisions (Wave 2):
#  - Operator (Josh) is co-founder of MycoSymbiotics Cooperative; this CIC is
#    operationally first-person for the operator, but the card must work for
#    any cooperative customer (worker / producer / consumer / multi-stakeholder /
#    shared-services / platform).
#  - "Cooperative" = applicant identity, not legal-entity-type prescription.
#    Many U.S. cooperatives operate as LLCs with cooperative bylaws (where state
#    cooperative statute is weak or impractical); some are incorporated under a
#    state cooperative-corporation statute (CA, MN, IA, MA, WI, OH, etc.); some
#    are federal cooperatives; some are LP / Subchapter T pass-through. The
#    card captures the legal_status fact-class to surface this.
#  - ESOP boundary: ESOP-owned firms are *one form of* employee ownership but
#    have distinct ERISA fiduciary obligations and a different (Mainstreet
#    Employee Ownership Act + SBA 7(a)) financing pathway than a true
#    cooperatively-governed worker co-op (one-member-one-vote + Subchapter T
#    patronage). Both are in scope; card differentiates via fact-class +
#    compliance_burdens.
#  - "Solidarity economy" / "anti-capitalist" / "mutual aid" carry political
#    weight in conservative federal review climates and are flagged HIGH in
#    admin_risk_term_register with substitution candidates. Per Law 4 +
#    operator OQ-5: approval_required: true on every term — no silent rewrites.
#
# Lifecycle: draft. NO Ed25519 signature. Operator review pending before Wave 2
# LOCK ceremony as separate dispatch.

