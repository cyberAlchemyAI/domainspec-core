# ─────────────────────────────────────────────────────────────────────────────
# Capacity signals required
# ─────────────────────────────────────────────────────────────────────────────
capacity_signals_required:
  - signal: "active SAM.gov registration + UEI"
    evidence_type: "SAM.gov record"
    required_for_competitive: true
  - signal: "current good standing on prior federal awards (where applicable)"
    evidence_type: "prior-award compliance record"
    required_for_competitive: true
  - signal: "bylaws compliant with applicable cooperative statute"
    evidence_type: "bylaws document + state-cooperative-statute citation; legal opinion preferred for high-dollar federal applications"
    required_for_competitive: true
  - signal: "current member roster with voting documentation"
    evidence_type: "signed-and-dated member roster; voting record from last election"
    required_for_competitive: true
  - signal: "active board or steering committee"
    evidence_type: "current board roster + last 12 months board minutes"
    required_for_competitive: true
  - signal: "documented patronage model"
    evidence_type: "bylaws or board-policy section + Subchapter T qualified-written-notice template (where applicable)"
    required_for_competitive: true
  - signal: "financial controls + audit history"
    evidence_type: "audited financials (preferred) or CPA-reviewed compilation; internal-control documentation"
    required_for_competitive: true
  - signal: "technical assistance partner (cooperative development center) named OR in-house cooperative-development capacity"
    evidence_type: "MOU / engagement letter with TA partner; OR resume of in-house cooperative-development manager"
    required_for_competitive: true

# ─────────────────────────────────────────────────────────────────────────────
# Compliance burdens
