nickname: "Seasonal multi-activity funding world"
tilth_cic_id: "TILTH-CIC-01"

# ─────────────────────────────────────────────────────────────────────────────
# Search vocabulary — Scout consumption per §18.8
# ─────────────────────────────────────────────────────────────────────────────
search_vocabulary:
  core_terms:
    - term: "agricultural producer"
      source_citation: "USDA VAPG 7 CFR 4284 Subpart J — eligible-applicant statutory definition"
    - term: "farmer or rancher cooperative"
      source_citation: "USDA VAPG eligible-applicant roster — Rural Business-Cooperative Service"
    - term: "specialty crop"
      source_citation: "USDA SCBGP / AMS — program scope definition"
    - term: "value-added agriculture"
      source_citation: "USDA VAPG program page — Rural Development"
    - term: "local and regional food"
      source_citation: "USDA LAMP / AMS umbrella program name"
    - term: "food hub"
      source_citation: "USDA LFPP — local food intermediary framing"
    - term: "direct-to-consumer marketing"
      source_citation: "USDA FMPP — producer-to-consumer market framing"
    - term: "institutional procurement"
      source_citation: "USDA RFSP — regional food system partnership framing (institutional food buyers)"
    - term: "conservation practice"
      source_citation: "NRCS EQIP + CSP program pages"
    - term: "soil health"
      source_citation: "NRCS Regenerative Pilot Program — whole-farm resource concern framing"
    - term: "agricultural commodity"
      source_citation: "USDA Rural Development definitions — VAPG, Ag Innovation Grant statutes"
    - term: "beginning farmer or rancher"
      source_citation: "USDA BFRDP statutory category; VAPG priority points"
    - term: "socially-disadvantaged farmer or rancher"
      source_citation: "USDA Rural Development priority-category statutory roster"
    - term: "veteran farmer or rancher"
      source_citation: "USDA Rural Development priority-category statutory roster"
    - term: "mid-tier value chain"
      source_citation: "USDA VAPG reserved-funds category (10% set-aside)"
    - term: "food safety"
      source_citation: "USDA VAPG reserved-funds category (10% set-aside); FSMA framework"
    - term: "rural cooperative"
      source_citation: "USDA RCDG — Rural Business-Cooperative Service program"

  synonym_map:
    agricultural_producer:
      - "farmer"
      - "rancher"
      - "grower"
      - "producer"
    specialty_crop:
      - "fruits"
      - "vegetables"
      - "tree nuts"
      - "dried fruits"
      - "horticulture"
      - "nursery crops"
      - "mushrooms"
    value_added_agriculture:
      - "processing"
      - "aggregation"
      - "packaging"
      - "branding"
      - "preserving"
    local_food:
      - "regional food"
      - "community food"
      - "farm-to-table"
      - "short supply chain"
    food_hub:
      - "regional food hub"
      - "aggregator"
      - "intermediary"
      - "food business enterprise"

  funder_program_keywords:
    - keyword: "VAPG"
      funder: "USDA Rural Development / Rural Business-Cooperative Service"
      source_citation: "USDA RD program page — Value-Added Producer Grants"
    - keyword: "SCBGP"
      funder: "USDA Agricultural Marketing Service (passes through state DOAs)"
      source_citation: "USDA AMS — Specialty Crop Block Grant Program"
    - keyword: "LAMP"
      funder: "USDA Agricultural Marketing Service"
      source_citation: "USDA AMS — Local Agriculture Market Program umbrella"
    - keyword: "FMPP"
      funder: "USDA AMS — Farmers Market Promotion Program (LAMP component)"
      source_citation: "USDA AMS LAMP component listing"
    - keyword: "LFPP"
      funder: "USDA AMS — Local Food Promotion Program (LAMP component)"
      source_citation: "USDA AMS LAMP component listing"
    - keyword: "RFSP"
      funder: "USDA AMS — Regional Food System Partnerships (LAMP component)"
      source_citation: "USDA AMS LAMP component listing"
    - keyword: "EQIP"
      funder: "USDA NRCS"
      source_citation: "NRCS programs page — Environmental Quality Incentives Program"
    - keyword: "CSP"
      funder: "USDA NRCS"
      source_citation: "NRCS programs page — Conservation Stewardship Program"
    - keyword: "Regenerative Pilot Program"
      funder: "USDA NRCS"
      source_citation: "NRCS Regenerative Pilot Program FY26 FAQ"
    - keyword: "SARE"
      funder: "USDA NIFA — Sustainable Agriculture Research and Education"
      source_citation: "SARE.org — regional host structure"
    - keyword: "AFRI"
      funder: "USDA NIFA — Agriculture and Food Research Initiative"
      source_citation: "NIFA AFRI program page — six priority areas + three program structure"
    - keyword: "BFRDP"
      funder: "USDA NIFA — Beginning Farmer and Rancher Development Program"
      source_citation: "NIFA BFRDP eligibility + funding-priorities page"
    - keyword: "RCDG"
      funder: "USDA Rural Development — Rural Cooperative Development Grants"
      source_citation: "USDA RD RCDG program page + 7 CFR 4284 Subpart F"
    - keyword: "Agriculture Innovation Grant"
      funder: "Pennsylvania Department of Agriculture"
      source_citation: "PA.gov PDA — 2026 Agricultural Innovation Grant program page"
    - keyword: "REAP"
      funder: "USDA Rural Development — Rural Energy for America Program"
      source_citation: "USDA RD program page — Rural Energy for America Program (rd.usda.gov/programs-services/energy-programs/rural-energy-america-program-renewable-energy-systems-energy-efficiency)"

  disqualifier_terms:
    - term: "personal use"
      reason: "VAPG + Rural Development programs require Agricultural Commodity production at scale and commercial sales; personal-use or hobby farming flags mismatch."
    - term: "research grant only"
      reason: "If applicant scope is pure scientific research with no producer-side activity, AFRI / SARE may fit, but VAPG / Specialty Crop / LAMP / Ag Innovation Grant scope is producer / processor / commercial; flag mismatch unless co-applicant producer is in scope."
    - term: "indirect non-agricultural use"
      reason: "Programs in this CIC require Agricultural Commodity nexus; non-ag end products typically disqualify (verify per RFA)."

# ─────────────────────────────────────────────────────────────────────────────
# Evidence signals — Scribe consumption per §18.8
# ─────────────────────────────────────────────────────────────────────────────
evidence_signals:
  - kind: "sales_ledger"
    source_pattern: "annual sales totals + buyer breakdown; pulled from accounting system or Schedule F"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA VAPG criterion a.iii — historical financial summary + pro forma projections"
  - kind: "buyer_letters_or_letters_of_intent"
    source_pattern: "signed LOI or purchase commitment from named buyer with volume + price + term"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "USDA VAPG criterion a.i (potential markets); USDA LFPP / RFSP institutional procurement framing"
  - kind: "production_records"
    source_pattern: "acreage / livestock counts / yield records / crop plans"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA VAPG criterion a.i — sufficient agricultural commodity supply"
  - kind: "soil_test_or_conservation_plan"
    source_pattern: "soil lab report; NRCS conservation plan; or NRCS contract"
    weight: "MEDIUM"
    freshness_tolerance_days: 730
    source_citation: "NRCS EQIP + CSP + Regenerative Pilot — resource-concern baselines"
  - kind: "food_safety_certification"
    source_pattern: "GAP, GHP, FSMA Produce Safety Rule, USDA Organic, third-party audit"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "USDA VAPG food-safety reserved-funds category; institutional buyer compliance"
  - kind: "equipment_quotes"
    source_pattern: "vendor quotes with itemized cost + delivery timeline for proposed capital purchase"
    weight: "MEDIUM"
    freshness_tolerance_days: 180
    source_citation: "PA Ag Innovation Grant + USDA VAPG working-capital documentation expectations"
  - kind: "business_plan_or_feasibility_study"
    source_pattern: "written business plan or feasibility study by Qualified Consultant (VAPG planning grants)"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "USDA VAPG planning-grant scope — Feasibility Study and/or Business/Marketing Plan by Qualified Consultant"
  - kind: "match_documentation"
    source_pattern: "cash and/or in-kind match commitments with source identification; cash-vs-in-kind ratio disclosed"
    weight: "HIGH"
    freshness_tolerance_days: 90
    source_citation: "USDA VAPG criterion d — cash match scores higher; PA Ag Innovation Grant 50% match requirement"
  - kind: "qualified_personnel_documentation"
    source_pattern: "resumes / biosketches for Key Personnel; job descriptions for unfilled roles"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA VAPG criterion b — Qualifications of Key Personnel scoring (20 pts)"
  - kind: "cooperative_governance_documentation"
    source_pattern: "bylaws + member roster + patronage model + board minutes (for cooperatives)"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA RCDG eligibility + VAPG priority-points framing for cooperatives"

# ─────────────────────────────────────────────────────────────────────────────
# KFR fact classes — Intake / Logician consumption
# ─────────────────────────────────────────────────────────────────────────────
kfr_fact_classes:
  - fact_class: "land_tenure"
    description: "Owned / leased / shared-use of operating land; site control for fixed-site projects."
    typical_provenance: "deed; lease; landowner letter"
  - fact_class: "acreage_under_management"
    description: "Operating acreage by crop/product category."
    typical_provenance: "FSA 156EZ; crop plan; lease schedule"
  - fact_class: "crop_or_product_category"
    description: "What is grown / raised / processed (commodity + specialty distinction)."
    typical_provenance: "crop plan; sales ledger; Schedule F"
  - fact_class: "annual_revenue"
    description: "Gross sales by year for last 1-3 years."
    typical_provenance: "Schedule F; P&L; tax returns"
  - fact_class: "certifications_held"
    description: "USDA Organic / GAP / GHP / FSMA / state-specific food-safety / Animal Welfare / Certified Naturally Grown."
    typical_provenance: "certifying body letter or audit report"
  - fact_class: "buyer_relationships"
    description: "Named buyers + categories (direct, wholesale, institutional, processor, distributor)."
    typical_provenance: "invoices; signed agreements; LOIs"
  - fact_class: "equipment_inventory"
    description: "Owned + shared-use processing / harvest / cold-chain equipment."
    typical_provenance: "asset list; insurance schedule; co-op shared-asset agreement"
  - fact_class: "production_volume"
    description: "Annual production by SKU or commodity (lbs, bushels, head, etc.)."
    typical_provenance: "production records; harvest logs; weight tickets"
  - fact_class: "conservation_practices_in_place"
    description: "NRCS-recognized practice codes; soil-test history; cover crop / no-till / rotational grazing / pollinator habitat etc."
    typical_provenance: "NRCS conservation plan; CSP contract; soil reports"
  - fact_class: "operator_priority_category"
    description: "Beginning farmer (within 10 years); socially-disadvantaged; veteran; small/medium family farm; cooperative."
    typical_provenance: "FSA records; self-attestation per VAPG / BFRDP form"
  - fact_class: "match_capacity"
    description: "Cash on hand + committed third-party cash + verifiable in-kind."
    typical_provenance: "bank statements; commitment letters; in-kind valuation memo"
  - fact_class: "cooperative_membership_and_governance"
    description: "Member count + classes + voting structure + patronage model (cooperatives only)."
    typical_provenance: "bylaws; member roster; board minutes"

# ─────────────────────────────────────────────────────────────────────────────
# Provenance requirements per fact class
# ─────────────────────────────────────────────────────────────────────────────
provenance_requirements:
  annual_revenue:
    required_citation_type: "Schedule F or audited P&L or signed self-attestation with backing tax doc"
    verbatim_quote_required: false
  certifications_held:
    required_citation_type: "certifying body letter or audit report with cert ID + expiration"
    verbatim_quote_required: false
  buyer_relationships:
    required_citation_type: "signed letter, LOI, or invoice — verbatim buyer name + commitment terms"
    verbatim_quote_required: true
  conservation_practices_in_place:
    required_citation_type: "NRCS practice code + plan ID; or third-party verifier letter"
    verbatim_quote_required: false
  operator_priority_category:
    required_citation_type: "FSA filing or signed self-attestation per program-specific form"
    verbatim_quote_required: false

# ─────────────────────────────────────────────────────────────────────────────
# Register defaults — Scribe consumption
# ─────────────────────────────────────────────────────────────────────────────
register_defaults:
  language_register: "hybrid"
  narrative_voice: "first_person_plural"
  tone: "technical_precise"
  operator_override: "PROJECT_CONTEXT match_overrides take precedence"
  # Structured sub-register triad per Cycle 1 audit fold-in (F-01).
  # Scribe selects ONE sub-register per proposal section based on active CLC +
  # funder dialect at runtime. Sub-registers do NOT compose into a single tone.
  # Cycle 2 fix-in-place (C2-01): removed `typical_clc_contexts` per Judge P0 +
  # Red Team MED — listing CLC slugs constitutes design-time CIC × CLC
  # coupling regardless of advisory framing. CLC selection is opportunity-
  # driven at runtime; the `sub_register_selection_rule` prose below is the
  # authoritative guidance for Scribe.
  sub_registers:
    - id: "business_commercial"
      description: "Profitability, market, enterprise, and commercialization framing"
      typical_program_anchors:
        - "USDA VAPG criterion a.iii (profitability)"
        - "PA Ag Innovation Grant (production / processing / commercialization)"
    - id: "ecological_conservation"
      description: "Soil health, water, biodiversity, conservation-practice framing"
      typical_program_anchors:
        - "NRCS EQIP / CSP / Regenerative Pilot Program"
        - "USDA SARE soil/water/energy/wildlife priorities"
    - id: "community_benefit"
      description: "Local-food access, partnership, rural-cooperative-development framing"
      typical_program_anchors:
        - "USDA LAMP (local-food framing)"
        - "USDA BFRDP (partnership framing)"
        - "USDA RCDG (rural-cooperative-development framing)"
  sub_register_selection_rule: |
    Scribe selects the sub-register matching the active CLC (identified at
    runtime per opportunity) plus the funder dialect from
    `dialect_routing_table`. Do NOT collapse business / ecological /
    community-benefit into a single tone. The sub_register × CLC association
    is opportunity-driven at runtime, never archetype-bound at design time,
    per CIC × CLC orthogonality (architecture v7.0.8 + v7.0.11).

# ─────────────────────────────────────────────────────────────────────────────
# Dialect routing table — Scribe per Law 4
# ─────────────────────────────────────────────────────────────────────────────
dialect_routing_table:
  - funder_political_axis: "conservative"
    dialect: "scribe.formal_commercial"
    example_funder: "USDA Rural Development (current administration framing — 'Farmer First Regenerative Pilot Program' name)"
  - funder_political_axis: "centrist"
    dialect: "scribe.technical_precise"
    example_funder: "USDA AMS SCBGP / LAMP; state departments of agriculture"
  - funder_political_axis: "progressive"
    dialect: "scribe.movement_aligned"
    example_funder: "Regional foundation food-systems portfolios + community foundations with food-systems priorities. Specific third-party org names removed from binding field per Law 5 + Phase F 2026-05-16 cleanup."
  - funder_political_axis: "soul_fire"
    dialect: "scribe.cooperative_solidarity"
    example_funder: "food sovereignty-aligned grantmakers"
    # Per Cycle 1 audit fold-in (F-02): generic descriptor in `example_funder`
    # avoids dialect-recruitment implication for named third-party orgs.
    # Cycle 2 fix-in-place (C2-02): removed `_observed_examples` undeclared
    # field per Judge MED — §18.5 schema for dialect_routing_table items
    # does not include underscore-prefixed example fields. Public-org
    # references moved to `_research_metadata.priors_consulted` where
    # underscore-prefixed metadata IS schema-canonical.

# ─────────────────────────────────────────────────────────────────────────────
# Admin-risk term register — Law 4 axis (b)
# Per operator OQ-5: approval_required: true defaults. Per L-005 (lessons memory):
# substitutions that settle across enough cycles may flip to false per-term
# per-card at a future Archivist Reflection sub-mode pass.
# ─────────────────────────────────────────────────────────────────────────────
admin_risk_term_register:
  - flagged_term: "food sovereignty"
    severity: "MEDIUM"
    substitution_candidates:
      - "food security and producer agency"
      - "producer self-determination in the food system"
      - "community-controlled food infrastructure"
    reviewer_context: |
      Term carries movement-aligned political weight (La Via Campesina origin; National
      Family Farm Coalition usage). Conservative federal review climates and most state
      DOA / USDA Rural Development panels read it as activist signaling. Centrist
      foundation and progressive philanthropy panels accept it; Soul Fire / food
      sovereignty-aligned grantmakers expect it.
    approval_required: true

  - flagged_term: "regenerative agriculture"
    severity: "MEDIUM"
    substitution_candidates:
      - "soil-health-based agriculture with named practices"
      - "USDA-recognized conservation practices (NRCS practice codes)"
      - "whole-farm conservation framework"
    reviewer_context: |
      Term carries no single agreed definition across funders. USDA NRCS uses it
      officially (Regenerative Pilot Program, FY26). State agencies and many
      foundations use it broadly. When applying to centrist / technical reviewers
      who want measurable practices, substituting to NRCS-named practice codes
      (cover crop, no-till, rotational grazing, etc.) reads as more precise. Keep
      "regenerative" verbatim when the active RFA uses the term, or when the
      funder's own materials use it as a primary frame. Operator decides per
      application; Tilth does not adjudicate the definitional dispute.
    approval_required: true

  - flagged_term: "climate-smart agriculture"
    severity: "MEDIUM"
    substitution_candidates:
      - "soil-carbon management practices"
      - "named conservation practices with measured outcomes"
      - "greenhouse-gas-aware production"
    reviewer_context: |
      Term peaked under prior administration; current USDA framing pivoted to
      "regenerative" + "Farmer First" language. Foundation and FAO context still
      accepts climate-smart; conservative federal review climates may treat it as
      politically loaded. Verify against active RFA language before keeping or
      substituting.
    approval_required: true

  - flagged_term: "land back"
    severity: "HIGH"
    substitution_candidates:
      - "Indigenous land tenure and stewardship"
      - "Tribal Nation land management partnership"
      - "Indigenous co-management agreement"
    reviewer_context: |
      Phrase carries explicit political demand framing in conservative review climates.
      Substitute to functional descriptions of the land-relationship structure unless
      applying to a funder whose RFA uses the phrase. (Tribal-specific funding programs
      use distinct statutory categories — verify program-specific language.)
    approval_required: true

  - flagged_term: "climate justice"
    severity: "MEDIUM"
    substitution_candidates:
      - "equitable climate adaptation"
      - "frontline-community climate resilience"
      - "environmental equity"
    reviewer_context: |
      Reads as activist framing to conservative panels; reads as core framing to
      progressive philanthropy + EPA-EE-aligned funders. Match to funder dialect.
    approval_required: true

  - flagged_term: "decolonize"
    severity: "HIGH"
    substitution_candidates:
      - "centering Indigenous knowledge"
      - "elevating producer-of-color leadership"
      - "structural inclusion of underrepresented producers"
    reviewer_context: |
      Activist register; conservative panels reject. Even progressive philanthropy
      may prefer functional language unless applying to soul-fire-aligned funder.
    approval_required: true

  - flagged_term: "anti-capitalist"
    severity: "HIGH"
    substitution_candidates:
      - "cooperative economics"
      - "shared-ownership enterprise"
      - "member-owned business model"
    reviewer_context: |
      Reads as ideological framing across most funder types. Substitute to functional
      enterprise / governance descriptors. (Cooperative CIC has its own substitution
      register — defer there for cooperative-applicant cases.)
    approval_required: true

  - flagged_term: "DEI / equity / inclusion"
    severity: "MEDIUM"
    substitution_candidates:
      - "underserved producer outreach"
      - "socially-disadvantaged farmer or rancher (USDA statutory category)"
      - "beginning, veteran, and SDA producer support"
    reviewer_context: |
      Under current federal administration framing, DEI language has been deprioritized
      in some USDA program announcements. USDA *statutory* priority categories
      (beginning, socially-disadvantaged, veteran, small/medium family farm) remain
      live and are the preferred framing for USDA Rural Development / NIFA programs.
      Foundation funders vary. Verify per active RFA.
    approval_required: true

# ─────────────────────────────────────────────────────────────────────────────
# Reporting cadence
# ─────────────────────────────────────────────────────────────────────────────
reporting_cadence_typical:
  default_frequency: "project_based"
  per_funder_overrides:
    USDA_VAPG: "semi-annual performance + annual financial; final at project close (max 3-year performance period)"
    USDA_LAMP: "annual performance + final report; quarterly financial common"
    USDA_NRCS_CSP: "annual practice-completion reporting; 5-year contract"
    USDA_NRCS_EQIP: "per-practice completion reporting + final inspection"
    USDA_SARE: "annual + final report with farmer-research outputs"
    USDA_AFRI: "annual progress reports + final; NIFA Reporting System (REEport)"
    USDA_SCBGP: "state-DOA pass-through reporting schedule (state-specific)"
    PA_Ag_Innovation_Grant: "milestone-based + final"
    USDA_BFRDP: "annual + final; NIFA REEport"
    USDA_RCDG: "annual + final"

