    evidence_type: "SAM.gov record"
    required_for_competitive: true
  - signal: "current good standing on prior federal awards"
    evidence_type: "prior-award compliance record (no FAPIIS adverse actions)"
    required_for_competitive: true
  - signal: "prior-deployment portfolio with named customers (where permitted)"
    evidence_type: "case-study portfolio + signed customer attestation letters"
    required_for_competitive: true
  - signal: "documented technical capability (for tech-supplier intermediaries)"
    evidence_type: "technical specification + system architecture + security posture documentation"
    required_for_competitive: true
  - signal: "qualified Key Personnel in deployment / service domain"
    evidence_type: "resumes / CVs / biosketches with role-to-task mapping; deployment-domain references"
    required_for_competitive: true
  - signal: "partner commitments documented"
    evidence_type: "signed MOU / partnership agreements with named roles"
    required_for_competitive: true
  - signal: "pricing / business model articulated"
    evidence_type: "written pricing schedule + financial sustainability narrative"
    required_for_competitive: true
  - signal: "data governance posture (especially for tech-supplier intermediaries)"
    evidence_type: "data-governance policy + classification register + applicable compliance audit (SOC-2 / FedRAMP / NIST 800-171 / HIPAA / FERPA / CCPA per sector)"
    required_for_competitive: true
  - signal: "evaluation methodology with attribution"
    evidence_type: "evaluation plan + logic model + attribution methodology section"
    required_for_competitive: true
  - signal: "single-audit readiness (for federal applicants > $750k expended)"
    evidence_type: "most recent Single Audit report (or fiscal-sponsor's where applicable)"
    required_for_competitive: false

# ─────────────────────────────────────────────────────────────────────────────
# Compliance burdens
# ─────────────────────────────────────────────────────────────────────────────
compliance_burdens:
  - framework: "SAM.gov + UEI registration"
    applicability: "all federal grant applicants"
    required_filings:
      - "SAM.gov annual renewal"
      - "Unique Entity Identifier on every application"
  - framework: "2 CFR 200 Uniform Guidance"
    applicability: "all federal grant recipients"
    required_filings:
      - "Single Audit if federal expenditures > $750,000 in a year"
      - "Procurement standards compliance"
      - "Subrecipient monitoring (where intermediary subgrants funds)"
  - framework: "FFATA / FSRS subaward reporting"
    applicability: "intermediaries that subaward federal funds > $30,000"
    required_filings:
      - "FSRS subaward report per subaward over threshold"
  - framework: "SBIR/STTR Data Rights and Bayh-Dole"
    applicability: "SBIR/STTR Phase I/II/III recipients"
    required_filings:
      - "Bayh-Dole iEdison invention disclosure within 60 days"
      - "Election to retain title within 2 years"
      - "Government-purpose-license preservation"
      - "SBIR Data Rights designation on technical data deliverables (4-year + Phase III protection)"
      - "Commercialization status report (Phase II awardees)"
  - framework: "SOC-2 Trust Services Criteria"
    applicability: "tech-supplier intermediaries handling customer data"
    required_filings:
      - "Annual SOC-2 Type II audit (if customer-required)"
      - "Continuous monitoring evidence"
  - framework: "FedRAMP"
    applicability: "tech-supplier intermediaries serving federal customers with cloud services"
    required_filings:
      - "FedRAMP authorization (Moderate or High per sensitivity)"
      - "Continuous monitoring per FedRAMP cadence"
  - framework: "NIST 800-171"
    applicability: "intermediaries handling Controlled Unclassified Information (CUI) for federal customers"
    required_filings:
      - "NIST 800-171 self-assessment (or 800-171A if formal assessment)"
      - "System Security Plan (SSP) + Plan of Action and Milestones (POA&M)"
      - "DFARS 252.204-7012 cybersecurity reporting (DoD-touching)"
  - framework: "HIPAA Privacy + Security Rules"
    applicability: "intermediaries handling Protected Health Information (PHI) for healthcare end-users"
    required_filings:
      - "Business Associate Agreement (BAA) with each covered entity"
      - "HIPAA Security Risk Analysis"
      - "Breach notification procedure"
  - framework: "FERPA (34 CFR Part 99)"
    applicability: "intermediaries handling student education records for educational end-users"
    required_filings:
      - "FERPA-compliant data-handling agreement with each LEA / IHE"
      - "Annual notification + parental consent procedures (where intermediary acts as school official)"
  - framework: "CCPA / state privacy laws"
    applicability: "intermediaries handling California-resident personal information (and other state-specific frameworks: CPRA, VCDPA, CPA, CTDPA, UCPA)"
    required_filings:
      - "Privacy notice meeting state-specific requirements"
      - "Data Subject Access Request (DSAR) handling procedure"
      - "Service Provider / Processor contract terms"
  - framework: "DOL Registered Apprenticeship (29 CFR Part 29 + 30)"
    applicability: "intermediaries operating as apprenticeship sponsors or intermediary sponsors"
    required_filings:
      - "Standards of Apprenticeship registration with DOL OA or State Apprenticeship Agency"
      - "RAPIDS data entry per apprentice"
      - "EEO compliance per 29 CFR Part 30"
  - framework: "State-specific intermediary licensing"
    applicability: "varies by state + intermediary type — e.g., licensed financial advisors, registered investment advisors, state-licensed CDFIs, state-licensed apprenticeship sponsors, state-licensed pesticide-extension agents, etc."
    required_filings:
      - "State licensure documentation per applicable framework"
  - framework: "Intellectual Property assignment + license framework"
    applicability: "varies by program — SBIR/STTR has specific data-rights provisions; foundation grants vary; federal cooperative agreements often require government-purpose license"
    required_filings:
      - "IP-assignment terms in each award (varies)"
      - "License-grant documentation where applicable"

# ─────────────────────────────────────────────────────────────────────────────
# Common risk register entries
# ─────────────────────────────────────────────────────────────────────────────
common_risk_register_entries:
  - risk: "private-vendor subsidy perception"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Foreground downstream public benefit + end-user agency. Document customer-
      owned-infrastructure / operator-controlled-deployment / sovereignty-preserving
      posture. Show specific named customer benefit with attribution methodology.
      Avoid vendor-pitch vocabulary (see admin_risk_term_register: disruption,
      platform dominance, scale, monopoly). Substitute toward implementation-
      oriented + workforce-augmentation framing.

      Reviewer-axis-specific framing. For conservative + centrist federal review
      contexts, emphasize statutory eligible-applicant fit + documented technical
      capability + jobs-and-investment-attribution methodology. For progressive +
      soul_fire reviewer contexts, foreground community-ownership / member-
      ownership posture, cite anti-extractive guarantees, document end-user
      agency over deployed infrastructure (customer-owned keys / exit pathways /
      open formats / data portability), and surface anti-lock-in commitments as
      structural — not marketing.
  - risk: "unclear or weakly-attributed end-user benefit"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Document attribution methodology explicitly: pre/post comparison, matched-
      comparison, dosage tracking, end-user self-attestation, third-party-evaluator
      attribution. Cite named customers (with permission). Use baseline-vs-target
      framing not raw outcome numbers. Surface methodology in evaluation_plan
      narrative section.
  - risk: "overstated technology readiness"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Use TRL self-assessment per NASA TRL Handbook / DOE TRL Calculator with
      evidence per TRL definition. Match SBIR phase to TRL: Phase I = 1-3, Phase
      II = 3-6, Phase III = 6-9. Avoid "production-ready" or "validated" claims
      without evidence. For Tilth's own self-application: be explicit about
      `local_only_validated: false` posture per architecture v7.0.10 §1.
  - risk: "weak demand evidence"
    likelihood: "HIGH"
    impact: "HIGH"
    mitigation_pattern: |
      Stack signed customer LOI / MOU + named partner commitments + prior-deployment
      case studies + customer-pipeline depth (count + dollar value). Avoid market-
      size substitution (TAM / SAM / SOM without specific buyer commitments).
  - risk: "adoption friction underestimated"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: |
      Document adoption_barriers_identified KFR fact-class. Include adoption-
      friction-mitigation plan in implementation narrative. Budget for change-
      management / training / customer-success staff. Surface dosage requirements
      explicitly.
  - risk: "support burden underestimated"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: |
      Document support_model KFR fact-class with response-time SLAs, escalation
      paths, knowledge-base scope, on-call rotation. Budget for ongoing support
      staffing (not just deployment staffing). Reviewer skepticism on support
      sustainability is common.
  - risk: "proprietary lock-in"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Document interoperability + data-portability + exit-pathway-preserving
      posture. Use open standards where possible. For Tilth-specific case: the
      sovereignty posture (operator-owned keys, local-only-sovereign deployment,
      one-Golden-Quill-per-client) IS the anti-lock-in answer — surface it
      explicitly. Avoid "platform" / "ecosystem capture" framing.
  - risk: "data governance ambiguity"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      Document data_governance_posture KFR fact-class with applicable framework
      (SOC-2 / FedRAMP / NIST 800-171 / HIPAA / FERPA / CCPA). Surface
      classification register + retention schedule + cross-org isolation
      guarantees. For Tilth-specific case: cite Law 3 (Org Isolation) +
      F-CARDS-CROSS-ORG-NAMESPACE-LEAK fail-closed enforcement.
  - risk: "weak maintenance / sustainability plan"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: |
      Document financial sustainability beyond grant period: revenue model,
      pricing structure, customer retention, partner-funding commitments,
      reserve-building plan. Foundation capacity-building reviewers especially
      sensitive to post-grant sustainability claims that lack mechanism.
  - risk: "insufficient training curriculum"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    mitigation_pattern: |
      For training-provider intermediaries: document curriculum with learning
      objectives, contact hours, assessment methodology, instructor
      qualifications. For DOL Registered Apprenticeship: align with applicable
      occupation framework + competency standards. Cite curriculum-evaluation
      methodology.
  - risk: "Law 4 boundary drift on vendor / scale / disruption vocabulary"
    likelihood: "HIGH"
    impact: "MEDIUM"
    mitigation_pattern: |
      Per admin_risk_term_register, every flagged term substitution flows through
      operator approval (approval_required: true default). No silent rewrites.
      CIC-06-specific: vendor-vs-intermediary tightrope is the most acute admin-
      risk surface for this CIC. Scribe should flag every "scale" / "disrupt" /
      "platform" / "automation" / "AI replaces" instance for operator review.
  - risk: "AI-replacement framing trap (Tilth-specific)"
    likelihood: "MEDIUM"
    impact: "HIGH"
    mitigation_pattern: |
      For Tilth's own self-application: never frame Tilth as replacing grant
      writers, replacing council seats, or autonomous-of-operator. Per
      architecture: Tilth's six-seat council REQUIRES operator decisions at every
      gate; per Five Operating Laws Law 1: RFA is the source of truth, not
      Tilth's own knowledge. Surface human-in-the-loop posture explicitly.

