    - term: "intermediary"
      source_citation: "USDA AMS Regional Food Business Centers framing — 'regional intermediary' as program-level identity term; SBA Microloan Intermediary statutory role"
    - term: "ecosystem builder"
      source_citation: "Kauffman Foundation + EDA Build to Scale program framing — 'ecosystem building' as inclusive-entrepreneurship intermediary identity"
    - term: "backbone organization"
      source_citation: "Stanford Social Innovation Review collective-impact framework (Kania + Kramer 2011) — 'backbone organization' as field-defining term; widely cited in foundation field-building RFAs (Mott, Kresge, RWJF)"
    - term: "technical assistance provider"
      source_citation: "USDA NIFA + USDA RD program-wide eligible-applicant framing; SBA Federal and State Technology (FAST) Partnership Program statutory role"
    - term: "capacity builder"
      source_citation: "Foundation field-building common usage; appears in Mott + Kresge + RWJF capacity-building portfolio RFAs as intermediary-applicant identity"
    - term: "implementation partner"
      source_citation: "EDA Build to Scale + NIST MEP common framing for intermediaries delivering federal-program adoption support"
    - term: "training provider"
      source_citation: "DOL Apprenticeship Building America Program (ABAP) + WIOA national programs eligible-applicant framing; appears in IES Comprehensive Centers RFA"
    - term: "systems integrator"
      source_citation: "Federal IT acquisition vocabulary (NASA / DoD / GSA); applies to tech-supplier intermediaries deploying multi-component systems for end-user organizations"
    - term: "navigator"
      source_citation: "USDA AMS Regional Food Business Centers — 'navigator' role for connecting producers to programs; HRSA + ACA Marketplace Navigator program lineage"
    - term: "extension provider"
      source_citation: "USDA NIFA Extension partnerships (1862 / 1890 / 1994 land-grant + Cooperative Extension System); statutory eligible-applicant under Smith-Lever Act + Extension RFAs"
    - term: "adoption support"
      source_citation: "EDA Build to Scale + NSF Convergence Accelerator framing — 'adoption support' as intermediary deliverable distinct from technology development"
    - term: "deployment partner"
      source_citation: "DOE / NREL technology-deployment intermediary framing; NIST MEP-style deployment-support intermediary role"
    - term: "fiscal sponsor"
      source_citation: "National Network of Fiscal Sponsors (NNFS) sector identity; appears in foundation RFAs as eligible-applicant relationship for emerging projects"
    - term: "regenerative systems supplier"
      source_citation: "Composite-concept lineage — NOT a fixed industry-taxonomy term. NIST Manufacturing USA + DOE / NREL technology-deployment intermediary lineage names the supplier-of-deployed-infrastructure role; foundation regenerative-economy literature (Capital Institute / RSF Social Finance) frames the regenerative-vs-extractive distinction. The compound phrase appears in operator-internal taxonomy (drawing TILTH-CIC-REVIEW-01, 2026-05-08) as the v0.1 working label for the technology-supplier-with-regenerative-posture intermediary archetype."
      _note: "Term is operator-coined-composite, not externally-defined. Treat search-vocabulary matches as soft signals (Scout matches partial-phrase variants like 'regenerative infrastructure supplier' / 'sovereignty-preserving deployment supplier' / 'customer-owned infrastructure vendor')."
    - term: "field-building intermediary"
      source_citation: "Foundation field-building portfolios (Mott, Mellon, Kresge, Schmidt Futures) — 'field-building' as foundation-recognized intermediary deliverable category"
    - term: "regranting intermediary"
      source_citation: "Foundation regranting common usage (Communities of Color United, Borealis, NEO Philanthropy fiscal-sponsorship + regranting; Tides) — pass-through-grant intermediary identity"
    - term: "convener"
      source_citation: "Foundation collective-impact RFA common usage; appears in RWJF + Kresge backbone-organization framing as intermediary deliverable"
    - term: "matchmaker"
      source_citation: "EDA Build to Scale + USDA AMS Regional Food Business Centers — 'matchmaking' between buyers + sellers / funders + applicants as intermediary deliverable"

