# Card — TILTH-CIC-06 Ecosystem Intermediary / Regenerative Systems Supplier
# Wave 2 research draft. Cards Wave 2 dispatch 2026-05-15 (Cowork session).
# Operator decisions from Wave 1 carried forward: directory UPPERCASE (CIC/),
# verbatim quotes ≤2 sentences (OQ-4), approval_required: true defaults (OQ-5),
# qualitative-only frequency tags until 12+ CycleReceipts (OQ-6).
#
# Wave 1 handback resolutions applied:
#  - schema is current as-on-disk; do NOT modify; field names + enums exactly.
#  - lifecycle uses review_status; card passes.
#  - dialect_routing_table item shape {funder_political_axis, dialect,
#    example_funder} with enum {conservative, centrist, progressive, soul_fire}.
#  - common_funders_observed.frequency_observed enum per entry.
#  - provenance_requirements keys = KFR fact_class names with
#    required_citation_type + verbatim_quote_required.
#
# NEVER include common_clc_patterns_observed or any CLC eligibility / preference /
# win-rate / ranking field (F-CARDS-COUPLING-VIOLATION-EXTENSION fail-closes
# loader). common_funders_observed below is funder-side observational metadata
# only — NOT a CIC × CLC binding. Runtime matching is opportunity-driven
# (Scout / Logician identify CLC per opportunity; CIC determines seat
# configuration only).
#
# ─────────────────────────────────────────────────────────────────────────────
# Important framing decisions (Wave 2 — TILTH-CIC-06 specific)
# ─────────────────────────────────────────────────────────────────────────────
#
#  - SELF-APPLICABILITY: This is the CIC that fits Tilth / Golden Quill itself.
#    Tilth is an ecosystem intermediary supplying agentic grant-intelligence as
#    deployed infrastructure. The card MUST be authored well enough that
#    Tilth could use it for its own grant applications (research / SBIR /
#    EDA Build to Scale / NSF Convergence Accelerator / foundation field-
#    building / capacity-building portfolios). Per §18.13 + Law 3, the
#    card lives in the workspace-shared cards:cic:* namespace and does
#    NOT carry Tilth-specific applicant data; that data belongs in
#    `orgs/fit_farms_llc/PROJECT_CONTEXT.md` (the grant-writing client role
#    label per CLAUDE.md). The card is generic to any ecosystem-
#    intermediary applicant. See decision_queue OD-1 for self-applicability
#    operator-review note.
#
#  - DISPLAY NAME (slash form): Architecture v7.0.11 §7.2 (resolved 2026-05-15
#    PM) keeps the slash form "Ecosystem Intermediary / Regenerative Systems
#    Supplier" as `display_name`. The schema gains an optional
#    `display_name_short` field — set here to "Ecosystem Intermediary" for
#    downstream consumers that cannot safely render slashes (audit-log
#    canonical-bytes formatting, future Match-DB grid display, terminal-
#    pipeline-CLI table rendering). Loader resolves `display_name_short` to
#    `display_name` when absent. CIC-06 is the only CIC that needs both today.
#
#  - VENDOR-VS-INTERMEDIARY REGISTER TIGHTROPE: The most acute admin-risk
#    surface for this CIC is the perception that the applicant is a private
#    vendor receiving grant subsidy for commercial gain (vs a credible
#    intermediary delivering downstream public benefit). Register defaults
#    pivot on credible / implementation-oriented / careful-not-to-sound-like-
#    vendor-hype framing. Multiple admin_risk_term_register entries
#    ("disruption", "platform dominance", "scale", "automation replacing
#    workers") substitute toward operator/applicant agency and downstream
#    benefit framing — never toward AI capability bragging (even though Tilth
#    IS an AI-powered intermediary). When Tilth applies for its own grants,
#    Scribe must foreground operator agency (the Golden Quill owner, the
#    member-owner) over Tilth's own technical sophistication.
#
#  - TECHNOLOGY READINESS LEVEL (TRL): For tech-supplier intermediaries
#    (including Tilth itself), federal funders increasingly expect TRL-style
#    self-assessment per DOE / DoD / NASA / NIH conventions. SBIR Phase I
#    targets TRL 1-3 (concept / proof-of-concept); Phase II targets TRL 3-6
#    (prototype / pilot); Phase III targets TRL 6-9 (commercialization).
#    The technology_readiness_level KFR fact-class captures this with
#    evidence backing per TRL definition (NASA TRL Handbook + DOE TRL
#    Calculator). For non-tech intermediaries (TA / training / fiscal
#    sponsorship / convening), TRL is N/A — the fact-class self-attests.
#
#  - DOWNSTREAM-ATTRIBUTION METHODOLOGY: The intermediary's value is
#    measured at end-user organizations (revenue uplift, capacity gain, time
#    saved at customer farms / schools / agencies / co-ops served). Direct
#    attribution is methodologically hard — the intermediary's contribution
#    must be isolated from confounds (concurrent funding, market conditions,
#    end-user effort, peer-effects). The downstream_outcomes KFR fact-class
#    requires a documented attribution methodology (pre/post comparison,
#    matched-comparison, dosage tracking, end-user self-attestation, third-
#    party evaluator attribution), NOT a raw outcome number. Reviewer-side
#    skepticism on weak attribution is a top-3 red flag (per
#    common_risk_register_entries).
#
#  - INTERMEDIARY ARCHETYPE BOUNDARIES (vs other CICs):
#      * vs CIC-02 Educator: An intermediary that runs training / curriculum
#        as a primary service falls in BOTH cards. If the applicant is an
#        accredited educational institution the LEAD axis is CIC-02; if the
#        applicant is a TA provider whose training is one delivery mode the
#        LEAD axis is CIC-06.
#      * vs CIC-05 Cooperative: An intermediary may be cooperatively-governed
#        (shared-services co-op, federation). LEAD axis is CIC-05 if the
#        cooperative-governance form is the funding-relevant identity (e.g.,
#        applying for USDA RCDG as a member-owned co-op); LEAD axis is CIC-06
#        if the funding-relevant identity is the intermediary-service-
#        delivery role (e.g., applying for SBIR as a tech vendor).
#      * vs CIC-03 Public Agency: An intermediary funded by a public agency
#        as fiscal sponsor / pass-through is NOT a public agency itself —
#        LEAD axis stays CIC-06. Public agencies that operate intermediary
#        programs (e.g., a state-DOA-run TA program) lead with CIC-03.
#      * vs CIC-04 Arts & Culture: An arts-services intermediary (regranting
#        arts council, teaching-artist network) leads with CIC-04 if the
#        artistic-merit funding logic dominates; CIC-06 if the backbone /
#        capacity-builder role dominates.
#      * vs CIC-01 Food Systems: A food-systems intermediary (food hub
#        operator, regional aggregator, regional food business center) leads
#        with CIC-01 if direct producer-side activity is the funding focus;
#        CIC-06 if the backbone / regional-coordination role is the funding
#        focus (e.g., applying as a USDA AMS Regional Food Business Center
#        backbone organization).
#    These boundaries are advisory; the active CIC at runtime is operator-
#    selected per opportunity, not auto-routed by Tilth.
#
# Lifecycle: draft. NO Ed25519 signature. Operator review pending before Wave 2
# LOCK ceremony as separate dispatch. Per OD-1, this CIC requires an additional
# operator-review pass for self-application use cases (Tilth applying for its
# own grants under the card it authored).
#
# DOCUMENTATION-VS-SCHEMA POSTURE (Wave 2 Cycle 2 clarification, RT-C2-02 fold):
# The comment-block framing above describes the AUTHORING CONTEXT (Tilth itself
# is an instance of this CIC) — that context is operator-internal and stays in
# documentation comments only. The card SCHEMA FIELDS (search_vocabulary,
# evidence_signals, kfr_fact_classes, register_defaults, dialect_routing_table,
# admin_risk_term_register, common_risk_register_entries, common_funders_observed,
# narrative_sections_typical, capacity_signals_required, compliance_burdens,
# metrics_table_template) have been purged of Tilth-specific marketing language
# during Cycle 1 F-01 + F-03 folds. The card serves ALL ecosystem
# intermediary applicants generically. Tilth-specific application work (when
# Tilth applies for its own grants) flows through orgs/fit_farms_llc/PROJECT_CONTEXT.md
# per Law 3 Org Isolation — not through this workspace-shared card.

