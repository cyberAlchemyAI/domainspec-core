  disqualifier_terms:
    - term: "individual consultant fee-for-service only"
      reason: "Most ecosystem intermediary funding programs require organizational applicant (501(c)(3), cooperative, LLC with intermediary mission, public agency, accredited institution). Sole-proprietor consulting fee-for-service work usually disqualifies (consultant role may be subcontract within an intermediary's award — verify per RFA)."
    - term: "private commercial product launch (no public-benefit framing)"
      reason: "Ecosystem-intermediary funders expect downstream public benefit (producer adoption, jobs at end-user organizations, regional ecosystem strengthening). Pure commercial product launches without public-benefit framing usually disqualify (SBIR is the exception — but SBIR still requires research-novelty + commercialization-with-broader-impact framing)."
    - term: "for-profit applicant for nonprofit-only programs"
      reason: "USDA RCDG, foundation field-building portfolios, and many DOL workforce intermediary programs restrict to nonprofits. For-profit intermediaries (including LLC-form social enterprises and Tilth itself) must verify per-program eligibility before applying."
    - term: "research grant only with no deployment / TA scope"
      reason: "Ecosystem-intermediary funders distinguish research (CIC-04 / CLC-04 territory) from deployment / adoption support / TA (CIC-06). Pure research scope without an intermediary-delivery component usually mismatches CIC-06 funder expectations."

# ─────────────────────────────────────────────────────────────────────────────
# Evidence signals — Scribe consumption per §18.8
# ─────────────────────────────────────────────────────────────────────────────
evidence_signals:
  - kind: "customer_letters_or_letters_of_intent"
    source_pattern: "signed letter / LOI / MOU from named end-user customer (farm, school, agency, co-op) committing to receive intermediary services with scope + timeline"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "EDA Build to Scale + USDA AMS Regional Food Business Centers + SBIR Phase II + NSF Convergence Accelerator — all expect named customer commitment as primary demand evidence"
  - kind: "partner_commitments"
    source_pattern: "signed partnership agreements / MOUs with delivery partners, TA partners, evaluation partners, technology partners — with named roles + responsibilities"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "USDA NIFA Extension partnership requirements; foundation field-building partnership expectations; NSF Convergence Accelerator multi-disciplinary-partnership requirement"
  - kind: "prior_deployment_case_studies"
    source_pattern: "narrative case study of prior intermediary delivery to a named customer (or anonymized with permission) — including baseline + intervention + outcome + attribution methodology"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "EDA Build to Scale + SBIR Phase II + foundation capacity-building portfolios — track record evidence"
  - kind: "technical_specifications"
    source_pattern: "documented technical specs for any technology / software / hardware deliverable; system architecture; API documentation; data-flow diagrams; security posture"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "SBIR Phase I/II technical-merit scoring; SOC-2 / FedRAMP requirements for federal-customer-data-handling intermediaries; NIST 800-171 for CUI handling"
  - kind: "implementation_plan"
    source_pattern: "detailed implementation plan with milestones, customer onboarding sequence, support model, escalation paths, success metrics"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "EDA Build to Scale program design + NSF Convergence Accelerator Phase 1 deliverables; USDA AMS Regional Food Business Center cooperative-agreement workplan expectations"
  - kind: "training_curriculum"
    source_pattern: "documented training curriculum with learning objectives, contact hours, assessment methodology, instructor qualifications"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "DOL Apprenticeship Building America Program curriculum requirements; IES Comprehensive Centers training-deliverable expectations; USDA Extension curriculum standards"
  - kind: "support_model_documentation"
    source_pattern: "documented post-deployment support model: ticketing system, response-time SLAs, escalation paths, knowledge base, on-call rotation, documentation portal"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "EDA Build to Scale + foundation systems-supplier expectations; SOC-2 operational-controls scoping"
  - kind: "pricing_model_documentation"
    source_pattern: "written pricing structure: sliding scale / member-capped / one-deployment-per-client / per-appliance / tiered / subscription / fee-for-service / hybrid — with rationale linking pricing to mission"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "Foundation capacity-building grantmaker expectations re: financial sustainability post-grant; SBIR Phase II commercialization plan; CDFI lender financial-sustainability scoring"
  - kind: "staff_credentials_and_qualifications"
    source_pattern: "resumes / CVs / biosketches for Key Personnel; deployment-domain experience documented; technical credentials where applicable; prior-customer references"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "USDA RD VAPG-style Qualifications-of-Key-Personnel scoring (intermediary programs mirror this); SBIR PI requirements; foundation capacity-building team-evidence expectations"
  - kind: "evaluation_plan_and_attribution_methodology"
    source_pattern: "evaluation plan with logic model, baseline-comparison or matched-comparison or pre/post or third-party-evaluator design, attribution methodology, data-collection schedule"
    weight: "HIGH"
    freshness_tolerance_days: 365
    source_citation: "EDA Build to Scale evaluation-rigor scoring; NSF Convergence Accelerator evaluation requirements; foundation field-building evaluation expectations; IES Comprehensive Centers evaluation-deliverable requirements"
  - kind: "fiscal_sponsor_documentation"
    source_pattern: "fiscal sponsorship agreement (Model A or Model C per NNFS taxonomy); fiscal-sponsor 501(c)(3) determination letter; fee structure; reporting cadence"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "National Network of Fiscal Sponsors (NNFS) Best Practices; foundation grantmaker fiscal-sponsorship documentation expectations"
  - kind: "extension_or_TA_partner_agreements"
    source_pattern: "signed agreement with land-grant Extension office, MEP center, SBDC, or other TA delivery partner — with division of labor + reporting responsibilities"
    weight: "MEDIUM"
    freshness_tolerance_days: 365
    source_citation: "USDA NIFA Extension partnership documentation requirements; NIST MEP affiliated-center agreements"
  - kind: "downstream_impact_attribution_documentation"
    source_pattern: "documented methodology for measuring downstream impact at end-user organizations — pre/post comparison, dosage tracking, end-user self-attestation forms, third-party evaluator reports"
    weight: "HIGH"
    freshness_tolerance_days: 730
    source_citation: "Foundation field-building evaluation rigor; EDA Build to Scale jobs-and-investment-attribution methodology; NIST MEP NIPS economic-impact-survey methodology"
  - kind: "technology_readiness_evidence"
    source_pattern: "TRL self-assessment with evidence per TRL definition (NASA TRL Handbook / DOE TRL Calculator); for tech-supplier intermediaries only"
    weight: "MEDIUM"
    freshness_tolerance_days: 180
    source_citation: "SBIR/STTR Phase scoring; DOE / DoD / NASA TRL conventions; federal tech-acquisition vocabulary"
  - kind: "data_governance_posture_documentation"
    source_pattern: "documented data-handling policies for end-user / customer data; classification register; retention schedule; deletion procedures; cross-org isolation guarantees; SOC-2 / FedRAMP / HIPAA / FERPA / CCPA compliance posture as applicable"
    weight: "HIGH"
    freshness_tolerance_days: 180
    source_citation: "SOC-2 Trust Services Criteria; NIST 800-171 for CUI handling; HIPAA Privacy + Security Rules; FERPA 34 CFR Part 99; CCPA Cal. Civ. Code §1798.100 et seq."

# ─────────────────────────────────────────────────────────────────────────────
# KFR fact classes — Intake / Logician consumption
# ─────────────────────────────────────────────────────────────────────────────
kfr_fact_classes:
  - fact_class: "service_type"
    description: "Primary intermediary service modality: TA / training / fiscal sponsorship / shared services / convening / matchmaking / advocacy / research-extension / regranting / deployment / systems-integration / multi-modal-hybrid."
    typical_provenance: "organizational mission statement; service catalog; theory-of-change document"
  - fact_class: "customer_segment"
    description: "End-user customer segment(s) served — by CIC: CIC-01 Food Systems / CIC-02 Educator / CIC-03 Public Agency / CIC-04 Arts & Culture / CIC-05 Cooperative / CIC-06 other intermediaries (intermediary-of-intermediaries). Multiple segments common."
    typical_provenance: "customer roster (with permission for named cases); aggregate customer-segment counts; service-catalog targeting language"
  - fact_class: "end_user_benefit_articulation"
    description: "Articulated downstream benefit at end-user organization — e.g., 'producer revenue uplift', 'co-op member capacity gain', 'school-district program-implementation time saved', 'agency cycle-time reduction'."
    typical_provenance: "theory-of-change document; logic model; customer testimonials; outcome-attribution methodology document"
  - fact_class: "technical_capability"
    description: "Documented technical capability for tech-supplier intermediaries (or N/A for non-tech). Architecture overview, technology stack, security posture summary, deployment topology."
    typical_provenance: "technical specification document; system architecture diagram; SOC-2 / FedRAMP / NIST 800-171 audit reports"
  - fact_class: "technology_readiness_level"
    description: "TRL self-assessment per NASA TRL Handbook / DOE TRL Calculator. Range 1-9 or N/A. SBIR Phase I targets TRL 1-3; Phase II targets TRL 3-6; Phase III targets TRL 6-9. N/A for non-tech intermediaries."
    typical_provenance: "self-assessment with evidence per TRL definition; prior-deployment evidence; pilot-customer-feedback documentation"
  - fact_class: "prior_deployments"
    description: "Roster of prior deployments / engagements with named customers (or anonymized aggregates with permission); count + duration + outcome category per deployment."
    typical_provenance: "customer roster with attestation permissions; signed customer attestation letters; case-study portfolio"
  - fact_class: "partner_network"
    description: "Active partnership roster: TA partners, technology partners, delivery partners, evaluation partners, fiscal sponsor (if applicable), funder relationships."
    typical_provenance: "signed MOU / partnership agreements; partner-roster maintenance log; partnership-portfolio narrative"
  - fact_class: "customer_commitments_in_pipeline"
    description: "Pipeline of pending / committed customer engagements — names (where permitted) + scope + signed-or-pending status."
    typical_provenance: "signed LOIs / MOUs; written commitment letters; CRM-pipeline export"
  - fact_class: "support_model"
    description: "Post-deployment support model: ticketing / response-time SLAs / escalation paths / knowledge base / on-call rotation / customer success management."
    typical_provenance: "support-model documentation; SLA contract language; ticketing-system metrics"
  - fact_class: "pricing_model"
    description: "Pricing structure: sliding scale / member-capped / one-deployment-per-client / per-appliance / tiered / subscription / fee-for-service / hybrid / nonprofit-revenue-line. Includes rationale linking pricing to mission."
    typical_provenance: "written pricing schedule; pricing-rationale memo; financial sustainability narrative"
  - fact_class: "adoption_barriers_identified"
    description: "Documented barriers to end-user adoption: technical complexity, change-management cost, end-user data sensitivity, compliance burden, peer-effects friction, etc."
    typical_provenance: "user-research findings; pilot-customer feedback; documented adoption-friction-mitigation plan"
  - fact_class: "downstream_outcomes_with_attribution"
    description: "Measured downstream outcomes at end-user organizations WITH documented attribution methodology — NOT raw outcome numbers. Methodology required: pre/post comparison, matched-comparison, dosage tracking, end-user self-attestation, third-party evaluator attribution."
    typical_provenance: "evaluation report with attribution methodology section; third-party-evaluator letter; end-user-attestation forms; pre/post baseline data"
  - fact_class: "backbone_organization_role"
    description: "For collective-impact / backbone organizations only: documented role per Kania + Kramer 2011 framework — guiding vision + strategy / supporting aligned activities / establishing shared measurement / building public will / advancing policy / mobilizing resources."
    typical_provenance: "backbone-org-role narrative; collective-impact-initiative governance document; cross-organization shared-measurement system documentation"
  - fact_class: "network_density"
    description: "Quantitative measure of intermediary network: number of customers served per cycle, number of partners, geographic coverage, customer-retention rate, cycle-throughput."
    typical_provenance: "annual report; customer-roster aggregate metrics; CRM export; network-analysis output"
  - fact_class: "data_governance_posture"
    description: "Documented data-handling posture for customer / end-user data: classification register, retention schedule, deletion procedures, cross-org isolation guarantees, applicable compliance frameworks (SOC-2 / FedRAMP / HIPAA / FERPA / CCPA)."
    typical_provenance: "data-governance policy document; classification register; SOC-2 / FedRAMP / NIST 800-171 audit report; legal-review memo"
  - fact_class: "intellectual_property_posture"
    description: "IP posture relevant to intermediary deliverables — proprietary / open-source / Bayh-Dole-elected / customer-owned / licensed / hybrid. Critical for SBIR Phase II/III + federal-customer scenarios."
    typical_provenance: "IP policy document; license agreements; SBIR Data Rights election documentation; Bayh-Dole reporting forms"

# ─────────────────────────────────────────────────────────────────────────────
# Provenance requirements per fact class
# ─────────────────────────────────────────────────────────────────────────────
provenance_requirements:
  prior_deployments:
    required_citation_type: "customer attestation letter or case-study portfolio with named customer (with attestation permission) and dated engagement"
    verbatim_quote_required: true
  customer_commitments_in_pipeline:
    required_citation_type: "signed LOI / MOU / commitment letter with named customer + scope + timeline"
    verbatim_quote_required: true
  technology_readiness_level:
    required_citation_type: "TRL self-assessment with evidence per TRL definition (NASA TRL Handbook / DOE TRL Calculator) — must show evidence-per-TRL-definition, not just claimed level"
    verbatim_quote_required: false
  technical_capability:
    required_citation_type: "technical specification document, system architecture diagram, or SOC-2 / FedRAMP / NIST 800-171 audit report"
    verbatim_quote_required: false
  downstream_outcomes_with_attribution:
    required_citation_type: "evaluation report or third-party-evaluator letter with documented attribution methodology section — NOT raw outcome numbers without methodology"
    verbatim_quote_required: true
  staff_credentials:
    required_citation_type: "resumes / CVs / biosketches; deployment-domain references where claimed"
    verbatim_quote_required: false
  partner_network:
    required_citation_type: "signed MOU / partnership agreement — verbatim partner name + role + commitment terms"
    verbatim_quote_required: true
  data_governance_posture:
    required_citation_type: "data-governance policy document; SOC-2 / FedRAMP / NIST 800-171 audit report; or legal-review memo for sector-specific frameworks (HIPAA / FERPA / CCPA)"
    verbatim_quote_required: false
  intellectual_property_posture:
    required_citation_type: "IP policy document; license agreements; SBIR Data Rights election form; Bayh-Dole reporting form"
    verbatim_quote_required: false

# ─────────────────────────────────────────────────────────────────────────────
# Register defaults — Scribe consumption
# ─────────────────────────────────────────────────────────────────────────────
register_defaults:
  language_register: "formal"
  narrative_voice: "first_person_plural"
  tone: "technical_precise"
  operator_override: "PROJECT_CONTEXT match_overrides take precedence. Per the vendor-vs-intermediary tightrope (see top-of-file framing), Scribe MUST default to credible / implementation-oriented / careful-not-to-sound-like-vendor-hype framing — even when the applicant has technically sophisticated capability. Foreground operator/applicant agency and downstream public benefit; background AI / technology capability bragging."
  # Sub-register triad parallels the food_systems CIC pattern. Scribe selects
  # ONE sub-register per proposal section based on active CLC + funder dialect
  # at runtime. CLC selection is opportunity-driven per architecture v7.0.8 +
  # v7.0.11 — sub-registers do NOT name CLC slugs.
  sub_registers:
    - id: "implementation_credibility"
      description: "Track-record + deployment-history + customer-letter-driven framing emphasizing prior delivery"
      typical_program_anchors:
        - "EDA Build to Scale (track record + jobs-and-investment-attribution)"
        - "USDA AMS Regional Food Business Centers (regional intermediary track record)"
        - "Foundation field-building portfolios (track record + partner network)"
    - id: "technical_research_innovation"
      description: "Research-novelty + technical-merit + commercialization-pathway framing for SBIR / NSF / DOE intermediary funding"
      typical_program_anchors:
        - "SBIR/STTR Phase I/II (research novelty + commercialization plan)"
        - "NSF Convergence Accelerator (multi-disciplinary innovation)"
        - "NSF I-Corps (customer-discovery rigor)"
    - id: "downstream_public_benefit"
      description: "End-user-organization benefit + jobs-at-customer-organizations + adoption-pathway framing for foundation + capacity-building funders"
      typical_program_anchors:
        - "Foundation capacity-building portfolios (Mott, Kresge, RWJF)"
        - "USDA RBDG / RCDG (rural-business + cooperative-development outcomes)"
        - "DOL Apprenticeship Building America (jobs at end-user organizations)"
  sub_register_selection_rule: |
    Scribe selects the sub-register matching the active CLC (identified at
    runtime per opportunity) plus the funder dialect from
    `dialect_routing_table`. Do NOT collapse implementation_credibility /
    technical_research_innovation / downstream_public_benefit into a single
    tone. The sub_register × CLC association is opportunity-driven at
    runtime, never archetype-bound at design time, per CIC × CLC
    orthogonality (architecture v7.0.8 + v7.0.11).

# ─────────────────────────────────────────────────────────────────────────────
# Dialect routing table — Scribe per Law 4
# ─────────────────────────────────────────────────────────────────────────────
dialect_routing_table:
  - funder_political_axis: "conservative"
    dialect: "scribe.formal_commercial"
    example_funder: "USDA Rural Development (current administration framing — 'deployment' + 'implementation' + 'domestic supply chain' + 'jobs in rural America' framing); EDA programs under current administration; SBA SBIR; DOL workforce / apprenticeship programs"
  - funder_political_axis: "centrist"
    dialect: "scribe.technical_precise"
    example_funder: "CDFI capacity-builders + foundation capacity-building portfolios + NSF I-Corps + NIST MEP. Specific third-party org names removed from binding field per Law 5 + Phase F 2026-05-16 cleanup."
  - funder_political_axis: "progressive"
    dialect: "scribe.movement_aligned"
    example_funder: "Major national foundation field-building + community-investment + systems-change portfolios + national innovation-competition programs. Specific third-party org names removed from binding field per Law 5 + Phase F 2026-05-16 cleanup."
  - funder_political_axis: "soul_fire"
    dialect: "scribe.cooperative_solidarity"
    example_funder: |
      Indigenous-led intermediary funders (for Indigenous-led intermediary
      applicants); cooperative-led intermediary funders (for cooperative-led
      intermediary applicants); regenerative-economy-aligned community-investment
      funders. Generic descriptors of funder political axis only — concrete
      named-org references live under _research_metadata.priors_consulted per
      Wave 1 Cycle 2 C2-02 fix-in-place precedent (food_systems card).

# ─────────────────────────────────────────────────────────────────────────────
# Admin-risk term register — Law 4 axis (b)
# Per operator OQ-5: approval_required: true defaults. Per L-005 (lessons memory):
# substitutions that settle across enough cycles may flip to false per-term
# per-card at a future Archivist Reflection sub-mode pass.
#
# CIC-06-specific framing note: This is Tilth's own CIC. Several entries
# specifically address the AI-replacement vocabulary trap — even though Tilth
# IS an AI-powered intermediary, substitutions foreground operator/applicant
# AGENCY rather than AI capability. See "automation replacing workers" + "AI
# replacing staff" + "disruption" entries.
# ─────────────────────────────────────────────────────────────────────────────
admin_risk_term_register:
  - flagged_term: "disruption"
    severity: "MEDIUM"
    substitution_candidates:
      - "operational improvement"
      - "implementation upgrade"
      - "deployed-infrastructure modernization"
      - "workforce-augmenting tooling"
    reviewer_context: |
      "Disruption" reads as Silicon-Valley vendor-pitch vocabulary across most
      federal + foundation review climates. Conservative federal panels read it
      as private-sector boasting incompatible with public-benefit framing.
      Foundation panels read it as un-rigorous re: end-user adoption costs.
      Substitute toward implementation-oriented framing that foregrounds
      operator/applicant continuity.
    approval_required: true

  - flagged_term: "platform dominance"
    severity: "HIGH"
    substitution_candidates:
      - "interoperable infrastructure"
      - "open-standard integration"
      - "customer-owned tooling"
      - "sovereignty-preserving deployment"
    reviewer_context: |
      "Platform dominance" / "category leader" / "winner-take-all" framing reads as
      anti-competitive across federal review climates and as monopoly-risk across
      foundation portfolios. Substitute toward interoperability + customer-ownership
      framing. (Tilth's own positioning is sovereignty-preserving / one-Golden-Quill-
      per-client / operator-owned-keys — substitution candidates reflect that posture.)
    approval_required: true

  - flagged_term: "surveillance"
    severity: "HIGH"
    substitution_candidates:
      - "operator-controlled telemetry"
      - "consent-based monitoring"
      - "opt-in observability"
      - "customer-owned audit logging"
    reviewer_context: |
      "Surveillance" carries explicit civil-liberties critique — appears in EFF /
      ACLU / academic-AI-ethics framing. For tech-supplier intermediary applicants,
      reviewers may flag the term even when the intermediary is positioned AGAINST
      surveillance; substitute toward consent-based / operator-controlled framing.
      For applicants whose work explicitly opposes surveillance (privacy-rights
      orgs), keep the term verbatim — context-sensitive operator decision.
    approval_required: true

  - flagged_term: "automation replacing workers"
    severity: "HIGH"
    substitution_candidates:
      - "workforce augmentation"
      - "staff-supporting tooling"
      - "operator-amplifying infrastructure"
      - "labor-augmentation deployment"
    reviewer_context: |
      "Automation replacing workers" / "AI replacing X" framing reads as job-loss-
      threat across DOL workforce panels, foundation capacity-building portfolios,
      and most federal panels. Even when factually accurate (automation does
      substitute for some labor), proposal framing must foreground worker continuity
      and capability uplift. Tilth-specific note: Tilth augments grant-writing
      labor; framing must NEVER suggest Tilth replaces grant writers — Tilth
      requires operator agency at every cycle.
    approval_required: true

  - flagged_term: "monopoly"
    severity: "HIGH"
    substitution_candidates:
      - "category specialization"
      - "deep-domain capability"
      - "concentrated expertise"
      - "specialist intermediary role"
    reviewer_context: |
      "Monopoly" reads as anti-competitive across federal review climates. Even
      "natural monopoly" framing (water utility, fiber backbone) carries political
      weight under current federal administration. Substitute toward specialization
      + role-specificity framing. For applicants in genuinely-shared-asset territory
      (CIC-05 cooperative + CLC-08 shared assets), the underlying logic is commons-
      ownership rather than monopoly — frame accordingly.
    approval_required: true

  - flagged_term: "proprietary lock-in"
    severity: "MEDIUM"
    substitution_candidates:
      - "interoperable architecture"
      - "open-standard integration"
      - "customer-portable deployment"
      - "exit-pathway-preserving infrastructure"
    reviewer_context: |
      "Lock-in" critique appears in foundation tech-procurement guidance and federal
      open-standards guidance (OMB M-22-09 + adjacent). For tech-supplier intermediary
      applicants, reviewers expect explicit anti-lock-in posture: open formats, data
      portability, exit pathways. Substitute toward interoperability + portability
      framing. Tilth-specific note: Tilth's sovereignty posture (operator-owned
      keys, local-only-sovereign deployment posture) IS the anti-lock-in answer.
    approval_required: true

  - flagged_term: "extractive scaling"
    severity: "HIGH"
    substitution_candidates:
      - "regenerative growth"
      - "member-benefiting expansion"
      - "downstream-benefit-aligned deployment"
      - "operator-sovereign growth pathway"
    reviewer_context: |
      "Extractive" framing carries explicit anti-capitalist political weight in
      cooperative + Indigenous + soul-fire-aligned funder contexts. In conservative
      federal review climates, the term itself may flag as activist signaling.
      Substitute toward regenerative / member-benefiting framing for non-soul-fire
      funder dialects; keep verbatim when applying to cooperative-funded or
      Indigenous-funded intermediaries.
    approval_required: true

  - flagged_term: "AI replacing staff"
    severity: "HIGH"
    substitution_candidates:
      - "AI-augmented workforce"
      - "operator-amplifying AI tooling"
      - "human-in-the-loop AI deployment"
      - "staff-supporting AI-assisted infrastructure"
    reviewer_context: |
      "AI replacing X" framing is a rapidly-evolving political risk surface across
      federal + foundation review climates (2026). DOL workforce panels reject it;
      foundation capacity-building portfolios reject it; even AI-friendly federal
      programs (NSF Convergence Accelerator, DARPA) prefer human-in-the-loop framing.
      Tilth-specific note: Tilth IS AI-powered, but Tilth's six-seat council REQUIRES
      operator decisions at every gate — framing must reflect that human-in-the-loop
      posture, not AI autonomy.
    approval_required: true

  - flagged_term: "scale / scaling"
    severity: "MEDIUM"
    substitution_candidates:
      - "expansion"
      - "deployment growth"
      - "fleet-wide rollout"
      - "regional coverage extension"
    reviewer_context: |
      "Scale" is high-frequency vendor-pitch vocabulary that draws skepticism from
      foundation capacity-building reviewers (who have seen many failed scaling
      claims) and from public-benefit reviewers (who associate it with VC-style
      growth-at-all-costs). The word is not blocked — it appears in EDA Build to
      Scale program name itself — but framing should specify what scales, how, with
      what capacity-management plan. Generic "we will scale this nationally" framing
      fails. Substitute toward specific expansion language with named milestones.
    approval_required: true

  - flagged_term: "DEI / equity / inclusion"
    severity: "MEDIUM"
    substitution_candidates:
      - "underserved-community access"
      - "socially-disadvantaged-customer support (USDA statutory category)"
      - "minority-business / women-owned-business / veteran-owned-business support (SBA statutory categories)"
      - "regional + sectoral access expansion"
    reviewer_context: |
      Under current federal administration framing, DEI language has been
      deprioritized in some federal program announcements. Statutory priority
      categories (socially-disadvantaged, minority-business, women-owned-business,
      veteran-owned-business, rural / distressed-community-served) remain live and
      are the preferred framing for federal intermediary programs. Foundation
      funders vary widely. Verify per active RFA. (Cross-CIC consistency: same
      MEDIUM severity + similar substitution candidates as food_systems +
      public_agency + cooperative cards.)
    approval_required: true

  - flagged_term: "sovereignty / sovereign"
    severity: "MEDIUM"
    substitution_candidates:
      - "customer-owned infrastructure"
      - "operator-controlled deployment"
      - "self-hosted system"
      - "local-only governance posture"
    reviewer_context: |
      Tilth-specific term — appears throughout Tilth's own positioning ("Sovereignty
      Promise", "Local-Only / Sovereign" routing posture). For most federal +
      foundation funders, the literal word "sovereignty" reads as either Indigenous-
      sovereignty framing (which has specific statutory + funding-program meaning) or
      as anti-government / anti-regulatory framing (negative for federal panels).
      Substitute toward functional descriptors (customer-owned / operator-controlled
      / self-hosted / local-only) for non-Indigenous-funded contexts. Keep verbatim
      when applying to Indigenous-led / Native-CDFI funders or to Tilth's own
      cooperative-commons-positioning materials. Operator decides per application.
    approval_required: true

