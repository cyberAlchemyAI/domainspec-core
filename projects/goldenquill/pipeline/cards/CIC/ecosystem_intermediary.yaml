    source_for_target: "customer roster + segment-tagged service-delivery log"
  - metric: "deployments completed"
    unit: "count"
    typical_target_range: "applicant-specific"
    source_for_target: "deployment log; for tech-supplier intermediaries: install / activation logs"
  - metric: "adoption rate"
    unit: "percent of customer base actively using deliverable"
    typical_target_range: "applicant-specific; baseline-vs-target"
    source_for_target: "usage telemetry (with operator-controlled-consent posture); customer attestation; periodic audit"
  - metric: "downstream revenue uplift at customer organizations"
    unit: "USD (with attribution methodology)"
    typical_target_range: "applicant-specific; document confidence interval"
    source_for_target: "third-party evaluator report or pre/post comparison with documented attribution methodology"
  - metric: "downstream capacity gain at customer organizations"
    unit: "FTE-hours saved or new-capability-deployed (with attribution methodology)"
    typical_target_range: "applicant-specific"
    source_for_target: "evaluation report or end-user attestation with documented attribution"
  - metric: "training participants"
    unit: "count + completion rate"
    typical_target_range: "applicant-specific"
    source_for_target: "training enrollment + completion records; LMS report; for DOL apprenticeship: RAPIDS entries"
  - metric: "partners engaged"
    unit: "count of signed MOU partners"
    typical_target_range: "applicant-specific"
    source_for_target: "partnership roster"
  - metric: "network density"
    unit: "customers + partners per FTE intermediary staff (or equivalent throughput metric)"
    typical_target_range: "applicant-specific"
    source_for_target: "operations reporting; CRM export"
  - metric: "technology-readiness progression"
    unit: "TRL level (1-9) baseline + target (for tech-supplier intermediaries only)"
    typical_target_range: "Phase I: TRL 1-3; Phase II: TRL 3-6; Phase III: TRL 6-9"
    source_for_target: "TRL self-assessment per NASA TRL Handbook / DOE TRL Calculator"
  - metric: "jobs created or retained at intermediary"
    unit: "FTE"
    typical_target_range: "applicant-specific"
    source_for_target: "intermediary-org HR records + payroll data"
  - metric: "jobs created or retained at end-user organizations"
    unit: "FTE (with attribution methodology)"
    typical_target_range: "applicant-specific"
    source_for_target: "EDA Build to Scale jobs-attribution methodology; NIST MEP NIPS; or third-party evaluator"
  - metric: "commercialization milestones (SBIR Phase II/III)"
    unit: "milestone narrative + revenue-from-deliverable + federal-customer-procurement status"
    typical_target_range: "applicant-specific"
    source_for_target: "Bayh-Dole reporting + commercialization status report"

