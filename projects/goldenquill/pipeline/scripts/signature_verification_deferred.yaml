# Signature-verification allowlist — assets whose embedded/row signatures are
# documented STALE-BY-DESIGN per the v0.2-first-wave loader-realization
# reconciliation. The signature_roundtrip CI job consults this list before
# hard-failing on a verification mismatch; any failure not on this list is
# treated as a regression and fails the build.
#
# Authority for each entry comes from:
#   - vault_shared/funder_intelligence/publisher_pubkey.signed.yaml §v0.2 NOTE
#     ("cards-publisher signed-asset uses an unreproducible canonicalization
#     whose hash does not verify under any of 8 candidate forms tested
#     2026-05-16. v0.2 loader-realization session reconciles ... OR re-runs
#     the original cards ceremony script to recompute.")
#   - pipeline/scripts/cards_embedded_re_sign_ceremony_2026-05-18.py header
#     comment ("v0.1 loader DOES enforce lifecycle.content_hash ... means the
#     stale-by-design [embedded signatures] do not block the loader; the v0.2
#     first-wave loader-realization session reconciles them.")
#   - OD-C row 272 precedent + OD-E supersession discipline embedded in
#     lock_history rows 276-278 (`embedded_signature_status: STALE
#     (intentional per OD-C row 272 precedent — supersession row is
#     authoritative new sig; loader-time re-validation deferred to v0.2
#     first-wave per architecture v7.0.11 §5)`).
#   - docs/project_audit_2026-05-18.md §10.1 reading note ("the loader does
#     not verify against the pinned publisher pubkey ... F-CARDS-SIGNATURE-
#     INVALID predicate body ... raises NotImplementedError").
#
# When the v0.2 first-wave loader-realization LOCK lands and these assets are
# re-signed under the reconciled canonicalization, REMOVE the corresponding
# entries from this file. Any leftover stale entry without an active deferral
# rationale is itself a CI-visible bug.

