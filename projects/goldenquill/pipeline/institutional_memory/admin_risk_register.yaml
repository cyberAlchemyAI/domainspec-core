    progressive_register: OK
    context: "Generally clean term across registers. Case-by-case at federal: 'green infrastructure' YELLOW-flagged in DOE/EPA contexts; 'public infrastructure', 'organizational infrastructure', 'data infrastructure' generally untouched. In Operating Capacity context, 'organizational infrastructure' is the modal usage and is funder-neutral."
    alternatives: ["organizational systems", "operational backbone", "core systems"]
    notes: "Watch for the qualifier — 'green' or 'climate' prefix triggers admin risk; standalone 'infrastructure' is safe. Cross-ref existing v2.1 entry 'green infrastructure' (RED-variant under climate/ESG family)."
    migrated_from: "TILTH-CLC-03 admin_risk_term_register entry; card severity=LOW"

  - term: "scalability"
    severity: GREEN
    federal_severity: GREEN
    progressive_register: OK
    context: "Disputed-meaning term: in venture/startup contexts implies unlimited growth; in capacity-building contexts implies 'serving more people with the new capacity'. Foundation-background reviewers may read 'scalability' as VC-language and discount; federal innovation reviewers (SBIR, EDA Build to Scale) welcome it. Match dialect to funder."
    alternatives: ["growth in service capacity", "expanded reach", "capacity to serve more", "replicability"]
    notes: "Foundation reviewers: prefer 'growth in service capacity'. Federal innovation reviewers: 'scalability' or 'scalable' acceptable. Cooperative/community funders: prefer 'replicability' to avoid extractive-scaling connotation."
    migrated_from: "TILTH-CLC-03 admin_risk_term_register entry; card severity=LOW"

