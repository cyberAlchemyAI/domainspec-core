  - term: "regional food system"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
    context: "USDA Regional Food System Partnership program statutory vocabulary; sibling to 'local food system' (v2.4 GREEN). Foundation reviewers welcome."
    alternatives: ["local food system", "regional value chain", "place-based food economy"]
    notes: "USDA-RFSP-statutory."
    variants: ["regional-food-system", "regional food economy"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
    approval_required: true

  - term: "values-based supply chain"
    severity: GREEN
    per_clc_register:
      market_access: OK
    context: "Foundation-food-systems vocabulary (Wallace Center, Kellogg, Mary Reynolds Babcock) and academic-extension (Iowa State Leopold Center) framing. Federal reviewers tolerate when paired with concrete supply-chain integrity standards. Soul-fire-aligned food-justice funders welcome."
    alternatives: ["values-aligned sourcing", "integrity-verified supply chain", "regional cooperative supply chain"]
    notes: "GREEN; no federal pull. Foundation-vocabulary common in food-systems grantmaking."
    variants: ["values based supply chain", "values-aligned supply chain"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
    approval_required: true

  - term: "commercialization"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
      research_evidence: EXPECTED
