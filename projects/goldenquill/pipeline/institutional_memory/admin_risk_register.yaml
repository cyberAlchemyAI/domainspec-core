    severity: GREEN
    federal_severity: GREEN
    progressive_register: OK
    context: "Generally safe; valued in federal programs (EDA Build to Scale, NSF, SBA). In Operating Capacity context, 'innovation in operations' or 'innovative governance practice' are funder-neutral."
    alternatives: ["operational improvement", "new approach", "process redesign"]
    notes: "Avoid 'disruption' / 'disruptive' which carries extractive-tech connotation."
    migrated_from: "TILTH-CLC-03 admin_risk_term_register entry; card severity=LOW"

