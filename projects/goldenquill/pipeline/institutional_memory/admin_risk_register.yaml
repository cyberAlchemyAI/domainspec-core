    alternatives: ["organizational effectiveness", "operational strengthening", "readiness investment"]
    notes: "Federal and progressive-foundation funders expect the term. Conservative-foundation funders may prefer 'organizational effectiveness'."
    variants: ["capacity-building"]
    migrated_from: "TILTH-CLC-03 admin_risk_term_register entry; card severity=LOW"

