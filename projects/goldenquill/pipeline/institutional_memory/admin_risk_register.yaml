    context: "USDA Local Agriculture Market Program (LAMP) + USDA-NIFA Local Food Promotion Program (LFPP) statutory vocabulary. Foundation-food-systems funders (Kellogg, Surdna, Mary Reynolds Babcock) welcome. Severity GREEN; federal pull would require a USDA program rescission (currently active 2026-05-16)."
    alternatives: ["regional food system", "place-based food system", "community food system"]
    notes: "USDA-statutory at LAMP + LFPP. GREEN; verify program-active at active-RFA fetch."
    variants: ["local-food", "local agriculture", "local food economy"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
