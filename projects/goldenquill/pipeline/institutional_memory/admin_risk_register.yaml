# Per-CLC vocabulary acceptability per v7.0.12 §1.2 per_clc_register discipline.
# Default for unlisted CLCs is AVOID per architecture v7.0.12 §1.2 safest-default.
# Entries are appended below in source-card order (CLC-01 → CLC-02 → CLC-04 → CLC-05 →
# CLC-06 → CLC-07 → CLC-08). Operator-approval (approval_required: true) on every entry
# carries forward from the source cards' OQ-5 discipline.
# =====================================================================

  # ---- CLC-01 public_purpose_works (3 new entries) ----------------

  - term: "disadvantaged community"
    severity: GREEN
    per_clc_register:
      public_purpose_works: EXPECTED
    context: "Justice40 vocabulary; FEMA BRIC and DOT competitive-grant rubrics carry 'disadvantaged community' as a weighted scoring factor. FY26+ administration may revise Justice40 scoping; severity remains GREEN pending documented program-rule pull. Native to CLC-01 (public works + capital-projects context); avoid carry-over into general DEI framing where it cross-references EO 14151 scrutiny."
    alternatives: ["historically under-resourced community", "rural / persistent-poverty community", "tribal or underserved area (per program-statutory definition)"]
    notes: "Justice40 disadvantaged-community designation is program-statutory under CEJST as currently published. Confirm at active-RFA fetch — operator should re-verify CEJST status per FOA at submission."
    variants: ["disadvantaged communities", "DAC"]
    migrated_from: "TILTH-CLC-01 admin_risk_term_register entry (pre-Cycle-1 FOLD-IN removal 2026-05-16)"
    approval_required: true

  - term: "equitable access"
    severity: GREEN
    per_clc_register:
      public_purpose_works: OK
    context: "Public-works framing for equitable distribution of project benefits (transit access, water-service access, broadband access). 'Access' (without 'equitable' prefix) is unflagged; 'equitable access' cross-references the workspace 'equity' RED entry in DEI framing. CLC-01 program reviewers (CDBG, BRIC, RAISE) tolerate the phrase when paired with measurable outcomes; remove the qualifier where measurement is the substance."
    alternatives: ["service access", "geographic equity in service delivery (measure-paired)", "underserved-area connectivity"]
    notes: "Cross-references v2 'equity' entry (RED in DEI framing). In CLC-01 capital-projects context, retain only when paired with measurable distributional outcomes; otherwise substitute the measurement-specific framing."
    migrated_from: "TILTH-CLC-01 admin_risk_term_register entry"
    approval_required: true

  - term: "resilience"
    severity: GREEN
    per_clc_register:
      public_purpose_works: EXPECTED
    context: "FEMA BRIC + HUD CDBG-DR + DOT-RAISE vocabulary; 'resilience' is statutory or near-statutory in mitigation-program names (Building Resilient Infrastructure and Communities). Standalone 'resilience' is admin-tolerable; pair with hazard-specific qualifier when defensible (seismic / flood / drought / cyber). 'Climate resilience' (already v2.1 YELLOW) is the cross-flagged variant."
    alternatives: ["disaster-readiness (hazard-specific)", "infrastructure hardening", "service-continuity (capital-projects context)"]
    notes: "Cross-ref existing v2.1 'climate resilience' YELLOW entry. Standalone 'resilience' is GREEN in CLC-01 program contexts; climate-prefix variant is YELLOW."
    variants: ["resilient", "resiliency"]
    migrated_from: "TILTH-CLC-01 admin_risk_term_register entry"
    approval_required: true

  # ---- CLC-02 catalytic_change (12 new entries) -------------------

  - term: "systems change"
    severity: GREEN
    per_clc_register:
      catalytic_change: EXPECTED
    context: "Foundation systems-change vocabulary native to Catalytic Change. Used at MacArthur 100&Change, Skoll, Ford BUILD, Bridgespan. Federal-innovation reviewers tolerate the phrase; corporate-foundation reviewers welcome; cooperative-finance reviewers may discount as aspirational unless paired with concrete intervention mechanism."
    alternatives: ["systemic improvement at the leverage point", "field-level intervention", "ecosystem-scale change"]
    notes: "Cross-reference 'transformation' (v2.3 CLC-03 GREEN) — distinct phrases; 'systems change' is about leverage points + mechanisms, 'transformation' is about outcome magnitude. Both common in CLC-02 narratives."
    variants: ["systems-change", "systems-level change"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry (pre-Cycle-2 fix-in-place removal 2026-05-16; ~190-line block removed)"
    approval_required: true

  - term: "disruptive innovation"
    severity: YELLOW
    per_clc_register:
      catalytic_change: OK
    context: "Christensen-era venture vocabulary; foundation reviewers (especially older program officers) may read as extractive-tech connotation. Federal innovation reviewers (SBIR, EDA, NSF I-Corps) accept openly. Cooperative / community-foundation reviewers prefer non-disruption framings. 'Disruption' carries political-discourse capture risk under post-2025 admin scrutiny when paired with sector-incumbent language."
    alternatives: ["paradigm-shifting innovation (mechanism-specified)", "field-restructuring approach", "category-redefining method"]
    notes: "Pair with concrete intervention to avoid the venture-jargon read. 'Innovation' (already v2.3 GREEN CLC-03) is the unflagged parent term."
    variants: ["disruptive", "disruption"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "climate transition"
    severity: YELLOW
    per_clc_register:
      catalytic_change: OK
    context: "Cross-references v2.1 RED entries (climate change / decarbonization / just transition / clean energy / renewable energy) without using the directly-pulled federal terms. In CLC-02 contexts the phrase appears at climate-philanthropy reviewers' threshold; federal CLC-02 reviewers (under EO 14154) treat as politically loaded. Severity YELLOW reflects this cross-axis exposure — full RED if paired with explicit policy framing."
    alternatives: ["climate-smart energy transition", "clean energy deployment (program-statutory where applicable)", "low-emissions modernization", "energy-system modernization"]
    notes: "RT-06 Cycle-1 fold added 'climate-smart energy transition' + 'clean energy deployment' as substitutes during Wave 2 dispatch. Cross-ref v2.1 'climate change' (RED) + 'just transition' (RED) + 'clean energy' (RED) — federal severity inherits from the parent terms when the phrase is used in policy framing."
    variants: ["climate-transition"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "energy transition"
    severity: YELLOW
    per_clc_register:
      catalytic_change: OK
    context: "Sibling of 'climate transition'; under EO 14154 federal severity tracks the parent climate-policy axis. Climate-philanthropy and energy-transition-focused foundations (Hewlett, ClimateWorks, Heising-Simons) expect the phrase. State-agency contexts (CA, NY, WA) tolerate. Avoid in federal applications without program-statutory anchor."
    alternatives: ["energy independence", "domestic energy modernization", "fuel diversification (program-statutory anchor preferred)"]
    notes: "Cross-ref v2.1 'renewable energy' (RED) + 'clean energy' (RED). When paired with rural-energy / on-farm-energy framing under USDA context, severity may soften to GREEN per the USDA-context-specific carve-out already documented at 'renewable energy'."
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "equity-centered design"
    severity: GREEN
    per_clc_register:
      catalytic_change: OK
    context: "Design-thinking / human-centered-design DEI methodology. Foundation reviewers (especially design-thinking-fluent program officers) welcome; federal reviewers post-EO 14151 treat 'equity-centered' as DEI-framed cross-reference. Pair with measurable design-process steps to defuse the framing scrutiny."
    alternatives: ["participant-informed design", "user-centered design (community participation specified)", "co-designed-with-community methodology"]
    notes: "Cross-ref v2 'equity' (RED in DEI framing). Standalone 'design-thinking' or 'human-centered design' avoids the equity-prefix scrutiny."
    variants: ["equity-centered"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "centering community"
    severity: GREEN
    per_clc_register:
      catalytic_change: OK
    context: "Verb-form DEI methodological framing ('we center community voice'); cross-references v2.1 YELLOW 'center' entry (DEI methodological framing). Foundation reviewers in racial-justice register welcome; federal reviewers flag. Substitute the methodological substance (participatory governance / community-board control / equity-share structure) rather than the verb framing."
    alternatives: ["community-led", "participatory governance", "member-controlled (cooperative-context)", "community-governance vested"]
    notes: "Cross-ref v2.1 'center' YELLOW entry — verb-form framing. Replace with mechanism (participatory governance / member control / advisory-board veto power) where defensible."
    variants: ["center community", "centering community voice"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "demonstration"
    severity: GREEN
    per_clc_register:
      catalytic_change: EXPECTED
      research_evidence: EXPECTED
    context: "Foundation-innovation + federal-pilot vocabulary; native to CLC-02 and CLC-04 (research/pilot/evidence-building). USDA SARE has demonstration as a statutory mechanism. Federal innovation reviewers (NSF, ARPA-E, NIH demonstration grants) expect the term. Foundation reviewers welcome."
    alternatives: ["pilot", "proof-of-concept", "field demonstration (USDA SARE-statutory where applicable)"]
    notes: "Statutory at USDA SARE (Demonstration Project category); GREEN across CLC-02 + CLC-04 contexts."
    variants: ["demonstrating", "demonstration project"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "leverage"
    severity: GREEN
    per_clc_register:
      catalytic_change: EXPECTED
    context: "Foundation-systems-change + federal-match vocabulary. Federal: 'leverage' is statutory in match-requirement language (USDA RBDG, EDA, HUD). Foundation: 'leverage ratio' is a normalized impact-finance metric (1:X ratio of foundation $ to crowded-in capital). CLC-02 specifically: 'leverage point' is systems-change vocabulary (Meadows' leverage points) — well-understood and expected."
    alternatives: ["match (federal-statutory)", "leverage ratio (impact-finance)", "leverage point (systems-change)"]
    notes: "Three distinct uses tracked in the register; all GREEN. Federal match-language is the unflagged statutory use."
    variants: ["leveraging", "leveraged"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "ecosystem"
    severity: GREEN
    per_clc_register:
      catalytic_change: EXPECTED
      sponsorship_corporate: OK
      shared_assets: OK
    context: "Two distinct uses: (a) ecological 'ecosystem' (NRCS / NIFA / NSF ecological-research — fully unflagged); (b) metaphorical 'innovation ecosystem' / 'food system ecosystem' (CLC-02 + CLC-06 ecosystem-intermediary context — foundation- and federal-innovation-reviewer-welcomed). Severity GREEN across both."
    alternatives: ["network of organizations", "field-of-practice", "value-chain (commerce-context)"]
    notes: "Metaphorical use grew out of biology — unflagged across all CLCs. Cross-ref CIC-06 ecosystem_intermediary card (this term is also CIC-axis, but CIC-06's card carries its own admin_risk_term_register block per §18.5 CIC schema declaration)."
    variants: ["ecosystems"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "field building"
    severity: GREEN
    per_clc_register:
      catalytic_change: EXPECTED
    context: "Foundation grant-program vocabulary for sector-strengthening grants (Bridgespan, NEO Philanthropy, Hewlett, Wallace). Federal reviewers tolerate; foundation reviewers in field-building program tracks expect."
    alternatives: ["sector strengthening", "field-of-practice development", "ecosystem capacity building"]
    notes: "GREEN; no federal pull. Term is normalized foundation-vocabulary."
    variants: ["field-building"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "catalytic"
    severity: GREEN
    per_clc_register:
      catalytic_change: EXPECTED
      credit_underwriting: OK
    context: "Native vocabulary for CLC-02 (Catalytic Change card name) and CLC-06 (catalytic concessionary capital in CDFI / blended-finance contexts). MacArthur 100&Change rubric uses 'catalytic'. Federal innovation reviewers (NSF EAGER, ARPA-E) tolerate; impact-investing funders expect."
    alternatives: ["leverage-generating", "field-shifting", "concessionary first-loss capital (CLC-06 CDFI-context)"]
    notes: "GREEN; no federal pull. Term is normalized impact-investing + foundation-innovation vocabulary."
    variants: ["catalyze", "catalyzing"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  - term: "transformative"
    severity: GREEN
    per_clc_register:
      catalytic_change: OK
    context: "Adjective form of 'transformation' (already v2.3 CLC-03 GREEN). Cross-ref v2 'transformative justice' YELLOW entry — 'transformative' alone is unflagged, the policy-justice composite is YELLOW. Reviewers in federal-innovation programs may push back if used aspirationally without underlying mechanism (same caveat as 'transformation' v2.3 entry)."
    alternatives: ["substantial change", "category-redefining", "field-restructuring"]
    notes: "Cross-ref v2.3 'transformation' (GREEN) — same lineage; cross-ref v2 'transformative justice' (YELLOW) — the policy-justice composite is distinct."
    variants: ["transformatively"]
    migrated_from: "TILTH-CLC-02 admin_risk_term_register entry"
    approval_required: true

  # ---- CLC-04 research_evidence (7 new entries) -------------------

  - term: "diverse perspectives"
    severity: YELLOW
    per_clc_register:
      research_evidence: OK
    context: "NSF / NIH research-vocabulary; cross-references v2 'diversity' YELLOW entry. Research-grant reviewers under post-2025 admin treat 'diverse perspectives' as DEI-framed. Substitute methodological framing (multi-disciplinary methodology / cross-institution collaboration) where defensible."
    alternatives: ["multi-disciplinary methodology", "cross-institutional research team", "methodological pluralism"]
    notes: "Cross-ref v2 'diversity' (YELLOW). Methodological framing avoids the DEI-prefix scrutiny."
    migrated_from: "TILTH-CLC-04 admin_risk_term_register entry (pre-Cycle-1 FOLD-IN removal 2026-05-16)"
    approval_required: true

  - term: "broader impacts"
    severity: GREEN
    per_clc_register:
      research_evidence: EXPECTED
    context: "NSF-statutory term (NSF Broader Impacts merit-review criterion — one of two NSF-mandatory criteria per NSF PAPPG). MUST appear in NSF proposals; statutory protection from admin-risk substitution. Post-2025 admin has narrowed acceptable Broader Impacts framings; substitution risk is misframing-of-content, not term-itself."
    alternatives: ["term is NSF-statutory; do not substitute. Substitute internal framings (workforce-of-future / national-competitiveness / broad-participation) within Broader Impacts section per current NSF guidance."]
    notes: "Inclusion in admin_risk_register is for misframing-surface coverage (operator should verify acceptable framings against current NSF program guidance for active solicitation), NOT because the criterion name is itself an admin-risk token. RT Cycle-1 fold added the clarifying preamble."
    variants: ["broader impact"]
    migrated_from: "TILTH-CLC-04 admin_risk_term_register entry"
    approval_required: true

  - term: "decolonize methodology"
    severity: YELLOW
    per_clc_register:
      research_evidence: OK
    context: "Indigenous-research-methodology vocabulary (Linda Tuhiwai Smith lineage); cross-ref v2 'decolonize' YELLOW entry. Federal-research-grant reviewers post-2025 flag; tribal-led and CBPR-aligned funders welcome. Methodological substance (community-validated methods / tribal-IRB partnership / lived-experience interviews) avoids term-prefix scrutiny."
    alternatives: ["community-validated methodology", "tribal-IRB-partnered research design", "participatory research methodology"]
    notes: "Cross-ref v2 'decolonize' (YELLOW). Substitution risks methodological misrepresentation — operator should consult applicant on which methods specifically Indigenous-methodology framing names; substitute method-by-method rather than wholesale."
    variants: ["decolonizing methodology", "decolonizing methodologies", "decolonized research"]
    migrated_from: "TILTH-CLC-04 admin_risk_term_register entry"
    approval_required: true

  - term: "community-based participatory research"
    severity: GREEN
    per_clc_register:
      research_evidence: EXPECTED
    context: "Statutory at NIH (CBPR is a documented NIH funding category); welcomed at USDA SARE Research-and-Education projects. Foundation-research funders (RWJF, Kellogg) PREFERRED. Federal severity GREEN (statutory-protected use)."
    alternatives: ["participatory research", "community-engaged scholarship", "co-produced research"]
    notes: "NIH-statutory acronym (CBPR). Term is unflagged; methodological pluralism is the federal-safer alternative where CBPR isn't program-cited."
    variants: ["CBPR", "community-based research"]
    migrated_from: "TILTH-CLC-04 admin_risk_term_register entry"
    approval_required: true

  - term: "two-spirit"
    severity: RED
    per_clc_register:
      research_evidence: AVOID
    context: "Indigenous LGBTQ+ identity term. Cross-references v2 RED entries (LGBTQ / transgender / gender identity). Indigenous-focused funders (Native Americans in Philanthropy, First Nations Development Institute) PREFERRED for tribal-led applicants; federal severity RED via EO 14168 + LGBTQ-axis pulls."
    alternatives: ["context-dependent — if program is tribal-statutory (e.g., HHS tribal-health), program may protect the term; federal research-grant applications outside tribal-statutory carve-outs should substitute identity-specific or omit"]
    notes: "Cross-ref v2 'LGBTQ' (RED), 'transgender' (RED). Statutory carve-outs at HHS / IHS tribal-health programs may preserve the term; non-tribal-statutory research grants face federal RED severity."
    migrated_from: "TILTH-CLC-04 admin_risk_term_register entry"
    approval_required: true

  - term: "Indigenous methodologies"
    severity: GREEN
    per_clc_register:
      research_evidence: EXPECTED
    context: "Tribal-IRB-partnered research vocabulary; statutory protection in tribal-statutory programs (NSF NHTRO, NIH NRMN, USDA Tribal Colleges Endowment). Federal severity GREEN in statutory-protected contexts. Foundation-research funders welcome."
    alternatives: ["tribal-research methods", "First Nations research design", "tribal-IRB-approved methodology"]
    notes: "Statutory carve-outs preserve the term in tribal-research programs. Cross-ref 'decolonize methodology' (v2.4 YELLOW) — Indigenous-methodologies-as-framing is the statutory-protected use."
    variants: ["Indigenous methodology", "tribal research methodology"]
    migrated_from: "TILTH-CLC-04 admin_risk_term_register entry"
    approval_required: true

  - term: "intersectionality"
    severity: YELLOW
    per_clc_register:
      research_evidence: OK
    context: "Academic-feminist analytical framework (Crenshaw 1989); cross-ref v2 'intersectional' GREEN entry — the noun form has slightly higher federal-scrutiny exposure than the adjective. Foundation-research funders welcome; federal NIH/NSF reviewers post-2025 flag. Substitute is methodologically risky (intersectionality names a specific analytical move; substitution may misrepresent)."
    alternatives: ["multi-factor analysis (carefully — may misrepresent)", "compound-circumstances framework"]
    notes: "Cross-ref v2 'intersectional' (GREEN — adjective). Operator should consult applicant on whether substitution preserves the analytical move; if not, recommend retention with admin-risk flag."
    variants: ["intersectional analysis"]
    migrated_from: "TILTH-CLC-04 admin_risk_term_register entry"
    approval_required: true

  # ---- CLC-05 market_access (13 new entries) ----------------------

  - term: "growth"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
      catalytic_change: OK
    context: "Generic-commerce vocabulary; statutory at SBA / SBIR programs. Federal-innovation reviewers expect. Cooperative-funder contexts may prefer 'service-expansion' framing to avoid extractive-scaling read."
    alternatives: ["revenue expansion", "service-capacity expansion", "membership growth (cooperative-context)"]
    notes: "Statutory at multiple SBA programs. Cross-ref v2.3 'scalability' (GREEN CLC-03) — growth and scalability are distinct: growth = current-trajectory expansion, scalability = capacity to expand under demand."
    variants: ["growing", "growth-stage"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry (pre-Cycle-2 fix-in-place removal 2026-05-16; ~200-line block removed)"
    approval_required: true

  - term: "market disruption"
    severity: YELLOW
    per_clc_register:
      market_access: OK
    context: "Christensen-disruption-theory vocabulary; same flagging as 'disruptive innovation' (v2.4 CLC-02 YELLOW). Federal commerce / SBIR Phase II reviewers welcome; cooperative / community-foundation reviewers discount."
    alternatives: ["category-redefining market entry", "new-segment creation", "underserved-market entry"]
    notes: "Cross-ref v2.4 'disruptive innovation' (YELLOW CLC-02). Same venture-jargon caveat applies."
    variants: ["disrupting markets", "market-disrupting"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
    approval_required: true

  - term: "competitive advantage"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
    context: "Standard MBA / VAPG-application vocabulary; statutory at USDA VAPG (value-added differentiation = required scoring criterion). Foundation reviewers tolerate; cooperative funders prefer 'shared-advantage' or 'cooperative differentiation' framing."
    alternatives: ["differentiation strategy", "value-added positioning (VAPG-statutory)", "shared cooperative advantage (cooperative-context)"]
    notes: "Statutory at USDA VAPG. GREEN across federal + foundation; cooperative-funder substitution is preference-driven, not severity-driven."
    variants: ["competitive advantages", "competitively advantaged"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
    approval_required: true

  - term: "import substitution"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
    context: "Current-admin-PREFERRED in federal commerce / agriculture contexts (EO and trade-policy cycle 2025-2026). USDA, EDA, DOC explicitly welcome. Foundation-progressive contexts neutral; some economic-justice funders question the framing on Global South impact."
    alternatives: ["domestic-supply enhancement", "local-supply-chain investment"]
    notes: "Federal-PREFERRED under current admin. Cross-ref 'buy american' (v2.4 CLC-05 GREEN) — same federal-PREFERRED axis."
    variants: ["import-substitution"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
    approval_required: true

  - term: "domestic supply chain"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
    context: "Federal-PREFERRED in current admin context; USDA / DOC / DOD-DMAG-program statutory. Foundation reviewers neutral. Pair with concrete supply-chain specifics (geographic radius, supplier-tier coverage) to avoid the buzzword read."
    alternatives: ["regional supply chain", "in-region sourcing", "supplier-network localization"]
    notes: "Federal-PREFERRED. Cross-ref 'buy american' + 'import substitution' (v2.4 CLC-05 GREEN) — same federal-PREFERRED axis."
    variants: ["domestic-supply-chain", "domestic supplier"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
    approval_required: true

  - term: "buy american"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
    context: "Federal-PREFERRED + statutory at federal contracting (Buy American Act + FAR Part 25 + EO 14005 modernization). Pair with BABA (Build America, Buy America Act) compliance reference where applicable; severity inherits statutory protection."
    alternatives: ["term is federal-statutory; do not substitute. Pair with BABA compliance language."]
    notes: "Federal-statutory. CLC-01 public-works carve-out (v2.4) carries this term as scoring-relevant via BABA compliance."
    variants: ["Buy America", "BABA-compliant", "Buy American Act"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
    approval_required: true

  - term: "value-added"
    severity: GREEN
    per_clc_register:
      market_access: EXPECTED
      operating_capacity: OK
    context: "USDA-statutory term (VAPG = Value-Added Producer Grants; statutory program-name). Substituting is misframing of the federal program. Foundation contexts neutral. Cooperative contexts welcome."
    alternatives: ["term is USDA-VAPG-statutory; do not substitute in federal applications. Cooperative-context alternatives: 'member-owned value-add', 'cooperatively-processed'."]
    notes: "USDA-statutory acronym. Cross-ref v2.4 'competitive advantage' (CLC-05 GREEN) — VAPG specifically requires both value-added and differentiation framing."
    variants: ["value added", "value-add", "VAPG-eligible"]
    migrated_from: "TILTH-CLC-05 admin_risk_term_register entry"
