prp_id: TILTH-PRP-NEPA-24CFR58
prp_kind: cross_cutting_regulation
display_name: 'NEPA Environmental Review (HUD 24 CFR Part 58 Responsible Entity pathway + 24 CFR Part 50 HUD-led pathway)'

funding_program_ref: null

# Effective date of the most recent 24 CFR Part 58 amendments (89 FR
# 30913, April 23, 2024). HUD-funded projects whose environmental review
# is conducted on or after this date are subject to the revised
# regulations. The underlying NEPA statute (42 U.S.C. 4321 et seq.) was
# last meaningfully amended by the Fiscal Responsibility Act of 2023
# (June 3, 2023); the 2024 HUD revisions reflect post-FRA conforming
# updates.
effective_date: '2024-04-23'

# expiry_date null: NEPA and 24 CFR Part 58 are permanent federal authorities
