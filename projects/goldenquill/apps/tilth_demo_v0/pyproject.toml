[project]
name = "tilth-demo-v0"
version = "0.0.1"
description = "Tilth UI demo — Phase A.0 scaffold over OpenClaw + FIT Farms"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "watchdog>=4.0",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[tool.uvicorn]
host = "127.0.0.1"
port = 8000
reload = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "openclaw_bridge"]
