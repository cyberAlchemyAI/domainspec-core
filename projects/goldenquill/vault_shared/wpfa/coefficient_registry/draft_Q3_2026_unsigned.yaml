# Coefficient Registry — Q3-2026 inaugural draft (UNSIGNED — placeholder shape only).
#
# This file is a Cowork-pre-staged DRAFT showing the operator and SN-LLC the
# exact shape SN-LLC will publish at the inaugural Q3-2026 cut. Every numeric
# coefficient is a placeholder (zero or representative-but-not-measured value).
# Every URL is a placeholder. The signature is empty. The signing key id is
# explicitly `draft_pre_signing`.
#
# CRITICAL: This file is NOT a valid Coefficient Registry. The Cycle Accountant
# loader (pipeline/vault/sub_kinds/coefficient_registry.py) will fail-closed on
# this file at every gate:
#   - F-WPFA-COEFFICIENT-REGISTRY-UNSIGNED at the empty signature
#   - schema_version field is non-standard (`0.0.0-draft`)
#   - sn_llc_signing_key_id is `draft_pre_signing` (rejected by white-glove pin)
#
# The runtime loader path is `vault_shared/wpfa/coefficient_registry/active.yaml`
# (the scaffold). This draft sits beside it under the same directory; the loader
# does not read this filename. It exists solely to ground governance review
# in a concrete artifact rather than abstract schema description.
#
# Lineage:
#   - docs/wpfa_methodology_v1_draft_2026-05-18.md (methodology skeleton)
#   - docs/wpfa_sn_llc_signing_ceremony_runbook_2026-05-18.md (signing ceremony)
#   - pipeline/blueprint/v0.1/section_02_v7_4_coefficient_registry_amendment.md (schema authority)
#
# Replacement procedure: when SN-LLC publishes the inaugural signed registry,
# the operator runs `tilth wpfa registry update --path <path-to-signed-registry.yaml>`
# which performs schema validation + signature verification + history snapshot
# before writing to `active.yaml`. This draft file MAY be deleted at that
# point, or retained as audit context.

schema_version: "0.0.0-draft"
quarter: "Q3-2026"
published_at: "2026-07-01T00:00:00Z"
sn_llc_signature_ed25519: ""  # 128-hex when signed; empty here forces fail-closed
sn_llc_signing_key_id: "draft_pre_signing"  # SN-LLC sets canonical at publication, e.g., "sn-llc-2026-q3"

# Baseline model selection — DPC-1 default for inaugural Q3-2026. SN-LLC ratifies.
baseline_model_id: "claude-sonnet-4-6"

# Methodology URL — SN-LLC sets canonical at publication. The repo's
# pre-staged copy of the methodology lives at
# docs/wpfa_methodology_v1_draft_2026-05-18.md; SN-LLC publishes the
# canonical version externally.
methodology_url: "https://sovereignnode.example/methodology/wpfa-v1"

# Rollback pointer — null at inaugural cut; populated only when this registry
# version replaces a prior version, where it holds the prior version's
# SHA3-512 hash.
rollback_pointer: null

