# FID publisher-pubkey signed asset
# Funder Intelligence Database — Path 2 TOFU self-sign (planning doc §1.5 / §2.1 / §11.5).
#
# Mirrors the v7.0.7 §6.1 router-template publisher pubkey pinning byte-for-
# byte (also mirrored by §17 v1 Coefficient Registry + §16 v1.1 Reflection
# Packet producer-pubkey + §18 v1 cards publisher-pubkey).
#
# Operator IS the publisher for FID — the operator-controlled Ed25519 signing
# key for FID artifacts (funders/*.yaml, programs/*.yaml,
# compliance_cascades/*.yaml, reviewer_heuristics/*.yaml). Dedicated key per
# planning doc §11.5 (separation-of-concerns from cards-publisher key).
#
# At ceremony first-install (Trust-On-First-Use), the operator pubkey
# self-signs this asset; subsequent rotations require co-signing by the
# prior pubkey via prior_pubkey_signature_ed25519_hex.
#
# The FID artifact loader (lands at v0.2 first wave realization) resolves
# FID artifact signature verification (F-FID-SIGNATURE-INVALID) against this
# pubkey.
#
# Trust pinning: white-glove onboarding pins this asset path AND records the
# canonical_bytes_sha3_512_hex below for integrity verification at startup.
#
# ─── Canonicalization algorithm (Path 2; documented for v0.2 reconciliation) ───
# canonical_bytes = canonical-JSON of this YAML parsed-as-dict, with the two
# self-referential keys REMOVED before serialization:
#   - publisher_signature_ed25519_hex
#   - canonical_bytes_sha3_512_hex
# json.dumps with sort_keys=True, separators=(',', ':'), ensure_ascii=False,
# UTF-8-encoded.
# SHA3-512 over canonical_bytes → canonical_bytes_sha3_512_hex.
# Ed25519 signature over canonical_bytes (NOT the hash) → publisher_signature_ed25519_hex.
# Verification target pubkey: publisher_pubkey_ed25519_hex below (TOFU self-assertion).
# v0.2 NOTE: cards-publisher signed-asset uses an unreproducible canonicalization
# whose hash does not verify under any of 8 candidate forms tested 2026-05-16.
# v0.2 loader-realization session reconciles the cards-publisher hash to this
# Path-2 algorithm OR re-runs the original cards ceremony script to recompute.

