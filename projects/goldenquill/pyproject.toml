[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilth"
version = "0.1.0.dev0"
description = "Tilth — grant intelligence substrate running inside a Golden Quill"
readme = "CLAUDE.md"
requires-python = ">=3.11"
license = { text = "proprietary" }
authors = [{ name = "FIT Farms Commons" }]

dependencies = [
    # Round-A (Section 1 primitives): stdlib-only.
    # Round-C (keys.py + crypto_primitives.py extension) adds AES-GCM via `cryptography`.
    "cryptography>=42.0",
    # Phase-0 GPP hardening: gpp_det.py uses PyYAML for router.yaml parsing
    # (FAMILY-TAXONOMY check). Provisioning manifest listed this as future dep
    # for router_integrity.py; Phase 0 pulls it forward because gpp_det.py
    # needs it now. Ref: provisioning_manifest_v0.1.md §3.3.
    "pyyaml>=6.0",
    # Scout Round 6 (Channel E — RSS / newsletter watchlists): the ONLY import
    # site for `feedparser` is pipeline/scout/_feedparser_adapter.py, which
    # imports lazily inside parse_streaming so the dispatcher
    # pipeline.scout.channel_e_rss stays stdlib-adjacent. Ref:
    # section_03_scout.md §4.5 + scout_round_6_channel_e_rss.md.
    "feedparser>=6.0",
    # Scout Round 7 (Channel F — client-material-driven web search): the ONLY
    # import site for `idna` is pipeline/scout/channel_f_websearch.py, which
    # imports it lazily inside `_registrable_domain` so the dispatcher stays
    # stdlib-adjacent. `idna` provides UTS46 Punycode normalization
    # (`idna.encode(host, uts46=True)`) for A-14 IDN homograph defense. Ref:
    # section_03_scout.md §4.6 + scout_round_7_channel_f_websearch.md.
    "idna>=3.0",
    # F-LOGICIAN-FABRICATED-ORG gate (v0.2 spec card pre-authorized):
    # spaCy provides `en_core_web_sm` NER for ORG-entity extraction from
    # Scribe drafts; rapidfuzz provides Levenshtein ratio for fuzzy match
    # against PROJECT_CONTEXT.md allowlist. Both imports are LAZY inside
    # `pipeline.logician.gates.f_logician_fabricated_org` so the gate
    # module is importable on systems without the model installed (returns
    # FAIL with reason `spacy_unavailable`). Spec card:
    # `pipeline/engineering/spec_cards/logician_fabricated_org_ner_gate.md`.
    # Post-install model download required:
    #   python -m spacy download en_core_web_sm
    "spacy>=3.7",
    "rapidfuzz>=3.0",
    # §12 Uploader substrate (per ADR-001 frozen Golden Image set):
    # python-docx for SectionDraft → DOCX rendering, pypdf for PDF
    # validation, openpyxl for XLSX validation. Imports are concentrated
    # in pipeline.orchestrator.seats.uploader and uploader_adapters/*;
    # AST-lint R-UPLOADER-NO-SUBMIT enforces the allow-list. Spec:
    # pipeline/blueprint/v0.1/section_12_uploader.md §12.8.
    "python-docx>=1.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    # §17 WPFA Code phase (per §17.7.4 LOCKED 2026-05-11):
    # weasyprint = buyer-facing PDF emission substrate (HTML→PDF). Always-
    # local; no external rendering service. Added to Golden Image build per
    # ADR-001 substrate-frozen discipline.
    # Jinja2 = template engine for buyer_facing_pdf.html per §17.7.2 +
    # cssselect2/tinycss2 = CSS walking dependency-of weasyprint that the
    # indirect-template-data scan reuses (RT-C2-02 fold-in, §17.7.6).
    "weasyprint>=60.0",
    "Jinja2>=3.1",
    "cssselect2>=0.7",
    "tinycss2>=1.2",
    # D-RB-01 closure (2026-05-15): Logfire is the canonical observability
    # substrate per architecture v7.0.x + ADR-001 + Wake-Up Sequence + the
    # v0.1 Beta deployment runbook §1.4. The process-wide bootstrap shim at
    # `pipeline.observability.logfire_bootstrap.bootstrap_logfire()` is
    # invoked at `pipeline/__init__.py` module-load and gracefully degrades
    # to a no-op + WARNING when credentials are absent (operator has not
    # run `logfire auth`) or when `LOGFIRE_ENABLED=0` is set
    # (v7.0.4-M1 §8.4.1 Intake discipline). Pinned floor matches the
    # runbook §1.4 expectation.
    "logfire>=0.42",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    # Deferred additions as later modules land:
    #   cedarpy or equiv   (Section 4 Cedar runtime)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
    # pytest-xdist parallelizes the suite so CI completes in seconds rather
    # than the 12+ minutes a sequential run takes on 10k+ tests. Use with
    # `--dist=loadfile` to keep file-scoped fixtures together.
    "pytest-xdist>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
exclude = [
    "pipeline.architecture*",
    "pipeline.blueprint*",
    "pipeline.validation*",
    "pipeline.handoffs*",
    "pipeline.radar*",
    "pipeline.drafts*",
    "pipeline.scores*",
    "pipeline.rfa*",
    "pipeline.editor*",
    "pipeline.classified*",
    "pipeline.delivery_log*",
    "pipeline.institutional_memory*",
    "pipeline.research*",
    "pipeline.rubrics*",
    "pipeline.subscribers*",
    "pipeline.templates*",
    "pipeline.tilth*",
    "pipeline.audits*",
]

[tool.coverage.run]
# gpp_det / gpp_council_dispatch / gpp_manifest live outside the normal
# package tree; list them explicitly so pytest-cov tracks them.
source = [
    "pipeline",
    "gpp_det",
    "gpp_council_dispatch",
    "gpp_manifest",
]
omit = [
    "tests/*",
    "pipeline/validation/**/gpp_det_report*",
    "pipeline/validation/**/council_findings*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that take more than a few seconds",
    "integration: tests that span multiple modules",
]
