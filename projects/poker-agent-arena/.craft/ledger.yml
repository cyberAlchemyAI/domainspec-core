descriptions:
  - description_id: DESC-PAA-001
    context_id: CTX-PAA-ROOT
    description: >
      Poker Agent Arena is a local competition harness where agents play
      poker-like toy games through constrained CLI decisions. The first product
      surface is Local Arena CLI v0, with Kuhn as the first fixture gate and
      Leduc, Hold'em engine parity, calibrated leaderboards, and novelty
      mechanics explicitly staged after the MVP line proves protocol and replay.
    status: active
    evidence:
      - ART-PAA-README
      - ART-PAA-SPEC
      - ART-PAA-WORK-PACK

definitions:
  - definition_id: DEF-PAA-LOCAL-ARENA-CLI-V0
    context_id: CTX-PAA-ROOT
    term: Local Arena CLI v0
    meaning: >
      The first executable Poker Agent Arena route: local commands that can run
      toy-game agent matches, enforce legal-action envelopes and deadlines,
      write transcripts, replay deterministically, and report diagnostic scores.
    status: candidate-local
    evidence: ART-PAA-WORK-PACK
  - definition_id: DEF-PAA-KUHN-FIXTURE-GATE
    context_id: CTX-PAA-ROOT
    term: Kuhn fixture gate
    meaning: >
      The first MVP validation game; it proves hidden-information boundaries,
      legal-action masks, deterministic fallback, replay, and diagnostics before
      larger poker engines are considered.
    status: candidate-local
    evidence: ART-PAA-SPEC
  - definition_id: DEF-PAA-REFEREE-TRANSCRIPT
    context_id: CTX-PAA-ROOT
    term: Referee transcript
    meaning: >
      Private replay authority for accepted actions, fallback events, payouts,
      diagnostics, and seed-handled material. Public replay is a redacted output,
      not the authority.
    status: candidate-local
    evidence: ART-PAA-SPEC

decisions:
  - decision_id: DEC-PAA-DEADLINE-001
    scope_id: CTX-PAA-ROOT
    question: What exact Local Arena CLI v0 deadline policy should SWU-PAA-001 freeze?
    status: closed
    decision_type: runtime-contract
    blocking: false
    description: >
      The work-pack recommends 5000ms decision timeout, 10000ms cleanup timeout,
      monotonic clock, start after decision-envelope flush, and stop at first
      complete stdout JSON object.
    impact: Blocks deadline-policy spec, runner behavior, transcript timing fields, and timeout fixtures.
    options:
      - id: accept-refine-default
        summary: Accept the current refine defaults.
      - id: tighten-timeout
        summary: Pick a shorter decision timeout after validating sample agent latency.
      - id: split-by-fixture
        summary: Allow fixture-specific timeout defaults in match config.
    default_option: accept-refine-default
    selected_option: accept-refine-default
    evidence:
      - ART-PAA-WORK-PACK
      - ART-PAA-ONE-SHOT-GOAL
    links:
      - label: Work-pack recommendation
        target: ART-PAA-WORK-PACK
        kind: artifact-id
  - decision_id: DEC-PAA-INVALID-RETIREMENT-001
    scope_id: CTX-PAA-ROOT
    question: What invalid-output strike and process retirement policy should v0 use?
    status: closed
    decision_type: protocol-contract
    blocking: false
    description: >
      Invalid output categories are known, but strike limits and process
      retirement rules are still prose-level.
    impact: Blocks invalid-events spec, sample adversarial agents, and abuse fixtures.
    options:
      - id: per-decision-fallback
        summary: Every invalid decision triggers fallback, with no match retirement in v0.
      - id: strike-limit-retire
        summary: Retire the agent after a fixed number of invalid decisions.
      - id: fixture-policy
        summary: Let match config define retirement thresholds by fixture.
    default_option: per-decision-fallback
    selected_option: per-decision-fallback
    evidence: ART-PAA-SPEC
  - decision_id: DEC-PAA-PUBLIC-REPLAY-001
    scope_id: CTX-PAA-ROOT
    question: What redaction and seed-commitment policy should public replay expose?
    status: closed
    decision_type: replay-policy
    blocking: false
    description: >
      Public replay must not leak raw seed material or live hidden information,
      while still proving accepted actions, fallback events, payouts, and
      diagnostics.
    impact: Blocks transcript spec, replay command acceptance, and canary checks.
    options:
      - id: opaque-seed-handles
        summary: Public replay uses opaque seed handles and no raw seed material.
      - id: post-match-commitment
        summary: Public replay exposes post-match commitments but keeps raw seed referee-only.
      - id: private-only-v0
        summary: Defer public replay export until private replay passes.
    default_option: opaque-seed-handles
    selected_option: opaque-seed-handles
    evidence: ART-PAA-SPEC
  - decision_id: DEC-PAA-ORBIT-COUNT-001
    scope_id: CTX-PAA-ROOT
    question: What first hand or seat-orbit count should provisional diagnostics use?
    status: closed
    decision_type: fixture-contract
    blocking: false
    description: >
      The MVP needs a repeatable first evaluation size for Kuhn diagnostics,
      even if later leaderboard calibration changes the count.
    impact: Blocks fixture corpus shape, smoke command expectations, and diagnostics examples.
    options:
      - id: tiny-smoke
        summary: Use a tiny deterministic smoke orbit for fast local proof.
      - id: provisional-eval
        summary: Use a larger provisional orbit for more stable diagnostics.
      - id: config-required
        summary: Require match config to state the orbit count.
    default_option: tiny-smoke
    selected_option: tiny-smoke
    evidence: ART-PAA-WORK-PACK
  - decision_id: DEC-PAA-M1-ENGINE-001
    scope_id: CTX-PAA-ROOT
    question: Which local Hold'em engine should M1 wrap after Local Arena CLI v0 passes?
    status: open
    decision_type: post-mvp
    blocking: false
    description: >
      Engine choice is explicitly deferred until v0 protocol, replay, fallback,
      and diagnostics are proven on toy fixtures.
    impact: Does not block SWU-PAA-001R through SWU-PAA-004.
    options:
      - id: defer
        summary: Defer until after MVP acceptance.
      - id: research-now
        summary: Research in parallel without affecting v0 implementation.
    default_option: defer
    evidence: ART-PAA-SPEC
  - decision_id: DEC-PAA-TIME-CREDITS-001
    scope_id: CTX-PAA-ROOT
    question: Should appendix time credits reset per hand, match, or evaluation block?
    status: open
    decision_type: novelty-appendix
    blocking: false
    description: >
      Time-bank or credit mechanics are novelty candidates and must not affect
      primary Local Arena CLI v0 ranking.
    impact: Deferred; does not block the MVP.
    options:
      - id: defer
        summary: Keep novelty mechanics outside v0.
      - id: appendix-only
        summary: Specify appendix-only reset semantics after v0 clocks pass.
    default_option: defer
    evidence: ART-PAA-SPEC

