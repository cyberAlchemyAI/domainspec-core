server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    auth_basic "Augmentor ontology";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "private, no-store" always;

    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /augmentor {
        return 308 /augmentor/;
    }

    location = /augmentor/ {
        try_files /index.html =404;
    }

    location = /augmentor/index.html {
        try_files /index.html =404;
    }

    location = /augmentor/consultation {
        limit_except POST {
            deny all;
        }
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_pass http://api:8787/augmentor/consultation;
        proxy_set_header Host $host;
        proxy_set_header X-ResonantOS-Consultation-Principal $remote_user;
        proxy_set_header X-ResonantOS-Consultation-Key "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
    }

    location / {
        return 404;
    }
}
