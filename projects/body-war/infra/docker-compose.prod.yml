services:
  app:
    image: ${BODY_WAR_APP_IMAGE:-ghcr.io/domainspec/body-war-app}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BODY_WAR_HOST: 0.0.0.0
      BODY_WAR_PORT: "5174"
      BODY_WAR_PUBLIC_BASE_URL: ${BODY_WAR_PUBLIC_BASE_URL:-https://${BODY_WAR_DOMAIN}}
      BODY_WAR_SESSION_SECRET: ${BODY_WAR_SESSION_SECRET}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-https://${BODY_WAR_DOMAIN}/api/auth/strava/callback}
      DATABASE_URL: postgres://${POSTGRES_USER:-body_war}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-body_war}
      BODY_WAR_AUTH_STORE: ${BODY_WAR_AUTH_STORE:-/var/lib/body-war/auth-store.json}
    volumes:
      - app_data:/var/lib/body-war
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5174/api/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - body_war

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-body_war}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-body_war}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-body_war} -d ${POSTGRES_DB:-body_war}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - body_war

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BODY_WAR_DOMAIN: ${BODY_WAR_DOMAIN:-localhost}
      BODY_WAR_TLS_EMAIL: ${BODY_WAR_TLS_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - body_war

volumes:
  app_data:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  body_war:
    driver: bridge
