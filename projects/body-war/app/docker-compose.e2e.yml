services:
  body-war-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: body_war_e2e
      POSTGRES_USER: body_war_e2e
      POSTGRES_PASSWORD: body_war_e2e_password
    ports:
      - "${BODY_WAR_E2E_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U body_war_e2e -d body_war_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
