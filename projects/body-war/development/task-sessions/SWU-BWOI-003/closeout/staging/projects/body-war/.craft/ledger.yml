decisions:
  - decision_id: DEC-ARCH-BOUNDARY-001
    scope_id: CTX-BODY-WAR-ARCH-AUDIT
    decision_type: blocker
    question: Which TypeScript architecture/import boundary will Body War use to consume DomainSpec methods?
    description: Closed architecture/import-boundary decision that unblocks MVP work-pack planning while keeping DomainSpec method ownership outside Body War.
    options:
      - body-war-own-typescript-workspace-with-domainspec-path-alias
      - shared-domainspec-method-package
      - documentation-only-reference-until-export-exists
    selected: body-war-own-typescript-workspace-with-domainspec-path-alias
    rationale: User selected option 1. This unblocks MVP planning fastest while preserving DomainSpec as method authority through explicit TypeScript path aliases or source references.
    evidence: projects/body-war/docs/decisions/architecture-import-boundary.md
    status: closed
    blocking: false
    impact: MVP implementation can proceed in a Body War-owned TypeScript workspace; shared DomainSpec package extraction remains future hardening.
    owner: Body War architecture
    links:
      - label: decision record
        target: projects/body-war/docs/decisions/architecture-import-boundary.md
        kind: path
      - label: architecture audit
        target: ART-ARCHITECTURE-AUDIT
        kind: artifact-id
      - label: closed blocker
        target: BLK-ARCH-BOUNDARY-001
        kind: row-id
  - decision_id: DEC-BODY-WAR-AUTH-FIRST-001
    scope_id: CTX-BODY-WAR-ROOT
    decision_type: priority_pivot
    question: What should Body War prioritize before track geometry and game mechanics?
    description: The operator chose to defer track and game work and prioritize login, auth/session, and Strava connection through a reusable auth/user-management project.
    options:
      - auth-user-management-first
      - continue-track-and-game-mvp
      - implement-body-war-direct-auth-without-reusable-foundation
    selected: auth-user-management-first
    rationale: Login/auth and Strava connection are the smallest production prerequisite for a usable hosted preview, and a reusable auth project can serve later projects.
    evidence: projects/auth-user-management/development/refinement-runs/20260621T025133Z-auth-strava-foundation/REFINE-SEED-PROPOSAL.md
    status: closed
    blocking: false
    impact: Body War's next move shifts from broad W0 track/game spec execution to real Strava activity validation through the auth-backed pilot.
    owner: Body War product and auth-user-management
    links:
      - label: auth-user-management refine route
        target: ART-AUTH-USER-MANAGEMENT-REFINE
        kind: artifact-id
      - label: reusable auth ledger
        target: projects/auth-user-management/.craft/ledger.yml
        kind: path

