schema_version: whisper.text-intent-substrate.v1
substrate_id: cyberalchemy-co-op-product-cognition-view
prepared_date: 2026-08-07

scope:
  target: projects/co-op-engine
  artifact_kind: writing_substrate
  authority_effect: none
  implementation_effect: none
  publication_effect: none
  audience_copy_included: false
  note: >-
    This is authoring state for a possible Co-Op product view. It does not alter
    project truth, definitions, the current interface, or public copy.

whisper:
  spell: whisper
  preset: cyberalchemy_site_page
  transport_id: cyberalchemy_site_page
  transport_proof_status: unproven
  page_role: how-it-works
  primary_explanation_method: beginner-tutorial
  secondary_explanation_method: xray-layered-visual
  intent_state: forming
  derivative_fan_out_count: 0
  draft_status: block
  human_gate: pending
  delivery_flow: active

objective:
  author_intent: >-
    Prepare a source-bound writing model for a more ergonomic CyberAlchemy
    Co-Op project view that begins with recognizable human work, explains the
    bounded support each project offers, preserves the person's decision and
    authority, and keeps evidence, status, limits, and next authorization
    visible.
  reader_job: >-
    Let a cold reader decide what to inspect without first decoding fourteen
    project names, while retaining a permanent route back to the complete
    fourteen-entry index.
  success_signal: >-
    A technical builder and a domain practitioner can each retell the human job,
    bounded operation, inspectable output, retained authority, current evidence,
    nearest unsupported claim, and responsible next route for a selected entry.
  success_signal_state: planned_unexecuted
  one_sentence_page_promise_candidate: >-
    Start from the work you are trying to advance, then inspect what supports
    it, what exists, what remains yours to decide, and where the evidence stops.
  promise_publication_state: unapproved

target_public:
  primary:
    - technical_builder_unfamiliar_with_arcanum
    - domain_practitioner_unfamiliar_with_arcanum
  secondary:
    - curious_builder
    - research_collaborator
    - returning_operator_needing_orientation
  forbidden_inference:
    - personal_fit
    - recruitment_qualification
    - recommendation
    - ranking
    - conversion_evidence

source_package:
  audited_findings:
    path: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/findings.md
    sha256: 3c446eeb0d56cff3163bc767a2aacdcf03bf16bcbbff6e58e719718ff77422e7
    audit: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/findings-audit.json
    audit_verdict: ACCEPT
  source_bound_model:
    path: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/product-cognition-synthesis-repair-round-2.json
    pointer: '#/source_bound_project_evidence_model'
  project_records:
    path: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/product-cognition-synthesis-repair-round-2.json
    pointer: '#/records'
    expected_count: 14
  claim_packets:
    path: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/product-cognition-synthesis-repair-round-2.json
    pointer: '#/whisper_claim_metadata'
    expected_count: 11
  evidence_manifest:
    path: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/evidence-closure.json
    pointer: '#/source_manifest'
  closure_matrix:
    path: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/evidence-closure.json
    pointer: '#/closure_matrix'
    expected_count: 12
  page_contract: projects/cyberAlchemy-website/content/page-contracts/home.md
  page_preset: projects/cyberAlchemy-website/whisper-presets/cyberalchemy-site-page.md
  public_method: arcanum/framework/CYBERALCHEMY-METHOD.md

resonance_core:
  tone:
    - precise
    - inviting
    - quietly_rigorous
  voice: collaborative_expert
  felt_meaning: >-
    Meaningful work stays recognizable as human work. Support makes choices,
    evidence, limits, and responsibility easier to inspect without pretending
    to replace domain judgment.
  emotional_residue:
    - I_can_find_a_relevant_start_without_being_profiled
    - I_can_see_what_each_project_does_and_does_not_prove
    - I_remain_responsible_for_the_decision
  value_signal:
    - bounded_support
    - inspectable_outputs
    - retained_human_authority
    - visible_evidence_and_limits
    - reversible_or_owner_visible_continuation
  forbidden_feels:
    - AI_magic
    - autonomous_replacement
    - manifesto
    - taxonomy_dump
    - governance_first_onboarding
    - maturity_by_polish

relevance_core:
  entry_principle: human_job_first
  recovery_principle: complete_project_index_always_available
  explanation_principle: bounded_operation_plus_inclusion_reason
  status_principle: visible_and_orthogonal_not_a_writing_label
  reader_questions:
    - What human work is at stake?
    - What bounded operation supports it?
    - What inspectable output exists?
    - What remains a human decision or authority?
    - What does current evidence establish?
    - What is the nearest unsupported claim?
    - What next step is proposed, and who may authorize it?
  likely_objections:
    - Is every entry really a product?
    - Is this a recommendation or fit assessment?
    - What is implemented versus designed or unresolved?
    - Does support mean autonomous execution?
    - Where does project evidence end and public writing begin?

trajectory_core:
  movement:
    - reader_problem
    - smallest_public_cyberalchemy_frame
    - human_job_entrance
    - candidate_entries_with_inclusion_reasons
    - bounded_operation_and_named_output
    - retained_human_authority
    - evidence_status_ceiling_and_gap
    - proposed_next_route_and_authorization
    - source_trace
    - all_14_recovery
  introduction_policy: reader_job_before_architecture
  ending_policy: bounded_route_or_return_to_complete_index
  architecture_position: after_reader_value_and_trust
  target_length: 900_to_1400_words_if_a_future_page_draft_is_authorized

pareto_selection:
  selected_candidate:
    id: human_job_gateway_over_complete_index
    rationale: >-
      It improves information scent for cold readers while preserving a single
      source-bound record per project, visible evidence and limits, and a stable
      project-first recovery route.
  alternatives:
    - id: project_first_annotated_atlas
      disposition: retain_as_control_and_fallback
    - id: augmentation_move_first
      disposition: narrow_to_record_explanation
    - id: domain_first
      disposition: narrow_to_optional_metadata
    - id: status_first
      disposition: defer_as_navigation_require_as_field
    - id: personalized_matching
      disposition: kill
    - id: multi_facet_control_bank
      disposition: kill
    - id: duplicate_lens_records
      disposition: kill

candidate_navigation:
  state: proposed
  authority_effect: none
  owner_admission_required: true
  all_projects_route:
    label: All 14
    permanence: always_visible
    expected_count: 14
  entrance_jobs:
    - id: create_and_shape
      label: Create and shape
      inclusion_rule: The project externalizes intent or prepares a reviewable variant.
      project_ids:
        - whisper
        - agentic-music-studio
        - ui-prototyping-studio
    - id: learn_and_explain
      label: Learn and explain
      inclusion_rule: The project orients, translates, or exposes source-bound layers for retell.
      project_ids:
        - user-guide
        - x-ray
        - arcanum-journey
    - id: test_and_inspect
      label: Test and inspect
      inclusion_rule: The project makes behavior, evidence, gates, or limits inspectable.
      project_ids:
        - poker-agent-arena
        - body-war
        - x-ray
        - sonar-loop
    - id: research_and_decide
      label: Research and decide
      inclusion_rule: The project compares evidence or confounds before an owner-held decision.
      project_ids:
        - tower-system-taxonomy
        - autoads
        - ontologize
    - id: route_and_authorize
      label: Route and authorize
      inclusion_rule: The project prepares a bounded route, grant, fallback, or receiver decision.
      project_ids:
        - ide-extension
        - ide-ergonomics
        - sonar-loop
    - id: play_and_contest
      label: Play and contest
      inclusion_rule: The project proposes shared play whose evidence and disputes remain human-governed.
      project_ids:
        - body-war
  invariants:
    - Every membership has a visible inclusion reason.
    - Multiple memberships resolve to one candidate project record.
    - No task label implies fit, ranking, recommendation, maturity, or taxonomy.
    - No project is orphaned from both a job entrance and All 14.

project_set:
  record_source: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/product-cognition-synthesis-repair-round-2.json#/records
  ids:
    - whisper
    - user-guide
    - agentic-music-studio
    - poker-agent-arena
    - body-war
    - ui-prototyping-studio
    - tower-system-taxonomy
    - ide-extension
    - ide-ergonomics
    - x-ray
    - arcanum-journey
    - autoads
    - sonar-loop
    - ontologize
  identity_rule: candidate_projection_only
  duplicate_truth_records_allowed: false
  unresolved_status_conflicts:
    - body-war
    - arcanum-journey

record_grammar:
  fields:
    - id: single_projection_record
      reader_decision: Is this one project or a duplicate?
      display_priority: structural
    - id: candidate_human_objective
      reader_decision: Is the work recognizable enough to inspect?
      display_priority: preview
    - id: bounded_support_operation
      reader_decision: How does support specifically occur?
      display_priority: preview_or_first_detail
    - id: named_work_output
      reader_decision: What result can be inspected?
      display_priority: first_detail
    - id: named_human_authority
      reader_decision: Who still decides, consents, interprets, approves, refuses, or stops?
      display_priority: preview
    - id: observed_evidence
      reader_decision: What directly exists?
      display_priority: preview
    - id: admitted_or_unresolved_status
      reader_decision: What state may be relied on?
      display_priority: preview
    - id: ceiling_and_gap
      reader_decision: What adjacent claim must not be inferred?
      display_priority: preview
    - id: next_step_and_authorization
      reader_decision: What continuation is proposed, and is it authorized?
      display_priority: detail
    - id: claim_metadata_and_exposure
      reader_decision: Who owns the claim and may it be public?
      display_priority: evidence_detail
  state_vocabulary:
    - observed
    - implemented
    - designed
    - proposed
    - conflicted
    - unverified
  forbidden_substitutions:
    - recommendation_for_decision
    - preparation_for_execution
    - retrieval_for_review
    - route_for_acceptance
    - artifact_for_usefulness_or_maturity
    - writing_status_for_project_status
    - draft_for_publication
    - interface_mechanics_for_comprehension

support_operation_vocabulary:
  keep:
    - orient
    - translate
    - externalize
    - compare
    - surface
    - prepare
    - route
    - test_with_state
    - recover
  narrow:
    - structure_only_when_it_changes_a_decision
    - find_only_when_provenance_changes_a_decision
  defer:
    - remember_until_admission_correction_expiry_and_reuse_exist
    - handoff_until_a_receiver_accepts
  status: candidate_not_canonical_ontology

authority_boundaries:
  project_truth:
    owner: PT
    owns: identity_mechanism_evidence_status_ceiling_next_step_feasibility
    reference: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/product-cognition-synthesis-repair-round-2.json#/authority_boundaries/project_truth
  public_method:
    owner: MA
    owns: public_method_facts_only
    reference: arcanum/framework/CYBERALCHEMY-METHOD.md#purpose|#core-thesis|#agent-collaboration-model
  writing:
    owner: WA
    owns: transport_claim_metadata_sequence_and_draft_gates
    reference: projects/cyberAlchemy-website/whisper-presets/cyberalchemy-site-page.md#transport-schema|#draft-gate
  interface:
    owner: IO
    owns: current_records_controls_disclosure_count_and_presentation_mechanics
    reference: projects/co-op-engine/index.html#choose|#projects|.project-card|.presentation-controls
  publication:
    owner: PA
    state: unresolved
    owns: exact_public_names_claims_exclusions_and_release_surface
    reference: projects/cyberAlchemy-website/content/page-contracts/home.md#public-boundary-notes|#allowed-claims|#forbidden-claims
  private_candidate_material:
    public_authority: false
    publication_disposition: forbidden_as_public_authority
    reference: projects/co-op-engine/research/2026-08-07-product-cognition-writing-substrate/receipts/evidence-closure.json#/closure_matrix/7

claim_policy:
  allowed_for_future_draft_only_when_source_metadata_is_carried:
    - The Co-Op interface currently presents fourteen project records.
    - A candidate task entrance may sit over the unchanged project index.
    - Support may be described as a bounded operation with an inspectable output and named human authority.
    - Evidence, project status, claim ceiling, and authorization are separate fields.
  deferred_until_new_authority_and_evidence:
    - portfolio_wide_cognitive_tools
    - human_machine_integration
    - cognition_improvement
    - cognitive_load_reduction
    - personalized_fit
    - adaptation
  killed_phrases:
    - AI collaborator
    - agentic writer studio
    - generic knowledge graph
    - autonomous replacement
    - self-improving knowledge system
    - complete AI design platform
    - shipping IDE agent
    - tested productivity layer
    - available course
    - ROAS automation
    - autonomous remediation
    - client-proven platform
    - best for you
    - all fourteen are finished products

