    - orient
    - select_one_human_job
    - scan_inclusion_reasons
    - compare_evidence_states_and_limits
    - open_one_unchanged_record
    - inspect_source_and_authority
    - choose_bounded_route_or_reset
  presentation:
    - reuse_identical_records
    - expose_job_identity_evidence_status_and_limit
    - permit_direct_project_jumps
    - exit_to_complete_map
  compression_rules:
    - one_audience_block_one_job
    - remove_repeated_thesis
    - remove_heading_body_paraphrase
    - explain_each_mechanism_once_per_path
    - do_not_repeat_opening_as_ending

audition:
  state: planned_unexecuted
  representative_records:
    - whisper
    - poker-agent-arena
    - sonar-loop
  moments:
    - id: orient_and_choose
      proof_question: Can the reader choose a job and entry without facilitator repair?
    - id: compare_and_inspect
      proof_question: Can the reader distinguish observed workflow, implemented harness, and designed specification while seeing limits?
    - id: remove_and_retell
      proof_question: Can the reader retell job, support, retained authority, evidence, denied claim, distinction, and next authorization?
  formative_audiences:
    - technical_builder
    - domain_practitioner
  human_gate: pending
  general_comprehension_effect: none

validation:
  automatable:
    - exactly_14_stable_ids
    - zero_orphans
    - zero_duplicate_truth_records
    - inclusion_reason_for_every_membership
    - every_view_resolves_to_same_record
    - evidence_status_ceiling_authorization_and_source_present
    - critical_limit_visible_before_deep_disclosure
    - all_14_reset_and_stable_anchors
    - focus_reflow_keyboard_and_no_js_truth_access
    - forbidden_wording_absent
  human_only:
    - accurate_novel_word_retell
    - separates_evidence_ambition_and_limit
    - names_retained_human_authority
    - distinguishes_two_entries_meaningfully
    - justifies_transfer_without_inventing_fit
    - recognizes_editorial_lens_not_recommendation
    - reports_misconceptions_and_confidence
  non_proofs:
    - click_success
    - time_on_task
    - route_completion
    - schema_validity
    - accessibility_mechanics
    - browser_reachability

learning_residue:
  retain:
    - verbatim_retells
    - misconceptions
    - confidence
    - abandoned_routes
    - facilitator_repairs
    - false_positive_results
    - field_level_failures
    - membership_disputes
    - owner_responses
    - source_revisions
    - stop_and_kill_decisions
  promotion_effect: none
  routing:
    product_fact: PT
    public_method: MA
    writing: WA
    interface_mechanics: IO
    public_claim: PA

distill_trace:
  invocation_source: whisper_required_sigil
  mode: standard
  budget_assumption: >-
    The user confirmed preparation; Standard was selected because one evidence-closed
    proposal track and two finite role-simulated rounds were sufficient.
  role_execution: inline_role_simulation
  role_execution_reason: >-
    The confirmed dispatch froze nine agents and reserved Whisper as a parent-owned
    consumer, so no additional agent was introduced.
  proposer_round_1:
    claim: A human-job gateway is the smallest useful editorial entrance.
    evidence: audited_findings_navigation_and_audience_paths
  balancer_round_1:
    objection_category: source_fidelity
    objection: A new gateway could hide project identity, status, or limits.
    reconciliation: Keep All 14 permanent and resolve every membership to one record with visible ceiling and status.
  proposer_round_2:
    claim: Six plain job entrances can cover all fourteen records without duplicating truth.
    evidence: round_2_records_and_inclusion_reasons
  balancer_round_2:
    objection_category: authority_and_non_vacuity
    objection: Job labels could imply fit or become an unowned taxonomy.
    reconciliation: Mark every label proposed, require owner admission, forbid fit/rank language, and retain the atlas control.
  smallest_coherent_unit:
    name: human_job_gateway_record
    responsibility: >-
      Connect one recognizable human job to one source-bound project record using
      an inclusion reason, bounded operation, named output, retained authority,
      evidence/status, ceiling, and authorized-next-step boundary.
  recomposition_proof: >-
    Repeating the unit across candidate memberships produces the task entrance;
    resolving memberships to the fourteen stable records recomposes the complete
    index; the surface sequence and claim packets then recompose the future page.
  frame_expiry: >-
    Re-run distillation if project IDs change, PT admits a shared status vocabulary,
    PA approves portfolio-wide framing, the task entrance performs worse than the
    project-first atlas, or any project becomes orphaned.
  evidence_emission: not_configured

next_route:
  route: language_audition
  status: blocked_pending_human_and_owner_gates
  prerequisites:
    - PA_review_of_candidate_names_and_public_claims
    - PT_resolution_or_explicit_display_policy_for_body_war_and_arcanum_journey
    - owner_admission_or_rejection_of_candidate_job_labels_and_memberships
    - operator_approval_of_three_moment_language_audition
