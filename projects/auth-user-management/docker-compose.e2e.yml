name: auth-user-management-e2e

services:
  auth-user-management-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_user_management_e2e
      POSTGRES_USER: auth_e2e
      POSTGRES_PASSWORD: auth_e2e_password
    ports:
      - "${AUTH_E2E_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U auth_e2e -d auth_user_management_e2e",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - auth-user-management-e2e-postgres:/var/lib/postgresql/data

volumes:
  auth-user-management-e2e-postgres:
