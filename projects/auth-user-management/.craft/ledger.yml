decisions:
  - decision_id: DEC-AUTH-TRANSPORT-001
    scope_id: CTX-AUTH-UM-ROOT
    decision_type: implementation_boundary
    question: What production session transport should the reusable foundation standardize first?
    description: Select the first production transport before implementation so projects do not mix client-asserted session payloads, bearer-only APIs, and cookie sessions without a threat model.
    options:
      - http-only-cookie-session-with-csrf-and-server-session-store
      - bearer-jwt-with-sid-and-server-session-token-records
      - hybrid-cookie-for-browser-bearer-for-service-api
    selected: hybrid-cookie-for-browser-bearer-for-service-api
    rationale: Browser flows need HttpOnly cookie sessions, CSRF binding, same-origin checks, and server session lookup from Savvy's proof, while service/API flows can preserve poker-team's bearer token shape only when the server-backed sid remains authoritative.
    evidence: projects/auth-user-management/development/refinement-runs/20260621T025133Z-auth-strava-foundation/RESULT.md
    status: closed
    blocking: false
    impact: Unblocks SWU-AUTH-001 while requiring separate browser and bearer guards over the same server-owned session authority.
    owner: auth-user-management architecture
    links:
      - label: poker-team auth reference
        target: validation/poker-team/docs/features/auth-access-control/SPEC.md
        kind: path
      - label: savvy cookie guard reference
        target: projects/savvy_legal-studio-ai/frontend/savvy-legal-studio/lib/auth/savvy-auth.ts
        kind: path
      - label: refine seed
        target: ART-AUTH-REFINE-SEED
        kind: artifact-id
  - decision_id: DEC-AUTH-STRAVA-SCOPE-001
    scope_id: CTX-AUTH-UM-ROOT
    decision_type: provider_scope
    question: What is the minimum Strava provider capability for Body War's first auth consumer slice?
    description: Decide whether the first reusable provider adapter only links Strava identity, imports activity summaries, or stores refresh-capable activity access.
    options:
      - link-strava-identity-only
      - link-identity-and-import-recent-activity-summaries
      - link-identity-and-store-refreshable-activity-access
    selected: link-identity-and-import-recent-activity-summaries
    rationale: Body War's first consumer needs login plus Strava connection and recent activity summaries, not track/game mechanics or broad private activity access; default scope is read,activity:read with activity:read_all only for explicit consenting-athlete private activity import.
    evidence: projects/auth-user-management/development/refinement-runs/20260621T025133Z-auth-strava-foundation/RESULT.md
    status: closed
    blocking: false
    impact: Affects Body War's first consumer implementation and the token custody/security contract.
    owner: Body War plus auth-user-management
    links:
      - label: Body War Strava blocker
        target: projects/body-war/.craft/ledger.yml
        kind: path
      - label: Strava linked pilot work-pack
        target: projects/body-war/docs/features/strava-linked-pilot/WORK-PACK.md
        kind: path

