definitions:
  - definition_id: DEF-AUTH-UM-001
    scope_id: CTX-AUTH-UM-ROOT
    term: reusable auth/user-management foundation
    statement: A portable private project that packages auth domain, session transport, user/resource authorization, provider link management, tests, and adoption guidance for reuse by Body War and later projects.
    status: candidate
    evidence: operator request, 2026-06-21
  - definition_id: DEF-AUTH-UM-002
    scope_id: CTX-AUTH-UM-ROOT
    term: server-owned session
    statement: A session whose validity is established from server-side session/token records and protected transport, not from client-supplied authStatus payloads.
    status: candidate
    evidence: validation/poker-team/docs/features/auth-access-control/SPEC.md
  - definition_id: DEF-AUTH-UM-003
    scope_id: CTX-AUTH-UM-ROOT
    term: provider connection
    statement: A user-owned external account link, such as Strava, with OAuth state validation, scoped token custody, refresh/revocation behavior, and redacted audit evidence.
    status: candidate
    evidence: projects/body-war/docs/features/strava-linked-pilot/WORK-PACK.md

