decisions:
  - decision_id: DEC-IDEEXT-L0-BOUNDARY
    scope_id: CTX-IDEEXT-L0
    decision_type: selection
    question: What is the smallest truthful product boundary?
    selected: local-server-first governed workbench
    rationale: Evidence supports loopback workbench, manifests, approvals, dry-run envelopes, and receipts. It does not yet support autonomous IDE agency or embedded VSCodium automation.
    evidence: development/founding-research/findings.md
    status: closed
    blocking: false
    impact: L0 work starts with local server and adjacent browser proof.
    owner: strategist
  - decision_id: DEC-IDEEXT-MODULES-NOT-KERNEL
    scope_id: CTX-IDEEXT-L0
    decision_type: boundary
    question: Which capabilities belong in the kernel?
    selected: keep Craft, Whisper, UI Studio, IDE Ergonomics, OpenRouter, and agent systems as modules or adapters
    rationale: The kernel owns registry, grants, approval, audit, artifacts, and provider mediation only.
    evidence: development/founding-research/findings.md
    status: closed
    blocking: false
    impact: Integrations stay replaceable and cannot become hidden authority.
    owner: strategist
  - decision_id: DEC-IDEEXT-OV1-V4-INTERACTION
    scope_id: CTX-IDEEXT-L0
    decision_type: contract-migration
    question: How should Operations V1 interactions enter event version 4?
    selected: Reuse canvas.interaction_recorded in V4; event_version distinguishes V3 and V4 bindings.
    rationale: This preserves one semantic event name while allowing Operations V1 to define a strict V4 interaction payload through explicit migration OV1-EVENT-V4-M1.
    evidence: development/operations-v1-plan/task-sessions/20260714T214740Z-swu-ov1-004/DECISION-GATE.md
    status: closed
    blocking: false
    impact: SWU-OV1-004 may implement projector and storage reconciliation; SWU-OV1-005 remains dependency-blocked until SWU-OV1-004 passes.
    owner: human-operator
  - decision_id: DEC-IDEEXT-OV1-PRUNING-COMPLETION
    scope_id: CTX-IDEEXT-L0
    decision_type: contract-migration
    question: How should automatic retention durably close an active request after orphan-only convergence?
    selected: Add canvas.pruning_completed as an exact seventh V4 event through migration OV1-EVENT-V4-M2.
    rationale: This preserves revision tombstone meaning and closes an active request durably only after physical storage is verified below soft.
    evidence: development/operations-v1-plan/task-sessions/20260714T234403Z-swu-ov1-012/DECISION-GATE.md
    status: closed
    blocking: false
    impact: SWU-OV1-012 passed with additive replay, automatic cleanup, timer, failure, and restart evidence; SWU-OV1-013 is ready.
    owner: human-operator
  - decision_id: DEC-IDEEXT-OV1-VALUE-USEFULNESS
    scope_id: CTX-IDEEXT-L0
    decision_type: product-validation
    question: Is the retained Operations V1 agent-to-workbench result useful enough to proceed to integrated closeout?
    selected: Option 1 - useful enough; proceed to integrated audit
    rationale: The user reviewed the retained desktop/mobile witness and selected Option 1; machine correctness and human usefulness evidence now both pass for the bounded Operations V1 claim.
    evidence: development/operations-v1-plan/task-sessions/20260715T004506Z-swu-ov1-013/DECISION-GATE.md
    status: closed
    blocking: false
    impact: SWU-OV1-013 passed and SWU-OV1-014 may run; deferred L3 capabilities remain excluded.
    owner: human-operator

