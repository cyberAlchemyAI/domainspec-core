contexts:
  - context_id: CTX-IDEEXT-L0
    parent_id: root
    title: ide-extension L0 governed workbench witness
    purpose: Prove a local-server-first IDE-adjacent governance workbench with modules, approval-gated dry-run envelopes, durable state, and receipts before claiming an IDE agent or VSCodium product.
    stage: scaffold
    gate: flag
    next_move: Validate schemas, run npm run smoke, then add Playwright evidence over the adjacent local browser URL.
    owned_artifacts:
      - ART-IDEEXT-README
      - ART-IDEEXT-SPEC
      - ART-IDEEXT-ARCHITECTURE
      - ART-IDEEXT-CRAFT
      - ART-IDEEXT-LEDGER
      - ART-IDEEXT-RESEARCH
      - ART-IDEEXT-FINDINGS
      - ART-IDEEXT-SCHEMAS
      - ART-IDEEXT-DEMO
    notes: Founded by subagent strategy dispatch with five explorers, one synthesizer, three skeptics, one writer, and one planned auditor.

decisions:
  - decision_id: DEC-IDEEXT-L0-BOUNDARY
    scope_id: CTX-IDEEXT-L0
    decision_type: selection
    question: What is the smallest truthful product boundary?
    selected: local-server-first governed workbench
    rationale: Evidence supports loopback workbench, manifests, approvals, dry-run envelopes, and receipts. It does not yet support autonomous IDE agency or embedded VSCodium automation.
    evidence: development/founding-research/findings.md
    status: closed
    blocking: false
    impact: L0 work starts with local server and adjacent browser proof.
    owner: strategist
  - decision_id: DEC-IDEEXT-MODULES-NOT-KERNEL
    scope_id: CTX-IDEEXT-L0
    decision_type: boundary
    question: Which capabilities belong in the kernel?
    selected: keep Craft, Whisper, UI Studio, IDE Ergonomics, OpenRouter, and agent systems as modules or adapters
    rationale: The kernel owns registry, grants, approval, audit, artifacts, and provider mediation only.
    evidence: development/founding-research/findings.md
    status: closed
    blocking: false
    impact: Integrations stay replaceable and cannot become hidden authority.
    owner: strategist

gaps:
  - gap_id: GAP-IDEEXT-PLAYWRIGHT-MCP
    scope_id: CTX-IDEEXT-L0
    summary: Playwright MCP has not yet driven the adjacent local workbench URL.
    severity: flag
    treatment: test
    owner: validation
    status: active
    evidence: development/founding-research/findings.md
  - gap_id: GAP-IDEEXT-VSCODIUM-WEBVIEW
    scope_id: CTX-IDEEXT-L0
    summary: Embedded VSCodium webview automation is not locally witnessed and cannot be the L0 proof path.
    severity: flag
    treatment: defer
    owner: host-integration
    status: active
    evidence: development/founding-research/findings.md
  - gap_id: GAP-IDEEXT-MANIFEST-VALIDATOR
    scope_id: CTX-IDEEXT-L0
    summary: Manifest schemas exist, but invalid-manifest fixtures and failing tests should be added before claiming registry hardening.
    severity: flag
    treatment: test
    owner: kernel
    status: active
    evidence: schemas/module-manifest.schema.json
  - gap_id: GAP-IDEEXT-PROVIDER-ADAPTER
    scope_id: CTX-IDEEXT-L0
    summary: OpenRouter adapter is a boundary stub; no live key, streaming, cost, or provider trace proof exists.
    severity: flag
    treatment: experiment
    owner: provider-adapter
    status: active
    evidence: src/adapters/openrouter.mjs

