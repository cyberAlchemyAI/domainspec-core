<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variant C — Editorial signup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f0e8; color: #29251f; font: 17px/1.5 Georgia, serif; }
    [data-od-id="card.root"] { width: min(100%, 520px); padding: clamp(26px, 7vw, 52px); border: 1px solid #29251f; background: #fffdf8; box-shadow: 12px 12px 0 #d8cbb8; }
    [data-od-id="badge.kicker"] { margin: 0; color: #9a3412; font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(34px, 8vw, 56px); line-height: .98; font-weight: 500; }
    [data-od-id="card.subtitle"] { color: #665d50; }
    label { display: grid; gap: 7px; margin-top: 24px; font: 650 14px/1.4 system-ui, sans-serif; }
    input { min-height: 48px; padding: 10px 12px; border: 1px solid #817567; background: transparent; font: 16px system-ui, sans-serif; }
    [data-od-id="cta.primary"] { width: 100%; min-height: 48px; margin-top: 12px; border: 1px solid #29251f; background: #29251f; color: #fffdf8; font: 750 15px system-ui, sans-serif; }
    [data-od-id="trust.note"] { margin: 12px 0 0; color: #756a5c; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main data-od-id="card.root">
    <p data-od-id="badge.kicker">A more accountable canvas</p>
    <h1 data-od-id="card.title">Ideas should leave a trail.</h1>
    <p data-od-id="card.subtitle">Explore quickly while keeping every durable decision inspectable.</p>
    <label data-od-id="field.email">Email address
      <input type="email" placeholder="you@example.com">
    </label>
    <button data-od-id="cta.primary" type="button">Join the studio</button>
    <p data-od-id="trust.note">One local session · reversible history</p>
  </main>
</body>
</html>
