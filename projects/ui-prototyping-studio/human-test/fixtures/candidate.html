<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variant A — Calm signup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef2ff; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
    [data-od-id="card.root"] { width: min(100%, 430px); padding: 30px; border: 1px solid #dbe3f2; border-radius: 20px; background: white; box-shadow: 0 20px 55px #33415524; }
    [data-od-id="badge.kicker"] { margin: 0 0 8px; color: #4f46e5; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); line-height: 1.08; }
    [data-od-id="card.subtitle"] { margin: 12px 0 22px; color: #526079; }
    label { display: grid; gap: 7px; font-weight: 650; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #bdc8db; border-radius: 10px; font: inherit; }
    [data-od-id="cta.primary"] { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 11px; background: #0f766e; color: white; font: inherit; font-weight: 750; cursor: pointer; }
    [data-od-id="trust.note"] { margin: 12px 0 0; color: #68758c; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main data-od-id="card.root">
    <p data-od-id="badge.kicker">14-day workspace trial</p>
    <h1 data-od-id="card.title">Make the next decision visible.</h1>
    <p data-od-id="card.subtitle">A quiet workspace for product decisions, prototypes, and their evidence.</p>
    <label data-od-id="field.email">Work email
      <input type="email" placeholder="you@example.com">
    </label>
    <button data-od-id="cta.primary" type="button">Continue securely</button>
    <p data-od-id="trust.note">No card required · cancel any time</p>
  </main>
</body>
</html>
