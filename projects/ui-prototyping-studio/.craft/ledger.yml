  impact: Root spine is now README + lean SPEC + .craft + development; 19 vision docs and 200 reference files moved to provenance/. Code extraction (P1-P5) remains.
  owner: operator
- decision_id: DEC-INTERFACE-MODEL-009
  scope_id: CTX-UPS-ROOT
  decision_type: selection
  question: What is the primary interaction model for the studio?
  description: How humans/agents drive the studio.
  options:
  - Human workbench + embedded assistant
  - Agent-operable service (API/MCP)
  - Dual surface
  default_option: Human workbench + embedded assistant
  selected: Human workbench + embedded assistant
  rationale: Designer-in-the-loop ergonomics; agent proposes inside the UI, human disposes at the governance gates. Matches the current React+REST shape. Agent-operable API/MCP is a possible later surface, out of scope now.
  status: closed
  blocking: false
  impact: Build the human web workbench as primary; no agent-facing API/MCP surface this release.
  owner: operator
- decision_id: DEC-GENERATOR-PORT-010
  scope_id: CTX-UPS-EXTRACTION
  decision_type: selection
  question: Where should the real generation agent (the LLM) come in?
  description: GenerateVariants is currently a deterministic stub; ports.ts injects only a storage port, so no LLM seam exists.
  options:
  - Add generator port now
  - Keep stub for L0-L2, port later
  - Just record as a gap
  default_option: Add generator port now
  selected: Add generator port now
  rationale: Make it a real agentic tool sooner; a VariantGeneratorPort abstracts a Claude-backed generator (app) and a deterministic fake (e2e). Mutation synthesis stays deterministic - generation is the only LLM seam.
  status: closed
  blocking: false
  impact: Adds extraction phase P1.5 (generator port). Replaces the GenerateVariants stub; introduces the single LLM seam (Claude-backed).
  owner: operator
- decision_id: DEC-RUNTIME-CLAUDE-CODE-011
  scope_id: CTX-UPS-EXTRACTION
  decision_type: selection
  question: What is the runtime for the generation agent and the product shape?
  description: Whether the studio owns its own LLM (standalone) or is operated through Claude Code in VSCode.
  options:
  - Claude Code-native (run in VSCode)
  - Standalone app (own the model)
  - Port-agnostic now
  - Both, Claude Code first
  default_option: Claude Code-native (run in VSCode)
  selected: Claude Code-native (run in VSCode)
  rationale: 'The embedded assistant IS Claude Code: no API key, no agent loop to build, dogfoods the Arcanum/Claude-Code workflow. Studio = governance harness + review surface; Claude Code = generation/mutation engine. Coupled to Claude Code (not a standalone product); a standalone Anthropic-SDK adapter stays a future option behind the same port.'
  status: closed
  blocking: false
  impact: Generator port's real adapter = MCP/Claude-Code bridge. Adds an MCP server + operating SKILL.md; the web app becomes the local human review surface, not a product shell. Removes @anthropic-ai/sdk from this release.
  owner: operator
- decision_id: DEC-CLI-NOT-MCP-012
  scope_id: CTX-UPS-EXTRACTION
  decision_type: selection
  question: Operate the backend via an MCP server, or a CLI?
  description: Refines DEC-RUNTIME-CLAUDE-CODE-011. For a single-user, local, Claude-Code-driven tool, MCP's typed-schema/cross-client/resource benefits don't pay off; Claude Code already has Bash.
  options:
  - studio CLI (no MCP)
  - MCP server
  default_option: studio CLI (no MCP)
  selected: studio CLI (no MCP)
  rationale: Nothing to run (no server/protocol), Claude Code calls it via Bash, the human drives the same commands (true dogfooding), trivially testable, matches the repo's CLI-heavy ecosystem. The orchestration core already exists; the CLI is a thin wrapper. Also lets MVP drop the React SPA (preview HTML + CLI gates).
  status: closed
  blocking: false
  impact: Seam = `studio` CLI + operating SKILL.md (no MCP server). MVP needs no React review SPA. Generator seam collapses to `studio variants register` (Claude Code supplies HTML) + a deterministic fake.
  owner: operator
- decision_id: DEC-INPROTO-ANNOTATION-013
  scope_id: CTX-UPS-EXTRACTION
  decision_type: selection
  question: How do humans annotate prototypes — hand-typed CSS selectors, a React form, or directly on the rendered components?
  description: 'Ground truth: today the prototype HTML isn''t rendered in the workbench and AnnotationPanel makes the human type a CSS selector (e2e fills ''#state''). That violates ergonomics-first.'
  options:
  - In-prototype click-to-annotate via `studio preview` overlay
  - Manual selector form (current)
  - CLI `comment add` only
  default_option: In-prototype click-to-annotate via `studio preview` overlay
  selected: In-prototype click-to-annotate via `studio preview` overlay
  rationale: 'Generation produces HTML, so the prototype itself is the natural annotation surface. `studio preview` serves the HTML from an ephemeral local server and injects a click-to-annotate overlay: click element -> capture selector+label -> {severity,intent,note} -> CaptureCommentEvent. Comments land directly on components, no hand-typed selectors, no React SPA. `comment add` stays the headless path; both produce the identical CommentEvent contract.'
  status: closed
  blocking: false
  impact: '`studio preview --annotate` gains an injected overlay + ephemeral local callback server. Resolves GAP-ANNOTATION-UX-006 in-design (in scope, not deferred). The existing selector-typing React AnnotationPanel is superseded; no SPA needed.'
  owner: operator
- decision_id: DEC-ATOMIC-IDS-014
  scope_id: CTX-UPS-EXTRACTION
  decision_type: selection
  question: Does adopting atomic-design components help annotation / element selection?
  description: CSS selectors are brittle across regeneration; AnnotationTarget.odId (a stable-id slot) already exists end-to-end but is unused and generated HTML emits no stable ids.
  options:
  - 'Light: stamp stable data-od-id now, full atomic design at L4'
  - Full atomic-design system now (atoms->organisms + registry + conformance)
  - Keep brittle CSS selectors
  default_option: 'Light: stamp stable data-od-id now, full atomic design at L4'
  selected: 'Light: stamp stable data-od-id now, full atomic design at L4'
  rationale: Generator stamps a stable data-od-id (minimal component-role convention) -> overlay captures odId as primary target (selector fallback) -> comment targets survive regeneration. Cheap (odId slot already plumbed; mostly a generation-contract line in the operating skill). Full atomic-design taxonomy + component registry + UIElementIdentity/conformance-delta is the L4 realization of the same idea, deferred.
  status: closed
  blocking: false
  impact: AnnotationTarget.odId becomes the primary annotation target (selector fallback). Operating skill requires data-od-id stamping. Atomic design named as the L4 vocabulary unifying identity (BLK-IDENTITY-TYPES-002), registry (GAP-COMPONENT-REGISTRY-002), and conformance-delta.
  owner: operator
- decision_id: DEC-MUTATION-EXEC-015
  scope_id: CTX-UPS-EXTRACTION
  decision_type: selection
  question: What is the mutation-execution model — how does ApplyApprovedBatch turn approved MutationTasks into the next revision HTML?
  description: 'Full refine (run 20260615-mutation-execution-mechanics): tournament A(deterministic) vs B(agentic) vs C(hybrid), dialectic, toy-game falsification. Apply today does no HTML mutation.'
  options:
  - A deterministic patch
  - B agentic regeneration
  - 'C hybrid: agentic-propose + deterministic-validate'
  default_option: 'C hybrid: agentic-propose + deterministic-validate'
  selected: 'C hybrid: agentic-propose + deterministic-validate'
  rationale: 'Claude Code proposes the mutated HTML behind the CLI seam (non-deterministic/expressive lane); determinism is RECOVERED at the ADMISSION boundary in the pure core — a clock-free validator suite (V1-V9b) admits a candidate and the human accepts the exact staged diff they previewed (two gates: approve-intent + accept-diff via the dormant RevisionApplied state). A and B kept as Pareto-frontier config (C->A, C->B), not redesign. Pareto scores: A audit5/expr2/cc2, B audit2.5/expr5/cc5, C audit4/expr4/cc5/ergonomics5.'
  status: closed
  blocking: false
  impact: 'Schema: add odId + MutationChangeType union to MutationTask (GAP-1); DiffSummaryHonest + per-od-id fragments, delete buildDiffSummary (D5); add htmlArtifactRef+candidateHtmlHash+ExecutionProvenance to RevisionManifestEntry (GAP-2). Apply becomes produce->validate->stage->human-accept->record (all-or-nothing, fail-closed, bounded retry). 7-layer plan; all [PROPOSAL].'
  owner: operator
- decision_id: DEC-C1-SPIKE-SURVIVED-016
  scope_id: CTX-UPS-EXTRACTION
  decision_type: approval
  question: Does the C-1 spike clear the V3-fence scope dimension of RESIDUE-B?
  description: RUN of the frozen criterion (2026-06-16-c1-validator-spike-criterion). Verdict SURVIVED, parent-verified (re-run deterministic; v3 has no expect-label access; real diff/attribution/integrity/CSS algorithm; adversarial reason-isolation probes pass).
  options:
  - SURVIVED — V3 fence buildable on the closed set
  - FALSIFIED — repair a horn
  default_option: SURVIVED — V3 fence buildable on the closed set
  selected: SURVIVED — V3 fence buildable on the closed set
  rationale: A pure, deterministic whole-tree od-id-attributed V3 fence correctly REJECTs every out-of-scope/forge/held-out case and ADMITs every in-scope (incl. CSS) case on the 11-fixture closed set, via a single stable alignment-key primitive. Generalization NOT established (criterion's own bound).
  status: closed
  blocking: false
  impact: 'The V3-fence scope dimension of RESIDUE-B clears (buildable). Still OPEN in RESIDUE-B (criterion non-goals): the V2-vs-CSS R2 mechanism choice (R2-a/R2-b) and the S/B/k/c calibration. New caveats: alignment-key is brittle to legitimate structural reordering; CSS attribution is conservative (needs real cascade for arbitrary stylesheets).'
  owner: operator
- decision_id: DEC-R2-CSS-ATTRIBUTION-017
  scope_id: CTX-UPS-EXTRACTION
  decision_type: deferral
  question: How does V3 attribute CSS-rule changes — R2-a (declare style allowance + attribute) or R2-b (resolved-style hash in cascade)?
  description: The C-1 spike used a conservative CSS attribution that passed the closed set but won't generalize (cascade/specificity + reordering-robust node identity needed).
  options:
  - Separate as a focused spike
  - Decide R2-a now
  - Decide R2-b now
  default_option: Separate as a focused spike
  selected: Separate as a focused spike
  rationale: Decide with evidence, not blind. A pre-registered spike (like C-1) on cascade/specificity + node identity (GAP-V3-NODE-IDENTITY-008) decides R2-a vs R2-b; doesn't block L0 substrate.
  status: closed
  blocking: false
  impact: R2 mechanism stays open pending the CSS-attribution/node-identity spike; L0 build proceeds without it (V3 fence is L1).
  owner: operator
- decision_id: DEC-EXT-DOMAINSPEC-BREAK-018
  scope_id: CTX-UPS-EXTRACTION
  decision_type: deferral
  question: 'D-EXT-2: keep domainspec building green, or accept breakage after the module is removed?'
  options:
  - Minimal de-registration (keep green)
  - Accept breakage (deprecating)
  default_option: Accept breakage (deprecating)
  selected: Accept breakage (deprecating)
  rationale: domainspec is being deprecated; spending effort to keep its build green after the extraction is not worth it. P4 de-registration becomes optional cleanup, not a requirement.
  status: closed
  blocking: false
  impact: Resolved at the task-session gate (2026-06-16); applies when the extraction WORK-PACK executes.
  owner: operator
- decision_id: DEC-EXT-GIT-HISTORY-019
  scope_id: CTX-UPS-EXTRACTION
  decision_type: selection
  question: 'D-EXT-4: how to carry git history for the moved code?'
  options:
  - Plain move
  - git filter-repo across the boundary
  default_option: Plain move
  selected: Plain move
  rationale: Move files on disk; per-file history stays in the domainspec submodule git and is recoverable there. filter-repo not worth it for line-level blame across the move.
  status: closed
  blocking: false
  impact: Resolved at the task-session gate (2026-06-16); applies when the extraction WORK-PACK executes.
  owner: operator
- decision_id: DEC-EXT-COMMIT-POLICY-020
  scope_id: CTX-UPS-EXTRACTION
  decision_type: approval
  question: Commit policy during extraction execution?
  options:
  - Leave changes uncommitted for review
  - Commit submodule-first per discipline
  default_option: Leave changes uncommitted for review
  selected: Leave changes uncommitted for review
  rationale: All file changes land in the working tree for operator review; no commits, no submodule gitlink bump by the agent.
  status: closed
  blocking: false
  impact: Resolved at the task-session gate (2026-06-16); applies when the extraction WORK-PACK executes.
  owner: operator
- decision_id: DEC-UX-SURFACE-C-021
  scope_id: CTX-UPS-UX-REFINE
  decision_type: design
  question: Which review surface should a cold-start human use to dispose of agent-generated UI variants — A (browser overlay), B (TUI), or C (local web review page)?
  options:
  - 'A: studio preview --annotate in-DOM overlay'
  - 'B: terminal/TUI review'
  - 'C: same-origin local web review page (Fastify render GET + static 3-region page)'
  default_option: A
  selected: C
  rationale: C won on Pareto + first-principle/fixed-obligation tie-break (build-cost re-classed from a flat ergonomic axis to a gating constraint per review F6); disputed build-cost verified against runnable code. B dominated on the two cold-start axes; A deferred as a named upgrade hook (its in-DOM data-od-id capture).
  status: decided
  blocking: false
  impact: Sets the interaction surface; A overlay becomes a deferred upgrade.
  owner: refine
- decision_id: DEC-UX-SKILL-AUTHORITY-HONEST-022
  scope_id: CTX-UPS-UX-REFINE
  decision_type: governance
  question: How should the operating SKILL state its authority, given the core does not distinguish Claude Code from the human at the durable gates?
  options:
  - Keep "refused server-side" claim (FALSE)
  - 'State honestly: scope enforced, identity NOT; the SKILL never-do spine is the sole self-disposal control'
  default_option: Keep "refused server-side" claim (FALSE)
  selected: 'State honestly: scope enforced, identity NOT; the SKILL never-do spine is the sole self-disposal control'
  rationale: 'F-CRIT-1: approve has zero actor-class check; apply refuses only literal "system:auto"; route defaults actor to "web-ui". The "refused server-side" backstop does not exist. SKILL draft corrected; real identity gate routed to core owners (R-S7-1/P-c3).'
  status: decided
  blocking: true
  impact: BLOCKING correction owed before build; the SKILL discipline is currently the only control on agent self-disposal.
  owner: refine
