definitions:
  - definition_id: DEF-LL-LIGHT-001
    scope_id: CTX-LL-ROOT
    term: Light
    statement: A bounded service offered when ordinary options fail, governed by an explicit request, price, agreement, performance rule, and consequence.
    status: active-local
    evidence: ART-LL-CH01-MANUSCRIPT
  - definition_id: DEF-LL-OPEN-FAVOR-001
    scope_id: CTX-LL-ROOT
    term: open favor
    statement: Compensation whose future request is unspecified at agreement time; the client may refuse collection but then loses access to future Lights.
    status: active-local
    evidence: ART-LL-CH01-MANUSCRIPT
  - definition_id: DEF-LL-VESPER-001
    scope_id: CTX-LL-STORY-BIBLE
    term: Vesper
    statement: The renamed, rain-soaked city in which Chapter 1 takes place, navigable through both official streets and Lucifer's unofficial network.
    status: active-local
    evidence: ART-LL-LOCATIONS
  - definition_id: DEF-LL-PRIOR-LIGHT-001
    scope_id: CTX-LL-STORY-BIBLE
    term: prior Light
    statement: An older active agreement that takes precedence when a later request would require violating it; the later request is held without payment until canceled or voluntarily amended.
    status: active-local
    evidence: ART-LL-CONTINUITY
  - definition_id: DEF-LL-VOICE-TETHER-001
    scope_id: CTX-LL-MANUSCRIPT
    term: voice tether
    statement: The requirement that a Lucifer aside remain connected to a live person, rule, decision, danger, or clock rather than pausing the scene as a detached essay.
    status: candidate
    evidence: ART-LL-VOICE-GUIDE

