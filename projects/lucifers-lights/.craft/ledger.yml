contexts:
  - context_id: CTX-LL-ROOT
    parent_id: root
    title: Lucifer's Lights
    purpose: Track the novel's manuscript, story continuity, editorial decisions, graphic-novel assets, audio derivatives, gaps, gates, and next moves without conflating them.
    stage: review-audit
    gate: flag
    next_move: Read the revised Chapter 1 and either accept it as the project baseline or record targeted corrections.
    owned_artifacts:
      - ART-LL-LEDGER
      - ART-LL-CRAFT-VIEW
      - ART-LL-PROJECT-BRIEF
      - ART-LL-SOURCE-MAP
      - ART-LL-REVISION-LOG
      - ART-LL-CH01-REVIEW
      - ART-LL-BOOTSTRAP-VALIDATION
    links:
      - label: Chapter 1 editorial gate
        target: GATE-LL-CH01-EDITORIAL-001
        kind: row-id
      - label: Current manuscript
        target: ART-LL-CH01-MANUSCRIPT
        kind: artifact-id
      - label: Asset-home decision
        target: DEC-LL-ASSET-HOME-001
        kind: row-id
      - label: Whisper ontology
        target: CTX-LL-ONTOLOGY
        kind: row-id
    notes: Root project created after the author requested durable tracking for prose, continuity, and derivative production.
  - context_id: CTX-LL-MANUSCRIPT
    parent_id: CTX-LL-ROOT
    title: Manuscript
    purpose: Own prose development, chapter baselines, editorial review, voice discipline, and revision history.
    stage: review-audit
    gate: flag
    next_move: Run the human editorial read for Vesper clarity, tethered voice, and the sunrise clock.
    owned_artifacts:
      - ART-LL-CH01-MANUSCRIPT
      - ART-LL-CH01-PRE-REVISION
      - ART-LL-CH01-REVIEW
      - ART-LL-VOICE-GUIDE
    links:
      - label: Voice continuity gap
        target: GAP-LL-VOICE-CONTINUITY-001
        kind: row-id
      - label: Deadline continuity gap
        target: GAP-LL-DEADLINE-CONTINUITY-001
        kind: row-id
      - label: Vesper clarity gap
        target: GAP-LL-VESPER-CLARITY-001
        kind: row-id
  - context_id: CTX-LL-STORY-BIBLE
    parent_id: CTX-LL-ROOT
    title: Story Bible
    purpose: Record established characters, locations, rules, timelines, prop state, and unresolved questions without inventing future canon.
    stage: define
    gate: flag
    next_move: Update facts only after the Chapter 1 candidate is accepted or later chapters establish new evidence.
    owned_artifacts:
      - ART-LL-CHARACTERS
      - ART-LL-LOCATIONS
      - ART-LL-CONTINUITY
    links:
      - label: Story-bible coverage gap
        target: GAP-LL-STORY-BIBLE-001
        kind: row-id
  - context_id: CTX-LL-GRAPHIC-NOVEL
    parent_id: CTX-LL-ROOT
    title: Graphic Novel
    purpose: Own the visual bible, selected keyframes, shot mapping, lettering handoff, and later motion-comic image timing.
    stage: validate
    gate: flag
    next_move: After prose acceptance, compare the shot manifest and selected keyframes against the revised chapter.
    owned_artifacts:
      - ART-LL-CH01-SHOT-MANIFEST
      - ART-LL-CH01-KEYFRAMES
      - ART-LL-CH01-VISUAL-ANCHOR
    links:
      - label: Derivative sync gap
        target: GAP-LL-DERIVATIVE-SYNC-001
        kind: row-id
  - context_id: CTX-LL-AUDIO
    parent_id: CTX-LL-ROOT
    title: Audio and Motion Comic
    purpose: Own the ElevenLabs performance script, casting guide, voice auditions, narration timing, and later motion-comic audio synchronization.
    stage: plan
    gate: flag
    next_move: After prose acceptance, synchronize the ElevenLabs script and generate the three voice auditions.
    owned_artifacts:
      - ART-LL-CH01-AUDIO-SCRIPT
      - ART-LL-CH01-AUDIO-GUIDE
    links:
      - label: Audio-render gap
        target: GAP-LL-AUDIO-RENDER-001
        kind: row-id
      - label: Derivative sync gap
        target: GAP-LL-DERIVATIVE-SYNC-001
        kind: row-id
  - context_id: CTX-LL-ONTOLOGY
    parent_id: CTX-LL-ROOT
    title: Whisper Ontology
    purpose: Govern the project-local authoring ontology for Whisper across intent, story entities, evidence, commitment, mysteries, editorial rules, and derivative drift without changing prose or canonical Arcanum vocabulary.
    stage: validate
    gate: flag
    next_move: Review the Whisper intent, entity set, knowledge roles, edge policies, and deferred semantics, then accept or correct the candidate ontology.
    owned_artifacts:
      - ART-LL-ONTOLOGY-README
      - ART-LL-WHISPER-INTENT
      - ART-LL-ONTOLOGY-GRAPH
      - ART-LL-ONTOLOGY-MAP
      - ART-LL-ONTOLOGY-PROFILE
      - ART-LL-ONTOLOGY-VALIDATOR
      - ART-LL-ONTOLOGY-NEGATIVES
      - ART-LL-ONTOLOGY-VALIDATION
    links:
      - label: Ontology graph
        target: ART-LL-ONTOLOGY-GRAPH
        kind: artifact-id
      - label: Human review gate
        target: GATE-LL-ONTOLOGY-REVIEW-001
        kind: row-id
      - label: Acceptance gap
        target: GAP-LL-ONTOLOGY-ACCEPTANCE-001
        kind: row-id
    notes: Knowledge-vault archetype with project-local alias whisper-story-ontology; inline validation passes, but author acceptance and wider semantics remain pending.

