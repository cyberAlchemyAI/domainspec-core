decisions:
  - decision_id: DEC-LL-OPENING-ENGINE-001
    scope_id: CTX-LL-MANUSCRIPT
    decision_type: selection
    question: What dramatic engine should open Lucifer's Lights?
    description: Selection of a live transaction rather than a front-loaded character or theology essay.
    options:
      - request-negotiation-terms-consequence
      - mythology-monologue
      - retrospective-origin-story
    default_option: request-negotiation-terms-consequence
    selected: request-negotiation-terms-consequence
    rationale: It reveals Lucifer, the app, the Light economy, Mara's need, and the cost through action.
    evidence: ART-LL-CH01-MANUSCRIPT
    status: closed
    blocking: false
    impact: Future chapters should establish abstract lore through live choices and consequences whenever possible.
    owner: author
  - decision_id: DEC-LL-VOICE-TETHER-001
    scope_id: CTX-LL-MANUSCRIPT
    decision_type: approval
    question: How should Lucifer's internal voice and direct-reader interjections be revised?
    description: Preserve charismatic instability and direct address while requiring every aside to touch the live scene.
    options:
      - preserve-and-tether
      - remove-most-interjections
      - retain-without-editing
    default_option: preserve-and-tether
    selected: preserve-and-tether
    rationale: The voice is part of the novel's identity; placement rather than eccentricity caused the pacing disconnection.
    evidence: ART-LL-CH01-REVIEW
    status: closed
    blocking: false
    impact: Detached essays are compressed or relocated; scene-reading interjections remain.
    owner: author
    links:
      - label: Voice guide
        target: ART-LL-VOICE-GUIDE
        kind: artifact-id
  - decision_id: DEC-LL-VESPER-CITY-001
    scope_id: CTX-LL-STORY-BIBLE
    decision_type: approval
    question: What is Vesper, and when must the reader understand it?
    description: Establish Vesper explicitly as the city at its first appearance.
    options:
      - city-at-first-mention
      - delay-reveal
      - rename-location
    default_option: city-at-first-mention
    selected: city-at-first-mention
    rationale: Later passport, train, and two-map references need a clear place anchor rather than an unexplained proper noun.
    evidence: ART-LL-CH01-REVIEW
    status: closed
    blocking: false
    impact: The opening now says “In the city of Vesper,” and the story bible owns the local place definition.
    owner: author
  - decision_id: DEC-LL-SUNRISE-CLOCK-001
    scope_id: CTX-LL-MANUSCRIPT
    decision_type: selection
    question: How should the before-sunrise urgency remain legible through Chapter 1?
    description: Carry one exact sunrise clock through the request, amendment, station, and cliffhanger.
    options:
      - exact-clock-throughline
      - atmospheric-dawn-only
      - deadline-only-in-ui
    default_option: exact-clock-throughline
    selected: exact-clock-throughline
    rationale: The chapter already uses precise train, tracker, and clock intervals; an exact 5:38 sunrise makes the larger deadline part of the same pattern.
    evidence: ART-LL-CH01-REVIEW
    status: closed
    blocking: false
    impact: The amended contract retains sunrise and the station sequence reports 2:43, 2:51, and remaining time.
    owner: author
  - decision_id: DEC-LL-ASSET-HOME-001
    scope_id: CTX-LL-ROOT
    decision_type: selection
    question: Should the existing manuscript and generated media be moved physically under projects/lucifers-lights?
    description: Non-blocking ownership decision. The first bootstrap references existing repository-root draft paths to avoid risky movement or duplicate authority.
    options:
      - reference-in-place
      - move-after-chapter-baseline
      - copy-and-archive-originals
    default_option: move-after-chapter-baseline
    selected: pending
    rationale: Pending author choice; reference-in-place is the current reversible bootstrap behavior.
    evidence: ART-LL-SOURCE-MAP
    status: active
    blocking: false
    impact: Project tracking works now; physical consolidation waits for an explicit choice.
    owner: author
  - decision_id: DEC-LL-ONTOLOGY-TYPE-001
    scope_id: CTX-LL-ONTOLOGY
    decision_type: selection
    question: Which reusable Ontology Vault archetype should govern the Lucifer's Lights Whisper ontology?
    description: Select one primary modeling job while keeping the story-specific name as a noncanonical project alias.
    options:
      - knowledge-vault
      - business-domain
      - authority-governance
    default_option: knowledge-vault
    selected: knowledge-vault
    rationale: The primary need is to govern author intent, narrative evidence, commitment state, mysteries, editorial learning, and derivative drift. World semantics and authority routing remain supporting concerns.
    evidence: ART-LL-ONTOLOGY-MAP
    status: closed
    blocking: false
    impact: The project uses the local alias whisper-story-ontology without extending the reusable catalog or introducing branch requirements.
    owner: ontology-vault-routing

