definitions:
  - definition_id: DEF-AJ-JOURNEY-001
    scope_id: CTX-AJ-ROOT
    term: Arcanum Journey
    statement: >
      A learning course and installer companion that teaches what Arcanum is by
      constructing it piece by piece; each sigil or spell introduced is a chapter,
      and the course shows how concepts inherit, build on, and integrate.
    status: candidate
    evidence: ART-AJ-VISION-BRIEF
  - definition_id: DEF-AJ-CHAPTER-001
    scope_id: CTX-AJ-ROOT
    term: chapter
    statement: >
      One sigil or spell introduced as a tutorial step that builds on the
      chapters before it; adding a tool to the journey adds a chapter.
    status: candidate
    evidence: ART-AJ-VISION-BRIEF
  - definition_id: DEF-AJ-LEARNING-PRESET-001
    scope_id: CTX-AJ-ROOT
    term: learning preset
    statement: >
      A decision-profile-style configuration that controls explanation style for
      novices (clever analogies, simplicity, Veritasium-style), ships neutral
      defaults, and remains user-tweakable so it speaks the user's language.
    status: candidate
    evidence: ART-AJ-GOAL-PROFILE-SRC
  - definition_id: DEF-AJ-ROUTE-MAP-001
    scope_id: CTX-AJ-ROOT
    term: sigil/spell route map
    statement: >
      A map of all sigils and spells with inherit / build-on / integrate edges,
      used to order chapters and to offer possible next paths after each session.
    status: candidate
    evidence: ART-AJ-VISION-BRIEF
  - definition_id: DEF-AJ-STARTING-POINT-001
    scope_id: CTX-AJ-ROOT
    term: starting-point routing
    statement: >
      Interrogation-driven selection of the user's first tool by primary goal
      (e.g. creative writing -> Whisper; automation -> Craft + goal or
      task-session), with the user free to pick or probe afterward.
    status: candidate
    evidence: ART-AJ-VISION-BRIEF
  - definition_id: DEF-AJ-CRAFT-CONTROL-SURFACE-001
    scope_id: CTX-AJ-ROOT
    term: Craft as control surface
    statement: >
      The framing that every sigil has a place inside Craft and the journey
      returns to Craft as its spine; refine and invoke are explained as the entry
      capabilities feeding that surface.
    status: candidate
    evidence: ART-AJ-VISION-BRIEF
  - definition_id: DEF-AJ-TEACH-WHILE-INSTALL-001
    scope_id: CTX-AJ-ROOT
    term: teach-while-install
    statement: >
      The standalone downloadable skill installs the repo as it teaches, letting
      a user learn by testing and probing, or install the whole repo and pick.
    status: candidate
    evidence: ART-AJ-VISION-BRIEF
  - definition_id: DEF-AJ-EXPLAIN-SURFACE-001
    scope_id: CTX-AJ-ROOT
    term: explanation surface
    statement: >
      Each chapter's teaching surface is an agent-generated HTML page (x-ray
      style) that lays out the concept visually, consistent with the existing
      arcanum user-guide HTML surfaces.
    status: candidate
    evidence: ART-AJ-XRAY-SRC

