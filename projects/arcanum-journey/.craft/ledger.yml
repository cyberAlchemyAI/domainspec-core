contexts:
  - context_id: CTX-AJ-ROOT
    parent_id: root
    title: Arcanum Journey
    purpose: >
      Build a learning course that explains what Arcanum is by constructing it
      piece by piece. Each sigil/spell introduced is a new chapter; the journey
      teaches how concepts inherit, build on, and integrate with each other,
      presenting Craft as the control surface. Surface area is a standalone
      downloadable skill that installs the repo and teaches while installing,
      using agent-generated HTML pages as explanation surfaces.
    stage: build
    gate: flag
    next_move: >
      L0 POC staged (ART-AJ-DELIVERABLE, boundary-lint PASS). Remaining executable
      work: author chapters 2-9 (Wave 1 S-002), wire arcanum-bootstrap install-while-
      teaching runtime (S-001 runtime half), then capstone tower (S-009) and
      experiment-harness + promotion to public arcanum (W3, separate approval).
    owned_artifacts:
      - ART-AJ-CRAFT-LEDGER
      - ART-AJ-CRAFT-VIEW
      - ART-AJ-VISION-BRIEF
      - ART-AJ-DECISION-RECORD
      - ART-AJ-INVOKE-RUN
    notes: >
      Root context created by /craft start for the Arcanum Journey course.
      Scope = projects/arcanum-journey/.craft. The planning ledger stays in the
      PRIVATE parent; DEC-AJ-HOME-001 resolved the SHIPPED deliverable to the
      PUBLIC arcanum submodule because the Cyber Alchemy method is already public
      inside arcanum and the explainer persona is anonymizable. Craft records the
      downstream sigil routes here but does not execute them.

decisions:
  - decision_id: DEC-AJ-HOME-001
    scope_id: CTX-AJ-ROOT
    decision_type: approval
    question: Where does the Arcanum Journey deliverable live — public arcanum submodule or the private parent?
    description: >
      The operator said "a project inside of arcanum". arcanum is the public
      submodule. Premise checked during the gate: the explainer persona is
      anonymizable (not private), and the Cyber Alchemy method is already
      published inside public arcanum (development/cyberalchemy-ontology-lifecycle/,
      ARCANUM-MANUAL, README), so a public home does not require private data.
    options:
      - public-arcanum-only
      - hybrid-public-shell-private-content
      - private-parent-project
    default_option: hybrid-public-shell-private-content
    selected: public-arcanum-only
    rationale: >
      Operator chose a public arcanum home and pointed to the Cyber Alchemy
      method already present in public arcanum. Persona is anonymizable. Guardrail:
      the journey teaches Cyber Alchemy only at the level already public in
      arcanum; the deeper private cyberAlchemy-v2 specifics and its still-open
      public/private boundary stay out. Engine/proprietary specifics excluded.
    evidence: ART-AJ-CYBERALCHEMY-SRC
    status: closed
    blocking: false
    impact: >
      The shipped deliverable lives under arcanum/ (public). All authoring must
      follow submodule discipline and exclude private operator data; only generic,
      public-safe Arcanum + public-level Cyber Alchemy teaching is allowed.
    owner: operator
    decided_at: 2026-06-22
    source: decision-gate (operator)
    links:
      - label: cyber alchemy already public in arcanum
        target: ART-AJ-CYBERALCHEMY-SRC
        kind: artifact-id
      - label: decision record
        target: ART-AJ-DECISION-RECORD
        kind: artifact-id
  - decision_id: DEC-AJ-PACKAGE-MODE-001
    scope_id: CTX-AJ-ROOT
    decision_type: selection
    question: Is the learning package built per-user at runtime, pre-authored as static chapters, or hybrid?
    description: >
      The operator wants the user to end with "their first tower in their own
      language" (runtime personalization via research-tower +
      reading-learning-package), but a tutorial also needs stable chapters.
    options:
      - hybrid-authored-chapters-plus-runtime-tower
      - runtime-tower-per-user
      - pre-authored-static-chapters
    default_option: hybrid-authored-chapters-plus-runtime-tower
    selected: hybrid-authored-chapters-plus-runtime-tower
    rationale: >
      Operator chose hybrid: each chapter ships authored, stable teaching content;
      at the end the user runs research-tower + reading-learning-package to build
      their own personalized tower in their own language. Reliable lessons plus
      the "first tower" payoff.
    evidence: ART-AJ-READING-PKG-SRC
    status: closed
    blocking: false
    impact: >
      Each chapter pairs authored content with a runtime reading-learning-package
      route; research-tower and reading-learning-package are wired per chapter.
    owner: operator
    decided_at: 2026-06-22
    source: decision-gate (operator)
    links:
      - label: reading-learning-package source
        target: ART-AJ-READING-PKG-SRC
        kind: artifact-id
  - decision_id: DEC-AJ-ROUTING-001
    scope_id: CTX-AJ-ROOT
    decision_type: selection
    question: How is the starting point (first tool) selected?
    description: >
      Interrogation infers the user's primary goal and the system offers a first
      tool; the operator also wants the user to be able to pick or probe freely.
    options:
      - both-interrogate-then-let-user-pick
      - system-offers-by-interrogation
      - user-picks-from-map
    default_option: both-interrogate-then-let-user-pick
    selected: both-interrogate-then-let-user-pick
    rationale: >
      Operator chose interrogate-then-pick: /interrogation infers primary goal and
      recommends a first tool (creative -> Whisper; automation -> Craft/goal/
      task-session), then shows the full map so the user can override or probe.
    evidence: ART-AJ-VISION-BRIEF
    status: closed
    blocking: false
    impact: >
      The /interrogation mode produces a goal-to-tool recommendation, and the
      post-session path offer presents the full sigil/spell map (GAP-AJ-SIGIL-MAP-001).
    owner: operator
    decided_at: 2026-06-22
    source: decision-gate (operator)
    links:
      - label: sigil/spell route map gap
        target: GAP-AJ-SIGIL-MAP-001
        kind: row-id
  - decision_id: DEC-AJ-SURFACE-001
    scope_id: CTX-AJ-ROOT
    decision_type: selection
    question: What is the surface area of the journey?
    description: >
      Operator's stated shape: a standalone downloadable skill that installs the
      repo, asks what the user wants to learn, or offers to install the whole repo
      and let them pick / probe, refined during the gate to use agent-generated
      HTML pages as explanation surfaces.
    options:
      - standalone-skill-installs-repo-teach-while-install-html-surfaces
      - in-repo-only-no-standalone-download
      - docs-only-no-install
    default_option: standalone-skill-installs-repo-teach-while-install-html-surfaces
    selected: standalone-skill-installs-repo-teach-while-install-html-surfaces
    rationale: >
      Operator chose the standalone install-and-teach skill AND specified
      agent-generated HTML pages as the explanation surfaces (x-ray-style, as the
      arcanum user-guide already does). The skill installs the repo (whole or a
      picked slice), asks what to learn, and teaches while installing.
    evidence: ART-AJ-XRAY-SRC
    status: closed
    blocking: false
    impact: >
      Adds an agent-generated-HTML explanation surface per chapter (x-ray as
      generator enabler) on top of the install-and-teach skill; /refine must
      harden the install + HTML-generation surface.
    owner: operator
    decided_at: 2026-06-22
    source: decision-gate (operator)
    links:
      - label: x-ray HTML surface enabler
        target: ENA-AJ-XRAY-001
        kind: row-id

